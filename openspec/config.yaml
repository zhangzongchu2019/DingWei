schema: spec-driven

# DingWei 仓 OpenSpec 配置 —— 依据研发管理委员会 2026-10-31《DingWei Spec 全面切换 OpenSpec 决议》
# 工具链：OpenSpec 1.16.0（钉版），Node >= 22.12，OPENSPEC_TELEMETRY=0；CI 跑 openspec validate --strict。

context: |
  Language: zh-CN
  All artifacts must be written in zh-CN.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.

  读取顺序（开始工作前）：openspec/specs/<能力>/context.md → spec.md → openspec/changes/ 中进行中的变更 → 平台能力时间线。
  不依赖聊天记录；Agent 之间不直接传递上下文，只经仓库与平台记录读写。平台派单只给坐标（仓库、变更编号、任务编号、commit SHA），在指定 commit 上读取。
  写回（每段工作结束前必须）：进度写 tasks.md 勾选与末尾「交接记录」；新技术决策写 design.md；未确认假设与待 PM 决策写 proposal.md；新的代码位置、环境、依赖写 context.md。
  一个任务只有一个执行者；提交前检查规格在派单后是否被修改，若修改先同步并在交接记录注明。
  密钥只写所在的密钥管理位置，不写值；大文件不进 Git，只放链接。

rules:
  proposal:
    - Why 节不少于 50 字（OpenSpec 按字计数，strict 下少于 50 即失败）
    - 写一次需求来源链接（不要从 Git 作者推导来源）
    - AI 新增且未经确认的假设单独列在「待确认假设」小节
    - 需要 PM 决策的事项列在「待 PM 决策」小节，每项写明编号、选项与建议
    - 一个变更的增量不超过 10 条，超出拆成多个变更
  specs:
    - '需求名以固定编号开头，如「### Requirement: SR-012 增量拉取按版本升序」；编号永不修改，场景与任务同理'
    - 中文需求句保留 SHALL 或 MUST，如「helper MUST 在写入前校验体积」
    - 规格 Purpose 用模板「本变更把 X 从 A 改为 B，目的是 C。涉及 D 模块，不影响 E。」且不少于 50 字
    - 每条需求至少一个 Scenario，WHEN 与 THEN 都能被客观检查；主要异常情况也写成场景
    - 单条需求正文不超过 500 字；单份 spec.md 不超过 30 KB，超出按子能力拆分
    - 能力首次变更时，依据现有代码与线上行为补一份最小基线与 context.md
  design:
    - design.md 中新出现的接口、状态、错误码，必须有对应的 Requirement（审阅固定检查项）
  tasks:
    - 任务以固定编号 T-01、T-02 起；tasks.md 末尾维护「交接记录」，每段工作追加一条：日期、执行者、commit；完成、阻塞、下一步三项

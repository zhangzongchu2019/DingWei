# 授权根的【机器读取面】—— 本件是唯一被闸读取的配置件。
#
# 🔴 立本件的直接原因（2026-08-26 实取抓出，执笔方自造）：
#   上一版让闸直接读 `TRUST-ROOT.md`，而该件第三节写着**启用方式的示例**：
#     ```
#     ACTIVE: reviewer-owned-protected-ref
#     REF: <门方会话名> <远端受保护 ref> <路径>
#     ```
#   示例在围栏代码块内，但**行首形态与真配置一模一样** ⇒ 闸把文档示例读成了启用配置，
#   于是「当前零 ACTIVE 后端」这句话在文档里是真的、在机器面是假的。
#   ⚠️ 更难看的是：**执笔方在提交信息里写下「TRUST-ROOT 现仍零 ACTIVE」，
#     而那句话没有实跑过 `exc_trust_backends` 就写了出去。**
#   ⇒ 同族：**判据与被判物不同源**（文档面 vs 机器面），
#     以及**输出精度超过实取精度**（没跑就断言状态）。
#
# ⇒ 治法：把机器面从散文件里**分出来**。散文说明留 TRUST-ROOT.md（闸不读它，示例永远不会生效）；
#   本件只放配置行，且**注释掉的行一律不生效**（带反测钉住）。
#
# 格式（每行一条，行首不得有空格）：
#   ACTIVE: <后端名>
#   REF: <门方会话名> <远端受保护 ref> <记录在该 ref 内的路径>
#
# 🔴 启用属门方/coordinator 动作，执笔方不得自加。语义与判据见 TRUST-ROOT.md。
#
# ===== 当前生效配置：无 =====

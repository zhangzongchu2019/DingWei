# WorkPulse nginx reverse proxy snippet.
# Replace server_name / ssl_certificate in your outer server block. Do not put
# real domains, certificates, or secrets in this repository.
#
# Expected public prefix:
#   https://YOUR_DOMAIN/dingwei/
#
# WorkPulse should listen on localhost, for example WP_ADDR=127.0.0.1:8791.

location /dingwei/ws/ {
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_pass http://127.0.0.1:8791/ws/;
}

location /dingwei/ {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 3600s;
    proxy_pass http://127.0.0.1:8791/;
    proxy_redirect / /dingwei/;

    # WorkPulse admin pages currently use absolute paths such as /admin.
    # Rewrite common HTML attributes so the UI works under this prefix.
    sub_filter_once off;
    sub_filter_types text/html;
    sub_filter 'href="/' 'href="/dingwei/';
    sub_filter 'src="/' 'src="/dingwei/';
    sub_filter 'action="/' 'action="/dingwei/';
}

location /schedule/ {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 3600s;
    proxy_pass http://127.0.0.1:8791/schedule/;
}

# File-service public data plane. These two routes deliberately target only
# the public listener. The internal issuer/audit/archive listener on 8794 must
# never be proxied by nginx.
location = /files/upload {
    limit_except POST { deny all; }
    client_max_body_size 50m;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_request_buffering off;
    proxy_pass http://127.0.0.1:8793;
}

# /files/ref/ retrieval proxy frozen by owner decision 2026-09-18. Restore
# only with Hub head/get issuance, file-service retrieval issuer/GrantStore,
# public handler route and their tests. Downloads now use nginx /f/ below.

# Public direct links. The regex is the path-boundary guard: nginx can only
# reach regular object names produced by file-service. Unknown extensions and
# malformed/directory paths fall through to the 404 location below.
location ~ ^/f/(?<file_rel>[a-z0-9_-]{1,64}/[a-z0-9_-]{1,64}/[0-9]{2}/[0-9]{4}/[0-9a-f]{32})\.(?<file_ext>jpg|png|gif|webp|avif|heic|bmp|tiff|mp4|webm|ogv|mov|mkv|pdf|txt)$ {
    limit_except GET { deny all; }
    alias /var/lib/dingwei-file-service/objects/$file_rel.$file_ext;
    autoindex off;
    types {
        image/jpeg jpg;
        image/png png;
        image/gif gif;
        image/webp webp;
        image/avif avif;
        image/heic heic;
        image/bmp bmp;
        image/tiff tiff;
        video/mp4 mp4;
        video/webm webm;
        video/ogg ogv;
        video/quicktime mov;
        video/x-matroska mkv;
        application/pdf pdf;
        text/plain txt;
    }
    default_type application/octet-stream;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
}

location ~ ^/f/(?<file_rel>[a-z0-9_-]{1,64}/[a-z0-9_-]{1,64}/[0-9]{2}/[0-9]{4}/[0-9a-f]{32})\.(?<file_ext>bin|docx|xlsx|pptx|doc|xls|ppt|zip)$ {
    limit_except GET { deny all; }
    alias /var/lib/dingwei-file-service/objects/$file_rel.$file_ext;
    autoindex off;
    default_type application/octet-stream;
    add_header Content-Disposition attachment always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
}

location /f/ {
    autoindex off;
    return 404;
}

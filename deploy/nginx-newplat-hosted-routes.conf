# 版本 2 反代需放行的新路由（G4 托管面）——清单＋配置片段
# 派工 R-V2-DEPLOY-ARTIFACTS-20261002161028 ③。逐条带 handler 文件:行（基 newplat/main c0a0720b）。
# 🔴 若现网反代按路径白名单放行，下列 8 条缺一条，节点拨入或 console 托管页即 404/403。
# 片段按「新平台 Hub 根路径直挂」（DW_PUBLIC_ORIGIN 根）写；若现网仍在前缀下挂，加前缀即可。
#
# 路由清单（8 条）：
#   1 GET  /api/node/connect                     cmd/workpulse/newplat_hosted.go:76   🔴 WSS（子协议 dingwei-node，须 Upgrade 头透传＋长超时）
#   2 POST /api/node/backup/{id}                 cmd/workpulse/newplat_hosted.go:63   节点出卷备份回传（流式上行，🔴 须放开 client_max_body_size 与代理超时）
#   3 GET  /api/console/hosted/options           cmd/workpulse/hosted_routes.go:39
#   4 POST /api/console/hosted/agents            cmd/workpulse/hosted_routes.go:40
#   5 GET  /api/console/hosted/jobs/{jobID}      cmd/workpulse/hosted_routes.go:41
#   6 POST /api/console/hosted/agents/{agentID}/{op}  cmd/workpulse/hosted_routes.go:42
#   7 GET  /api/console/admin/quotas             cmd/workpulse/hosted_routes.go:43
#   8 PUT  /api/console/admin/quotas/{userID}    cmd/workpulse/hosted_routes.go:44
#
# ── nginx 片段（值由 prodops 按现网填；此文件不进真实域名/证书/密钥）──

# 1 · 节点代理拨入（WSS 长连；🔴 Upgrade/Connection 头必须透传，读超时须大于节点心跳间隔）
location /api/node/connect {
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_pass http://127.0.0.1:{{WP_PORT}};
}

# 2 · 节点备份回传（流式上行大文件；🔴 放开体积上限与超时，否则销毁前备份会断）
location /api/node/backup/ {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    client_max_body_size {{BACKUP_MAX_BODY}};   # 按席位卷上限定（盘档 4c8g=16384MB）
    proxy_request_buffering off;                # 流式，不整收再转
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_pass http://127.0.0.1:{{WP_PORT}};
}

# 3-8 · console 托管面与管理配额（普通 HTTPS API，无特殊头）
location /api/console/hosted/ {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_pass http://127.0.0.1:{{WP_PORT}};
}

location /api/console/admin/quotas {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_pass http://127.0.0.1:{{WP_PORT}};
}

# 版本 2 反代需放行的新路由（G4 托管面）——清单＋配置片段
# 派工 R-V2-DEPLOY-ARTIFACTS-20261002161028 ③。逐条带 handler 文件:行（基 newplat/main c0a0720b）。
# 🔴 若现网反代按路径白名单放行，下列 8 条缺一条，节点拨入或 console 托管页即 404/403。
# 🔴 这些是 Hub 侧注册的【字面路径】——console_routes.go:13 的 prefixHub 是 Hub 变量名、
#    不是 URL 前缀；现网若有公共前缀，由 prodops 在反代层映射，Hub 代码无前缀概念。
#
# 路由清单（8 条）＋自证探针期望码（🔴 别写 200——200 会把「反代通了但鉴权坏了」判成绿）：
#   1 GET  /api/node/connect                     cmd/workpulse/newplat_hosted.go:76
#      🔴 WSS（子协议 dingwei-node，Upgrade/Connection 头必须透传）。
#      探针：无凭据或错凭据 ⇒ 401 error=node_auth_failed（internal/nodegate/gate.go:80-85，
#      在 websocket.Accept 之前就返回 ⇒ 裸 HTTP 探针即可验，不必真握手）。
#   2 POST /api/node/backup/{id}                 cmd/workpulse/newplat_hosted.go:63
#      🔴 大 body 流式上行（Hub 侧 io.Copy 经 LimitReader 32GiB 上限落盘并同步算 sha256，
#      internal/hosted/backup.go:192）。🔴 先查后鉴权：id 不存在或状态非 pending ⇒
#      404 error=backup_not_pending（backup.go:164-168；丙案新增 already 分支 :169-175——已落盘待比对的同 id 再传也 404 不覆写），只有 pending 的才走到节点凭据校验
#      ⇒ 探针拿不到 pending id 时【期望码是 404，不是 401】——别把 404 读成「反代没放行」。
#   3 GET  /api/console/hosted/options           cmd/workpulse/hosted_routes.go:39
#   4 POST /api/console/hosted/agents            cmd/workpulse/hosted_routes.go:40
#   5 GET  /api/console/hosted/jobs/{jobID}      cmd/workpulse/hosted_routes.go:41
#   6 POST /api/console/hosted/agents/{agentID}/{op}  cmd/workpulse/hosted_routes.go:42
#   7 GET  /api/console/admin/quotas             cmd/workpulse/hosted_routes.go:43
#   8 PUT  /api/console/admin/quotas/{userID}    cmd/workpulse/hosted_routes.go:44
#      3-8 探针：未带会话 ⇒ 401 error=unauthenticated（hosted_routes.go:120-132 actorOf）；
#      口令待改 ⇒ 403 error=must_change_password。
#
# ── nginx 片段（值由 prodops 按现网填；此文件不进真实域名/证书/密钥）──

# 1 · 节点代理拨入（WSS 长连）
# 🔴 超时为什么必须长（复验订正，依据实核）：节点容量帧的【发送】节拍＝heartbeatInterval
# 默认 60s（internal/nodeagent/run.go:142-145；SetHeartbeatInterval 的唯一调用方是测试，
# 生产恒 60s）；run.go:167 的 15s 只是【检查】节拍，发送条件在 :176（距上次满 interval
# 或变更超阈值）⇒ 最坏闲时缺口 60–75s，且两侧都无 ping/pong、无 deadline ⇒ 反代若用
# 默认 60s 读超时，闲时必砍连接。3600s 是盖缺口，不是余量——🔴 不得调小到 60s。
location /api/node/connect {
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_pass http://127.0.0.1:{{WP_PORT}};
}

# 2 · 节点备份回传（流式上行；🔴 体积上限须 ≥ Hub 侧 32GiB 接收上限，否则销毁前备份
#    会在反代层被截断——现象：备份失败、容器不被删，席位记 error/backup_failed）
# 🔴 trailer 闸（终态，R-TRAILER-PROXY-PROBE-20261002172530 实测已出）：106 实测
#    nginx 1.24.0 丢弃请求 trailer ⇒ 取丙（R-G4-BACKUP-CHECKSUM-CTRL-20261002172951）：
#    校验值改走控制面补报（export_seat 结果载荷，WSS 不经反代）、Hub 落盘自算、
#    相等才转 complete、未补报或不等 ⇒ 不销毁（backup_failed）；trailer 到达仅作旁证。
#    实现在本仓（节点 nodeagent/backup.go、Hub hosted/backup.go）。🔴 探针注意：
#    拿不存在的 id 测不出来——Hub 先查状态再读 body（hosted/backup.go:164-168），
#    404 分支根本不读 body，trailer 是否被剥无从显现。
location /api/node/backup/ {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    client_max_body_size 32g;                   # 或直接 0＝不限；不得小于 32GiB（backup.go:192）
    proxy_request_buffering off;                # 流式，不整收再转
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_pass http://127.0.0.1:{{WP_PORT}};
}

# 3-8 · console 托管面与管理配额（普通 HTTPS API，无特殊头）
location /api/console/hosted/ {
    proxy_http_version 1.1;
    proxy_set_header Host $host;

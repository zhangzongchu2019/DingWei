<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>变更风险与验收证据</title><style>body{font:16px system-ui;max-width:1000px;margin:2rem auto;padding:1rem}label{display:block;margin:.5rem 0}input,select,textarea,button{font:inherit;padding:.4rem}input{width:70%}article,section{border:1px solid #bbb;padding:1rem;margin:1rem 0}pre{white-space:pre-wrap;overflow-wrap:anywhere}.warning{color:#984b00}</style>
<a href="/console">返回 Console</a><h1>变更风险与验收证据</h1><p>风险提醒与已知悉不阻塞合并，也不代替 PM 回应、委员会确认或验收。依赖未知不会显示为通过。</p>
<form id="coordinates"><label>提供方<select name="provider"><option value="github">GitHub</option><option value="gongfeng">工蜂</option></select></label><label>Git 实例<input name="git_instance" required></label><label>仓库<input name="repository" required></label><label>变更目录<input name="change_dir" required></label><label>PR／MR 固定标识<input name="change_id" required></label><label>目标完整 SHA<input name="commit_sha" required pattern="[0-9a-f]{40}"></label><button>读取当前证据</button></form>
<p id="message" role="status"></p><div id="content"></div>
<section id="actions" hidden><button id="detect">重新判定风险</button><button id="deliver">重核 MR 评论投递</button><p>推进会重新核实全部前提；工具成功和任务全勾不能单独推进。</p><label>下一阶段<select id="next"><option>SPEC_REVIEW</option><option>SPEC_APPROVED</option><option>IMPLEMENTING</option><option>ACCEPTANCE</option><option>ARCHIVED</option><option>RELEASED</option></select></label><label>发布环境（仅 RELEASED）<input id="environment"></label><button id="advance">显式推进</button>
<h2>追加场景结果</h2><label>固定场景编号<input id="scenario"></label><label>结果<select id="result-status"><option>PASS</option><option>FAIL</option><option value="NOT_RUN">未执行</option><option value="NOT_APPLICABLE">不适用</option></select></label><label>实际受检完整 SHA<input id="tested"></label><label>证据位置<input id="evidence"></label><label>未执行／不适用理由<textarea id="reason"></textarea></label><label>修正的上一结果 ID（有历史时必填）<input id="supersedes"></label><button id="result">追加结果与证据</button></section>
<script>
'use strict';
const form=document.getElementById('coordinates'),content=document.getElementById('content'),message=document.getElementById('message'),actions=document.getElementById('actions');let loaded=null,generation=0,busy=false,pending=null;
function coord(){return Object.fromEntries(new FormData(form).entries());}
function line(parent,label,value){const p=document.createElement('p');p.textContent=label+value;parent.append(p);}
function clear(){generation++;loaded=null;pending=null;content.replaceChildren();actions.hidden=true;message.textContent='';}
form.addEventListener('input',clear);
actions.addEventListener('input',()=>{pending=null;});
async function request(url,options){const r=await fetch(url,{credentials:'same-origin',cache:'no-store',...options});if(!r.ok){const e=Error(await r.text());e.status=r.status;throw e;}return r.json();}
function draw(v){content.replaceChildren();loaded=v;actions.hidden=false;line(content,'目标 SHA：',v.state.Coordinate.commit_sha);line(content,'当前 MR head：',v.current_head);line(content,'阶段：',v.state.Phase+(v.old_version?'（旧版本，历史阶段不代表当前已满足）':''));line(content,'当前阻塞：',v.blocking_reason||'无');line(content,'当前风险检查：',v.risk_status==='current'?'当前输入已核':v.risk_status==='stale'?'输入已变化或尚未判定；历史知悉不覆盖新输入':'无法判定');line(content,'平台已记录的发布环境：',JSON.stringify(v.recorded_releases||[]));line(content,'场景数量：',JSON.stringify(v.scenario_counts));line(content,'全部场景已执行通过：',v.all_executed_passed?'是':'否');
 const reminder=v.state.Reminder;if(reminder){const latest=reminder.Revisions.at(-1);for(const r of reminder.Revisions){const card=document.createElement('article');line(card,'风险修订：',r.ID);line(card,'规则版本：',r.RuleVersion);line(card,'命中依据：',JSON.stringify(r.Hits));line(card,'负责人：',r.Owner);line(card,'Console 投递：',r.Console.Status);line(card,'MR 投递：',r.MR.Status+' '+(r.MR.Location||''));line(card,'知悉：',r.Acknowledged?JSON.stringify(r.Acknowledged):'待知悉');if(r.ID===latest.ID&&!r.Acknowledged){const button=document.createElement('button');button.textContent='已知悉该修订';button.onclick=()=>write('ack',{revision:r.ID});card.append(button);}content.append(card);}line(content,'合并时刻：',reminder.MergedAt&&!reminder.MergedAt.startsWith('0001-')?reminder.MergedAt:'未知');}
 const detail=document.createElement('pre');detail.textContent=JSON.stringify({facts:v.facts,results:v.state.Results,history:v.state.Events,tools:v.state.Tools},null,2);content.append(detail);}
form.onsubmit=async ev=>{ev.preventDefault();const mine=++generation;loaded=null;content.replaceChildren();actions.hidden=true;try{const v=await request('/api/console/change-evidence?'+new URLSearchParams(coord()));if(mine===generation){draw(v);message.textContent='当前权限与证据已读取；提交时仍会重核。';}}catch(e){if(mine===generation)message.textContent=e.message;}};
async function write(action,extra={}){if(!loaded||busy)return;const target=loaded.state.Coordinate;if(JSON.stringify(coord())!==JSON.stringify({provider:target.provider,git_instance:target.git_instance,repository:target.repository,change_dir:target.change_dir,change_id:target.change_id,commit_sha:target.commit_sha})){clear();return;}
 const payload={action,coordinate:target,...extra},key=JSON.stringify(payload);if(!pending||pending.key!==key)pending={key,id:crypto.randomUUID()};payload.operation_id=pending.id;const mine=generation;busy=true;
 try{const v=await request('/api/console/change-evidence',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});if(mine!==generation)return;draw(v);pending=null;message.textContent='操作已记录；状态、结果与发布事实分别显示。';}catch(e){if(mine===generation){loaded=null;content.replaceChildren();actions.hidden=true;message.textContent=e.message+'（请重新读取；同一操作重试保留编号）';}}finally{busy=false;}}
document.getElementById('detect').onclick=()=>write('detect');document.getElementById('deliver').onclick=()=>write('deliver');document.getElementById('advance').onclick=()=>write('advance',{expected:loaded.state.Phase,to:document.getElementById('next').value,environment:document.getElementById('environment').value});document.getElementById('result').onclick=()=>write('result',{scenario:document.getElementById('scenario').value,status:document.getElementById('result-status').value,tested_commit:document.getElementById('tested').value,evidence:document.getElementById('evidence').value,reason:document.getElementById('reason').value,supersedes:document.getElementById('supersedes').value});
</script></html>

name: speclint

# 与 scripts/speclint-gate.sh 是同一道闸的两处装法。
#
# 🔴 **两处装法的实际效力，须照实写**（2026-08-26 更正）：
#   · 本机 pre-commit 钩子：**只对装了它的人生效**，且闸自身印着 `--no-verify` 的绕行方式
#     （有意为之：让绕行留痕，而不是堵死）。
#   · 本 workflow：**只对触发面内的路径生效**，且**当前不是保护分支的必过状态检查**
#     ⇒ 它给的是【可见性】，**不是【强制】**。红了不挡合入。
#
# ⚠️ 本注释此前写作「CI 这道对所有人生效」—— **它没有这个属性**：
#   当时触发面是 `paths:['docs/**']`，只对改 docs 的人生效。
#   实例：2026-08-26 的 38d4c46 只改 specs/**，完全未触发，
#   分支头一度停在闸 ㉒ 判 FAIL 的状态而无人收到告警。
#   🔴 **声称的作用域大于实际覆盖面的注释，比没有注释更坏** —— 读的人据它认为已被覆盖。
#
# 🔴 **触发面必须覆盖闸的载体本身**：闸脚本、基线、索引若不在触发面内，
#   它们能被静默改掉而 CI 一声不响（上调 specs/gates/*-baseline.txt ＝ 放宽判据）。
#   本触发面由 scripts/workflow-coverage-gate.sh（提交闸 ㉗）逐条核，防止下次被收窄。
# ⚠️ 两处 paths 【显式写全，不用 YAML 锚点】——GitHub Actions 不支持 anchor/alias，
#   且工蜂是否执行 Actions 语法尚未核实（ops 2026-08-26）。
#   ⇒ 重复由闸 ㉗ 对撞两处是否一致，**不靠人记得同步**。
on:
  push:
    paths:
      - 'docs/**'
      - 'scripts/**'
      - 'specs/**'
      - 'go.mod'
      - 'go.sum'
      - 'build.sh'
      - 'Makefile'
      - 'deploy/**'
      - 'view-service/**'
      - '.github/**'
  pull_request:
    paths:
      - 'docs/**'
      - 'scripts/**'
      - 'specs/**'
      - 'go.mod'
      - 'go.sum'
      - 'build.sh'
      - 'Makefile'
      - 'deploy/**'
      - 'view-service/**'
      - '.github/**'

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
      - name: 提交闸 ①–㉗
        run: scripts/speclint-gate.sh
      - name: Python、shell 与 Go 测试
        run: make test

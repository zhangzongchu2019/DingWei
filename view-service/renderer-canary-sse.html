<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DingWei Event View</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f7f9;
      --panel: #ffffff;
      --panel-2: #f0f3f7;
      --text: #20242a;
      --muted: #69717d;
      --line: #d8dee8;
      --accent: #0b6bcb;
      --accent-2: #0f766e;
      --danger: #b42318;
      --danger-bg: #fff1f0;
      --code-bg: #101828;
      --code-text: #e6edf3;
      --waiting-white-space: nowrap;
      --shadow: 0 12px 30px rgba(16, 24, 40, 0.08);
    }

    [data-theme="dark"] {
      color-scheme: dark;
      --bg: #111316;
      --panel: #1b1f24;
      --panel-2: #242a31;
      --text: #eef2f6;
      --muted: #a8b0bb;
      --line: #38414c;
      --accent: #6cb6ff;
      --accent-2: #7dd3c7;
      --danger: #ffb4a9;
      --danger-bg: #3a1f1f;
      --code-bg: #070b10;
      --code-text: #e6edf3;
      --shadow: 0 12px 30px rgba(0, 0, 0, 0.35);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      height: 100vh;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font: 14px/1.55 ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing: 0;
    }
    button, input { font: inherit; }
    .app {
      height: 100vh;
      min-height: 0;
      min-width: 0;
      max-width: 100vw;
      display: grid;
      grid-template-rows: auto 1fr auto;
      overflow: hidden;
    }
    .topbar {
      position: sticky;
      top: 0;
      z-index: 5;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 18px;
      background: color-mix(in srgb, var(--panel) 92%, transparent);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(10px);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }
    .mark {
      display: grid;
      place-items: center;
      width: 32px;
      height: 32px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--panel-2);
      color: var(--accent);
      font-weight: 700;
    }
    .title {
      font-size: 18px;
      font-weight: 750;
      white-space: var(--waiting-white-space);
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.2;
    }
    .subtitle {
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .lock-panel {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 10px;
      min-width: 0;
      flex-wrap: wrap;
    }
    .lock-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: 32px;
      padding: 0 10px;
      border-radius: 999px;
      border: 1px solid var(--line);
      font-weight: 750;
      white-space: nowrap;
    }
    .lock-badge.readonly {
      color: var(--danger);
      border-color: color-mix(in srgb, var(--danger) 50%, var(--line));
      background: color-mix(in srgb, var(--danger-bg) 80%, var(--panel));
    }
    .lock-badge.writable {
      color: var(--accent-2);
      border-color: color-mix(in srgb, var(--accent-2) 50%, var(--line));
      background: color-mix(in srgb, var(--accent-2) 12%, var(--panel));
    }
    .lock-help {
      color: var(--muted);
      font-size: 13px;
      white-space: nowrap;
    }
    .source-badge {
      display: inline-block;
      padding: 1px 6px;
      margin-right: 6px;
      border-radius: 4px;
      font-size: 11px;
      line-height: 16px;
      background: var(--accent, #2f6fdd);
      color: #fff;
      vertical-align: middle;
    }
    .source-badge--trusted { background: #1a7f4b; }
    /* display-provenance v1 来源图标(灰度 flag 门控) */
    .prov-ic { display: inline-flex; align-items: center; justify-content: center; width: 18px; height: 18px; border-radius: 50%; background: color-mix(in srgb, var(--accent) 18%, var(--panel)); color: var(--accent); font-size: 11px; font-weight: 600; vertical-align: middle; flex: none; }
    .prov-ic .prov-svg { width: 13px; height: 13px; display: block; }
    .prov-ic--human { background: var(--accent); color: #fff; }
    .prov-label { font-size: 12px; color: var(--muted, #888); margin: 0 4px 0 3px; vertical-align: middle; }
    .prov-spin { color: var(--muted, #888); font-size: 12px; margin-right: 4px; }
    /* 等候区在途条(张宗楚灰度反馈#2):明确「投递中」+单行截断,不与「已收到消息」混淆 */
    .waiting-item--pending { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--muted, #888); }
    .waiting-item--pending .waiting-text { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1 1 auto; min-width: 0; }
    .waiting-item--pending .prov-spin { flex: none; }
    .waiting-item--pending .waiting-stage { flex: none; }
    .card-stage-footer {
      margin-top: 4px;
      font-size: 12px;
      color: var(--muted, #888);
      display: flex;
      gap: 6px;
      align-items: center;
      flex-wrap: wrap;
    }
    .card-footnote {
      font-size: 11px;
      color: var(--muted, #888);
      border: 1px dashed var(--muted, #888);
      border-radius: 4px;
      padding: 0 4px;
    }
    .cancellable-tag {
      font-size: 11px;
      color: #b8860b;
      border: 1px solid #b8860b;
      border-radius: 4px;
      padding: 0 4px;
      margin-left: 6px;
    }
    .waiting-stage { margin-left: 6px; font-size: 11px; color: var(--muted, #888); }

    /* C2 待提交区删除/中断确认 */
    .waiting-cancel-btn {
      font-size: 11px; line-height: 1; padding: 1px 6px; margin-left: 6px;
      border: 1px solid var(--danger, #c00); color: var(--danger, #c00);
      background: transparent; border-radius: 4px; cursor: pointer;
    }
    .waiting-cancel-btn:disabled { opacity: .5; cursor: default; }
    .c2-note { margin-left: 6px; font-size: 11px; color: var(--muted, #888); }

    /* C3 责任方任务看板 */
    .taskboard-handle {
      position: fixed; right: 0; top: 40%; z-index: 40;
      writing-mode: vertical-rl; padding: 10px 6px;
      border: 1px solid var(--line, #444); border-right: none;
      border-radius: 8px 0 0 8px;
      background: var(--bg-elev, #1e1e24); color: var(--fg, #ddd);
      cursor: pointer; font-size: 13px;
    }
    .taskboard-panel {
      position: fixed; right: 0; top: 0; bottom: 0; width: 320px; z-index: 39;
      background: var(--bg-elev, #1e1e24); border-left: 1px solid var(--line, #444);
      display: flex; flex-direction: column; overflow: hidden;
    }
    .taskboard-panel[hidden] { display: none; }
    .taskboard-head { padding: 10px 12px; border-bottom: 1px solid var(--line, #444); }
    .taskboard-title { font-weight: 600; font-size: 14px; }
    .taskboard-updated { font-size: 11px; color: var(--muted, #888); margin-top: 4px; }
    .taskboard-updated.stale { color: #b8860b; }
    .taskboard-error { color: var(--danger, #d66); font-size: 13px; }
    .taskboard-list { flex: 1; overflow-y: auto; padding: 8px; display: flex; flex-direction: column; gap: 8px; }
    .task-card { border: 1px solid var(--line, #444); border-radius: 8px; padding: 8px; background: var(--bg, #16161c); }
    .task-card-head { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .task-dot { width: 8px; height: 8px; border-radius: 50%; flex: 0 0 auto; }
    .task-dot.status-todo { background: #888; }
    .task-dot.status-in_progress { background: #2f6fdd; }
    .task-dot.status-blocked { background: #d66; }
    .task-dot.status-in_review { background: #b8860b; }
    .task-dot.status-done { background: #1a7f4b; }
    .task-id { font-weight: 600; font-size: 13px; }
    .task-title { font-size: 12px; color: var(--fg, #ddd); flex: 1; }
    .task-owner { font-size: 11px; color: var(--muted, #888); }
    .task-card-body { margin-top: 6px; font-size: 12px; display: flex; flex-direction: column; gap: 4px; }
    .task-status-line { color: var(--muted, #888); font-size: 11px; }
    .task-bar { height: 4px; border-radius: 2px; background: var(--line, #444); overflow: hidden; }
    .task-bar-fill { height: 100%; background: var(--accent, #2f6fdd); }
    .task-blockers { color: #d66; font-size: 11px; }
    .task-deps { font-size: 11px; color: var(--accent, #2f6fdd); cursor: pointer; }
    .task-note { font-size: 11px; color: var(--fg, #ccc); white-space: pre-wrap; }
    .task-evidence { display: flex; align-items: center; gap: 6px; font-size: 11px; }
    .task-evidence-text { color: var(--muted, #888); word-break: break-all; flex: 1; }
    .task-evidence-copy { font-size: 10px; padding: 1px 6px; border: 1px solid var(--line, #444); border-radius: 4px; background: transparent; color: var(--fg, #ddd); cursor: pointer; }
    .task-card.status-blocked { border-color: #d66; }
    @media (max-width: 768px) {
      .taskboard-panel { width: 100%; top: auto; height: 60%; border-left: none; border-top: 1px solid var(--line, #444); }
      .taskboard-handle { top: auto; bottom: 40%; writing-mode: horizontal-tb; border-radius: 8px 8px 0 0; border: 1px solid var(--line, #444); border-bottom: none; }
    }

    .unlock-btn {
      height: 32px;
      border-radius: 6px;
      border: 1px solid var(--accent);
      background: var(--accent);
      color: #fff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 10px;
      cursor: pointer;
      white-space: nowrap;
    }
    .unlock-btn[hidden] { display: none; }
    .controls {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      flex-wrap: wrap;
    }
    .icon-btn, .text-btn, .file-label {
      height: 34px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--panel);
      color: var(--text);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 0 10px;
      cursor: pointer;
      box-shadow: none;
    }
    .icon-btn { width: 36px; padding: 0; }
    .icon-btn:hover, .text-btn:hover, .file-label:hover { border-color: var(--accent); }
    .file-label input { display: none; }

    /* ── 0.2.0.6 A 线：正文区文件渲染（业主第 2 条） ───────────────────
       渲染不了的一律给下载链接，绝不留裸 URL、绝不报错卡。 */
    .attachments { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
    .attachment {
      border: 1px solid var(--line); border-radius: 8px; padding: 8px;
      background: var(--panel); max-width: 100%; overflow: hidden;
    }
    .attachment-head {
      display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
      font-size: 12px; color: var(--muted); margin-bottom: 6px;
    }
    .attachment-name { color: var(--text); font-weight: 600; word-break: break-all; text-decoration: none; }
    .attachment-name:hover { text-decoration: underline; }
    /* R5-2：正文里那条已经被渲染成附件块的 URL ⇒ 视觉隐藏。
       🔴 只隐藏，不从 DOM 删除 —— 接收侧靠扫正文里的 /f/ 直链分派（附录 B2），
          删掉会让那条机制失效，也会让「附件块数 == 正文直链数」这条不变式失去锚。 */
    .dw-link-rendered { display: none; }
    .attachment img, .attachment video { max-width: 100%; max-height: 420px; border-radius: 6px; display: block; }
    .attachment iframe { width: 100%; height: 480px; border: 0; border-radius: 6px; background: #fff; }
    .attachment audio { width: 100%; display: block; }
    .attachment pre {
      margin: 0; max-height: 360px; overflow: auto; white-space: pre-wrap; word-break: break-word;
      font-size: 12px; line-height: 1.5;
    }
    .attachment-dl {
      display: inline-flex; align-items: center; gap: 6px; text-decoration: none;
      border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; color: var(--text);
    }
    .attachment-dl:hover { border-color: var(--accent); }
    .attachment-note { font-size: 12px; color: var(--muted); margin-top: 6px; }
    .drop-hint {
      margin-top: 8px; padding: 10px; border: 1px dashed var(--accent); border-radius: 8px;
      text-align: center; font-size: 13px; color: var(--muted);
    }
    .composer.dragging .composer-inner { border-color: var(--accent); }

    /* ── 上传进度（业主验收第 1 条）────────────────────────────── */
    .upload-queue { display: flex; flex-direction: column; gap: 6px; margin-bottom: 8px; }
    .upload-row {
      display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; align-items: center;
      border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; background: var(--panel);
      font-size: 12px;
    }
    .upload-row .u-name { color: var(--text); font-weight: 600; word-break: break-all; }
    .upload-row .u-meta { color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
    .upload-row .u-bar { grid-column: 1 / -1; height: 4px; border-radius: 2px; background: var(--line); overflow: hidden; }
    .upload-row .u-fill { height: 100%; width: 0; background: var(--accent); transition: width .15s linear; }
    /* 未知进度（申请票据/等响应）时用一条来回走的条，表示「在动」而不是「卡住」 */
    .upload-row.indeterminate .u-fill { width: 35%; animation: u-slide 1.1s ease-in-out infinite; }
    @keyframes u-slide { 0% { margin-left: -35%; } 100% { margin-left: 100%; } }
    .upload-row.failed { border-color: #c0392b; }
    .upload-row.failed .u-meta { color: #c0392b; }
    .upload-row .u-retry { grid-column: 1 / -1; justify-self: start; font-size: 12px; padding: 1px 8px; }
    .upload-row.done .u-fill { background: #2e9e5b; }

    /* ── 批次级状态（R6，组长 2026-09-18 裁定）──────────────────────
       🔴 批次行与单文件行是**两层**，故用独立类名、独立 DOM，不复用 .upload-row：
          复用会让盯单文件行的断言被批次行连带满足（⑨ 的「完成后不得残留进度行」
          正是这种形状），于是批次行一出现，⑨ 就再也分辨不出单文件行有没有清干净。*/
    .batch-row {
      display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; align-items: center;
      border: 1px solid var(--accent); border-radius: 6px; padding: 6px 10px; background: var(--panel);
      font-size: 12px;
    }
    .batch-row .b-name { color: var(--text); font-weight: 600; }
    .batch-row .b-meta { color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
    .batch-row .b-bar { grid-column: 1 / -1; height: 4px; border-radius: 2px; background: var(--line); overflow: hidden; }
    .batch-row .b-fill { height: 100%; width: 0; background: var(--accent); transition: width .15s linear; }
    .batch-row[data-batch-state="all-ok"] .b-fill { background: #2e9e5b; }
    .batch-row[data-batch-state="has-failure"] { border-color: #c0392b; }
    .batch-row[data-batch-state="has-failure"] .b-meta { color: #c0392b; }

    /* ── 草稿附件缩略图（业主验收第 2 条）───────────────────────── */
    .draft-attachments { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
    .draft-chip {
      display: flex; align-items: center; gap: 8px; max-width: 260px;
      border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px 6px 6px; background: var(--panel);
    }
    .draft-chip img { width: 40px; height: 40px; object-fit: cover; border-radius: 4px; display: block; flex: 0 0 auto; }
    .draft-chip .d-icon {
      width: 40px; height: 40px; border-radius: 4px; flex: 0 0 auto; display: flex;
      align-items: center; justify-content: center; font-size: 18px; background: var(--bg); border: 1px solid var(--line);
    }
    .draft-chip .d-text { min-width: 0; }
    .draft-chip .d-name { font-size: 12px; font-weight: 600; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .draft-chip .d-size { font-size: 11px; color: var(--muted); }
    .main {
      min-height: 0;
      min-width: 0;
      max-width: 100%;
      display: flex;
      flex-direction: column;
      width: 100%;
      margin: 0 auto;
      padding: 16px;
      overflow: hidden;
    }
    .stream-alert {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
      padding: 10px 12px;
      border: 1px solid color-mix(in srgb, var(--danger) 45%, var(--line));
      border-radius: 8px;
      background: var(--danger-bg);
      color: var(--danger);
    }
    .stream-alert[hidden] { display: none; }
    .stream-alert .text-btn { flex: 0 0 auto; }
    .timeline {
      flex: 1;
      min-width: 0;
      min-height: 0;
      max-width: 100%;
      display: flex;
      flex-direction: column;
      gap: 10px;
      overflow-y: auto;
      overscroll-behavior: contain;
      padding-right: 4px;
      scroll-behavior: smooth;
    }
    .waiting-area {
      flex: 0 0 auto;
      margin-top: 10px;
      max-height: min(35vh, 280px);
      border: 1px dashed var(--line);
      border-radius: 10px;
      background: color-mix(in srgb, var(--muted) 12%, var(--panel));
      overflow-y: auto;
      overscroll-behavior: contain;
    }
    .waiting-area[hidden] { display: none; }
    .waiting-item {
      padding: 10px 12px;
      border-top: 1px solid var(--line);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .waiting-item:first-child { border-top: none; }
    .waiting-item::before {
      content: '';
      display: inline-block;
      width: 11px;
      height: 11px;
      margin-right: 8px;
      vertical-align: -1px;
      border: 2px solid color-mix(in srgb, var(--muted) 35%, transparent);
      border-top-color: var(--muted);
      border-radius: 50%;
      animation: dw-waiting-spin .7s linear infinite;
    }
    @keyframes dw-waiting-spin { to { transform: rotate(360deg); } }
    .task-progress {
      flex: 0 0 auto;
      height: 3px;
      width: 100%;
      overflow: hidden;
      background: color-mix(in srgb, var(--accent) 15%, transparent);
      border-radius: 2px;
    }
    .task-progress[hidden] { display: none; }
    .task-progress::before {
      content: '';
      display: block;
      height: 100%;
      width: 40%;
      background: var(--accent);
      border-radius: 2px;
      animation: dw-task-indeterminate 1.1s ease-in-out infinite;
    }
    @keyframes dw-task-indeterminate {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(250%); }
    }
    @media (prefers-reduced-motion: reduce) {
      .waiting-item::before { animation: none; }
      .task-progress::before { animation-duration: 2.2s; }
    }
    .message-card, .activity-card {
      flex: 0 0 auto;      /* 关键:不被 flex 压缩,事件保持原高 → 溢出由 timeline 滚动,而不是压扁内容 */
      display: block;
      width: 100%;
      max-width: 100%;
      min-width: 0;
      border: 1px solid var(--line);
      background: var(--panel);
      border-radius: 8px;
      box-shadow: var(--shadow);
      overflow: visible;
    }
    /* T-054:辅助面板收进右侧边条,只留错误。形态对齐既有 .taskboard-handle/.taskboard-panel。 */
    .workspace-dock[hidden] { display: none; }
    .workspace-dock {
      position: fixed; right: 0; top: 58%; z-index: 40;
      display: flex; flex-direction: row-reverse; align-items: flex-start;
    }
    .workspace-dock-toggle {
      writing-mode: vertical-rl; padding: 10px 6px;
      border: 1px solid var(--danger, #d66); border-right: none;
      border-radius: 8px 0 0 8px;
      background: var(--bg-elev, #1e1e24); color: var(--danger, #d66);
      cursor: pointer; font-size: 13px; white-space: nowrap;
    }
    .workspace-dock-body {
      /* 🔴 宽度必须带视口上限:dock 是 position:fixed 的 flex row-reverse 容器,承载面
         (console 右栏 iframe)窄于「面板＋把手」时,定值 320px 会把整个 dock 顶出视口。
         判据:renderer-failure-dock-embedded-regression.js 腿二(窄档量溢出)。 */
      width: min(320px, calc(100vw - 64px)); max-height: 60vh; overflow-y: auto;
      background: var(--bg-elev, #1e1e24); border: 1px solid var(--danger, #d66);
      border-radius: 8px 0 0 8px;
    }
    .workspace-dock-legacy {
      flex: 0 0 auto;
      margin-top: 10px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--panel);
      box-shadow: var(--shadow);
      overflow: hidden;
    }
    .workspace-dock-toggle, .dock-section-title {
      border: 0;
      background: transparent;
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: space-between;

       区块标题不需要它:那是 block 级的 flex 容器,宽度本就填满父级(实测撤掉后仍为 318px)。

    /* 响应式优先级:窄屏只留 主题切换/主机时间/锁状态/解锁;够宽再追加 服务资源 */
    .sb-res { display: none; }
    @media (min-width: 880px) { .sb-res  { display: inline-flex; } }
    /* RED 0.2.1.2:📎/📷 移进状态栏后**必须单独豁免**上面那条响应式隐藏。
       直接沿用 .sb-res 会让它们在 <880px 时整排 display:none ⇒ 窄窗口下按钮消失,
       那就是 0.2.0.5 的坑「界面上看不见按钮 = 功能不存在」(业主 0.2.0.6 第 1 条验收意见的成因)。
       ⇒ .sb-always 不参与任何 media query,任何宽度都显示。业主确认的阴格盯的就是这一条。 */
    /* 🔴 这两个元素**同时**挂 .sb-res 与 .sb-always:
       挂 .sb-res 是因为它们确实属于"状态栏追加区"(将来有人整理这一区时会连它们一起动);
       .sb-always 才是把它们从隐藏里救回来的那一道。
       🔴 第一版我只挂 .sb-always 不挂 .sb-res —— 变异"删掉 .sb-always"**零转红**:
       元素本来就不在隐藏规则的作用域里,豁免规则是**空的**,而阴格照样全绿。
       (自己写的「东西在那儿但不起作用」,靠组长要求的那发变异才照出来。) */
    .statusbar .sb-always { display: inline-flex !important; }

  <script>
    const timeline = document.getElementById('timeline');

    const headerSessionName = document.getElementById('headerSessionName');

    const costAccountingMode = /* VS_COST_ACCOUNTING_MODE */ 'active';
    const composerInner = document.getElementById('composerInner');
    const filePicker = document.getElementById('filePicker');
    const dropHint = document.getElementById('dropHint');
    const uploadQueue = document.getElementById('uploadQueue');
    const draftAttachments = document.getElementById('draftAttachments');
    const taskProgress = document.getElementById('taskProgress');
    const memStat = document.getElementById('memStat');
    const diskStat = document.getElementById('diskStat');
    const localTime = document.getElementById('localTime');

    // VS 代理端点自定位 scoped base(M1):保留 /view 前全部 pathname 前缀(/dingwei/view/<sess>/ → /dingwei/view/<sess>),
    // 未命中(根直出/nginx)→''=根相对。VS _serve_file 字面量改写降为冗余(本处不再含 ''/ep'' 引号字面量,不会双前缀)。
    // 懒解析(生产边角实证:bare POST /control=404):每次取当前 pathname,防 init 时 URL 未就绪/未来客户端跳转;
    // 根直出恒 ''(F5 不受影响)。注:本页不 mutate URL,空 base 另一主因=缓存旧件根绝对端点(部署侧缓存课题)。
    const apiBase = () => (location.pathname.match(/^(.*?\/view\/[^/]+)/) || [null, ''])[1];
    const apiEp = p => apiBase() + '/' + p;
    // API=init 快照,仅供诊断/测试读取;请求路径一律走 apiEp() 懒解析,勿再新增 API.x 调用点。
    const API = {
      events: apiEp('events'),
      input: apiEp('input'),
      interrupt: apiEp('interrupt'),
      control: apiEp('control'),
      status: apiEp('status'),
      page: apiEp('page'),
    };
    let eventSource = null;
    let eventSourceGeneration = 0;
    // 🔴 0.2.1.35-⑬:这个标志**必须是模块级的**。它原先是 connectEventStream() 的闭包局部,
    //    而 0.2.1.2 的自建重连每次都**新建** EventSource(scheduleReconnect → connectEventStream),
    //    于是它每次重连都归零 ⇒ 下面那句 `if (streamEverOpened) markStreamReconnect()`
    //    在**已发的自动重连路径上从不执行** ⇒ T-086 的延迟清空永不 arm ⇒ resetConversation 永不运行
    //    ⇒ 每次重连把整份 ring 又追加一遍(实测 26s / 18 次重连:正文 15360 → 136320 字,
    //      markStreamReconnect 调用数 = 0)。
    //    🔵 EventSource **原生**重连是"同一对象二次 open",所以这个 bug 在 0.2.1.2 之前不成立
    //      (对照实测:摘掉自建重连、以及真 pre-0.2.1.2 的件,正文全程纹丝不动)。
    //    判据是"**这个页面**曾经连上过",不是"**这个对象**open 过第二次"。
    let streamEverOpened = false;
    let streamConnectTimer = null;
    const STREAM_CONNECT_GRACE_MS = 7500;
    // RED 0.2.1.2:移除「重连」按钮**必须同时加自动重连** —— 移除前它是 SSE 断开后
    //    **唯一**的恢复入口,先拿掉再说等于"断线只能刷页面"。
    //    业主定「网络确实不好时 30 秒一次」;组长收口为**先快后慢**:
    //    瞬断不让业主等 30 秒,持续坏时落在业主说的 30 秒。
    const RECONNECT_BACKOFF_MS = [1000, 2000, 5000, 10000, 30000];
    let reconnectAttempt = 0;      // 第几次重连(0 = 当前是连着的)
    let reconnectTimer = null;
    let statusTimer = null;
    let rendered = 0;
    const messageBuffers = new Map();
    const messageNodes = new Map();
    const turnGroups = new Map();
    // ── View 长文本卡死 hotfix(A 节流 / B·C 上限 / D 缓存回收)──
    // 症状:7964 字契约文本使页面假死。根因=每个 SSE chunk 都触发一次全量 rebuildTurn +
    // renderMarkdown(整段历史文本),单回合 N 个 chunk ⇒ 近平方级重建。
    // B/C:时间线承载的「完整消息卡/回合卡」上限(不是 SSE chunk 数)。
    // 200 是**业主硬约束**(「始终最新 200 条」),不是性能取舍项。
    // 我曾据"200 与 500 只差 +486ms"把它改成 500,那是把硬约束当成了可优化的建议 —— 已按令改回。
    // 性能上 200/500 都不是闸门(真闸门是 H 的渲染死循环与 A 的每 chunk 全量重渲),
    // 故这里取 200 不带来任何性能代价;要改必须先改约束,不能由执笔按"技术最优"自决。
    // ── 2026-09-11 业主细化约束:按设备分档 ──
    // 业主原话(单位已与业主对齐:一轮=2 卡,输入/输出各一张):
    //     「PC:100 轮次 200 卡; 手机端:10 轮次 20 卡」
    // 🔴 **PC 档维持 200 不变** —— 即业主原有硬约束「始终最新 200 条」原样保留,
    //    本次只新增窄屏档。上一位执笔曾据性能把 200 改成 500 被退回并留言
    //    「要改必须先改约束,不能由执笔按技术最优自决」;该约束本次**未被改动**。
    // ⚠️ 计数单位是**时间线子节点数**。输入/输出各自成卡时 200 节点≈100 轮;
    //    若某些消息走回合分组渲染(turn-group 一个节点=一整轮),同样 200 节点会装下
    //    多达 200 轮 —— 即上限在分组模式下比预期**松**。本次不处理,记录在案。
    const NARROW_VIEWPORT_PX = 768;   // 与既有回归用的两档视口(1280/390)对齐
    function timelineMaxCards() {
      const w = (typeof window !== 'undefined' && window.innerWidth) || 1280;
      return w < NARROW_VIEWPORT_PX ? 20 : 200;   // 业主定:手机 10 轮次(20 卡)/ PC 100 轮次(200 卡)
    }
    // ── G:超长正文文件化 ───────────────────────────────────────
    // 业主定的方向:长文本本该落文件、直接读文件,不该在 View 页内联全量展示。
    // 超过阈值的回合正文**不再整段进 markdown**,只内联渲染开头一段摘要,
    // 其余通过[打开全文](Blob 新标签页)/[下载 .md]/[复制全文]取用 —— 正文一个字不丢。
    // 关键不变量:**内联渲染看到的字符数上界 = 摘要长度,与正文总长无关** ⇒ 渲染成本与长度解耦。
    // 这是治本的一层:A(节流)压的是频次、E(去重)断的是增长源、G 断的是"长度→成本"这条因果。
    const LONGTEXT_THRESHOLD = (typeof window !== 'undefined' && window.DW_LONGTEXT_THRESHOLD) || 4000;
    const LONGTEXT_EXCERPT = (typeof window !== 'undefined' && window.DW_LONGTEXT_EXCERPT) || 1200;
    const RENDER_THROTTLE_MS = 80;       // A:重渲合并窗口(要求区间 50~100ms)
    const assistantEntries = new Map();  // messageKey -> 渲染记录(非 turn 分组的流式助手卡)
    const pendingRenders = new Set();    // 待重渲的 turn group / assistant 记录
    let renderFlushTimer = null;
    let renderFlushFrame = null;
    const waitingDeliveries = new Map();
    // ── C2 control 地基(待提交区删除 + 中断确认)──
    // 传输层:默认真接 VS POST /control(仅 kind=cancel;VS 恒 200 {"ok":bool},ok=false=未受理/已注入/终态);
    // body 契约(派单②,与 devof5 书面冻结):legacy={kind,message_id,delivery_id} 三字段;
    // V2(生产)=补 page_id+page_token(VS authorize_page 授权,取自 pageIdentity,与 /input 同一对)+request_id(hub 幂等去重)。
    // window.C2_CONTROL_TRANSPORT 可注入覆盖(测试)。
    // 诚实语义(G-HONEST):VS 未受理→明说"未发出";受理 ok=true→"已请求";条目消失只由事件流 cancelled 驱动。
    const C2_ACK_TIMEOUT_MS = (typeof window !== 'undefined' && window.C2_ACK_TIMEOUT_MS) || 10000;  // 测试可经 window.C2_ACK_TIMEOUT_MS 覆盖
    const c2State = { interrupt: null };  // interrupt: {state:'requested', since, timer} | null
    // C2 中断目标上下文(契约 devof5 冻结):interrupt=注入后打运行中 turn,body 带 delivery_id+turn_id(无 message_id)。
    // active=最新未完成 turn;turn_completed 清除。requestId=该 turn 的中断意图幂等键(一个意图一个、重试复用;新 turn 新 id)。
    // root 精确(devof5 裁定,helper a5f7c25 双层 fence 精确匹配 delivery_id+turn_id、绝不打最新 turn):
    // 只认注入入口 user input 的 delivery(user_input / input_posted primary);copy/assistant/tool 事件**永不钉 root**
    // (其 delivery 非 root,错钉=stale 打不动);注入入口事件晚到即升级钉 root。**本地拦(devof5 再裁):
    // root 未确认不发**——一个 request_id↔一份不可变 body(hub reserveViewV2Request:同 rid 换 bodyHash=409 毒化),
    // provisional(子 delivery)恒 stale 零收益;root 未到时中断不了属诚实早报(fence 一样拦,不丢可中断性)。
    const c2TurnCtx = { active: null };  // {turnId, deliveryId, rootPinned, requestId} | null
    function c2TrackTurn(ev) {
      const norm = ev._norm || {};
      const tid = norm.turnId;
      if (!tid) return;
      if (ev.kind === 'state_change' && ev.data && ev.data.change === 'turn_completed') {
        if (c2TurnCtx.active && c2TurnCtx.active.turnId === tid) c2TurnCtx.active = null;
        return;
      }
      const isCopy = !!norm.copyKind || String(norm.deliveryMode || '').includes('copy');
      const isRootInput = !isCopy && (ev.kind === 'user_input' || ev.kind === 'input_posted');
      const dlv = ev.delivery_id || norm.deliveryId || '';
      if (!c2TurnCtx.active || c2TurnCtx.active.turnId !== tid) {
        c2TurnCtx.active = { turnId: tid, deliveryId: isCopy ? '' : dlv, rootPinned: isRootInput, requestId: null };
      } else if (!c2TurnCtx.active.rootPinned && isRootInput && dlv) {
        c2TurnCtx.active.deliveryId = dlv;  // 注入入口事件晚到→升级钉 root(requestId 不动,同意图复用)
        c2TurnCtx.active.rootPinned = true;
      }
    }
    // 真 transport:renderer→VS POST /control。非 cancel 的 kind(interrupt)不支持→sent:false 让调用方回退 legacy;
    // 成功时只回 VS 响应体({ok:bool}),由 c2SendControl 统一包装(与注入 mock 同形)。
    const c2VsTransport = {
      async send(msg) {
        if (msg.kind !== 'cancel') return { sent: false, reason: 'kind_not_supported' };
        // body 分契:legacy 三字段;V2 补 page_id+page_token+request_id(与 /input V2 同构)
        let ctlBody = { kind: 'cancel', message_id: msg.message_id || '', delivery_id: msg.delivery_id || '' };
        if (!ctlBody.message_id || !ctlBody.delivery_id) return { sent: false, reason: 'addr_incomplete' };  // 缺寻址字段本地拦(生产实证 15:13:28:发空串=VS 400,不如诚实早报)
        if (stats.authMode === 'view_page_v2') {
          if (!pageIdentity?.page_id || !pageIdentity?.page_token) return { sent: false, reason: 'no_page_identity' };  // fail-closed:无 V2 凭证不冒充,明说未发出
          ctlBody = { ...ctlBody, page_id: pageIdentity.page_id, page_token: pageIdentity.page_token, request_id: msg.request_id || '' };
        }
        try {
          const res = await fetch(apiEp('control'), {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(ctlBody),

    for (const type of ['wheel', 'touchstart', 'touchmove', 'mousedown', 'pointerdown']) {

        // 用户在初始窗口内**主动**上翻时立即交还滚动控制权；后续 live 事件
        // 只能在用户仍贴底时跟随。
        finishTimelineReplay(false);

      // 实测窄屏 20 卡:淘汰使位置被推离底部仅 **60px**,恰落在用户手势窗口内,
      // 于是被判成「用户想看历史」而永久交还跟随权 —— 连续流式那格 5/5 失败。
      // ⇒ 放弃跟随另立一条更宽的阈值:**离底不足 FOLLOW_RELEASE_GAP_PX 一律不放弃**。
      // 判宽的代价是「用户只滚了一点点,仍会被带回底」(再滚多一点即可);
      // 判窄的代价是「淘汰抖一下就永久失去跟随」,即本次要修的病。
      const gap = timeline.scrollHeight - timeline.clientHeight - timeline.scrollTop;

    // (业主 2026-09-10 截图:一张类型标 `event` 的卡 + 一张 👤 卡,正文相同)。

    const deliveryMergeKey = (id) => String(id || '').replace(/^dw-/, '');

    const C2_MERGE_HOLD_MS = (typeof window !== 'undefined' && window.C2_MERGE_HOLD_MS) || 3000;  // 归并等待窗(copy),测试可覆盖

    function bufferMergeCopy(dlvId, ev, opts = {}) {
      const buf = c1MergeBuf.get(dlvId) || [];

        timer: setTimeout(() => {
          if(!rec.managed) return flushMergeCopy(dlvId,rec);
          try {managedApplyActive=true;flushMergeCopy(dlvId,rec);flushPendingRenders();rec.managed.records.delete(rec);if(!rec.managed.records.size)rec.managed.resolve();}
          catch(err){rec.managed.reject(err);}finally{managedApplyActive=false;}
        }, opts.holdMs || C2_MERGE_HOLD_MS) };
      if(managedApplyActive&&managedApplyPending){rec.managed=managedApplyPending;managedApplyPending.records.add(rec);}
      buf.push(rec);
      c1MergeBuf.set(dlvId, buf);
    }
    function flushMergeCopy(dlvId, rec) {
      const buf = c1MergeBuf.get(dlvId) || [];
      const i = buf.indexOf(rec);
      if (i < 0) return;  // 窗内已归并
      buf.splice(i, 1);
      if (!buf.length) c1MergeBuf.delete(dlvId);

    function normalizeEvent(ev) {
      const data = ev.data || {};

      const rawVer = ev.schema_version ?? meta.schema_version ?? '';
      const isV2 = rawVer === 'delivery.v2' || rawVer === 2 || rawVer === '2';
      const norm = {
        messageId: ev.message_id || data.message_id || '',
        // view_observation 副本自身只有 copy_id;归并/取消寻址用被观察 primary 的 observed_delivery_id
        deliveryId: ev.observed_delivery_id || data.observed_delivery_id || ev.delivery_id || data.delivery_id || '',
        copyId: ev.copy_id || data.copy_id || '',
        turnId: ev.turn_id || data.turn_id || '',
        originDlv: ev.origin_delivery_id || data.origin_delivery_id || '',  // 归并锚(dev55 两签:helper 可信保留 hub meta.delivery_id 原样;仅相关性非鉴权)
        sourceKind: '', sourceLabel: '', sourceTrusted: false,
        stage: '', reason: '', copyKind: '', deliveryMode: '', cancellable: null,
        targets: [], text: '', stageIdx: -1, conflict: '',
      };
      // canonical 受保护字段
      norm.sourceKind = src.kind || '';
      // F3:可信徽标只认规范化 trust_decision(B0 决策层),不采信 raw provenance/attested_by(ingress 侧输入,可伪造);
      // trust_decision 缺失或 != trusted 一律 fail-closed 不挂徽标
      norm.sourceTrusted = src.trust_decision === 'trusted';
      norm.sourceLabel = src.display_name || '';
      const delivery = (ev.delivery && typeof ev.delivery === 'object') ? ev.delivery : {};
      // V2 终裁:canonical=delivery.role{primary,copy,control};delivery_mode 已废、无 legacy 兼容(read-only role)
      norm.deliveryMode = delivery.role || '';
      norm.targets = Array.isArray(delivery.targets) ? delivery.targets.filter(Boolean).map(String) : [];
      norm.copyKind = ev.copy_kind || delivery.copy_kind || '';
      const cb = ev.cancellable ?? ev.cancelable;  // 拼写容错(hub 双l/单l 并存,契约 hygiene;行为仍只认 input_posted 原值)
      norm.cancellable = (cb === undefined) ? null : Boolean(cb);
      // provenance 块(display-provenance v1 冻结契约):canonical 可选块,hub 按可信 ingress 坐实(非转发字符串)
      const prov = (ev.provenance && typeof ev.provenance === 'object') ? ev.provenance : null;
      norm.prov = { kind: 'unknown', displayName: '', trusted: false };
      if (prov) {
        norm.prov.kind = (typeof prov.kind === 'string' && prov.kind) ? prov.kind : 'unknown';
        norm.prov.displayName = prov.display_name || '';
        const chain = Array.isArray(prov.attestation_chain) ? prov.attestation_chain : [];
        const attested = prov.attested_by === 'hub' || chain.includes('hub');
        if (prov.trust_decision === 'trusted' && attested) {
          norm.prov.trusted = true;
        } else if (prov.trust_decision === 'trusted') {
          // 块 claim trusted 但 attested_by≠hub 且 chain 不含 hub=伪造坐实 → conflict+fail-closed 不显示
          if (!norm.conflict) norm.conflict = 'provenance_attestation_forged';
        }

        if (!norm.messageId) norm.conflict = 'v2_missing_message_id';
        const legacyKind = typeof data.source === 'string' ? data.source : '';
        if (!norm.conflict && norm.sourceKind && legacyKind &&
            legacyKind !== norm.sourceKind && !(legacyKind === 'user' && norm.sourceKind === 'view')) {
          norm.conflict = 'v2_legacy_source_conflict';
        }

        if (!norm.conflict && src.provenance === 'trusted') {

        norm.stage = ev.delivery_stage || ev.stage || '';
        norm.status = ev.delivery_status || '';

        else if (norm.status === 'failed') norm.stage = 'failed';

        norm.reason = ev.reason || data.reason || '';

      // 🔴 T-074 真正的成因(2026-09-11 逐层查到源头):同一条输入由**两个进程**各发一个事件,

      const dlvKey = deliveryMergeKey(norm.deliveryId);
      norm.key = (dlvKey && c1DeliveryCards.get(dlvKey)) || norm.messageId || dlvKey;
      return { ...ev, _norm: norm };
    }

    function sourceBadgeHtml(norm) {

        // 泛名(人工/human/空)=person SVG;真名=首字符头像(张宗楚→张)——泛名首字符「人」无信息量
        const generic = !label || ['人工', '人', 'human', 'Human', 'HUMAN'].includes(label);
        if (generic) return `<span class="prov-ic" title="人工" aria-label="来源:人工">${PROV_SVG.human}</span>`;
        const ch = label.trim().charAt(0);
        return `<span class="prov-ic prov-ic--human" title="${escapeHtml(label)}" aria-label="来源:人工 ${escapeHtml(label)}">${escapeHtml(ch)}</span>`;
      }
      const svg = PROV_SVG[norm.prov.kind];
      if (!svg) return '';  // 未知/扩展 kind:不显示(开放扩展不 fail)
      const kindText = { feishu: '飞书', agent: 'Agent', system: '系统' }[norm.prov.kind] || norm.prov.kind;
      return `<span class="prov-ic" title="${escapeHtml(label || kindText)}" aria-label="来源:${escapeHtml(label || kindText)}">${svg}</span>`;
    }

    function stageFooterText(norm) {
      if (norm.stage === 'failed') {
        const reason = C1_REASON_TEXT[norm.reason] || '投递失败';
        return `失败:${reason}`;
      }
      const t = C1_STAGE_FOOTER[norm.stage] || '';
      // 投递语义措辞(张宗楚#3):「已注入执行」→「已送达」——投递状态只表「送进 CLI 没有」,
      // 不暗示 CLI 在执行/在等结果(执行与回复=单独输出消息那路信号);flag 关=原措辞
      return provFlagOn() ? t.replace('已注入执行', '已送达').replace('注入未确认', '送达未确认') : t;
    }

    function outboundTargetsHtml(norm) {
      if (norm.deliveryMode !== 'copy' || !norm.targets.length) return '';
      const labels = [...new Set(norm.targets.map(addr => String(addr).split('#')[0]).filter(Boolean))];
      return labels.length ? `<span class="outbound-targets">→ ${escapeHtml(labels.join('、'))}</span>` : '';
    }

    function c1CardFor(norm, create) {
      if (!norm.key) return null;
      let entry = c1InputCards.get(norm.key);
      if (!entry && create) {
        entry = { card: null, footer: null, stageIdx: -1, footnotes: new Set() };
        c1InputCards.set(norm.key, entry);
      }
      return entry;
    }

    function c1ApplyCardUpdate(norm) {
      const entry = c1CardFor(norm, false);
      if (!entry || !entry.footer) {
        // 卡片未建:缓冲(到达乱序时,建卡后再应用最高阶段)
        if (norm.key) {
          const list = c1PendingUpdates.get(norm.key) || [];
          list.push(norm);
          c1PendingUpdates.set(norm.key, list);
        }
        return;
      }
      c1ApplyToEntry(entry, norm);
    }

    function c1ApplyToEntry(entry, norm) {
      // 阶段单调:只前进,不回退(B0 ACK 单调约束);failed/cancelled/expired=终态直通
      if (norm.stage === 'failed' || norm.stage === 'cancelled' || norm.stage === 'expired' || norm.stage === 'dead' || norm.stage === 'dropped' || norm.stageIdx > entry.stageIdx) {
        entry.stageIdx = Math.max(entry.stageIdx, norm.stageIdx);
        const text = stageFooterText(norm);
        if (text && entry.stageEl) entry.stageEl.textContent = text;
        if (provFlagOn() && entry.sentEl) {
          const sl = eventStatusLabel({ kind: 'input_posted', _norm: norm });  // kind 用卡自身的(输入卡),不取 update 事件的
          entry.sentEl.textContent = sl;
          entry.sentEl.style.display = sl ? '' : 'none';  // 精简:常态(已注入)隐标,异常才醒目
        }
      }
      if (norm.copyKind === 'feishu_sync' && !entry.footnotes.has('feishu_sync')) {
        entry.footnotes.add('feishu_sync');
        const note = document.createElement('span');
        note.className = 'card-footnote';
        note.textContent = '已同步飞书';
        entry.footer.appendChild(note);
      }
    }

    // ── B/C/D:时间线承载上限 ────────────────────────────────────
    // B 旧实现只在 handleIncomingEvent 的**最后一个**分支裁剪,delivery_update / 待提交区转入 /
    //   echo 归并等分支全部提前 return,绕过上限;这里改为在唯一入口的出口处统一裁剪,任何分支都绕不过。
    //   初始回放、实时新消息、重连补放同样只经此一个入口(SSE onmessage),故一处即全覆盖。
    // C 计数对象=timeline 的直接子元素,即一张完整消息卡或一个回合卡;长回复不论多少 chunk 都只占 1。
    // D 逐出节点时同步清掉指向它的全部索引缓存(旧实现只清 turnGroups,其余 Map 只增不减)。
    function releaseTimelineNode(node) {
      const ds = (node && node.dataset) || {};
      if (ds.turnKey) {
        const group = turnGroups.get(ds.turnKey);
        if (group) { group.detached = true; pendingRenders.delete(group); }
        turnGroups.delete(ds.turnKey);
      }
      if (ds.messageKey) {
        const entry = assistantEntries.get(ds.messageKey);
        if (entry) { entry.detached = true; pendingRenders.delete(entry); }
        assistantEntries.delete(ds.messageKey);
        messageNodes.delete(ds.messageKey);
        messageBuffers.delete(ds.messageKey);
      }
      if (ds.messageId) {
        c1InputCards.delete(ds.messageId);
        c1PendingUpdates.delete(ds.messageId);
        // 三方合并暴露(T-041):c1DeliveryCards 是 deliveryId -> messageKey 的**反向**索引,
        // 键不是 messageId,故上面两句删不到它 —— 只增不减,与 D 条(逐出即清空全部指向该节点的索引)相悖。
        // ⚠️ 合并前此处原注称「主线有那段回收循环,随 forward-port 补回」;实测四份副本无一存在该循环,
        //    该说法不成立。不要据注释断言另一版本的内容(与今日部署制品三来源拼装同类)。
        // 按值回收:表已收敛到 CAP 量级,每次逐出一次线性扫描的代价可忽略;
        // 不给它单设上限——那正是产生本 bug 的结构(索引自成一套生命周期),复制它只会再漏一次。
        for (const [dlvId, mappedKey] of c1DeliveryCards) {
          if (mappedKey === ds.messageId) c1DeliveryCards.delete(dlvId);
        }
      }
    }

    function enforceTimelineCap() {
      const cap = timelineMaxCards();
      // ⚠️ 此处**曾经**加过一段「淘汰后显式补滚」。负向对照显示去掉它测试照样全过
      // (3/3),即它并未起作用 —— 真正治住窄屏小上限的是下方跟随判据里的**迟滞**。
      // 已删除:基于错误假设加的补丁若留着,就成了又一层「谁也不敢动的时序补丁」,
      // 而正是这类层层补丁让本缺陷长期找不到根因。**没有证据支持的代码不留。**
      while (timeline.children.length > cap) {
        const oldest = timeline.firstElementChild;
        if (!oldest) break;
        releaseTimelineNode(oldest);
        timeline.removeChild(oldest);
      }
    }

    function handleIncomingEvent(ev) {
      try {
        return dispatchIncomingEvent(ev);
      } finally {
        enforceTimelineCap();
      }
    }

    function dispatchIncomingEvent(ev) {
      ev = normalizeEvent(ev);
      c2TrackTurn(ev);  // 中断目标:运行中 turn 跟踪(turn_completed 清除)
      if (ev._norm.conflict) {
        // U5:schema_conflict 可观测(徽标已关),事件本体按不可信继续渲染
        console.warn('[c1] schema_conflict:', ev._norm.conflict);
        renderError({ kind: 'error', text: `消息格式异常(${ev._norm.conflict}),已按不可信处理`,
          data: { code: 'schema_conflict' } });
      }
      const shouldFollow = replayInProgress || timelineAtBottom;
      scheduleTimelineReplayEnd();
      // R-V2-0103-MENTION-REPLY-MIRROR:被提及 Agent 那一轮的回复,只显示回来;不进回合分流、不进本页 Agent 的上下文。
      if (ev.kind === 'mention_reply') {
        if (renderMentionReply(ev)) rendered += 1;
        if (shouldFollow) scheduleTimelineToBottom();
        return;
      }
      // delivery_update / copy 事件:原位更新输入卡,不产生新条目
      // display v1 归并去重:route_observation 带 observed_delivery_id(链 primary)时走归并分支;无链=独立占位卡(现状回落)
      const copyMergable = provFlagOn() && ev._norm.copyKind === 'route_observation' && !!(ev.observed_delivery_id || (ev.data && ev.data.observed_delivery_id));
      if (ev.kind === 'delivery_update' || ev._norm.copyKind === 'feishu_sync' || copyMergable) {
        const norm = ev._norm;
        const wEntry = norm.deliveryId ? waitingDeliveries.get(norm.deliveryId) : null;
        if (wEntry && ['cli_injected', 'pty_write', 'failed', 'cancelled', 'expired', 'dead', 'dropped'].includes(norm.stage)) {
          // 注入/终态(含 expired 投递过期/dead 终止/dropped 丢弃):待提交区移出,以原输入事件建时间线卡(阶段由后续 update 推进)
          wEntry.node.remove();
          waitingDeliveries.delete(norm.deliveryId);
          waitingArea.hidden = waitingDeliveries.size === 0;
          renderEvent(wEntry.event);
          rendered += 1;
        } else if (wEntry) {
          // Merge only delivery progress, never the original input identity/body.
          const current = wEntry.event._norm;
          const currentStageIdx = C1_STAGE_ORDER.indexOf(current.stage === 'turn_admitted' ? 'cli_injected' : current.stage);
          let changed = false;
          if (norm.stageIdx > currentStageIdx) {
            current.stage = norm.stage;
            current.stageIdx = norm.stageIdx;
            changed = true;
          }
          const rawVer = ev.schema_version ?? ev.meta?.schema_version;
          const canonicalUpdate = ev.kind === 'delivery_update' && (rawVer === 'delivery.v2' || rawVer === 2 || rawVer === '2');
          if (canonicalUpdate) {
            // Explicit denial is fail-closed. Once denied, an older/same-stage
            // update cannot recreate a cancel action for this delivery.
            const canCancel = ev.cancellable;
            if (canCancel === false && current.cancellable !== false) {
              current.cancellable = false;
              changed = true;
            } else if (canCancel === true && current.cancellable !== false &&
                       (!norm.stage || norm.stageIdx >= currentStageIdx) && current.cancellable !== true) {
              current.cancellable = true;
              changed = true;
            }
            if (!norm.stage || norm.stageIdx >= currentStageIdx) {
              const status = ev.delivery_status;
              if (typeof status === 'string' && ['', 'cancelled', 'failed', 'dead', 'dropped'].includes(status) && (current.status || '') !== status) {
                current.status = status;
                changed = true;
              }
              const reason = ev.reason;
              if (typeof reason === 'string' && (reason === '' || reason === 'desktop_inbox_saved' || Object.hasOwn(C1_REASON_TEXT, reason)) && current.reason !== reason) {
                current.reason = reason;
                changed = true;
              }
            }
          }
          if (changed) renderWaitingDelivery(wEntry.event);
        }
        if (copyMergable) {
          // 归并去重(display v1):observed_delivery_id→primary 卡 footnote「已回显」;
          // 卡未建/在等待区→带 hold 窗缓冲(超时独立占位,错链不隐藏)
          const pKey = norm.deliveryId ? c1DeliveryCards.get(deliveryMergeKey(norm.deliveryId)) : null;
          const pEntry = pKey ? c1InputCards.get(pKey) : null;
          if (pEntry && pEntry.footer) c1Footnote(pEntry, 'echo_merge', '已回显');
          else if (norm.deliveryId) bufferMergeCopy(norm.deliveryId, ev);
        }
        c1ApplyCardUpdate(norm);
        rendered += 1;
        updateMetrics();
        if (shouldFollow) scheduleTimelineToBottom();
        return;
      }
      // G-LIFECYCLE(张宗楚实测「测试-你好×2」):同一 delivery 的 user_input queued/accepted 阶段事件=在途占位,
      // 与 input_posted primary 的待提交区重复(双份正文+再生一个删除按钮)——flag 开一律不渲;
      // admitted(带 turn)才是单一回显渲染点(生命周期幂等,renderer 自治,不依赖 helper 改)
      if (provFlagOn() && ev.kind === 'user_input') {
        const lc = String((ev.data && ev.data.lifecycle) || '').toLowerCase();
        if (lc === 'queued' || lc === 'accepted') {
          rendered += 1;
          updateMetrics();
          return;
        }
      }
      if (isWaitingDelivery(ev)) {
        renderWaitingDelivery(ev);
        rendered += 1;
        updateMetrics();
        return;
      }
      // G-MERGE-SAME(同会话去重,dev55 设计,纯 renderer 不猜链):结构化 user_input 回显 delivery_id
      // 精确命中本视图 primary input_posted.delivery_id → 不建第二张用户卡,primary 加「已回显」footnote;
      // 乱序短窗缓冲(C2_ECHO_HOLD_MS);未命中/空 id/copy/legacy 无 id=照常独立。provenance 只取 primary canonical。
      if (provFlagOn() && ev.kind === 'user_input' && (ev._norm || {}).deliveryId) {
        const echoN = ev._norm;
        const echoKey = echoN.originDlv || echoN.deliveryId;  // 归并锚=origin_delivery_id(两签可信字段);回退=自身 id 精确命中;绝不 trim dw- 猜链
        const pKey = c1DeliveryCards.get(deliveryMergeKey(echoKey));
        const pEntry = pKey ? c1InputCards.get(pKey) : null;
        if (pEntry && pEntry.footer) {
          c1Footnote(pEntry, 'echo_merge', '已回显');
          rendered += 1;
          updateMetrics();
          if (shouldFollow) scheduleTimelineToBottom();
          return;
        }
        bufferMergeCopy(echoKey, ev, { admit: true, holdMs: C2_ECHO_HOLD_MS, footKey: 'echo_merge' });
        rendered += 1;
        updateMetrics();
        return;
      }
      admitWaitingDelivery(ev);
      renderEvent(ev);
      rendered += 1;
      updateMetrics();
      if (shouldFollow) scheduleTimelineToBottom();
    }

    function deliveryLifecycle(ev) {
      return String(ev.data?.lifecycle || ev.data?.state || ev.data?.change || '').toLowerCase();
    }

    function isWaitingDelivery(ev) {
      const norm = ev._norm || {};
      if (!norm.deliveryId || norm.turnId) return false;
      // copy 不追 ACK,不进待提交区;control 不进输入卡/待提交区;已有卡的原位更新
      if (String(norm.deliveryMode).includes('copy')) return false;
      if (norm.deliveryMode === 'control') return false;
      if (norm.key && c1InputCards.has(norm.key)) return false;
      // canonical 注入前阶段入待提交区
      if (['generated', 'queued', 'hub_received', 'helper_received'].includes(norm.stage)) return true;
      const lifecycle = deliveryLifecycle(ev);
      return lifecycle === 'queued' || lifecycle === 'waiting' || lifecycle === 'delivery_queued' ||
        (ev.kind === 'user_input' && (!lifecycle || lifecycle === 'accepted'));
    }

    function renderWaitingDelivery(ev) {
      const waitKey = ev._norm?.deliveryId || ev.delivery_id;  // 归一键:observed_delivery_id 优先(B0)
      let entry = waitingDeliveries.get(waitKey);
      if (!entry) {
        const node = document.createElement('article');
        node.className = 'waiting-item';
        node.dataset.deliveryId = waitKey;
        waitingList.appendChild(node);
        entry = { node, event: ev };
        waitingDeliveries.set(waitKey, entry);
      } else if (ev.text) {
        entry.event = ev;
      }
      entry.touched = Date.now();  // 看门狗心跳:创建/阶段推进都刷新
      entry.staleNoted = false;    // 推进重渲染清超时标记(innerHTML 已重排)
      entry.failNotedAt = null;    // 推进重渲染清失败便签标记
      const norm = ev._norm || {};
      // 寻址保真 tripwire(dev56 取证:hub 必发 message_id,缺=renderer 管道丢)——可取消条目缺 message_id 必须可观测
      if (norm.cancellable && !norm.messageId) console.warn('[c2] 可取消条目缺 message_id(寻址保真破):', { deliveryId: waitKey, kind: ev.kind, stage: norm.stage, hasMsgId: 'message_id' in ev });
      const provIc = provenanceIconHtml(norm);  // display v1:provenance 图标在场时压 legacy 文字徽标(不双标)
      const badge = provIc ? '' : sourceBadgeHtml(norm);
      const cancelTag = norm.cancellable ? '<span class="cancellable-tag">可取消</span>' : '';
      const stageText = stageFooterText(norm);
      if (provFlagOn()) {
        // 精简在途条(张宗楚灰度反馈#2):明确「⏳ 投递中」+单行截断,全文进 title——不与「已收到消息」混淆;
        // 删除寻址保留(截断足够辨认),终态仍事件驱动转出
        entry.node.classList.add('waiting-item--pending');
        entry.node.innerHTML = `${provIc}${badge}<span class="prov-spin" title="未达终态(注入/失败/取消/过期/终止)">⏳ 投递中</span>${stageText ? `<span class="waiting-stage">${escapeHtml(stageText)}</span>` : ''}<span class="waiting-text"></span>${cancelTag}`;
      } else {
        entry.node.innerHTML = `${provIc}${badge}<span class="waiting-text"></span>${cancelTag}${stageText ? `<span class="waiting-stage">${escapeHtml(stageText)}</span>` : ''}`;
      }
      const rawWaitText = entry.event.text || ev.data?.text || `delivery ${waitKey}`;  // flag 关=原样(与生产逐字)
      const waitText = provFlagOn() ? (ev._norm?.text || rawWaitText) : rawWaitText;   // flag 开:在途条用 payload 解析文本(norm.text 优先)
      entry.node.querySelector('.waiting-text').textContent = waitText;
      entry.node.querySelector('.waiting-text').title = (provFlagOn() && !waitText.startsWith('delivery ')) ? waitText : '';  // 截断时全文 hover(仅 flag 开)
      // C2:可取消条目带删除按钮;点击=发起 cancel 请求(条目的消失只由事件流 cancelled 驱动,不本地静默删)
      if (norm.cancellable && !entry.node.querySelector('.waiting-cancel-btn')) {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'waiting-cancel-btn';
        btn.textContent = '删除';
        btn.title = '请求取消该待提交输入';
        btn.addEventListener('click', () => c2RequestCancel(waitKey, entry));
        entry.node.appendChild(btn);
      }
      waitingArea.hidden = false;
      requestAnimationFrame(() => {
        waitingArea.scrollTop = waitingArea.scrollHeight;
      });
    }

    function admitWaitingDelivery(ev) {
      const waitKey = ev._norm?.deliveryId || ev.delivery_id;
      if (!waitKey || !ev.turn_id) return;
      const entry = waitingDeliveries.get(waitKey);
      if (!entry) return;
      entry.node.remove();
      waitingDeliveries.delete(waitKey);
      waitingArea.hidden = waitingDeliveries.size === 0;
      if (ev.kind !== 'user_input') {
        renderTurnEvent(ev.turn_id, { ...entry.event, turn_id: ev.turn_id });
      }
    }

    function keyFor(ev) {
      return ev.delivery_id || ev.turn_id || `cursor-${ev.cursor || rendered}`;
    }

    function turnKeyFor(ev) {
      return ev.turn_id || ev.delivery_id || '';
    }

    function compareCursor(a, b) {
      return String(a.cursor ?? '').localeCompare(String(b.cursor ?? ''), undefined, { numeric: true, sensitivity: 'base' });
    }

    function eventTypeLabel(ev) {
      // 精简:flag 开,input_posted 与 user_input 一律隐类型标(有源图标表意,无则素净;治「人/👤 双标」)
      if (provFlagOn() && (ev.kind === 'input_posted' || ev.kind === 'user_input')) return '';
      if (ev.kind === 'assistant_text') return '🤖';
      if (ev.kind === 'user_input') return '👤';
      if (ev.kind === 'tool_call') return '🔧';
      if (ev.kind === 'error') return '⚠️';
      if (ev.kind === 'state_change') return '⚙️';
      return 'event';
    }

    function eventStatusLabel(ev) {
      if (!provFlagOn()) return '✓';
      // 状态标只挂投递生命周期(input_posted);assistant/tool/error/state 等输出无投递语义→不挂(治 assistant 卡常驻 ⏳)
      if (ev.kind !== 'input_posted') return '';
      // 精简:已注入=常态不打 ✓;仅异常/非终态醒目(⏳ 未达终态 / ✗ 失败 / 🚫 已取消 / ⏰ 已过期 / ■ 已终止·已丢弃)
      const st = ev._norm?.stage || '';
      if (st === 'cancelled') return '🚫';
      if (st === 'failed') return '✗';
      if (st === 'expired') return '⏰';
      if (st === 'dead' || st === 'dropped') return '■';
      if (['cli_injected', 'pty_write', 'turn_admitted', 'admitted'].includes(st)) return '';
      return '⏳';
    }

    function eventDiagnostics(ev) {
      return [
        ev.delivery_id ? ['delivery', ev.delivery_id] : null,
        ev.turn_id ? ['turn', ev.turn_id] : null,
        ev.cursor ? ['cursor', ev.cursor] : null,
      ].filter(Boolean);
    }

    // Generic dock shell: future sections (for example files) register one
    // list and reuse the same collapse/unread mechanics.
    const dockSections = new Map();
    let dockUnreadCount = 0;

    function registerDockSection(id) {
      const root = document.querySelector(`[data-dock-section="${id}"]`);
      const list = root?.querySelector('.dock-section-list');
      if (!root || !list) throw new Error(`missing dock section: ${id}`);
      dockSections.set(id, { root, list });
    }

    function updateDockUnread() {
      workspaceDockUnread.textContent = String(dockUnreadCount);
      workspaceDockUnread.hidden = dockUnreadCount === 0;
    }

    function setDockExpanded(expanded) {
      workspaceDockToggle.setAttribute('aria-expanded', String(expanded));
      workspaceDockBody.hidden = !expanded;
      if (expanded) {
        dockUnreadCount = 0;
        updateDockUnread();
      }
    }

    workspaceDockToggle.addEventListener('click', () => {
      setDockExpanded(workspaceDockToggle.getAttribute('aria-expanded') !== 'true');
    });

    function appendDockCard(sectionID, card) {
      const section = dockSections.get(sectionID);
      if (!section) throw new Error(`unregistered dock section: ${sectionID}`);
      section.list.appendChild(card);
      while (section.list.children.length > 500) section.list.removeChild(section.list.firstChild);
      workspaceDock.hidden = false;  // T-054:出现错误后入口才出现
      if (workspaceDockBody.hidden && !replayInProgress) {
        dockUnreadCount++;
        updateDockUnread();
      }
    }

    function showErrorToast(text) {
      const toast = document.createElement('div');
      toast.className = 'toast';
      toast.setAttribute('role', 'alert');
      toast.textContent = text || 'Unknown error';
      toastRegion.appendChild(toast);
      while (toastRegion.children.length > 3) toastRegion.removeChild(toastRegion.firstChild);
      setTimeout(() => toast.remove(), 6000);
    }

    registerDockSection('activity');
    setDockExpanded(false);

    // ══ 0.2.0.6 A 线：正文区按类型自动渲染（业主第 2 条）══════════════════
    // 契约 §3.2 · 附录 A5 · 🔴 附录 B2（组长 2026-09-18 裁定，取 (b)）。口径三条：
    //   1. 分派依据三级，按权威性排序（附录 B2 改裁为 (b′)）：
    //      ① **本页本次上传** ⇒ 用上传响应里的 media_type（§2 的四字段之一，最准）
    //      ② **收到的消息** ⇒ 发 HEAD 读**服务端声明的 Content-Type**。
    //         那是权威值；URL 扩展名只是对权威值的再解释。A5 保证这个头是对的。
    //         HEAD 返回 404 ⇒ 文件已过 7 天保留期被清掉，如实说「已不可取」，不画一个坏掉的 <img>。
    //      ③ 🔴 **降级**：HEAD 不被放行 / 网络出错 ⇒ 退回 URL 扩展名分派。
    //         组长明示 nginx `limit_except GET` 放行 HEAD **只从文档知道、未实测**
    //         （已派 prodops 在 H 收尾实测），实测通过前这条降级分支必须在。
    //      取 (b′) 而不是「只渲本页本次上传」，是因为业主要的是 **Agent 之间互传** ——
    //      接收方根本没见过那个上传响应。
    //   2. 🔴 渲染不了的一律给下载链接。不是报错，不是留一串裸 URL 文本。
    //   3. 只认本站 /f/ 直链（附录 A1 的 URL 前缀），不对任意外站 URL 做任何请求。
    const FILE_MAX_UPLOAD_BYTES = 52428800;      // 附录 A4：50 MiB = 50<<20，不是 50×1000²
    // §3.2 要求文本内联「要有长度上限，超出截断并给下载链接」但没给数值。
    // 组长裁定到达前按 256 KiB，交付件里标明这是我自选的数。
    const FILE_TEXT_INLINE_MAX = 262144;
    const FILE_URL_RE = /https?:\/\/[^\s<>"'`）】]+/gu;
    const uploadedFileHints = new Map();   // url -> {name,size,mediaType}（本页本次上传，免一次 HEAD）

    function formatFileBytes(n) {
      const bytes = Number(n) || 0;
      if (bytes < 1024) return `${bytes} B`;
      if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(1)} KiB`;
      return `${(bytes / 1024 / 1024).toFixed(1)} MiB`;
    }

    // 🔴 DW-MD-CORE:own-url BEGIN —— 【生成副本】源在 view-service/md-render-core.js 的同名段;改源后跑 md-render-core-sync.py(漂移由 test_md_render_core.py 挡)
    function isOwnFileUrl(raw) {
      try {
        const u = new URL(raw, location.href);
        return u.origin === location.origin && u.pathname.startsWith('/f/');
      } catch { return false; }
    }
    // DW-MD-CORE:own-url END

    // 正文里的 URL 常带尾随标点（句号、右括号、中文标点），不剥掉会把它吃进路径。
    function trimUrlTail(raw) {
      return String(raw).replace(/[.,;:!?，。；：！？、)\]}」』>]+$/u, '');
    }

    const fileMetaCache = new Map();   // url -> Promise<meta|'gone'|null>；同一 URL 全页只探一次

    // HEAD 探测：ok ⇒ 服务端声明；404 ⇒ 文件已被清理；其余(405/403/网络错) ⇒ null ⇒ 走扩展名降级。
    function probeFileMeta(url) {
      if (fileMetaCache.has(url)) return fileMetaCache.get(url);
      const task = fetch(url, { method: 'HEAD' })
        .then((res) => {
          if (res.ok) {
            const rawDisposition = String(res.headers.get('Content-Disposition') || '');
            return {
              mediaType: String(res.headers.get('Content-Type') || '').split(';')[0].trim().toLowerCase(),
              disposition: rawDisposition.toLowerCase(),
              // R4：接收侧的原名只能从这里来。服务端暂不带 filename（B 线 B5 在补），
              // 解不出即 '' —— **不编名字**，由调用方回退到浏览器默认行为。
              fileName: parseDispositionFilename(rawDisposition),
              size: Number(res.headers.get('Content-Length')) || 0,
            };
          }
          return res.status === 404 ? 'gone' : null;
        })
        .catch(() => null);
      fileMetaCache.set(url, task);
      return task;
    }

    // 🔴 DW-MD-CORE:ext-kind BEGIN —— 【生成副本】源在 view-service/md-render-core.js 的同名段;改源后跑 md-render-core-sync.py(漂移由 test_md_render_core.py 挡)
    // 附录 A5 那张白名单的**反向映射**，只在 HEAD 不可用时作降级依据。
    // 🔴 表外的扩展名（含 .bin）一律下载链接，不尝试内联。
    // 🔴 本表只在【降级路径】上用（HEAD 拿不到 Content-Type 时按 URL 扩展名分派）。
    //    B-11（组长 2026-09-19 授权）补两类，成因都是「B 侧本批加宽了能力，本表没跟上」：
    //    ① 音频：B 侧本批新增 audio 落盘与真实 audio MIME（mp3/m4a/flac/aac/opus/oga/wav），
    //       本表若不补，降级路径上音频一律落 download ——「否则不播」那个目的就没达成。
    //    ② 文本：B 侧 filenameTextExts 有 15 个扩展名统一出 text/plain，
    //       而本表此前只有 txt ⇒ md/csv/py/yml/json 在 HEAD 路径内联、在降级路径落 download，
    //       **同一个文件两条路径两种结果**。这里与 B 侧那张表对齐。
    //    🔴 对齐对象写死在这里，便于下次核：internal/fileservice/manager.go 的 filenameTextExts。
    //    ⚠️ 补进本表的扩展名必须与 FILE_EXT_NEVER_INLINE 不相交（④h(a) 盯着这条）。
    const FILE_EXT_KIND = {
      // 🔴 图片行必须 == `deploy/nginx-dingwei.conf` 里 `types{image/*}` 那一组(**单一事实源在 nginx**),
      //    另加一个已登记别名 `jpeg`(image/jpeg 的另一种写法;nginx 的 /f/ 只放行 jpg)。
      //    🔴 **本仓只有这一份图片扩展名清单**:markdown 就地出图(ts-No.79)也走它(经 kindFromExt),
      //    不许在别处再列一份 —— 漂移由 renderer-markdown-image-regression.js 的 G0 逐项对账
      //    (少一个、多一个、连"独有 token 在源码里出现两次"都红)。
      //    ⚠️ 补进本表的扩展名必须与 FILE_EXT_NEVER_INLINE 不相交(④h(a) 与 G0(c) 都盯着这条)。
      png: 'image', jpg: 'image', jpeg: 'image', gif: 'image', webp: 'image',
      avif: 'image', heic: 'image', bmp: 'image', tiff: 'image',
      mp4: 'video', webm: 'video',
      mp3: 'audio', m4a: 'audio', flac: 'audio', aac: 'audio', opus: 'audio', oga: 'audio', wav: 'audio',
      pdf: 'pdf',
      txt: 'text', md: 'text', csv: 'text', json: 'text', log: 'text', py: 'text', js: 'text',
      go: 'text', java: 'text', yaml: 'text', yml: 'text', toml: 'text', ini: 'text', sh: 'text', sql: 'text',
    };
    // DW-MD-CORE:ext-kind END
    // 展示用的类型文案：扩展名分派下没有响应头可读，不编造 media_type。
    const FILE_EXT_LABEL = {
      png: 'image/png', jpg: 'image/jpeg', jpeg: 'image/jpeg', gif: 'image/gif', webp: 'image/webp',
      mp4: 'video/mp4', webm: 'video/webm', pdf: 'application/pdf', txt: 'text/plain',
    };

    // 🔴 DW-MD-CORE:ext-of BEGIN —— 【生成副本】源在 view-service/md-render-core.js 的同名段;改源后跑 md-render-core-sync.py(漂移由 test_md_render_core.py 挡)
    function fileExtOf(url) {
      try {
        const last = new URL(url, location.href).pathname.split('/').pop() || '';
        const dot = last.lastIndexOf('.');
        return dot > 0 ? last.slice(dot + 1).toLowerCase() : '';
      } catch { return ''; }
    }
    // DW-MD-CORE:ext-of END

    function kindFromMediaType(mt) {
      if (!mt) return '';
      // 🔴 附录 E：SVG 可内嵌脚本 ⇒ 不内联，走下载链接。
      //    经 <img> 加载的 SVG 浏览器本就禁脚本，B 线也已把它排除在白名单外 ——
      //    但那是【别人线上的两个前提】，任一被改动这里就破了，所以本侧自己也挡一道。
      if (mt === 'image/svg+xml') return 'download';
      if (mt.startsWith('image/')) return 'image';
      if (mt.startsWith('video/')) return 'video';
      // B-11：音频与视频同一条路 —— 能播就播，播不了由 error 分支降级到下载链接。
      // 🔴 音频是被动数据（不像 svg 能带脚本），所以这里按服务端声明的真实 audio MIME 内联，
      //    而不是像文本那样统一压成一种类型；压成 text/plain 会让它根本不播。
      if (mt.startsWith('audio/')) return 'audio';
      if (mt === 'application/pdf') return 'pdf';
      // §3.2 的表写的是 text/*，附录 A5 的服务端白名单只放 text/plain。
      // 服务端真声明了 text/* 就按 text/* 内联 —— 附录 B2 定的权威值是响应头。
      // 🔴 内联一律走 <pre> 的 textContent（见 fillTextAttachment），
      //    所以 text/html 显示的是**源码文本**、不会被当 HTML 执行；比 iframe 安全。
      if (mt.startsWith('text/')) return 'text';
      return 'download';
    }
    // 🔴 DW-MD-CORE:never-inline BEGIN —— 【生成副本】源在 view-service/md-render-core.js 的同名段;改源后跑 md-render-core-sync.py(漂移由 test_md_render_core.py 挡)
    // 🔴 附录 E：这几个扩展名**永不内联**，且**不看 FILE_EXT_KIND 是否列了它们**。
    //    为什么要独立一层：今天 svg/html 不在表里，安全是靠「没写」得来的；
    //    将来有人「补全白名单」把它们加进去，降级路径就会内联 —— 而那条路径当时没有任何断言盯着。
    //    （同一形状：守卫加完就假定它会一直有效。组长 2026-09-18 在 ⑭ 闸上遇到的也是这个。）
    const FILE_EXT_NEVER_INLINE = new Set(['svg', 'svgz', 'html', 'htm', 'xhtml', 'xml']);
    function kindFromExt(url) {
      const ext = fileExtOf(url);
      if (FILE_EXT_NEVER_INLINE.has(ext)) return 'download';
      return FILE_EXT_KIND[ext] || 'download';
    }
    // DW-MD-CORE:never-inline END

    // 从 Content-Disposition 取原始文件名：支持 RFC 5987 的 filename*（可带 UTF-8 百分号编码）
    // 与普通 filename="…"。🔴 取不到就返回 ''，**绝不猜、绝不用 URL 末段冒充原名**。
    function parseDispositionFilename(raw) {
      if (!raw) return '';
      const ext = /filename\*\s*=\s*([^;]+)/i.exec(raw);
      if (ext) {
        const v = ext[1].trim().replace(/^UTF-8''/i, '');
        try { return decodeURIComponent(v); } catch { return v; }
      }
      const plain = /filename\s*=\s*("([^"]*)"|[^;]+)/i.exec(raw);
      if (plain) return (plain[2] !== undefined ? plain[2] : plain[1]).trim();
      return '';
    }

    function fileNameFromUrl(url) {
      try { return decodeURIComponent(new URL(url, location.href).pathname.split('/').pop() || '') || '文件'; }
      catch { return '文件'; }
    }

    function fileDownloadLink(url, label, fileName) {
      const a = document.createElement('a');
      a.className = 'attachment-dl';
      a.href = url;
      a.rel = 'noopener noreferrer';
      a.target = '_blank';
      // R4（业主 2026-09-18：下载下来是 f5790871….bin，Word 打不开）：
      // 🔴 `download=""` 让浏览器回退用 URL 末段命名 —— 而同一张卡片上明明显示着正确的原名。
      //    **显示对了、存下来错了**：两边取的不是同一个值。
      // ⇒ 有已知原名就填；取不到留空回退现行为，不自己编。
      const name = String(fileName || '').trim();
      // 只挡目录分隔符：空格与括号是合法文件名字符（业主那个就是 `… v2 (1).docx`）。
      a.setAttribute('download', name && !/[\\/]/.test(name) ? name : '');
      a.textContent = `⬇ ${label || '下载'}`;
      return a;
    }

    function fileAttachmentShell(url, meta, hint) {
      const box = document.createElement('div');
      box.className = 'attachment';
      box.dataset.fileUrl = url;
      const head = document.createElement('div');
      head.className = 'attachment-head';
      // R5-1（业主 09-18：「一个文件链接下一个文件展示」）：文件名本身就是那条链接。
      const name = document.createElement('a');
      name.className = 'attachment-name';
      name.href = url;
      name.rel = 'noopener noreferrer';
      name.target = '_blank';
      name.textContent = hint?.name || fileNameFromUrl(url);
      const facts = document.createElement('span');
      const size = hint?.size || meta?.size || 0;
      facts.textContent = [meta?.mediaType || '类型未知', size ? formatFileBytes(size) : ''].filter(Boolean).join(' · ');
      head.append(name, facts);
      box.appendChild(head);
      return box;
    }

    async function fillTextAttachment(box, url, meta, knownName) {
      const pre = document.createElement('pre');
      box.appendChild(pre);
      try {
        // Range 取头部：不为了显示一段预览把整个文件拉下来。
        const res = await fetch(url, { headers: { Range: `bytes=0-${FILE_TEXT_INLINE_MAX - 1}` } });
        if (!res.ok && res.status !== 206) throw new Error(`HTTP ${res.status}`);
        const text = await res.text();
        pre.textContent = text;
        const total = Number(meta?.size) || 0;
        // 🔴 不能拿「回了 206」当截断依据：Range 覆盖了整个小文件时服务端同样回 206，
        //    那样 1.7 KiB 的文本也会被标成「已截断」。以 Content-Range 的 end/total 为准。
        const cr = /bytes\s+(\d+)-(\d+)\/(\d+)/u.exec(res.headers.get('Content-Range') || '');
        const truncated = cr
          ? Number(cr[2]) + 1 < Number(cr[3])
          : (total ? total > FILE_TEXT_INLINE_MAX : text.length >= FILE_TEXT_INLINE_MAX);
        if (truncated) {
          const note = document.createElement('div');
          note.className = 'attachment-note';
          note.textContent = `已截断：只内联前 ${FILE_TEXT_INLINE_MAX} 字节${total ? `，全文 ${formatFileBytes(total)}` : ''}`;
          box.append(note, fileDownloadLink(url, '下载完整文件', knownName));
        }
      } catch (err) {
        pre.remove();
        const note = document.createElement('div');
        note.className = 'attachment-note';
        note.textContent = `文本取回失败（${err.message}）⇒ 改给下载链接`;
        box.append(note, fileDownloadLink(url, '下载', knownName));
      }
    }

    async function buildFileAttachment(url) {
      const hint = uploadedFileHints.get(url) || null;
      const ext = fileExtOf(url);
      let kind = '';
      let meta = { mediaType: '', size: 0 };
      let source = '';
      if (hint?.mediaType) {
        // ① 本页本次上传：手上就有 §2 的 media_type，不必再问服务端。
        meta = { mediaType: hint.mediaType, size: hint.size };
        kind = kindFromMediaType(hint.mediaType);
        source = 'upload';
      } else {
        const probed = await probeFileMeta(url);
        if (probed === 'gone') {
          // ② HEAD 404：7 天保留期到了、文件已被清掉。如实说，不画坏图也不假装能下。
          source = 'gone';
        } else if (probed) {
          meta = { mediaType: probed.mediaType, size: probed.size };
          // 服务端明说要当附件下（A5：白名单外 ⇒ octet-stream ＋ attachment），照办。
          kind = probed.disposition.includes('attachment') ? 'download' : kindFromMediaType(probed.mediaType);
          source = 'head';
        } else {
          // ③ 降级：HEAD 不被放行或网络出错 ⇒ 退回扩展名。
          //    nginx 放行 HEAD 尚未实测（prodops 在 H 收尾验），这条分支在实测通过前必须在。
          meta = { mediaType: FILE_EXT_LABEL[ext] || (ext ? `.${ext}` : ''), size: 0 };
          kind = kindFromExt(url);
          source = 'ext';
        }
      }
      // R4：本页上传用 uploadedFileHints 的 name；接收侧用 HEAD 解出的 Content-Disposition filename。
      //     两者都没有 ⇒ '' ⇒ fileDownloadLink 回退浏览器默认命名，不编。
      const knownName = String(hint?.name || meta?.fileName || '').trim();
      const box = fileAttachmentShell(url, meta, hint);
      box.dataset.dispatch = source;   // 供验收断言「这一张是靠哪一级定的类型」
      // 🔴 B-11 新增：把**判成了哪一类**也记下来。
      //    起因是 ④b 那条已经吃过一次亏：本机解不了 H.264 时 <video> 会自我移除，
      //    于是「判成 video 但播不了」与「根本没判成 video」在 DOM 上长得一样，
      //    用例只好写成「两种都算过」。音频同理（替身里的样本是假字节，必然解码失败）。
      //    ⇒ 把分派结果显式记成 data-kind，判定与解码能力就分开了：
      //      data-kind 验的是**分派对不对**，元素在不在验的是**这台机器能不能播**。
      box.dataset.kind = kind;
      if (source === 'gone') {
        const note = document.createElement('div');
        note.className = 'attachment-note';
        note.textContent = '文件已不可取（服务端 404）——可能已过 7 天保留期被清理';
        box.append(note, fileDownloadLink(url, '仍要试着打开', knownName));
        return box;
      }
      if (source === 'ext') {
        const note = document.createElement('div');
        note.className = 'attachment-note';
        note.textContent = '已降级：HEAD 不可用，改按 URL 扩展名分派';
        box.appendChild(note);
      }
      switch (kind) {
        case 'image': {
          const img = document.createElement('img');
          img.src = url;
          img.loading = 'lazy';
          img.alt = hint?.name || fileNameFromUrl(url);
          // 图片本身加载不出来时也不留空白：退到下载链接。
          img.addEventListener('error', () => { img.replaceWith(fileDownloadLink(url, '下载图片', knownName)); }, { once: true });
          box.appendChild(img);
          break;
        }
        case 'video': {
          const video = document.createElement('video');
          video.src = url;
          video.controls = true;
          video.preload = 'metadata';
          // 🔴 下面那条下载链接是**无条件**附的（能播时也该能下载）。
          //    所以 error 分支只需把放不了的 <video> **移除**，不能再 replaceWith 出第二条 ——
          //    否则解不了码时会并排出现两个「⬇ 下载视频」（组长 2026-09-18 从我的证据截图里看出来的）。
          video.addEventListener('error', () => { video.remove(); }, { once: true });
          box.appendChild(video);
          box.appendChild(fileDownloadLink(url, '下载视频', knownName));   // 恒附一条：能播时可下载，解不了码时它就是唯一出路
          break;
        }
        case 'audio': {
          const audio = document.createElement('audio');
          audio.src = url;
          audio.controls = true;
          audio.preload = 'metadata';
          // 与 video 同一形态（见上）：下载链接**无条件**附一条 ——
          // 能播时也该能存一份；解不了码时 error 分支只移除播放器，不再补第二条链接。
          audio.addEventListener('error', () => { audio.remove(); }, { once: true });
          box.appendChild(audio);
          box.appendChild(fileDownloadLink(url, '下载音频', knownName));
          break;
        }
        case 'pdf': {
          const frame = document.createElement('iframe');
          frame.src = url;
          frame.title = hint?.name || fileNameFromUrl(url);
          box.appendChild(frame);
          box.appendChild(fileDownloadLink(url, '下载 PDF', knownName));   // 浏览器无内置 PDF 阅读器时仍有出路
          break;
        }
        case 'text':
          await fillTextAttachment(box, url, meta, knownName);
          break;
        default:
          // 🔴 兜底分支：其它一切 ⇒ 下载链接。业主逐字：「不能显示的，直接给出下载链接」。
          box.appendChild(fileDownloadLink(url, hint?.name || fileNameFromUrl(url), knownName));
      }
      return box;
    }

    // 挂载点放在卡片上、而不是正文里：assistant 流式重渲会整块重写正文的 innerHTML，
    // 挂在正文里的 <video> 会被每个 chunk 打断重建（播放中断）。挂卡片上则跨重渲存活。
    function fileAttachmentsHost(cardEl) {
      let host = cardEl._fileHost;
      if (!host) {
        host = document.createElement('div');
        host.className = 'attachments';
        cardEl._fileHost = host;
      }
      if (host.parentNode !== cardEl) cardEl.appendChild(host);
      return host;
    }

    // R5-2/R5-3：把正文里「已经成功渲染成附件块」的那条 URL 文本视觉隐藏。
    //
    // 🔴 三条约束，缺一不可：
    //   ① **只隐藏，不删除** —— 接收侧靠扫正文里的 /f/ 直链分派（附录 B2）；
    //      删掉等于把那条机制拆了，也会让不变式失去锚。
    //   ② **只隐藏成功渲染的** —— 过期（HEAD 404）、渲染失败的，正文原样留着，
    //      否则用户连那条 URL 都看不到、连复制都做不到。
    //   ③ 每次重渲后都要重新施加：assistant 的正文每个流式 chunk 都会重写 innerHTML，
    //      上一次包的 <span> 会被整段冲掉。
    function hideRenderedLinks(cardEl) {
      if (!cardEl || !cardEl._fileHost) return;
      const okUrls = [...cardEl._fileHost.querySelectorAll('.attachment[data-rendered="ok"]')]
        .map((b) => b.dataset.fileUrl).filter(Boolean);
      if (!okUrls.length) return;
      for (const body of cardEl.querySelectorAll('.event-content')) {
        // 🔴 跳过已经被包过的:本函数在每个附件就绪时都会重跑一遍,
        //    不跳过就会把同一条 URL 反复嵌套包裹(实测:三条链接被包成 9 层)。
        const walker = document.createTreeWalker(body, NodeFilter.SHOW_TEXT, {
          acceptNode: (n) => (n.parentElement && n.parentElement.closest('.dw-link-rendered')
            ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT),
        });
        const hits = [];
        let node = walker.nextNode();
        while (node) {
          if (okUrls.some((u) => node.nodeValue.includes(u))) hits.push(node);
          node = walker.nextNode();
        }
        for (const textNode of hits) {
          let rest = textNode;
          for (const u of okUrls) {
            const idx = rest.nodeValue.indexOf(u);
            if (idx < 0) continue;
            const mid = rest.splitText(idx);
            rest = mid.splitText(u.length);
            const span = document.createElement('span');
            span.className = 'dw-link-rendered';
            span.dataset.fileUrl = u;
            span.textContent = u;
            mid.replaceWith(span);
          }
        }
      }
    }

    function attachFileRenders(cardEl, rawText) {
      if (!cardEl || !rawText) return;
      const urls = [...new Set((String(rawText).match(FILE_URL_RE) || []).map(trimUrlTail))].filter(isOwnFileUrl);
      if (!urls.length) return;
      const seen = cardEl._fileSeen || (cardEl._fileSeen = new Set());
      // 🔴 ts-No.79:同一张图不显示两处 —— 正文里已**就地出图**的直链不再建卡。
      //    判据是"当前 DOM 里那张 <img> 的状态",不是"这条 URL 写在 markdown 语法里"(理由见 mdInlineImageUrls)。
      const inlineShown = mdInlineImageUrls(cardEl);
      // 🔴 ts-No.79:记住这张卡当前的正文 —— 就地那张**加载失败**时,wireMarkdownImages 要靠它把卡补回来。
      cardEl._fileText = String(rawText);
      const host = fileAttachmentsHost(cardEl);
      for (const url of urls) {
        if (seen.has(url) || inlineShown.has(url)) continue;
        seen.add(url);
        const slot = document.createElement('div');   // 占位：保证多个附件的先后次序与正文一致
        slot.dataset.fileUrl = url;   // 🔴 ts-No.79:让"就地那张已加载"能撤掉**还在飞**的这张卡
        host.appendChild(slot);
        buildFileAttachment(url)
          .then((box) => {
            // 🔴 ts-No.79:探测回来时正文里已经就地出图了 ⇒ 这张卡不要了(一图不两处)
            if (mdInlineImageUrls(cardEl).has(url)) { slot.remove(); return; }
            // R5-3：只有**成功渲染**的才算数。gone（HEAD 404 已过期）不算 ——
            //      它在正文里那条 URL 必须留着可见，否则用户连复制都做不到。
            if (box.dataset.dispatch && box.dataset.dispatch !== 'gone') box.dataset.rendered = 'ok';
            slot.replaceWith(box);
            hideRenderedLinks(cardEl);
          })
          .catch(() => {
            // 渲染失败 ⇒ 不打 rendered 标记 ⇒ 正文那条 URL 保持可见（R5-3）
            const fallback = fileAttachmentShell(url, null, uploadedFileHints.get(url));
            fallback.appendChild(fileDownloadLink(url, '下载', uploadedFileHints.get(url)?.name || ''));
            slot.replaceWith(fallback);
          });
      }
    }

    // 🔴 ts-No.79:markdown 就地出图 与 附件卡 之间的让位规则。
    //
    // 为什么判据是"**当前 DOM 里那张 <img> 的状态**",而不是"这条 URL 写在 markdown 语法里":
    //   · 超长正文只渲染开头摘要(LONGTEXT_EXCERPT)⇒ 摘要外的图**不会**就地出现 ⇒ 卡必须照旧建,
    //     否则那张图**直接没了**(比现状差)。
    //   · 图取不到(7 天保留期到了 / 解不了码)⇒ 就地那张撤掉 ⇒ 卡照旧给
    //     「文件已不可取(服务端 404)——可能已过 7 天保留期被清理」与「⬇ 下载图片」的出路 ⇒ 也不比现状差。
    //   🔵 两条都不是推论:renderer-markdown-image-regression.js 的 G5/G6 各钉一条。
    function mdInlineImageUrls(cardEl) {
      const urls = new Set();
      if (!cardEl || !cardEl.querySelectorAll) return urls;
      for (const img of cardEl.querySelectorAll('.event-content img[data-md-img]')) {
        const src = img.getAttribute('src');
        if (!src) continue;
        // 🔴 加载失败(complete 且 naturalWidth==0)⇒ **不算**已就地显示 ⇒ 附件卡接手
        if (img.complete && img.naturalWidth === 0) continue;
        urls.add(src);
      }
      return urls;
    }

    function dropRenderedFileCard(cardEl, url) {
      if (!cardEl || !url || !cardEl._fileHost) return;
      for (const el of [...cardEl._fileHost.children]) {
        if (el.dataset && el.dataset.fileUrl === url) el.remove();
      }
    }

    // 每次重渲后都要重新接线(innerHTML 会把上一次的处理连同元素一起冲掉)—— 与 hideRenderedLinks 同理。
    function wireMarkdownImages(content, cardEl) {
      if (!content || !cardEl) return;
      for (const img of content.querySelectorAll('img[data-md-img]')) {
        if (img.dataset.mdWired === '1') continue;
        img.dataset.mdWired = '1';
        const url = img.getAttribute('src') || '';
        const failed = () => {
          // 就地那张取不到 ⇒ 撤掉破图标,并让附件卡接手(它带"已过期/下载"的出路,不留空白)。
          img.remove();
          attachFileRenders(cardEl, cardEl._fileText || '');
        };
        if (img.complete) {
          if (img.naturalWidth === 0) failed();
          else dropRenderedFileCard(cardEl, url);
          continue;
        }
        img.addEventListener('load', () => dropRenderedFileCard(cardEl, url), { once: true });
        img.addEventListener('error', failed, { once: true });
      }
    }

    function baseCard(ev, cls = '', cardClass = 'message-card') {
      const card = document.createElement('article');
      card.className = `${cardClass} ${cls}`.trim();
      const body = document.createElement('div');
      body.className = 'event-body';
      const meta = document.createElement('span');
      meta.className = 'event-meta';
      const diag = eventDiagnostics(ev);
      meta.innerHTML = `
        ${provenanceIconHtml(ev._norm || {})}${eventTypeLabel(ev) ? `<div class="event-type">${escapeHtml(eventTypeLabel(ev))}</div>` : ''}
        ${eventStatusLabel(ev) ? `<div class="event-sent">${escapeHtml(eventStatusLabel(ev))}</div>` : ''}
        ${eventTimeHtml(ev)}
        ${diag.length ? `<details class="event-diag"><summary title="诊断" aria-label="诊断"><span class="diag-icon" aria-hidden="true">i</span></summary><div class="event-diag-list">${diag.map(([k, v]) => `<code>${escapeHtml(k)} ${escapeHtml(v)}</code>`).join('')}</div></details>` : ''}
      `;
      const content = document.createElement('span');
      content.className = 'event-content';
      body.append(meta, content);
      card.appendChild(body);
      return { card, body, content, meta };
    }

    // 业主08-05定:tool_call/state_change 独立事件卡不上时间线(与会话卡重复,状态已有待提交区/状态栏)。
    // 只挡"独立卡"出口:turn-group 数据入组、完成判定、状态栏/成本副作用均不受影响;
    // state_change 本就不产卡(renderState 仅副作用),入集合为对齐口径。input_posted 留在正文;
    // 无 turn 的 error/control/unknown 进入正文外的辅助面板。
    const HIDDEN_TIMELINE_CARD_KINDS = new Set(['tool_call', 'state_change']);

    function renderEvent(ev) {
      if (ev.kind === 'state_change' && ev.data?.change === 'session_init') return renderState(ev);
      if (ev.kind === 'input_posted') return renderUser(ev);   // C1:canonical 输入事件,不经 turn 分组
      // 🔴 T-074:legacy `user_input` 与 canonical `input_posted` 描述的是**同一条输入**,
      // 却分别落到两条渲染路径(前者经 turn 分组、后者走独立输入卡),于是同一条输入画两次。
      // ⇒ 若该笔投递**已经有卡**(合卡索引命中,前缀两种写法已归一),就让它就地更新,
      //   不另起分组节点。
      // ⚠️ **带守卫,不无条件抑制**:若 input_posted 未到(索引未命中),user_input 仍照常渲染 ——
      //   否则在只有 legacy 事件的场景下,消息会整个消失。今晚已经因无守卫的抑制栽过一次。
      if (ev.kind === 'user_input' && ev.delivery_id
          && c1DeliveryCards.has(deliveryMergeKey(ev.delivery_id))) {
        return renderUser(ev);
      }
      const turnKey = turnKeyFor(ev);
      if (turnKey && ['user_input', 'assistant_text', 'tool_call', 'state_change', 'error'].includes(ev.kind)) {
        return renderTurnEvent(turnKey, ev);
      }
      if (HIDDEN_TIMELINE_CARD_KINDS.has(ev.kind)) {
        if (ev.kind === 'state_change') renderState(ev);   // 状态栏/成本副作用保留,本就无卡
        return;
      }
      if (ev.kind === 'user_input') return renderUser(ev);
      if (ev.kind === 'assistant_text') return renderAssistant(ev);
      if (ev.kind === 'error') return renderError(ev);
      renderUnknown(ev);
    }

    function eventTimeHtml(ev) {
      // ts=UTC epoch 毫秒(helper 打戳);按查看者本地时区渲染,悬停给完整本地时间+UTC。
      // 旧事件(ring 回放的无 ts 存量)不显示,不兜底猜时间。
      if (!Number.isFinite(ev?.ts)) return '';
      const d = new Date(ev.ts);
      if (Number.isNaN(d.getTime())) return '';   // 超Date值域的ts同走不显示不猜,防toISOString抛RangeError丢整卡(dev55 R1 F1)
      const full = `${d.toLocaleString()} (${d.toISOString()} UTC)`;
      return `<span class="event-time" data-ts="${ev.ts}" title="${escapeHtml(full)}">${escapeHtml(d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false }))}</span>`;
    }

    function eventMetaHtml(ev) {
      const diag = eventDiagnostics(ev);
      const tl = eventTypeLabel(ev);
      const sl = eventStatusLabel(ev);

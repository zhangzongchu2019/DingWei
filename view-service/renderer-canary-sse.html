      if (st === 'expired') return '⏰';
      if (st === 'dead' || st === 'dropped') return '■';
      if (['cli_injected', 'pty_write', 'turn_admitted', 'admitted'].includes(st)) return '';
      return '⏳';
    }

    function eventDiagnostics(ev) {
      return [
        ev.delivery_id ? ['delivery', ev.delivery_id] : null,
        ev.turn_id ? ['turn', ev.turn_id] : null,
        ev.cursor ? ['cursor', ev.cursor] : null,
      ].filter(Boolean);
    }

    // Generic dock shell: future sections (for example files) register one
    // list and reuse the same collapse/unread mechanics.
    const dockSections = new Map();
    let dockUnreadCount = 0;

    function registerDockSection(id) {
      const root = document.querySelector(`[data-dock-section="${id}"]`);
      const list = root?.querySelector('.dock-section-list');
      if (!root || !list) throw new Error(`missing dock section: ${id}`);
      dockSections.set(id, { root, list });
    }

    function updateDockUnread() {
      workspaceDockUnread.textContent = String(dockUnreadCount);
      workspaceDockUnread.hidden = dockUnreadCount === 0;
    }

    function setDockExpanded(expanded) {
      workspaceDockToggle.setAttribute('aria-expanded', String(expanded));
      workspaceDockBody.hidden = !expanded;
      if (expanded) {
        dockUnreadCount = 0;
        updateDockUnread();
      }
    }

    workspaceDockToggle.addEventListener('click', () => {
      setDockExpanded(workspaceDockToggle.getAttribute('aria-expanded') !== 'true');
    });

    function appendDockCard(sectionID, card) {
      const section = dockSections.get(sectionID);
      if (!section) throw new Error(`unregistered dock section: ${sectionID}`);
      section.list.appendChild(card);
      while (section.list.children.length > 500) section.list.removeChild(section.list.firstChild);
      workspaceDock.hidden = false;  // T-054:出现错误后入口才出现
      if (workspaceDockBody.hidden && !replayInProgress) {
        dockUnreadCount++;
        updateDockUnread();
      }
    }

    function showErrorToast(text) {
      const toast = document.createElement('div');
      toast.className = 'toast';
      toast.setAttribute('role', 'alert');
      toast.textContent = text || 'Unknown error';
      toastRegion.appendChild(toast);
      while (toastRegion.children.length > 3) toastRegion.removeChild(toastRegion.firstChild);
      setTimeout(() => toast.remove(), 6000);
    }

    registerDockSection('activity');
    setDockExpanded(false);

    function baseCard(ev, cls = '', cardClass = 'message-card') {
      const card = document.createElement('article');
      card.className = `${cardClass} ${cls}`.trim();
      const body = document.createElement('div');
      body.className = 'event-body';
      const meta = document.createElement('span');
      meta.className = 'event-meta';
      const diag = eventDiagnostics(ev);
      meta.innerHTML = `
        ${provenanceIconHtml(ev._norm || {})}${eventTypeLabel(ev) ? `<div class="event-type">${escapeHtml(eventTypeLabel(ev))}</div>` : ''}
        ${eventStatusLabel(ev) ? `<div class="event-sent">${escapeHtml(eventStatusLabel(ev))}</div>` : ''}
        ${eventTimeHtml(ev)}
        ${diag.length ? `<details class="event-diag"><summary title="诊断" aria-label="诊断"><span class="diag-icon" aria-hidden="true">i</span></summary><div class="event-diag-list">${diag.map(([k, v]) => `<code>${escapeHtml(k)} ${escapeHtml(v)}</code>`).join('')}</div></details>` : ''}
      `;
      const content = document.createElement('span');
      content.className = 'event-content';
      body.append(meta, content);
      card.appendChild(body);
      return { card, body, content, meta };
    }

    // 业主08-05定:tool_call/state_change 独立事件卡不上时间线(与会话卡重复,状态已有待提交区/状态栏)。
    // 只挡"独立卡"出口:turn-group 数据入组、完成判定、状态栏/成本副作用均不受影响;
    // state_change 本就不产卡(renderState 仅副作用),入集合为对齐口径。input_posted 留在正文;
    // 无 turn 的 error/control/unknown 进入正文外的辅助面板。
    const HIDDEN_TIMELINE_CARD_KINDS = new Set(['tool_call', 'state_change']);

    function renderEvent(ev) {
      if (ev.kind === 'state_change' && ev.data?.change === 'session_init') return renderState(ev);
      if (ev.kind === 'input_posted') return renderUser(ev);   // C1:canonical 输入事件,不经 turn 分组
      // 🔴 T-074:legacy `user_input` 与 canonical `input_posted` 描述的是**同一条输入**,
      // 却分别落到两条渲染路径(前者经 turn 分组、后者走独立输入卡),于是同一条输入画两次。
      // ⇒ 若该笔投递**已经有卡**(合卡索引命中,前缀两种写法已归一),就让它就地更新,
      //   不另起分组节点。
      // ⚠️ **带守卫,不无条件抑制**:若 input_posted 未到(索引未命中),user_input 仍照常渲染 ——
      //   否则在只有 legacy 事件的场景下,消息会整个消失。今晚已经因无守卫的抑制栽过一次。
      if (ev.kind === 'user_input' && ev.delivery_id
          && c1DeliveryCards.has(deliveryMergeKey(ev.delivery_id))) {
        return renderUser(ev);
      }
      const turnKey = turnKeyFor(ev);
      if (turnKey && ['user_input', 'assistant_text', 'tool_call', 'state_change', 'error'].includes(ev.kind)) {
        return renderTurnEvent(turnKey, ev);
      }
      if (HIDDEN_TIMELINE_CARD_KINDS.has(ev.kind)) {
        if (ev.kind === 'state_change') renderState(ev);   // 状态栏/成本副作用保留,本就无卡
        return;
      }
      if (ev.kind === 'user_input') return renderUser(ev);
      if (ev.kind === 'assistant_text') return renderAssistant(ev);
      if (ev.kind === 'error') return renderError(ev);
      renderUnknown(ev);
    }

    function eventTimeHtml(ev) {
      // ts=UTC epoch 毫秒(helper 打戳);按查看者本地时区渲染,悬停给完整本地时间+UTC。
      // 旧事件(ring 回放的无 ts 存量)不显示,不兜底猜时间。
      if (!Number.isFinite(ev?.ts)) return '';
      const d = new Date(ev.ts);
      if (Number.isNaN(d.getTime())) return '';   // 超Date值域的ts同走不显示不猜,防toISOString抛RangeError丢整卡(dev55 R1 F1)
      const full = `${d.toLocaleString()} (${d.toISOString()} UTC)`;
      return `<span class="event-time" data-ts="${ev.ts}" title="${escapeHtml(full)}">${escapeHtml(d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false }))}</span>`;
    }

    function eventMetaHtml(ev) {
      const diag = eventDiagnostics(ev);
      const tl = eventTypeLabel(ev);
      const sl = eventStatusLabel(ev);
      return `<span class="event-meta">${provenanceIconHtml(ev._norm || {})}${tl ? `<span class="event-type">${escapeHtml(tl)}</span>` : ''}${sl ? `<span class="event-sent">${escapeHtml(sl)}</span>` : ''}${eventTimeHtml(ev)}${diag.length ? `<details class="event-diag"><summary title="诊断" aria-label="诊断"><span class="diag-icon" aria-hidden="true">i</span></summary><span class="event-diag-list">${diag.map(([k, v]) => `<code>${escapeHtml(k)} ${escapeHtml(v)}</code>`).join('')}</span></details>` : ''}</span>`;
    }

    // ── E(已按 P0 令重做):重放幂等**不再靠 cursor 去重** ────────
    // 🔴 2026-08-29 P0:我原先假设 cursor 是"每事件唯一",据此对 assistant_text 做 seen 去重。
    // 该假设是错的 —— Codex 的流式 delta **整个 item 共用同一个 cursor**
    // (如 375 片全是 `turn:<turnId>:item:0003`,只有 data.params.delta 不同),
    // 于是第一片进 seen 之后其余 374 片被当成重放丢弃,页面只剩首片 + 一个假的「✓ 回合完成」。
    // 这正是我给自己定过的红线的反面:**去重的代价只能是"多渲一次",绝不能是"少一段内容"**,
    // 而我把它踩了 —— 因为我只验证了"重复事件不再累加",没有验证"不同内容会不会被误判成重复"。
    //
    // 新口径(业主令):**在服务端给出 per-delta 唯一序号(event_seq / SSE id)之前,
    // 任何按 cursor 的去重都不得作用于流式内容。** 这里索性把 cursor 去重整体拆掉,
    // 只保留一种幂等机制(见 markStreamReconnect):重连时先清空再由 ring 重放重建。
    // 一种机制比两种更难出错,且它的失败模式是"重建一次"而不是"丢正文"。
    // 现网每次 SSE 重连(网络抖动 / VS 重启 / 休眠唤醒 / 后台标签页被断流)之后,
    // hub 都会重放 ring 里的同一批事件;而追加路径此前**没有任何去重**——
    // 同一回合的正文每重放一次就再追加一遍(实测 60→120→180→240 字线性增长),
    // group.events 同步无界增长,使每次 rebuildTurn 的 filter/map/join 与 markdown 都越来越贵,
    // 最终表现为「同一个答案吐出两份 → 页面越来越卡 → 卡死」,极端情况下正文长度会撞上
    // V8 的字符串上限抛 RangeError(Invalid string length),此后该回合再也渲染不出来。
    // 节流只降渲染**频次**,治不了内容**无界增长**,故必须在追加入口做幂等。
    //
    function renderTurnEvent(turnKey, ev) {
      let group = turnGroups.get(turnKey);
      if (!group) {
        const node = document.createElement('article');
        node.className = 'turn-group';
        node.dataset.turnKey = turnKey;
        node.setAttribute('aria-label', `Turn ${turnKey}`);
        timeline.appendChild(node);
        group = { node, events: [], kind: 'turn', dirty: false, sorted: true, lastRender: 0, detached: false };
        turnGroups.set(turnKey, group);
      }
      group.events.push(ev);   // 不做 cursor 去重:同一 item 的多片 delta 共用 cursor,去重会吞正文
      group.sorted = false;
      // turn_completed 强制终渲:终态文案与 renderState 的状态栏/成本副作用不可被节流推迟
      const completed = ev.kind === 'state_change' && ev.data && ev.data.change === 'turn_completed';
      scheduleRender(group, completed);
    }

    // ── A:渲染节流 ─────────────────────────────────────────────
    // 同一 turn / 同一助手消息的重渲合并进 RENDER_THROTTLE_MS 窗口。
    // 前沿即时渲染:窗口空闲时第一条事件同步出画,保住「消息一到就看得见」的手感,
    //   也让「一条事件 → 立刻可断言 DOM」的既有同步语义对孤立事件保持不变。
    // 窗口内后续 chunk 只置脏,由尾帧一次性重渲;turn_completed 与回放收尾强制终渲。
    function cancelRenderFlush() {
      if (renderFlushTimer !== null) { clearTimeout(renderFlushTimer); renderFlushTimer = null; }
      if (renderFlushFrame !== null) { cancelAnimationFrame(renderFlushFrame); renderFlushFrame = null; }
    }

    function renderPendingEntry(entry) {
      entry.dirty = false;
      entry.lastRender = Date.now();
      if (entry.kind === 'assistant') renderAssistantBody(entry);
      else rebuildTurn(entry);
    }

    function flushPendingRenders() {
      cancelRenderFlush();
      if (!pendingRenders.size) return;
      // 跟随态必须在本次批量重渲**之前**取样:重渲会让回合卡增高,
      // 浏览器的滚动锚定(overflow-anchor)随即挪动 scrollTop 并派发一次 scroll 事件,
      // 而既有 scroll 处理器把「不在底部的 scroll」判为用户上翻 → 永久交还跟随权,页面停在半空。
      // 取样后在同一批里补到底,scroll 事件落地时已在底部,判据自然不成立(不改既有启发式)。
      const wasFollowing = replayInProgress || timelineAtBottom;
      const due = Array.from(pendingRenders);
      pendingRenders.clear();
      for (const entry of due) {
        if (entry.detached) continue;   // 已被上限逐出:不重渲,也不让它复活
        // F:单个条目渲染抛错不得连累同批其余条目 —— 它们已被移出 pendingRenders,
        // 一旦异常冒泡就再也没有人来渲染它们,表现为「页面从此不再更新 / 刷新也刷不出来」。
        // 这里逐条兜住并把错误显式记到控制台(fail-loud,不静默),其余条目照常渲染。
        try {
          renderPendingEntry(entry);
        } catch (err) {
          console.error('[render] 条目重渲失败,已跳过该条,不影响同批其余条目:', err);
        }
      }
      if (wasFollowing) scrollTimelineToBottom();
    }

    function scheduleRenderFlush() {
      if (renderFlushTimer !== null || renderFlushFrame !== null) return;
      renderFlushTimer = setTimeout(() => {
        renderFlushTimer = null;
        // 再对齐一次 rAF,避免与浏览器排版抢帧;定时器已先兜住节流窗口,
        // 故页面不可见(rAF 不触发)时也不会把内容永久压在队列里 —— 下次可见的首帧或强制终渲会补上。
        if (typeof requestAnimationFrame !== 'function') return flushPendingRenders();
        renderFlushFrame = requestAnimationFrame(() => { renderFlushFrame = null; flushPendingRenders(); });
      }, RENDER_THROTTLE_MS);
    }

    function scheduleRender(entry, force = false) {
      if (entry.detached) { pendingRenders.delete(entry); return; }
      entry.dirty = true;
      if (force || (Date.now() - (entry.lastRender || 0)) >= RENDER_THROTTLE_MS) {
        pendingRenders.delete(entry);
        renderPendingEntry(entry);
        return;
      }
      pendingRenders.add(entry);
      scheduleRenderFlush();
    }

    // 只数长度,不拼串(整段 join 会在每次重渲时分配一份完整正文,长文本下这本身就是开销)
    function eventsTextLength(evs) {
      let n = 0;
      for (const ev of evs) n += (ev.text || '').length;
      return n;
    }
    // 取前 max 字的摘要;在行边界截断,避免把一行 markdown 从中间劈开
    function eventsTextPrefix(evs, max) {
      let out = '';
      for (const ev of evs) {
        out += ev.text || '';
        if (out.length >= max) break;
      }
      if (out.length <= max) return out;
      const cut = out.slice(0, max);
      const nl = cut.lastIndexOf('\n');
      return nl > max * 0.5 ? cut.slice(0, nl) : cut;
    }
    function eventsTextFull(evs) {
      return evs.map(ev => ev.text || '').join('');
    }

    function rebuildTurn(group) {
      // 排序也从「每 chunk 一次」挪到重渲时一次:旧实现 O(N) 次 sort ⇒ O(N² log N)
      if (!group.sorted) { group.events.sort(compareCursor); group.sorted = true; }
      const users = group.events.filter(ev => ev.kind === 'user_input');
      const tools = group.events.filter(ev => ev.kind === 'tool_call');
      const assistants = group.events.filter(ev => ev.kind === 'assistant_text');
      const errors = group.events.filter(ev => ev.kind === 'error');
      const completed = group.events.filter(ev => ev.kind === 'state_change' && ev.data?.change === 'turn_completed').at(-1);
      group.node.classList.toggle('external', assistants.some(ev => ev.delivery_id?.startsWith('ext-')));
      let html = '';
      if (users.length) {
        const text = users.map(ev => ev.text || '').join('');
        html += `<section class="event-body turn-section turn-user">${eventMetaHtml(users[0])}<span class="event-content">${escapeHtml(text)}</span></section>`;
      }
      // Tools are useful as live progress while a turn is running. Once the
      // turn completes, remove them from the reading view and keep only the
      // user request and final answer.
      if (tools.length && !completed) {
        html += `<details class="turn-tools"><summary><span>🔧 ${tools.length} 次工具调用</span></summary><div class="turn-tools-list">${tools.map(renderTurnTool).join('')}</div></details>`;
      }
      if (assistants.length) {
        const total = eventsTextLength(assistants);
        if (total > LONGTEXT_THRESHOLD) {
          // G:超长 ⇒ 只渲染摘要 + 文件化入口。内联 markdown 的输入被摘要长度封顶。
          const excerpt = eventsTextPrefix(assistants, LONGTEXT_EXCERPT);
          const note = completed
            ? `全文 ${total.toLocaleString()} 字,已折叠(仅显示开头 ${excerpt.length.toLocaleString()} 字)`
            : `接收中…已收 ${total.toLocaleString()} 字,已折叠(仅显示开头 ${excerpt.length.toLocaleString()} 字)`;
          html += `<section class="event-body turn-section turn-assistant longtext">${eventMetaHtml(assistants[0])}` +
            `<span class="event-content longtext-fade">${renderMarkdown(excerpt)}</span>` +
            `<div class="longtext-bar" role="group" aria-label="长正文操作">` +
            `<span class="longtext-note">📄 ${escapeHtml(note)}</span>` +
            `<button type="button" data-longtext="open">打开全文</button>` +
            `<button type="button" data-longtext="download">下载 .md</button>` +
            `<button type="button" data-longtext="copy">复制全文</button>` +
            `</div></section>`;
        } else {
          const text = eventsTextFull(assistants);
          html += `<section class="event-body turn-section turn-assistant">${eventMetaHtml(assistants[0])}<span class="event-content">${renderMarkdown(text)}</span></section>`;
        }
      }
      for (const ev of errors) {
        html += `<section class="event-body turn-section turn-error">${eventMetaHtml(ev)}<span class="event-content">${escapeHtml(ev.text || 'Unknown error')}</span></section>`;
      }
      if (completed) {
        const cost = completed.data?.turn_cost_usd ?? completed.data?.cost_usd;
        const total = completed.data?.total_cost_usd ?? completed.data?.cost_total;
        // 业主 2026-09-11:「这里只要给个完成标志即可,不用单写一行文字」。
        // ⚠️ 标志本身保留:整行删掉会让「回合结束」与「还在跑」无法区分。
        html += `<footer class="turn-completed" title="回合完成" aria-label="回合完成">✓</footer>`;
      }
      group.node.innerHTML = html;
      group.node.querySelectorAll('.turn-assistant .event-content').forEach(content => {
        mergeMetaIntoMarkdown(content);
        wireCopyButtons(content);
      });
      group.node.querySelectorAll('.turn-tool-item').forEach(wireCopyButtons);
      wireLongtextBar(group);
      if (completed) renderState(completed);
    }

    // G:入口条接线。全文在点击那一刻才从 group.events 现拼 —— 既保证拿到的是最新内容,
    // 也保证流式期间完全不为"可能没人点"的全文付出任何成本。
    function wireLongtextBar(group) {
      const bar = group.node.querySelector('.longtext-bar');
      if (!bar) return;
      const fullText = () => eventsTextFull(group.events.filter(ev => ev.kind === 'assistant_text'));
      const fileName = `dingwei-${String(group.node.dataset.turnKey || 'turn').replace(/[^\w.-]/g, '_')}.md`;
      const withBlobUrl = (fn) => {
        const url = URL.createObjectURL(new Blob([fullText()], { type: 'text/markdown;charset=utf-8' }));
        try { fn(url); } finally { setTimeout(() => URL.revokeObjectURL(url), 60000); }
      };
      bar.querySelectorAll('button[data-longtext]').forEach(btn => {
        btn.addEventListener('click', async () => {
          const kind = btn.dataset.longtext;
          const label = btn.textContent;
          const flash = (t) => { btn.textContent = t; setTimeout(() => { btn.textContent = label; }, 1200); };
          if (kind === 'copy') {
            try { await navigator.clipboard.writeText(fullText()); flash('已复制'); }
            catch { flash('复制失败'); }   // 诚实回显失败,不假称成功
            return;
          }
          if (kind === 'download') {
            withBlobUrl(url => {
              const a = document.createElement('a');
              a.href = url; a.download = fileName;
              document.body.appendChild(a); a.click(); a.remove();
            });
            return;
          }
          withBlobUrl(url => {
            // 新标签页打开;被拦截时不静默,退回下载
            if (!window.open(url, '_blank', 'noopener')) flash('被拦截');
          });
        });
      });
    }

    function renderTurnTool(ev) {
      const name = ev.data?.name || 'Tool';
      const input = ev.data?.input || {};
      const preview = Object.entries(input).map(([k, v]) => `${k}: ${String(v).slice(0, 56)}`).join(' · ');
      return `<div class="turn-tool-item"><div class="turn-tool-head">${eventMetaHtml(ev)}<span class="tool-name">${escapeHtml(name)}</span><span class="tool-preview">${escapeHtml(preview)}</span></div>${renderCode(JSON.stringify(input, null, 2), 'json')}</div>`;
    }

    // control 消息按系统事件渲染:v0.6 只表达「已发起/已发出」,绝不假称「已终止/真停」(真停挂 v0.7#20)
    function renderControlNote(ev) {
      // T-054(业主 2026-09-10):control 卡片与输入框上方的待提交区完全重复
      // (待提交区已显示已入队→hub 已收→helper 已收→已注入→已写入终端,含失败原因),
      // 故不再产生任何卡片 —— 正文区与边条都不产生。
      return;
      /* eslint-disable no-unreachable */
      const { card, content } = baseCard(ev, 'system', 'activity-card');
      const kind = String(ev.control?.kind || ev.control_kind || '').toLowerCase();
      const text = {
        cancel: '已请求终止',
        interrupt: '中断已发出',
      }[kind] || '控制消息已下发';
      const detail = ev.text || ev._norm?.text || '';
      content.textContent = detail ? `${text}:${detail}` : text;
      appendDockCard('activity', card);
      /* eslint-enable no-unreachable */
    }

    function renderUser(ev) {
      const norm = ev._norm || { key: '', sourceTrusted: false, stageIdx: -1 };
      // control 消息(cancel/interrupt 等)不进输入卡/待提交区,按系统事件文案渲染
      if (norm.deliveryMode === 'control') {
        c2MaybeConfirmInterrupt(ev);  // C2:流上 control 事件=中断回执,升级 pending 请求为已确认
        return renderControlNote(ev);
      }
      // 🔴 业主 2026-09-11(两次):『不希望看到 event 卡片,就算是出错信息也不希望看到』
      // 『这个卡片要显示的状态信息,在待提交信息区和对话轮次交互卡片中都可以展示,
      //   无需多出一个 event 卡片』。
      // ⇒ 失败**不另起任何卡**(正文区与右侧看板都不起),而是**更新已有的那张对话卡**。
      // 成因见 T-074:失败事件与输入卡的 message_id 键对不上,`c1CardFor` 找不到 ⇒ 新建 ⇒ 多一张。
      // ⇒ 按 message_id 找不到时,改用**投递号**(已归一)反查已有卡再更新。
      const entry0 = norm.key ? c1CardFor(norm, true) : null;
      if (!entry0?.card && norm.stage === 'failed') {
        const viaDlv = norm.deliveryId ? c1InputCards.get(c1DeliveryCards.get(deliveryMergeKey(norm.deliveryId))) : null;
        if (viaDlv?.footer) {
          // fail-loud:不在界面另起卡,但仍留痕,便于事后诊断(业主不看,排查时要用)
          console.warn('[delivery-failed]', norm.deliveryId || '', stageFooterText(norm));
          const st = viaDlv.footer.querySelector('.stage-text');
          if (st) st.textContent = stageFooterText(norm) || '失败:投递失败';
          return;
        }
        // ⚠️ 连已有卡都找不到:仍不新建卡(业主明确不要),只留痕。
        console.warn('[delivery-failed-orphan]', norm.deliveryId || '', stageFooterText(norm));
        return;
      }
      const entry = entry0;
      if (entry && entry.card) {
        // 同 message_id 已有输入卡:原位更新,绝不产生第二张
        if (norm.text && !entry.content.textContent) entry.content.textContent = norm.text;
        c1ApplyToEntry(entry, norm);
        return;
      }
      const { card, content } = baseCard(ev, 'user');
      content.textContent = ev.text || norm.text || '';
      if (norm.key) card.dataset.messageId = norm.key;
      // 徽标 + 阶段脚注:trusted 才挂来源徽标(fail-closed);copy 不显示等待 ACK 态
      const isCopy = String(norm.deliveryMode).includes('copy');
      const footer = document.createElement('div');
      footer.className = 'card-stage-footer';
      const provIc = provenanceIconHtml(norm);  // display v1:provenance 图标在场时压 legacy 文字徽标(不双标)
      const badge = provIc ? '' : sourceBadgeHtml(norm);
      const footText = isCopy ? '已同步/镜像(不追 ACK)' : stageFooterText(norm);
      footer.innerHTML = `${badge}<span class="stage-text">${escapeHtml(footText)}</span>`;
      card.appendChild(footer);
      timeline.appendChild(card);
      if (entry) {
        entry.card = card;
        entry.content = content;
        entry.footer = footer;
        entry.stageEl = footer.querySelector('.stage-text');
        entry.sentEl = card.querySelector('.event-sent');
        entry.stageIdx = norm.stageIdx;
        if (norm.deliveryId) c1DeliveryCards.set(deliveryMergeKey(norm.deliveryId), norm.key);
        // 应用建卡前缓冲的乱序更新
        const pending = c1PendingUpdates.get(norm.key) || [];
        c1PendingUpdates.delete(norm.key);
        for (const p of pending) c1ApplyToEntry(entry, p);
        // copy/echo 归并缓冲(display v1):先到的 route_observation/user_input 回显归并到本卡(清 timer 防回落)
        const mergeNotes = norm.deliveryId ? c1MergeBuf.get(norm.deliveryId) || [] : [];
        c1MergeBuf.delete(norm.deliveryId);
        for (const rec of mergeNotes) { clearTimeout(rec.timer); c1Footnote(entry, rec.footKey || 'echo_merge', '已回显'); }
        if (!isCopy) c1ApplyToEntry(entry, norm);
      }
    }

    function renderAssistant(ev) {
      const k = keyFor(ev);
      let body = messageNodes.get(k);
      if (!body) {
        const { card, content } = baseCard(ev, `assistant ${ev.delivery_id?.startsWith('ext-') ? 'external' : ''}`);
        card.dataset.messageKey = k;   // D:逐出时按此反查,清 messageNodes/messageBuffers/assistantEntries
        timeline.appendChild(card);
        body = content;
        messageNodes.set(k, body);
        messageBuffers.set(k, '');
      }
      let entry = assistantEntries.get(k);
      if (!entry) {
        entry = { kind: 'assistant', key: k, dirty: false, lastRender: 0, detached: false };
        assistantEntries.set(k, entry);
      }
      messageBuffers.set(k, (messageBuffers.get(k) || '') + (ev.text || ''));   // 同上:不去重,不吞正文
      scheduleRender(entry);   // A:同一条助手消息的多个 chunk 合并为一次 markdown 重渲
    }

    function renderAssistantBody(entry) {
      const body = messageNodes.get(entry.key);
      if (!body) return;
      body.innerHTML = renderMarkdown(messageBuffers.get(entry.key) || '');
      mergeMetaIntoMarkdown(body);
      wireCopyButtons(body);
    }

    function mergeMetaIntoMarkdown(content) {
      const eventBody = content.closest('.event-body');
      const meta = eventBody?.querySelector(':scope > .event-meta');
      const md = content.querySelector(':scope > .md');
      const firstBlock = md?.firstElementChild;
      if (!meta || !firstBlock || firstBlock.contains(meta)) return;
      let target = firstBlock;
      if (firstBlock.matches('ol, ul')) {
        target = firstBlock.querySelector('li') || firstBlock;
      } else if (firstBlock.classList.contains('code-wrap')) {
        target = firstBlock.querySelector('.code-toolbar') || firstBlock;
      } else if (firstBlock.classList.contains('table-wrap')) {
        target = firstBlock.querySelector('th, td') || firstBlock;
      }
      target.insertBefore(meta, target.firstChild);
    }

    function mergeMetaIntoFirstBlock(content, target) {
      const eventBody = content.closest('.event-body');
      const meta = eventBody?.querySelector(':scope > .event-meta');
      if (!meta || !target || target.nodeType !== Node.ELEMENT_NODE || target.contains(meta)) return;
      target.insertBefore(meta, target.firstChild);
    }

    function renderState(ev) {
      if (ev.data?.change === 'session_init') {
        applyStatusData(ev.data);
        return;
      }
      if (ev.data?.change === 'turn_completed') {
        stats.turns = Math.max(stats.turns, Number(ev.data.num_turns || stats.turns || 0));
        applyCostData(ev.data);
        setStatus('idle');
        return;
      }
      // Unknown lifecycle state changes are intentionally omitted from the
      // conversation timeline; rendering their raw payload creates noisy cards.
      return;
    }

    function applyCostData(data) {
      const total = Number(data.total_cost_usd ?? data.cost_total ?? data.totalCostUsd ?? data.cost_usd ?? NaN);
      if (Number.isFinite(total)) {
        stats.turnCost = Math.max(0, total - stats.lastTurnCostTotal);
        stats.cost = total;
        stats.lastTurnCostTotal = total;
        return;
      }
      const turn = Number(data.turn_cost_usd ?? 0);
      stats.turnCost = Number.isFinite(turn) ? turn : 0;
      stats.cost += stats.turnCost;
      stats.lastTurnCostTotal = stats.cost;
    }

    // Live data source contract:
    // helper/sidecar will emit state_change every ~5s with data like
    // {mem:{used,total,unit}, disk:{used,total,unit}, load, session_state,
    //  readonly, unlock_code, owner}.
    // The view updates this bottom status bar and does not append those
    // heartbeat state events to the conversation timeline.
    function applyStatusData(data) {
      if (data.session_id || data.session) stats.sessionName = data.session_id || data.session;
      if (data.owner) stats.owner = data.owner;
      if (data.auth_mode) stats.authMode = data.auth_mode;
      if (data.model || data.driver) stats.model = data.model || data.driver;
      if (data.unlock_code || data.unlockCode) stats.unlockCode = data.unlock_code || data.unlockCode;
      const pageAuthorized = stats.authMode === 'view_page_v2';
      if (!pageAuthorized && data.readonly !== undefined) {
        stats.readonly = Boolean(data.readonly);
        stats.access = stats.readonly ? '只读' : '可写';
      } else if (!pageAuthorized && data.readonly === undefined) {
        stats.readonly = false;
        stats.access = '可写';
      }
      if (!pageAuthorized && data.access) stats.access = data.access;
      const incomingState = data.session_state || data.state;
      if (incomingState) {
        stats.sessionState = incomingState === 'busy' ? 'running' : incomingState;
        if (!pageAuthorized && incomingState === 'readonly') {
          stats.readonly = true;
          stats.access = '只读';
        }
      }
      if (data.mem) stats.mem = data.mem;
      if (data.disk) stats.disk = data.disk;
      if (data.load !== undefined) stats.load = data.load;
      if (data.turns !== undefined) {
        const turns = Number(data.turns);
        if (Number.isFinite(turns)) stats.turns = turns;
      }
      if (data.datetime) {
        const parsed = Date.parse(data.datetime);
        if (Number.isFinite(parsed)) {
          stats.statusDatetimeMs = parsed;
          stats.statusDatetimeReceivedAt = Date.now();
          stats.statusDatetimeText = '';
        } else {
          stats.statusDatetimeMs = 0;
          stats.statusDatetimeText = data.datetime;
        }
      }
      if (data.cost_total !== undefined || data.total_cost_usd !== undefined) {
        const total = Number(data.cost_total ?? data.total_cost_usd);
        if (Number.isFinite(total)) {
          stats.cost = total;
        }
      }
      if (data.cost_last !== undefined) {
        const last = Number(data.cost_last);
        if (Number.isFinite(last)) stats.turnCost = last;
      }
      updateMetrics();
    }

    function renderError(ev) {
      const text = ev.text || 'Unknown error';
      const { card, content } = baseCard(ev, 'error', 'activity-card');
      content.innerHTML = `${escapeHtml(text)}<div class="subtitle">${escapeHtml(ev.data?.code || '')}</div>`;
      appendDockCard('activity', card);
      if (!replayInProgress) showErrorToast(text);
    }

    function renderUnknown(ev) {
      // T-054:同上,unknown 事件不再产生卡片。
      return;
      /* eslint-disable no-unreachable */
      const { card, content } = baseCard(ev, 'system', 'activity-card');
      content.appendChild(document.createTextNode(JSON.stringify(ev, null, 2)));
      mergeMetaIntoFirstBlock(content, content.firstChild);
      appendDockCard('activity', card);
      /* eslint-enable no-unreachable */
    }

    function renderMarkdown(src) {
      const blocks = splitFencedBlocks(src);
      let html = '';
      for (const block of blocks) {
        if (block.type === 'code') {
          html += renderCode(block.code, block.lang);
        } else {
          html += renderMarkdownText(block.text);
        }
      }
      return `<div class="md">${html}</div>`;
    }

    function splitFencedBlocks(src) {
      const lines = src.split('\n');
      const blocks = [];
      let text = [];
      let inCode = false;
      let lang = '';
      let code = [];
      for (const line of lines) {
        const fence = line.match(/^```([A-Za-z0-9_-]*)\s*$/);
        if (fence && !inCode) {
          if (text.length) blocks.push({ type: 'text', text: text.join('\n') });
          text = [];
          inCode = true;
          lang = fence[1] || '';
          code = [];
        } else if (fence && inCode) {
          blocks.push({ type: 'code', lang, code: code.join('\n') });
          inCode = false;
          lang = '';
          code = [];
        } else if (inCode) {
          code.push(line);
        } else {
          text.push(line);
        }
      }
      if (inCode) {
        text.push('```' + lang);
        text.push(...code);
      }
      if (text.length) blocks.push({ type: 'text', text: text.join('\n') });
      return blocks;
    }

    function renderMarkdownText(src) {
      const lines = src.split('\n');
      let html = '';
      for (let i = 0; i < lines.length;) {
        if (!lines[i].trim()) { i++; continue; }
        if (isTableStart(lines, i)) {
          const table = [];
          while (i < lines.length && lines[i].includes('|') && lines[i].trim()) table.push(lines[i++]);
          html += renderTable(table);
          continue;
        }
        const heading = lines[i].match(/^(#{1,3})\s+(.+)$/);
        if (heading) {
          const level = heading[1].length;
          html += `<h${level}>${renderInline(heading[2])}</h${level}>`;
          i++;
          continue;
        }
        if (/^>\s?/.test(lines[i])) {
          const quote = [];
          while (i < lines.length && /^>\s?/.test(lines[i])) quote.push(lines[i++].replace(/^>\s?/, ''));
          html += `<blockquote>${renderInline(quote.join('\n'))}</blockquote>`;
          continue;
        }
        if (/^---+$/.test(lines[i].trim())) {
          html += '<hr>';
          i++;
          continue;
        }
        if (/^(\s*)([-*+]|\d+\.)\s+/.test(lines[i])) {
          const list = [];
          const ordered = /^\s*\d+\.\s+/.test(lines[i]);
          while (i < lines.length && /^(\s*)([-*+]|\d+\.)\s+/.test(lines[i])) list.push(lines[i++]);
          html += renderList(list, ordered);
          continue;
        }
        const paraStart = i;
        const para = [];
        while (i < lines.length && lines[i].trim() && !isTableStart(lines, i) && !/^(\s*)([-*+]|\d+\.)\s+/.test(lines[i]) && !/^(#{1,3})\s+/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !/^---+$/.test(lines[i].trim())) {
          para.push(lines[i++]);
        }
        // 🔴 无进展保护 —— 长文本「卡死」的直接原因就在这里。
        // 本函数的外层 `for (let i = 0; i < lines.length;)` 没有自增,完全依赖各分支推进 i。
        // 「### 」这种**只有标记、没有标题**的行会两头落空:标题分支的 /^(#{1,3})\s+(.+)$/
        // 要求标题非空所以不匹配;段落分支的守卫里又有 !/^(#{1,3})\s+/ 把它挡在外面 ——
        // 于是一行都不吃、i 原地不动,外层 for 无限循环,html 每轮追加一个空 <p></p>,
        // 约 7600 万轮后撑爆 V8 字符串上限抛 RangeError,页面表现为「卡住几分钟后再也渲染不出来」。
        // 流式下只要某个 chunk 边界正好落在「### 」之后就会踩到(实测 7964 字契约文本的
        // 3680 字前缀恰好如此);非流式下,正文里任何一个空标题行同样会踩到。
        // 兜底:若这一轮没有任何前进,就把该行按普通段落吃掉,保证外层循环必定推进、且不丢内容。
        if (i === paraStart) para.push(lines[i++]);
        html += `<p>${renderInline(para.join('\n'))}</p>`;
      }
      return html;
    }

    function isTableStart(lines, i) {
      return i + 1 < lines.length && /^\s*\|?.+\|.+\|?\s*$/.test(lines[i]) && /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/.test(lines[i + 1]);
    }

    function splitTableRow(row) {
      const cells = [];
      let cell = '';
      let escaped = false;
      const trimmed = row.trim().replace(/^\|/, '').replace(/\|$/, '');
      for (const ch of trimmed) {
        if (escaped) { cell += ch; escaped = false; continue; }
        if (ch === '\\') { escaped = true; continue; }
        if (ch === '|') { cells.push(cell.trim()); cell = ''; continue; }
        cell += ch;
      }
      cells.push(cell.trim());
      return cells;
    }

    function renderTable(rows) {
      const head = splitTableRow(rows[0]);
      const body = rows.slice(2).map(splitTableRow);
      return `<div class="table-wrap"><table><thead><tr>${head.map(c => `<th>${renderInline(c)}</th>`).join('')}</tr></thead><tbody>${body.map(r => `<tr>${r.map(c => `<td>${renderInline(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
    }

    function renderList(lines, ordered) {
      const tag = ordered ? 'ol' : 'ul';
      const items = lines.map(line => {
        let text = line.replace(/^(\s*)([-*+]|\d+\.)\s+/, '');
        const task = text.match(/^\[( |x|X)\]\s+(.+)$/);
        if (task) {
          const checked = task[1].toLowerCase() === 'x' ? ' checked' : '';
          text = `<input type="checkbox" disabled${checked}> ${renderInline(task[2])}`;
        } else {
          text = renderInline(text);
        }
        return `<li>${text}</li>`;
      }).join('');
      return `<${tag}>${items}</${tag}>`;
    }

    function renderInline(src) {
      let out = escapeHtml(src);
      const codes = [];
      out = out.replace(/`([^`]+)`/g, (_, code) => {
        const token = `@@CODE${codes.length}@@`;
        codes.push(`<code>${code}</code>`);
        return token;
      });
      out = out.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" rel="noreferrer" target="_blank">$1</a>');
      out = out.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
      out = out.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
      out = out.replace(/\n/g, '<br>');
      codes.forEach((html, i) => { out = out.replace(`@@CODE${i}@@`, html); });
      return out;
    }

    function renderCode(code, lang) {
      const safeLang = escapeHtml(lang || 'text');
      const highlighted = highlightCode(code, lang);
      const encoded = encodeURIComponent(code);
      return `<div class="code-wrap"><div class="code-toolbar"><span>${safeLang}</span><button class="copy-code" type="button" data-code="${encoded}">Copy</button></div><pre><code>${highlighted}</code></pre></div>`;
    }

    function highlightCode(code, lang) {
      let html = escapeHtml(code);
      if ((lang || '').toLowerCase() === 'python') {
        html = html.replace(/(#.*)$/gm, '<span class="tok-com">$1</span>');
        html = html.replace(/(&#39;[^&]*?&#39;|&quot;[^&]*?&quot;)/g, '<span class="tok-str">$1</span>');
        html = html.replace(/\b(def|return|if|else|elif|for|in|and|or|not|class|import|from|while|try|except|with|as|lambda)\b/g, '<span class="tok-kw">$1</span>');
        html = html.replace(/\b(\d+(?:\.\d+)?)\b/g, '<span class="tok-num">$1</span>');
      } else if ((lang || '').toLowerCase() === 'json') {
        html = html.replace(/(&quot;[^&]*?&quot;)(\s*:)/g, '<span class="tok-kw">$1</span>$2');
        html = html.replace(/(:\s*)(&quot;[^&]*?&quot;)/g, '$1<span class="tok-str">$2</span>');
        html = html.replace(/\b(true|false|null)\b/g, '<span class="tok-kw">$1</span>');
        html = html.replace(/\b(\d+(?:\.\d+)?)\b/g, '<span class="tok-num">$1</span>');
      }
      return html;
    }

    function wireCopyButtons(root) {
      root.querySelectorAll('.copy-code').forEach(btn => {
        btn.addEventListener('click', async () => {
          const text = decodeURIComponent(btn.dataset.code || '');
          try {
            await navigator.clipboard.writeText(text);
            btn.textContent = 'Copied';
            setTimeout(() => btn.textContent = 'Copy', 900);
          } catch {
            btn.textContent = 'Copy failed';
            setTimeout(() => btn.textContent = 'Copy', 900);
          }
        });
      });
    }

    async function startApp() {
      resetConversation();
      updateLocalTime();
      setInterval(updateLocalTime, 1000);
      connectEventStream();
      await refreshStatus();
      statusTimer = setInterval(refreshStatus, 5000);
      taskBoardStart();   // C3 看板(失败自清,不阻塞主页)
    }

    function clearStreamConnectTimer() {
      clearTimeout(streamConnectTimer);
      streamConnectTimer = null;
    }
    function hideStreamAlert() {
      streamAlert.hidden = true;
    }
    function showStreamAlert() {
      if (!document.hidden) streamAlert.hidden = false;
    }
    function closeEventStream() {
      eventSourceGeneration += 1;
      clearStreamConnectTimer();
      if (eventSource) eventSource.close();
      eventSource = null;
    }
    // 重连幂等:EventSource 断线后会自动重连,hub 随后重放 ring 里的同一批事件。
    // 没有 per-event 唯一序号,客户端无法逐条判重(见上方 P0 说明),
    // 因此改用"清空 + 由重放重建"这一种机制 —— 与刷新页面等价、天然幂等,
    // 且失败模式是"重建一次(短暂重排)",不会丢正文。
    function markStreamReconnect() {
      resetConversation();
      beginTimelineReplay();
    }

    function connectEventStream() {
      closeEventStream();
      const generation = eventSourceGeneration;
      let opened = false;
      let receivedFirstEvent = false;
      beginTimelineReplay();
      setStatus('idle');
      eventSource = new EventSource(apiEp('events'));
      let everOpened = false;
      eventSource.onopen = () => {
        if (generation !== eventSourceGeneration) return;
        // 第二次及以后的 open = 断线重连:hub 会重放 ring,先清空避免与已有内容叠加
        if (everOpened) markStreamReconnect();
        everOpened = true;
        opened = true;
        clearStreamConnectTimer();
        hideStreamAlert();
        if (!stats.readonly) setStatus('idle');
      };
      eventSource.onmessage = (msg) => {
        if (generation !== eventSourceGeneration) return;
        receivedFirstEvent = true;
        clearStreamConnectTimer();
        hideStreamAlert();
        try {
          handleIncomingEvent(JSON.parse(msg.data));
        } catch (err) {
          handleIncomingEvent({ kind: 'error', text: `Bad event payload: ${err.message}`, data: { code: 'bad_sse_payload' } });
        }
      };
      eventSource.onerror = () => {
        if (generation !== eventSourceGeneration) return;
        opened = false;
        setStatus('disconnected');
        // EventSource 自带重连；仅在宽限期后仍未重新 open/收到事件时提示。
        clearStreamConnectTimer();
        streamConnectTimer = setTimeout(() => {
          if (generation === eventSourceGeneration && !opened &&
              eventSource?.readyState !== EventSource.OPEN) showStreamAlert();
        }, STREAM_CONNECT_GRACE_MS);
      };
      streamConnectTimer = setTimeout(() => {
        if (generation === eventSourceGeneration && !opened && !receivedFirstEvent &&
            eventSource?.readyState !== EventSource.OPEN) showStreamAlert();
      }, STREAM_CONNECT_GRACE_MS);
    }

    async function refreshStatus() {
      try {
        const res = await fetch(apiEp('status'), { cache: 'no-store' });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        applyStatusData(await res.json());
        if (stats.authMode === 'view_page_v2') await ensurePageIdentity();
      } catch {
        setStatus('disconnected');
      }
    }

    function pageStorageKey() {
      return `dw-view-page:${stats.sessionName}`;
    }
    function savePageIdentity(identity) {
      pageIdentity = identity;
      sessionStorage.setItem(pageStorageKey(), JSON.stringify(identity));
      stats.unlockCode = identity.code;
      stats.readonly = !identity.can_write;
      stats.access = stats.readonly ? '只读' : '可写';
      updateMetrics();
    }
    async function createPageIdentity() {
      const res = await fetch(apiEp('page'), { method: 'POST' });
      if (!res.ok) throw new Error(`POST /page failed: HTTP ${res.status}`);
      const created = await res.json();
      savePageIdentity({ page_id: created.page_id, page_token: created.page_token,
        code: created.code, state: created.state, can_write: created.state === 'unlocked' });
      announcePageIdentity();
    }
    function resetPageIdentityChannel() {
      clearTimeout(pageIdentityUniqueTimer);
      pageIdentityUnique = false;
      if (pageIdentityChannel) pageIdentityChannel.close();
      pageIdentityChannel = null;
    }
    async function ensurePageIdentity(forceNew = false) {
      if (pageIdentityEnsurePromise) {
        await pageIdentityEnsurePromise;
        if (!forceNew) return;
      }
      const pending = ensurePageIdentityOnce(forceNew);
      pageIdentityEnsurePromise = pending;
      try {
        await pending;
      } finally {
        if (pageIdentityEnsurePromise === pending) pageIdentityEnsurePromise = null;
      }
    }
    async function ensurePageIdentityOnce(forceNew = false) {
      if (!pageIdentity && !forceNew) {
        try { pageIdentity = JSON.parse(sessionStorage.getItem(pageStorageKey()) || 'null'); } catch { pageIdentity = null; }
      }
      if (!pageIdentity || forceNew) {
        resetPageIdentityChannel();
        await createPageIdentity();
        setupPageIdentityChannel();
        return;
      }
      const res = await fetch(`${apiEp('page')}/resume`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ page_id: pageIdentity.page_id, page_token: pageIdentity.page_token }),
      });
      if (!res.ok) {
        sessionStorage.removeItem(pageStorageKey());
        pageIdentity = null;
        resetPageIdentityChannel();
        await createPageIdentity();
      } else {
        const resumed = await res.json();
        if (!['locked', 'unlocked'].includes(resumed.state)) {
          sessionStorage.removeItem(pageStorageKey());
          pageIdentity = null;
          resetPageIdentityChannel();
          await createPageIdentity();
        } else {
          savePageIdentity({ ...pageIdentity, ...resumed });
        }
      }
      setupPageIdentityChannel();
    }
    function announcePageIdentity() {
      if (pageIdentityChannel && pageIdentity?.page_id) {
        pageIdentityChannel.postMessage({ type: 'claim', page_id: pageIdentity.page_id, nonce: pageInstanceNonce });
      }
    }
    function settlePageIdentityUniqueness() {
      pageIdentityUnique = false;
      clearTimeout(pageIdentityUniqueTimer);
      pageIdentityUniqueTimer = setTimeout(() => { pageIdentityUnique = true; }, 300);
    }
    async function awaitPageIdentityUniqueness() {
      const deadline = Date.now() + 1500;
      while (!pageIdentityUnique && Date.now() < deadline) {
        await new Promise(resolve => setTimeout(resolve, 20));
      }
      if (!pageIdentityUnique) throw new Error('页面身份确认超时，请重试');
    }
    function setupPageIdentityChannel() {
      if (pageIdentityChannel || !pageIdentity?.page_id) return;
      if (!('BroadcastChannel' in window)) {
        // Cannot prove a cloned sessionStorage identity is single-tab: fail safe.
        if (!pageIdentityFallbackApplied) {
          pageIdentityFallbackApplied = true;
          ensurePageIdentity(true).catch(() => setStatus('disconnected'));
        } else {
          pageIdentityUnique = true;
        }
        return;
      }
      pageIdentityChannel = new BroadcastChannel(`dw-view-page:${stats.sessionName}`);
      pageIdentityChannel.onmessage = event => {
        const claim = event.data || {};
        if (claim.type !== 'claim' || claim.page_id !== pageIdentity?.page_id || claim.nonce === pageInstanceNonce) return;
        settlePageIdentityUniqueness();
        // Deterministic tie-break: the lexicographically smaller instance nonce yields.
        if (pageInstanceNonce < String(claim.nonce)) {
          pageIdentityChannel.close();
          pageIdentityChannel = null;
          pageIdentityUnique = false;
          ensurePageIdentity(true).catch(() => setStatus('disconnected'));
        } else {
          announcePageIdentity();
        }
      };
      settlePageIdentityUniqueness();
      setTimeout(announcePageIdentity, 50);
      setTimeout(announcePageIdentity, 250);
    }

    async function submitInput(text) {
      if (stats.authMode === 'view_page_v2') {
        await awaitPageIdentityUniqueness();
        if (stats.readonly) throw new Error('当前页面尚未解锁');
      }
      const res = await fetch(apiEp('input'), {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(stats.authMode === 'view_page_v2' ? {
          text, page_id: pageIdentity?.page_id, page_token: pageIdentity?.page_token,
          request_id: newRequestId(),
        } : { text }),
      });
      if (!res.ok) throw new Error(`POST /input failed: HTTP ${res.status}`);
      const body = await res.json().catch(() => ({}));
      if (!body.ok) throw new Error('input returned ok=false');
    }

    async function interruptTurn() {
      // body 契约(devof5 冻结):V2={delivery_id,turn_id,page_id,page_token,request_id}——打运行中 turn、无 message_id;
      // page 凭证与 /input、/control cancel 同一对;request_id=中断意图幂等键(c2TurnCtx.active 上 stash,重试复用)。
      // legacy 保持无 body(老 viewer 路,逐字节不变)。响应语义 §4:VS 恒 200 看 body.ok;ok:true=帧已下发≠turn 已停(停走正常流事件);
      // 非 200(400/403/502)=未受理,沿用 throw→error 卡诚实呈现。
      let intBody = null;
      if (stats.authMode === 'view_page_v2') {
        if (!pageIdentity?.page_id || !pageIdentity?.page_token) throw new Error('中断未发出:无 V2 page 凭证');
        const act = c2TurnCtx.active;
        if (!act) throw new Error('中断未发出:无运行中 turn');
        if (!act.rootPinned || !act.deliveryId) throw new Error('中断未发出:运行中 turn 的注入入口(root)未确认');  // 本地拦:一个 request_id↔一份不可变 body,root 确认后才 POST
        if (!act.requestId) act.requestId = newRequestId();
        intBody = { delivery_id: act.deliveryId, turn_id: act.turnId, page_id: pageIdentity.page_id, page_token: pageIdentity.page_token, request_id: act.requestId };
      }
      const res = await fetch(apiEp('interrupt'), intBody
        ? { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(intBody) }
        : { method: 'POST' });
      if (!res.ok) throw new Error(`POST /interrupt failed: HTTP ${res.status}`);
      const body = await res.json().catch(() => ({}));
      if (!body.ok) throw new Error('interrupt returned ok=false');
    }

    themeBtn.addEventListener('click', () => {
      const next = document.body.dataset.theme === 'dark' ? 'light' : 'dark';
      document.body.dataset.theme = next;
    });
    reconnectBtn.addEventListener('click', () => {
      connectEventStream();
      refreshStatus();
    });
    streamRetryBtn.addEventListener('click', () => {
      hideStreamAlert();
      connectEventStream();
    });
    async function doSend() {
      if (stats.readonly) {
        copyUnlockInstruction();
        return;
      }
      // 保留开头和内部换行，只清掉消息结尾的多余空白。
      const text = humanInput.value.replace(/\s+$/u, '');
      if (!text) return;
      try {
        await submitInput(text);
        humanInput.value = '';
        resizeHumanInput();
      } catch (err) {
        handleIncomingEvent({ kind: 'error', text: err.message, data: { code: 'input_failed' } });
      }
    }
    document.getElementById('sendBtn').addEventListener('click', doSend);
    function resizeHumanInput() {
      humanInput.style.height = 'auto';
      humanInput.style.height = `${Math.min(humanInput.scrollHeight, 140)}px`;
    }
    function insertInputNewline() {
      const start = humanInput.selectionStart;
      const end = humanInput.selectionEnd;
      humanInput.setRangeText('\n', start, end, 'end');
      humanInput.dispatchEvent(new Event('input', { bubbles: true }));
    }
    humanInput.addEventListener('input', resizeHumanInput);
    // Enter 发送；Ctrl/Cmd/Shift+Enter 在光标或选区处插入换行。
    // isComposing 守卫：中文输入法选字回车只确认候选，不误发送。
    humanInput.addEventListener('keydown', (e) => {
      if (e.key !== 'Enter' || e.isComposing) return;
      e.preventDefault();
      if (e.ctrlKey || e.metaKey || e.shiftKey) insertInputNewline();
      else doSend();
    });
    resizeHumanInput();
    document.getElementById('interruptBtn').addEventListener('click', () => {
      c2RequestInterrupt();  // C2:已请求→(流上 control 事件)已发出;无传输时内部回退 legacy /interrupt,确认语义不变
    });
    async function copyUnlockInstruction() {
      const command = `#unlock ${stats.unlockCode}`;
      try {
        await navigator.clipboard.writeText(command);
        copyUnlockBtn.textContent = '已复制 #unlock';
      } catch {
        copyUnlockBtn.textContent = command;
      }
      setTimeout(() => {
        if (stats.readonly) copyUnlockBtn.textContent = '复制解锁指令';
      }, 1100);
    }
    copyUnlockBtn.addEventListener('click', copyUnlockInstruction);

    addEventListener('pagehide', () => {
      if (stats.authMode !== 'view_page_v2' || !pageIdentity) return;
      navigator.sendBeacon(`${apiEp('page')}/disconnect`, new Blob([JSON.stringify({
        page_id: pageIdentity.page_id, page_token: pageIdentity.page_token,
      })], { type: 'application/json' }));
    });
    addEventListener('pageshow', event => {
      if (!event.persisted || stats.authMode !== 'view_page_v2') return;
      resetPageIdentityChannel();
      ensurePageIdentity().catch(() => setStatus('disconnected'));
    });

    startApp();
  </script>
</body>
</html>

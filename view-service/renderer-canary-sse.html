      return `<span class="event-meta">${provenanceIconHtml(ev._norm || {})}${tl ? `<span class="event-type">${escapeHtml(tl)}</span>` : ''}${sl ? `<span class="event-sent">${escapeHtml(sl)}</span>` : ''}${eventTimeHtml(ev)}${diag.length ? `<details class="event-diag"><summary title="诊断" aria-label="诊断"><span class="diag-icon" aria-hidden="true">i</span></summary><span class="event-diag-list">${diag.map(([k, v]) => `<code>${escapeHtml(k)} ${escapeHtml(v)}</code>`).join('')}</span></details>` : ''}</span>`;
    }

    // ── E(已按 P0 令重做):重放幂等**不再靠 cursor 去重** ────────
    // 🔴 2026-08-29 P0:我原先假设 cursor 是"每事件唯一",据此对 assistant_text 做 seen 去重。
    // 该假设是错的 —— Codex 的流式 delta **整个 item 共用同一个 cursor**
    // (如 375 片全是 `turn:<turnId>:item:0003`,只有 data.params.delta 不同),
    // 于是第一片进 seen 之后其余 374 片被当成重放丢弃,页面只剩首片 + 一个假的「✓ 回合完成」。
    // 这正是我给自己定过的红线的反面:**去重的代价只能是"多渲一次",绝不能是"少一段内容"**,
    // 而我把它踩了 —— 因为我只验证了"重复事件不再累加",没有验证"不同内容会不会被误判成重复"。
    //
    // 新口径(业主令):**在服务端给出 per-delta 唯一序号(event_seq / SSE id)之前,
    // 任何按 cursor 的去重都不得作用于流式内容。** 这里索性把 cursor 去重整体拆掉,
    // 只保留一种幂等机制(见 markStreamReconnect):重连时先清空再由 ring 重放重建。
    // 一种机制比两种更难出错,且它的失败模式是"重建一次"而不是"丢正文"。
    // 现网每次 SSE 重连(网络抖动 / VS 重启 / 休眠唤醒 / 后台标签页被断流)之后,
    // hub 都会重放 ring 里的同一批事件;而追加路径此前**没有任何去重**——
    // 同一回合的正文每重放一次就再追加一遍(实测 60→120→180→240 字线性增长),
    // group.events 同步无界增长,使每次 rebuildTurn 的 filter/map/join 与 markdown 都越来越贵,
    // 最终表现为「同一个答案吐出两份 → 页面越来越卡 → 卡死」,极端情况下正文长度会撞上
    // V8 的字符串上限抛 RangeError(Invalid string length),此后该回合再也渲染不出来。
    // 节流只降渲染**频次**,治不了内容**无界增长**,故必须在追加入口做幂等。
    //
    // R-V2-0105 件一：回合组上限。到软上限时把【按 cursor 排序后较旧一半】里连续的 assistant_text 合并为一条
    // （文本按序拼接、cursor 取首条）——rebuildTurn 的正文就是排序后 assistant_text 文本的拼接，合并不改正文；
    // 只合并较旧一半，免得后到事件的 cursor 落进已合并区间。合并后仍超硬上限才停止追加并提示（第八、十六节）。
    const TURN_EVENTS_SOFT_CAP = (typeof window !== 'undefined' && window.TURN_EVENTS_SOFT_CAP) || 20000;
    const TURN_EVENTS_HARD_CAP = (typeof window !== 'undefined' && window.TURN_EVENTS_HARD_CAP) || 100000;
    function compactTurnGroup(group) {
      if (!group.sorted) group.events.sort(compareCursor);
      group.sorted = true;
      const half = Math.floor(group.events.length / 2);
      const merged = [];
      for (let i = 0; i < half; i++) {
        const ev = group.events[i];
        const prev = merged[merged.length - 1];
        // 同 delivery 才合并（复核要求：不同投递的文本各留归属，delivery_id 另有用途如 ext- 判定）
        // turn_id 为空的不参与合并（这类事件本就各自成卡；组长 R-V2-0105-MERGE-EMPTY-TURN）
        if (prev && prev.kind === 'assistant_text' && ev.kind === 'assistant_text'
            && prev.turn_id && ev.turn_id
            && (prev.delivery_id || '') === (ev.delivery_id || '')) {
          merged[merged.length - 1] = { ...prev, text: (prev.text || '') + (ev.text || '') };
        } else {
          merged.push(ev);
        }
      }
      group.events = merged.concat(group.events.slice(half));
      if (group.events.length > TURN_EVENTS_HARD_CAP && !group.overCap) {
        group.overCap = true;
        const note = document.createElement('div');
        note.className = 'turn-overcap-note';
        note.textContent = '本回合事件过多,后续未显示(刷新页面重建)';
        group.node._overCapNote = note;   // rebuildTurn 用 innerHTML 重写，故与附件区同法接回
        group.node.appendChild(note);
      }
    }

    function renderTurnEvent(turnKey, ev) {
      let group = turnGroups.get(turnKey);
      if (!group) {
        const node = document.createElement('article');
        node.className = 'turn-group';
        node.dataset.turnKey = turnKey;
        node.setAttribute('aria-label', `Turn ${turnKey}`);
        timeline.appendChild(node);
        group = { node, events: [], kind: 'turn', dirty: false, sorted: true, lastRender: 0, detached: false };
        turnGroups.set(turnKey, group);
      }
      if (group.overCap) return;   // R-V2-0105 件一：已到硬上限并已提示
      const prevEv = group.events[group.events.length - 1];
      group.events.push(ev);   // 不做 cursor 去重:同一 item 的多片 delta 共用 cursor,去重会吞正文
      // R-V2-0105 件一压力格：按 cursor 顺序到达（常态）不置乱序，重渲与合并就不必每次全量重排；
      // 全量重排在 2 万条时每次约百毫秒，每片都触发一次重渲时页面整个卡住（含同页 Agent 列表轮询）。
      // 平局（同 cursor 多片）保持到达序，与稳定排序结果相同。
      if (prevEv && compareCursor(prevEv, ev) > 0) group.sorted = false;
      if (group.events.length > TURN_EVENTS_SOFT_CAP) compactTurnGroup(group);
      // turn_completed 强制终渲:终态文案与 renderState 的状态栏/成本副作用不可被节流推迟
      const completed = ev.kind === 'state_change' && ev.data && ev.data.change === 'turn_completed';
      scheduleRender(group, completed);
    }

    // ── A:渲染节流 ─────────────────────────────────────────────
    // 同一 turn / 同一助手消息的重渲合并进 RENDER_THROTTLE_MS 窗口。
    // 前沿即时渲染:窗口空闲时第一条事件同步出画,保住「消息一到就看得见」的手感,
    //   也让「一条事件 → 立刻可断言 DOM」的既有同步语义对孤立事件保持不变。
    // 窗口内后续 chunk 只置脏,由尾帧一次性重渲;turn_completed 与回放收尾强制终渲。
    function cancelRenderFlush() {
      if (renderFlushTimer !== null) { clearTimeout(renderFlushTimer); renderFlushTimer = null; }
      if (renderFlushFrame !== null) { cancelAnimationFrame(renderFlushFrame); renderFlushFrame = null; }
    }

    function renderPendingEntry(entry) {
      entry.dirty = false;
      entry.lastRender = Date.now();
      if (entry.kind === 'assistant') renderAssistantBody(entry);
      else rebuildTurn(entry);
    }

    function flushPendingRenders() {
      cancelRenderFlush();
      if (!pendingRenders.size) return;
      // 跟随态必须在本次批量重渲**之前**取样:重渲会让回合卡增高,
      // 浏览器的滚动锚定(overflow-anchor)随即挪动 scrollTop 并派发一次 scroll 事件,
      // 而既有 scroll 处理器把「不在底部的 scroll」判为用户上翻 → 永久交还跟随权,页面停在半空。
      // 取样后在同一批里补到底,scroll 事件落地时已在底部,判据自然不成立(不改既有启发式)。
      const wasFollowing = replayInProgress || timelineAtBottom;
      const due = Array.from(pendingRenders);
      pendingRenders.clear();
      for (const entry of due) {
        if (entry.detached) continue;   // 已被上限逐出:不重渲,也不让它复活
        // F:单个条目渲染抛错不得连累同批其余条目 —— 它们已被移出 pendingRenders,
        // 一旦异常冒泡就再也没有人来渲染它们,表现为「页面从此不再更新 / 刷新也刷不出来」。
        // 这里逐条兜住并把错误显式记到控制台(fail-loud,不静默),其余条目照常渲染。
        try {
          renderPendingEntry(entry);
        } catch (err) {
          if (managedApplyActive) throw err;
          console.error('[render] 条目重渲失败,已跳过该条,不影响同批其余条目:', err);
        }
      }
      if (wasFollowing) scrollTimelineToBottom();
    }

    function scheduleRenderFlush() {
      if (renderFlushTimer !== null || renderFlushFrame !== null) return;
      renderFlushTimer = setTimeout(() => {
        renderFlushTimer = null;
        // 再对齐一次 rAF,避免与浏览器排版抢帧;定时器已先兜住节流窗口,
        // 故页面不可见(rAF 不触发)时也不会把内容永久压在队列里 —— 下次可见的首帧或强制终渲会补上。
        if (typeof requestAnimationFrame !== 'function') return flushPendingRenders();
        renderFlushFrame = requestAnimationFrame(() => { renderFlushFrame = null; flushPendingRenders(); });
      }, RENDER_THROTTLE_MS);
    }

    function scheduleRender(entry, force = false) {
      if (entry.detached) { pendingRenders.delete(entry); return; }
      entry.dirty = true;
      if (force || (Date.now() - (entry.lastRender || 0)) >= RENDER_THROTTLE_MS) {
        pendingRenders.delete(entry);
        renderPendingEntry(entry);
        return;
      }
      pendingRenders.add(entry);
      scheduleRenderFlush();
    }

    // 只数长度,不拼串(整段 join 会在每次重渲时分配一份完整正文,长文本下这本身就是开销)
    function eventsTextLength(evs) {
      let n = 0;
      for (const ev of evs) n += (ev.text || '').length;
      return n;
    }
    // 取前 max 字的摘要;在行边界截断,避免把一行 markdown 从中间劈开
    function eventsTextPrefix(evs, max) {
      let out = '';
      for (const ev of evs) {
        out += ev.text || '';
        if (out.length >= max) break;
      }
      if (out.length <= max) return out;
      const cut = out.slice(0, max);
      const nl = cut.lastIndexOf('\n');
      return nl > max * 0.5 ? cut.slice(0, nl) : cut;
    }
    function eventsTextFull(evs) {
      return evs.map(ev => ev.text || '').join('');
    }

    function rebuildTurn(group) {
      // 排序也从「每 chunk 一次」挪到重渲时一次:旧实现 O(N) 次 sort ⇒ O(N² log N)
      if (!group.sorted) { group.events.sort(compareCursor); group.sorted = true; }
      const users = group.events.filter(ev => ev.kind === 'user_input');
      const tools = group.events.filter(ev => ev.kind === 'tool_call');
      const assistants = group.events.filter(ev => ev.kind === 'assistant_text');
      const errors = group.events.filter(ev => ev.kind === 'error');
      const completed = group.events.filter(ev => ev.kind === 'state_change' && ev.data?.change === 'turn_completed').at(-1);
      group.node.classList.toggle('external', assistants.some(ev => ev.delivery_id?.startsWith('ext-')));
      let html = '';
      if (users.length) {
        const text = users.map(ev => ev.text || '').join('');
        html += `<section class="event-body turn-section turn-user">${eventMetaHtml(users[0])}<span class="event-content">${escapeHtml(text)}</span></section>`;
      }
      // Tools are useful as live progress while a turn is running. Once the
      // turn completes, remove them from the reading view and keep only the
      // user request and final answer.
      if (tools.length && !completed) {
        html += `<details class="turn-tools"><summary><span>🔧 ${tools.length} 次工具调用</span></summary><div class="turn-tools-list">${tools.map(renderTurnTool).join('')}</div></details>`;
      }
      if (assistants.length) {
        const total = eventsTextLength(assistants);
        if (total > LONGTEXT_THRESHOLD) {
          // G:超长 ⇒ 只渲染摘要 + 文件化入口。内联 markdown 的输入被摘要长度封顶。
          const excerpt = eventsTextPrefix(assistants, LONGTEXT_EXCERPT);
          const note = completed
            ? `全文 ${total.toLocaleString()} 字,已折叠(仅显示开头 ${excerpt.length.toLocaleString()} 字)`
            : `接收中…已收 ${total.toLocaleString()} 字,已折叠(仅显示开头 ${excerpt.length.toLocaleString()} 字)`;
          html += `<section class="event-body turn-section turn-assistant longtext">${eventMetaHtml(assistants[0])}` +
            `<span class="event-content longtext-fade">${renderMarkdown(excerpt)}</span>` +
            `<div class="longtext-bar" role="group" aria-label="长正文操作">` +
            `<span class="longtext-note">📄 ${escapeHtml(note)}</span>` +
            `<button type="button" data-longtext="open">打开全文</button>` +
            `<button type="button" data-longtext="download">下载 .md</button>` +
            `<button type="button" data-longtext="copy">复制全文</button>` +
            `</div></section>`;
        } else {
          const text = eventsTextFull(assistants);
          html += `<section class="event-body turn-section turn-assistant">${eventMetaHtml(assistants[0])}<span class="event-content">${renderMarkdown(text)}</span></section>`;
        }
      }
      for (const ev of errors) {
        html += `<section class="event-body turn-section turn-error">${eventMetaHtml(ev)}<span class="event-content">${escapeHtml(ev.text || 'Unknown error')}</span></section>`;
      }
      if (completed) {
        const cost = completed.data?.turn_cost_usd ?? completed.data?.cost_usd;
        const total = completed.data?.total_cost_usd ?? completed.data?.cost_total;
        // 业主 2026-09-11:「这里只要给个完成标志即可,不用单写一行文字」。
        // ⚠️ 标志本身保留:整行删掉会让「回合结束」与「还在跑」无法区分。
        html += `<footer class="turn-completed" title="回合完成" aria-label="回合完成">✓</footer>`;
      }
      group.node.innerHTML = html;
      // 0.2.0.6 A：innerHTML 会连附件一起抹掉 ⇒ 重渲后把附件区接回去，已渲染过的不重建。
      if (group.node._fileHost) group.node.appendChild(group.node._fileHost);
      if (group.node._overCapNote) group.node.appendChild(group.node._overCapNote);
      attachFileRenders(group.node, `${users.map(ev => ev.text || '').join('')}\n${eventsTextFull(assistants)}`);
      group.node.querySelectorAll('.turn-assistant .event-content').forEach(content => {
        mergeMetaIntoMarkdown(content);
        wireCopyButtons(content);
        wireMarkdownImages(content, group.node);   // 🔴 ts-No.79:就地图片与附件卡的让位(回合重建路径)
      });
      group.node.querySelectorAll('.turn-tool-item').forEach(wireCopyButtons);
      wireLongtextBar(group);
      if (completed) renderState(completed);
    }

    // G:入口条接线。全文在点击那一刻才从 group.events 现拼 —— 既保证拿到的是最新内容,
    // 也保证流式期间完全不为"可能没人点"的全文付出任何成本。
    function wireLongtextBar(group) {
      const bar = group.node.querySelector('.longtext-bar');
      if (!bar) return;
      const fullText = () => eventsTextFull(group.events.filter(ev => ev.kind === 'assistant_text'));
      const fileName = `dingwei-${String(group.node.dataset.turnKey || 'turn').replace(/[^\w.-]/g, '_')}.md`;
      const withBlobUrl = (fn) => {
        const url = URL.createObjectURL(new Blob([fullText()], { type: 'text/markdown;charset=utf-8' }));
        try { fn(url); } finally { setTimeout(() => URL.revokeObjectURL(url), 60000); }
      };
      bar.querySelectorAll('button[data-longtext]').forEach(btn => {
        btn.addEventListener('click', async () => {
          const kind = btn.dataset.longtext;
          const label = btn.textContent;
          const flash = (t) => { btn.textContent = t; setTimeout(() => { btn.textContent = label; }, 1200); };
          if (kind === 'copy') {
            try { await navigator.clipboard.writeText(fullText()); flash('已复制'); }
            catch { flash('复制失败'); }   // 诚实回显失败,不假称成功
            return;
          }
          if (kind === 'download') {
            withBlobUrl(url => {
              const a = document.createElement('a');
              a.href = url; a.download = fileName;
              document.body.appendChild(a); a.click(); a.remove();
            });
            return;
          }
          withBlobUrl(url => {
            // 新标签页打开;被拦截时不静默,退回下载
            if (!window.open(url, '_blank', 'noopener')) flash('被拦截');
          });
        });
      });
    }

    function renderTurnTool(ev) {
      const name = ev.data?.name || 'Tool';
      const input = ev.data?.input || {};
      const preview = Object.entries(input).map(([k, v]) => `${k}: ${String(v).slice(0, 56)}`).join(' · ');
      return `<div class="turn-tool-item"><div class="turn-tool-head">${eventMetaHtml(ev)}<span class="tool-name">${escapeHtml(name)}</span><span class="tool-preview">${escapeHtml(preview)}</span></div>${renderCode(JSON.stringify(input, null, 2), 'json')}</div>`;
    }

    // control 消息按系统事件渲染:v0.6 只表达「已发起/已发出」,绝不假称「已终止/真停」(真停挂 v0.7#20)
    function renderControlNote(ev) {
      // T-054(业主 2026-09-10):control 卡片与输入框上方的待提交区完全重复
      // (待提交区已显示已入队→hub 已收→helper 已收→已注入→已写入终端,含失败原因),
      // 故不再产生任何卡片 —— 正文区与边条都不产生。
      return;
      /* eslint-disable no-unreachable */
      const { card, content } = baseCard(ev, 'system', 'activity-card');
      const kind = String(ev.control?.kind || ev.control_kind || '').toLowerCase();
      const text = {
        cancel: '已请求终止',
        interrupt: '中断已发出',
      }[kind] || '控制消息已下发';
      const detail = ev.text || ev._norm?.text || '';
      content.textContent = detail ? `${text}:${detail}` : text;
      appendDockCard('activity', card);
      /* eslint-enable no-unreachable */
    }

    function renderUser(ev) {
      const norm = ev._norm || { key: '', sourceTrusted: false, stageIdx: -1 };
      // control 消息(cancel/interrupt 等)不进输入卡/待提交区,按系统事件文案渲染
      if (norm.deliveryMode === 'control') {
        c2MaybeConfirmInterrupt(ev);  // C2:流上 control 事件=中断回执,升级 pending 请求为已确认
        return renderControlNote(ev);
      }
      // 🔴 业主 2026-09-11(两次):『不希望看到 event 卡片,就算是出错信息也不希望看到』
      // 『这个卡片要显示的状态信息,在待提交信息区和对话轮次交互卡片中都可以展示,
      //   无需多出一个 event 卡片』。
      // ⇒ 失败**不另起任何卡**(正文区与右侧看板都不起),而是**更新已有的那张对话卡**。
      // 成因见 T-074:失败事件与输入卡的 message_id 键对不上,`c1CardFor` 找不到 ⇒ 新建 ⇒ 多一张。
      // ⇒ 按 message_id 找不到时,改用**投递号**(已归一)反查已有卡再更新。
      const entry0 = norm.key ? c1CardFor(norm, true) : null;
      if (!entry0?.card && norm.stage === 'failed') {
        const viaDlv = norm.deliveryId ? c1InputCards.get(c1DeliveryCards.get(deliveryMergeKey(norm.deliveryId))) : null;
        if (viaDlv?.footer) {
          // fail-loud:不在界面另起卡,但仍留痕,便于事后诊断(业主不看,排查时要用)
          console.warn('[delivery-failed]', norm.deliveryId || '', stageFooterText(norm));
          const st = viaDlv.footer.querySelector('.stage-text');
          if (st) st.textContent = stageFooterText(norm) || '失败:投递失败';
          return;
        }
        // ⚠️ 连已有卡都找不到:仍不新建卡(业主明确不要),只留痕。
        console.warn('[delivery-failed-orphan]', norm.deliveryId || '', stageFooterText(norm));
        return;
      }
      const entry = entry0;
      if (entry && entry.card) {
        // 同 message_id 已有输入卡:原位更新,绝不产生第二张
        if (norm.text && !entry.content.textContent) entry.content.textContent = norm.text;
        c1ApplyToEntry(entry, norm);
        attachFileRenders(entry.card, ev.text || norm.text || '');   // 0.2.0.6 A：正文里的 /f/ 直链渲染
        return;
      }
      const { card, content } = baseCard(ev, 'user');
      content.textContent = ev.text || norm.text || '';
      attachFileRenders(card, ev.text || norm.text || '');   // 0.2.0.6 A：正文里的 /f/ 直链渲染
      if (norm.key) card.dataset.messageId = norm.key;
      // 徽标 + 阶段脚注:trusted 才挂来源徽标(fail-closed);copy 不显示等待 ACK 态
      const isCopy = String(norm.deliveryMode).includes('copy');
      const footer = document.createElement('div');
      footer.className = 'card-stage-footer';
      const provIc = provenanceIconHtml(norm);  // display v1:provenance 图标在场时压 legacy 文字徽标(不双标)
      const badge = provIc ? '' : sourceBadgeHtml(norm);
      const footText = isCopy ? '已同步/镜像(不追 ACK)' : stageFooterText(norm);
      footer.innerHTML = `${badge}${outboundTargetsHtml(norm)}<span class="stage-text">${escapeHtml(footText)}</span>`;
      card.appendChild(footer);
      timeline.appendChild(card);
      if (entry) {
        entry.card = card;
        entry.content = content;
        entry.footer = footer;
        entry.stageEl = footer.querySelector('.stage-text');
        entry.sentEl = card.querySelector('.event-sent');
        entry.stageIdx = norm.stageIdx;
        if (norm.deliveryId) c1DeliveryCards.set(deliveryMergeKey(norm.deliveryId), norm.key);
        // 应用建卡前缓冲的乱序更新
        const pending = c1PendingUpdates.get(norm.key) || [];
        c1PendingUpdates.delete(norm.key);
        for (const p of pending) c1ApplyToEntry(entry, p);
        // copy/echo 归并缓冲(display v1):先到的 route_observation/user_input 回显归并到本卡(清 timer 防回落)
        const mergeNotes = norm.deliveryId ? c1MergeBuf.get(norm.deliveryId) || [] : [];
        c1MergeBuf.delete(norm.deliveryId);
        for (const rec of mergeNotes) { clearTimeout(rec.timer); c1Footnote(entry, rec.footKey || 'echo_merge', '已回显'); }
        if (!isCopy) c1ApplyToEntry(entry, norm);
      }
    }

    // R-V2-0103-MENTION-REPLY-MIRROR:独立卡片(左色条＋「来自 X 的回复」头),与本页 Agent 的回复在样式上区分;
    // 正文走与 assistant 同一个 renderMarkdown(先转义再排版,不执行 HTML);失败／未处理只画一行状态文字。
    // 按 message_id 去重:Hub 给的号稳定(mreply-<delivery_id>-<turn 短哈希>),重连回放同一条只画一张。
    const mentionReplySeen = new Set();
    function renderMentionReply(ev) {
      const id = String(ev.message_id || '');
      if (id && mentionReplySeen.has(id)) return false;
      if (id) mentionReplySeen.add(id);
      const data = ev.data || {};
      const label = String(data.from_label || data.from_full_name || '');
      const failed = data.status === 'failed';
      const { card, body, content } = baseCard(ev, `mention-reply${failed ? ' mention-reply-failed' : ''}`);
      if (id) card.dataset.messageId = id;
      card.dataset.status = failed ? 'failed' : 'ok';
      const head = document.createElement('div');
      head.className = 'mention-reply-head';
      head.textContent = `来自 ${label} 的回复`;
      body.insertBefore(head, content);
      const text = String(ev.text || '');
      if (failed) content.textContent = text;
      else content.innerHTML = renderMarkdown(text);
      timeline.appendChild(card);
      return true;
    }

    function renderAssistant(ev) {
      const k = keyFor(ev);
      let body = messageNodes.get(k);
      if (!body) {
        const { card, content } = baseCard(ev, `assistant ${ev.delivery_id?.startsWith('ext-') ? 'external' : ''}`);
        card.dataset.messageKey = k;   // D:逐出时按此反查,清 messageNodes/messageBuffers/assistantEntries
        timeline.appendChild(card);
        body = content;
        messageNodes.set(k, body);
        messageBuffers.set(k, '');
      }
      let entry = assistantEntries.get(k);
      if (!entry) {
        entry = { kind: 'assistant', key: k, dirty: false, lastRender: 0, detached: false };
        assistantEntries.set(k, entry);
      }
      messageBuffers.set(k, (messageBuffers.get(k) || '') + (ev.text || ''));   // 同上:不去重,不吞正文
      scheduleRender(entry);   // A:同一条助手消息的多个 chunk 合并为一次 markdown 重渲
    }

    function renderAssistantBody(entry) {
      const body = messageNodes.get(entry.key);
      if (!body) return;
      body.innerHTML = renderMarkdown(messageBuffers.get(entry.key) || '');
      mergeMetaIntoMarkdown(body);
      wireCopyButtons(body);
      // 0.2.0.6 A：挂在卡片上而不是正文里 —— 正文每个 chunk 都重写 innerHTML。
      attachFileRenders(body.closest('.message-card'), messageBuffers.get(entry.key) || '');
      // 🔴 ts-No.79:流式路径也要接线,否则每个 chunk 重渲后"让位"就失效 ⇒ 一图两处。
      wireMarkdownImages(body, body.closest('.message-card'));
    }

    function mergeMetaIntoMarkdown(content) {
      const eventBody = content.closest('.event-body');
      const meta = eventBody?.querySelector(':scope > .event-meta');
      const md = content.querySelector(':scope > .md');
      const firstBlock = md?.firstElementChild;
      if (!meta || !firstBlock || firstBlock.contains(meta)) return;
      let target = firstBlock;
      if (firstBlock.matches('ol, ul')) {
        target = firstBlock.querySelector('li') || firstBlock;
      } else if (firstBlock.classList.contains('code-wrap')) {
        target = firstBlock.querySelector('.code-toolbar') || firstBlock;
      } else if (firstBlock.classList.contains('table-wrap')) {
        target = firstBlock.querySelector('th, td') || firstBlock;
      }
      target.insertBefore(meta, target.firstChild);
    }

    function mergeMetaIntoFirstBlock(content, target) {
      const eventBody = content.closest('.event-body');
      const meta = eventBody?.querySelector(':scope > .event-meta');
      if (!meta || !target || target.nodeType !== Node.ELEMENT_NODE || target.contains(meta)) return;
      target.insertBefore(meta, target.firstChild);
    }

    function renderState(ev) {
      if (ev.data?.change === 'session_init') {
        applyStatusData(ev.data);
        return;
      }
      if (ev.data?.change === 'turn_completed') {
        stats.turns = Math.max(stats.turns, Number(ev.data.num_turns || stats.turns || 0));
        applyCostData(ev.data);
        setStatus('idle');
        return;
      }
      // Unknown lifecycle state changes are intentionally omitted from the
      // conversation timeline; rendering their raw payload creates noisy cards.
      return;
    }

    function applyCostData(data) {
      if (costAccountingMode !== 'active') return;
      const total = Number(data.total_cost_usd ?? data.cost_total ?? data.totalCostUsd ?? data.cost_usd ?? NaN);
      if (Number.isFinite(total)) {
        stats.turnCost = Math.max(0, total - stats.lastTurnCostTotal);
        stats.cost = total;
        stats.lastTurnCostTotal = total;
        return;
      }
      const turn = Number(data.turn_cost_usd ?? 0);
      stats.turnCost = Number.isFinite(turn) ? turn : 0;
      stats.cost += stats.turnCost;
      stats.lastTurnCostTotal = stats.cost;
    }

    // Live data source contract:
    // helper/sidecar will emit state_change every ~5s with data like
    // {mem:{used,total,unit}, disk:{used,total,unit}, load, session_state,
    //  readonly, unlock_code, owner}.
    // The view updates this bottom status bar and does not append those
    // heartbeat state events to the conversation timeline.
    function applyStatusData(data) {
      if (data.session_id || data.session) stats.sessionName = data.session_id || data.session;
      if (data.owner) stats.owner = data.owner;
      if (data.auth_mode) stats.authMode = data.auth_mode;
      if (data.model || data.driver) stats.model = data.model || data.driver;
      if (data.unlock_code || data.unlockCode) stats.unlockCode = data.unlock_code || data.unlockCode;
      const pageAuthorized = stats.authMode === 'view_page_v2';
      if (!pageAuthorized && data.readonly !== undefined) {
        stats.readonly = Boolean(data.readonly);
        stats.access = stats.readonly ? '只读' : '可写';
      } else if (!pageAuthorized && data.readonly === undefined) {
        stats.readonly = false;
        stats.access = '可写';
      }
      if (!pageAuthorized && data.access) stats.access = data.access;
      const incomingState = data.session_state || data.state;
      if (incomingState) {
        stats.sessionState = incomingState === 'busy' ? 'running' : incomingState;
        if (!pageAuthorized && incomingState === 'readonly') {
          stats.readonly = true;
          stats.access = '只读';
        }
      }
      if (data.mem) stats.mem = data.mem;
      if (data.disk) stats.disk = data.disk;
      if (data.load !== undefined) stats.load = data.load;
      if (data.turns !== undefined) {
        const turns = Number(data.turns);
        if (Number.isFinite(turns)) stats.turns = turns;
      }
      if (data.datetime) {
        const parsed = Date.parse(data.datetime);
        if (Number.isFinite(parsed)) {
          stats.statusDatetimeMs = parsed;
          stats.statusDatetimeReceivedAt = Date.now();
          stats.statusDatetimeText = '';
        } else {
          stats.statusDatetimeMs = 0;
          stats.statusDatetimeText = data.datetime;
        }
      }
      if (costAccountingMode === 'active' && (data.cost_total !== undefined || data.total_cost_usd !== undefined)) {
        const total = Number(data.cost_total ?? data.total_cost_usd);
        if (Number.isFinite(total)) {
          stats.cost = total;
        }
      }
      if (costAccountingMode === 'active' && data.cost_last !== undefined) {
        const last = Number(data.cost_last);
        if (Number.isFinite(last)) stats.turnCost = last;
      }
      updateMetrics();
    }

    function renderError(ev) {
      const text = ev.text || 'Unknown error';
      const { card, content } = baseCard(ev, 'error', 'activity-card');
      content.innerHTML = `${escapeHtml(text)}<div class="subtitle">${escapeHtml(ev.data?.code || '')}</div>`;
      appendDockCard('activity', card);
      if (!replayInProgress) showErrorToast(text);
    }

    function renderUnknown(ev) {
      // T-054:同上,unknown 事件不再产生卡片。
      return;
      /* eslint-disable no-unreachable */
      const { card, content } = baseCard(ev, 'system', 'activity-card');
      content.appendChild(document.createTextNode(JSON.stringify(ev, null, 2)));
      mergeMetaIntoFirstBlock(content, content.firstChild);
      appendDockCard('activity', card);
      /* eslint-enable no-unreachable */
    }

    // 🔴 DW-MD-CORE:render BEGIN —— 【生成副本】源在 view-service/md-render-core.js 的同名段;改源后跑 md-render-core-sync.py(漂移由 test_md_render_core.py 挡)
    function renderMarkdown(src) {
      const blocks = splitFencedBlocks(src);
      let html = '';
      for (const block of blocks) {
        if (block.type === 'code') {
          html += renderCode(block.code, block.lang);
        } else {
          html += renderMarkdownText(block.text);
        }
      }
      return `<div class="md">${html}</div>`;
    }

    function splitFencedBlocks(src) {
      const lines = src.split('\n');
      const blocks = [];
      let text = [];
      let inCode = false;
      let lang = '';
      let code = [];
      for (const line of lines) {
        const fence = line.match(/^```([A-Za-z0-9_-]*)\s*$/);
        if (fence && !inCode) {
          if (text.length) blocks.push({ type: 'text', text: text.join('\n') });
          text = [];
          inCode = true;
          lang = fence[1] || '';
          code = [];
        } else if (fence && inCode) {
          blocks.push({ type: 'code', lang, code: code.join('\n') });
          inCode = false;
          lang = '';
          code = [];
        } else if (inCode) {
          code.push(line);
        } else {
          text.push(line);
        }
      }
      if (inCode) {
        text.push('```' + lang);
        text.push(...code);
      }
      if (text.length) blocks.push({ type: 'text', text: text.join('\n') });
      return blocks;
    }

    function renderMarkdownText(src) {
      const lines = src.split('\n');
      let html = '';
      for (let i = 0; i < lines.length;) {
        if (!lines[i].trim()) { i++; continue; }
        if (isTableStart(lines, i)) {
          const table = [];
          while (i < lines.length && lines[i].includes('|') && lines[i].trim()) table.push(lines[i++]);
          html += renderTable(table);
          continue;
        }
        const heading = lines[i].match(/^(#{1,3})\s+(.+)$/);
        if (heading) {
          const level = heading[1].length;
          html += `<h${level}>${renderInline(heading[2])}</h${level}>`;
          i++;
          continue;
        }
        if (/^>\s?/.test(lines[i])) {
          const quote = [];
          while (i < lines.length && /^>\s?/.test(lines[i])) quote.push(lines[i++].replace(/^>\s?/, ''));
          html += `<blockquote>${renderInline(quote.join('\n'))}</blockquote>`;
          continue;
        }
        if (/^---+$/.test(lines[i].trim())) {
          html += '<hr>';
          i++;
          continue;
        }
        if (/^(\s*)([-*+]|\d+\.)\s+/.test(lines[i])) {
          const list = [];
          const ordered = /^\s*\d+\.\s+/.test(lines[i]);
          while (i < lines.length && /^(\s*)([-*+]|\d+\.)\s+/.test(lines[i])) list.push(lines[i++]);
          html += renderList(list, ordered);
          continue;
        }
        const paraStart = i;
        const para = [];
        while (i < lines.length && lines[i].trim() && !isTableStart(lines, i) && !/^(\s*)([-*+]|\d+\.)\s+/.test(lines[i]) && !/^(#{1,3})\s+/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !/^---+$/.test(lines[i].trim())) {
          para.push(lines[i++]);
        }
        // 🔴 无进展保护 —— 长文本「卡死」的直接原因就在这里。
        // 本函数的外层 `for (let i = 0; i < lines.length;)` 没有自增,完全依赖各分支推进 i。
        // 「### 」这种**只有标记、没有标题**的行会两头落空:标题分支的 /^(#{1,3})\s+(.+)$/
        // 要求标题非空所以不匹配;段落分支的守卫里又有 !/^(#{1,3})\s+/ 把它挡在外面 ——
        // 于是一行都不吃、i 原地不动,外层 for 无限循环,html 每轮追加一个空 <p></p>,
        // 约 7600 万轮后撑爆 V8 字符串上限抛 RangeError,页面表现为「卡住几分钟后再也渲染不出来」。
        // 流式下只要某个 chunk 边界正好落在「### 」之后就会踩到(实测 7964 字契约文本的
        // 3680 字前缀恰好如此);非流式下,正文里任何一个空标题行同样会踩到。
        // 兜底:若这一轮没有任何前进,就把该行按普通段落吃掉,保证外层循环必定推进、且不丢内容。
        if (i === paraStart) para.push(lines[i++]);
        html += `<p>${renderInline(para.join('\n'))}</p>`;
      }
      return html;
    }

    function isTableStart(lines, i) {
      return i + 1 < lines.length && /^\s*\|?.+\|.+\|?\s*$/.test(lines[i]) && /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/.test(lines[i + 1]);
    }

    function splitTableRow(row) {
      const cells = [];
      let cell = '';
      let escaped = false;
      const trimmed = row.trim().replace(/^\|/, '').replace(/\|$/, '');
      for (const ch of trimmed) {
        if (escaped) { cell += ch; escaped = false; continue; }
        if (ch === '\\') { escaped = true; continue; }
        if (ch === '|') { cells.push(cell.trim()); cell = ''; continue; }
        cell += ch;
      }
      cells.push(cell.trim());
      return cells;
    }

    function renderTable(rows) {
      const head = splitTableRow(rows[0]);
      const body = rows.slice(2).map(splitTableRow);
      return `<div class="table-wrap"><table><thead><tr>${head.map(c => `<th>${renderInline(c)}</th>`).join('')}</tr></thead><tbody>${body.map(r => `<tr>${r.map(c => `<td>${renderInline(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
    }

    function renderList(lines, ordered) {
      const tag = ordered ? 'ol' : 'ul';
      const items = lines.map(line => {
        let text = line.replace(/^(\s*)([-*+]|\d+\.)\s+/, '');
        const task = text.match(/^\[( |x|X)\]\s+(.+)$/);
        if (task) {
          const checked = task[1].toLowerCase() === 'x' ? ' checked' : '';
          text = `<input type="checkbox" disabled${checked}> ${renderInline(task[2])}`;
        } else {
          text = renderInline(text);
        }
        return `<li>${text}</li>`;
      }).join('');
      return `<${tag}>${items}</${tag}>`;
    }

    // 🔴 ts-No.79(业主:「只要是图片的就显示预览的图」「感叹号可以不用了」):
    //    "这条 URL 该不该就地出图"的**唯一**判据。两个前提都复用**已有**的东西,不新造清单、不新造边界:
    //      · isOwnFileUrl —— 附件那条路已在用的信任边界:只认本站 /f/ 直链,
    //        🔴「不对任意外站 URL 做任何请求」(见 FILE_URL_RE 上面那段注释)⇒ 外站图片**仍是链接**。
    //        🔵 这是一条产品可见的边界:要放开得由业主裁,不在本格顺手改(G4 把现状钉住了)。
    //      · kindFromExt —— 先查 FILE_EXT_NEVER_INLINE(svg/svgz/html/htm/xhtml/xml **写死**永不内联;
    //        派工单④:不靠"名单里没写"),再查 FILE_EXT_KIND(== nginx 的 types{image/*},G0 对账)。
    function isInlineImageUrl(url) {
      return isOwnFileUrl(url) && kindFromExt(url) === 'image';
    }

    // 🔴 派工单④:一律 <img>,**绝不内联 SVG 源码** —— 本函数只可能产出 <img>,
    //    没有任何一条路会把文件字节读进来拼成元素(svg 更是上面那层写死的 deny-set 就挡住了)。
    //    alt/src 用的都是 escapeHtml **之后**的串(引号已是 &quot;)⇒ 属性突破不成立;
    //    那道承重墙由 ts-No.76 的 P12 与本件 G3/M-G3 一起钉着。
    function mdImageHtml(alt, url) {
      return `<img class="md-img" data-md-img src="${url}" alt="${alt}" loading="lazy" referrerpolicy="no-referrer">`;
    }

    function renderInline(src) {
      let out = escapeHtml(src);
      const codes = [];
      out = out.replace(/`([^`]+)`/g, (_, code) => {
        const token = `@@CODE${codes.length}@@`;
        codes.push(`<code>${code}</code>`);
        return token;
      });
      // 🔴 ts-No.79:`!?` 把感叹号一起吃掉 ⇒「! ＋ 链接」那个怪形态消失(业主:感叹号可以不用了)。
      //    指向图片的就**就地出图**,其余**仍是链接**(派工单③:非图片链接行为不变,只是少了那个 "!")。
      //    🔵 用函数式替换而不是 '$1/$2' 串:捕获值里的 `$` 不再有机会被当替换模式解释。
      out = out.replace(/(!?)\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, (_, bang, text, url) => (
        isInlineImageUrl(url)
          ? mdImageHtml(text, url)
          : `<a href="${url}" rel="noreferrer" target="_blank">${text}</a>`));
      out = out.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
      out = out.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
      out = out.replace(/\n/g, '<br>');
      codes.forEach((html, i) => { out = out.replace(`@@CODE${i}@@`, html); });
      return out;
    }

    function renderCode(code, lang) {
      const safeLang = escapeHtml(lang || 'text');
      const highlighted = highlightCode(code, lang);
      const encoded = encodeURIComponent(code);
      return `<div class="code-wrap"><div class="code-toolbar"><span>${safeLang}</span><button class="copy-code" type="button" data-code="${encoded}">Copy</button></div><pre><code>${highlighted}</code></pre></div>`;
    }

    // 🔴 2026-09-25 修:每一条正则原先都作用在【上一条已经产出的 HTML】上,
    //    于是后一条会把前一条生成的标签当成源码再包一层。实测触发点是关键字名单里的
    //    `class` 命中了 `<span class="tok-str">` 的**属性名**:
    //      print("copy-me")  ⇒  print(<span <span class="tok-kw">class</span>="tok-str">…</span>)
    //      屏上显示成         print(class="tok-str">"copy-me")
    //    ⇒ **凡含字符串字面量的 python 代码块都坏**,spec 页与 timeline 共用本核,两处都坏。
    // 🔵 做法不是把 `class` 从名单里删掉(那只挡住今天这一个词,明天加 `for`/`type` 又会犯);
    //    而是让后续规则【看不见已经包好的部分】:每包完一类就把生成的 span 收进保险箱,
    //    原地留一个不可能被任何规则命中的占位,全部替换结束后再还原。
    function highlightCode(code, lang) {
      // 占位用的两个控制字符若真出现在源码里,先剔掉,免得还原阶段被伪造的占位污染。
      let html = escapeHtml(code).replace(/[\u0001\u0002]/g, '');
      const vault = [];
      // 🔴 占位里【不能出现数字】:数字规则 \b(\d+)\b 会把占位的序号当成代码里的数字包起来,
      //    stash 再把它收走 ⇒ 占位嵌套、还原失败,屏上直接漏出控制字符。(本次实测踩到过。)
      //    故序号按 26 进制编成 A..P,所有规则(关键字/字面量全是小写)都命中不了它。
      const encodeIndex = (n) => n.toString(26).replace(/[0-9a-p]/g, (ch) => String.fromCharCode(65 + parseInt(ch, 26)));
      const decodeIndex = (s) => s.split('').reduce((acc, ch) => acc * 26 + (ch.charCodeAt(0) - 65), 0);
      const stash = (value) => value.replace(/<span class="tok-[a-z]+">[\s\S]*?<\/span>/g, (hit) => {
        vault.push(hit);
        return '\u0001' + encodeIndex(vault.length - 1) + '\u0002';
      });
      const wrap = (pattern, replacement) => { html = stash(html.replace(pattern, replacement)); };
      if ((lang || '').toLowerCase() === 'python') {
        wrap(/(#.*)$/gm, '<span class="tok-com">$1</span>');
        wrap(/(&#39;[^&]*?&#39;|&quot;[^&]*?&quot;)/g, '<span class="tok-str">$1</span>');
        wrap(/\b(def|return|if|else|elif|for|in|and|or|not|class|import|from|while|try|except|with|as|lambda)\b/g, '<span class="tok-kw">$1</span>');
        wrap(/\b(\d+(?:\.\d+)?)\b/g, '<span class="tok-num">$1</span>');
      } else if ((lang || '').toLowerCase() === 'json') {
        wrap(/(&quot;[^&]*?&quot;)(\s*:)/g, '<span class="tok-kw">$1</span>$2');
        wrap(/(:\s*)(&quot;[^&]*?&quot;)/g, '$1<span class="tok-str">$2</span>');
        wrap(/\b(true|false|null)\b/g, '<span class="tok-kw">$1</span>');
        wrap(/\b(\d+(?:\.\d+)?)\b/g, '<span class="tok-num">$1</span>');
      }
      return html.replace(/\u0001([A-P]+)\u0002/g, (_, index) => vault[decodeIndex(index)]);
    }
    // DW-MD-CORE:render END

    function wireCopyButtons(root) {
      root.querySelectorAll('.copy-code').forEach(btn => {
        btn.addEventListener('click', async () => {
          const text = decodeURIComponent(btn.dataset.code || '');
          try {
            await navigator.clipboard.writeText(text);
            btn.textContent = 'Copied';
            setTimeout(() => btn.textContent = 'Copy', 900);
          } catch {
            btn.textContent = 'Copy failed';
            setTimeout(() => btn.textContent = 'Copy', 900);
          }
        });
      });
    }

    async function startApp() {
      resetConversation();
      updateLocalTime();
      setInterval(updateLocalTime, 1000);
      connectEventStream();
      await refreshStatus();
      statusTimer = setInterval(refreshStatus, 5000);
    }

    function clearStreamConnectTimer() {
      clearTimeout(streamConnectTimer);
      streamConnectTimer = null;
    }
    // 🔴 (c) `0.2.1.35`-⑲:重放窗口过期不得**静默**。同一个告警元素现在承载两种含义 ——
    //    "连接不上"(恢复动作 = 重试)与 "重放超时"(恢复动作 = 刷新)⇒ 按变体分别给文案与按钮标签。
    //    🔵 conn 的措辞**从标记里读**,不在这里复制第二份:两份字串迟早会漂,而漂了没人会发现。
    //    🔵 措辞与外观属**产品可见**项(业主可能改)⇒ 闸只钉"出窗时有可见告警"与"变体是 replay",不钉文案。
    const STREAM_ALERT_TEXT = {
      conn: streamAlertText.textContent.trim(),
      replay: '⚠️ 重连后 1 秒内没等到历史重放:屏幕上的正文可能已过期,或与随后到达的重放重复。点【刷新】可恢复。',
      gap: '⚠️ 有较早或未送达的事件没能补齐,显示可能不全。点【刷新】可重建。',
    };
    const STREAM_ALERT_ACTION = { conn: '重试', replay: '刷新', gap: '刷新' };
    let streamAlertMode = 'conn';
    function hideStreamAlert() {
      // 🔴 重放超时告警**不许**被 onopen / onmessage 的常规 hide 抹掉:它出现的那一刻(arm+1s)
      //    之后约 300ms 就会来一条迟到的重放事件 ⇒ 没有这一句,告警只显示 300ms,业主根本看不见,
      //    (c) 等于没做。端到端闸那条"可见性"断言(要求某次采样里 hidden=false · 文本非空 · 盒子非零)
      //    钉的就是这件事。清它只有一条正路:clearReplayTimeoutAlert()。
      // R-V2-0105 件一：'gap'（显示可能不全）同理不得被常规 hide 抹掉，只有刷新才算处理了它。
      if ((streamAlertMode === 'replay' || streamAlertMode === 'gap') && !streamAlert.hidden) return;
      streamAlert.hidden = true;
    }
    function showStreamAlert(mode) {
      if (document.hidden) return;
      streamAlertMode = mode || 'conn';
      // 🔴 不留 `|| conn` 兜底:那会把"变体缺失 / 文案为空"**静默降级成另一件事的告警**。
      //    实测(变异 M-C3:把 replay 文案改成空串)有兜底时页面弹的是"连接不上…点【重试】",
      //    端到端闸当时 26/0 全绿 ⇒ 业主被指向一个错误的恢复动作。**指错方向比不指更坏。**
      //    两张表对 conn / replay 都是全覆盖的,不需要兜底;缺一项就该在页面上看得出来。
      streamAlertText.textContent = STREAM_ALERT_TEXT[streamAlertMode];
      streamRetryBtn.textContent = STREAM_ALERT_ACTION[streamAlertMode];
      streamAlert.hidden = false;
    }
    // 撤销重放超时告警的唯一入口:内容已由 ring 重建 ⇒ "可能与重放重复"的风险过去了。
    function clearReplayTimeoutAlert() {
      if (streamAlertMode !== 'replay') return;
      streamAlertMode = 'conn';
      streamAlert.hidden = true;
    }
    // RED 断线必须**看得见**,否则就是「东西在那儿但不起作用」:
    //    自动重连 ＋ 无指示 ⇒ 死掉的页面和正常页面长得一模一样,业主会对着断线页面等消息。
    //    做法(不额外占状态栏空间):让保留下来的 🕐 那一栏兼任连接状态。
    function renderConnectionState() {
      if (!clockStatus) return;
      if (reconnectAttempt > 0) {
        clockStatus.classList.add('offline');
        clockStatus.title = '事件流已断开,正在自动重连。点击立即重试';
        localTime.textContent = `断线重连中 · 第 ${reconnectAttempt} 次`;
      } else {
        clockStatus.classList.remove('offline');
        clockStatus.title = '点击立即重连事件流';
        updateLocalTime();
      }
    }
    function clearReconnectTimer() {
      if (reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = null; }
    }
    // 连上了 ⇒ 归零并恢复时钟显示。
    function markStreamConnected() {
      clearReconnectTimer();
      reconnectAttempt = 0;
      renderConnectionState();
    }
    // 断了 ⇒ 计次、显示、并按 1s→2s→5s→10s→30s 封顶排下一次。
    function scheduleReconnect() {
      clearReconnectTimer();
      const delay = RECONNECT_BACKOFF_MS[Math.min(reconnectAttempt, RECONNECT_BACKOFF_MS.length - 1)];
      reconnectAttempt += 1;
      renderConnectionState();
      reconnectTimer = setTimeout(() => { reconnectTimer = null; connectEventStream(); }, delay);
    }
    function closeEventStream() {
      eventSourceGeneration += 1;
      clearStreamConnectTimer();
      if (eventSource) eventSource.close();
      eventSource = null;
    }
    // 重连幂等:EventSource 断线后会自动重连,hub 随后重放 ring 里的同一批事件。
    // 没有 per-event 唯一序号,客户端无法逐条判重(见上方 P0 说明),
    // 因此改用"清空 + 由重放重建"这一种机制 —— 与刷新页面等价、天然幂等,
    // 且失败模式是"重建一次(短暂重排)",不会丢正文。
    // T-086 止血(业主 2026-09-16 定):**把清空推迟到第一条重放事件真正到达时**。
    //
    // 为什么:`eventRing` 纯内存 ⇒ **Hub 一重启就归零**;而此处原先在 onopen **立刻**清空,
    // 于是「清空了、却没东西可重放」⇒ **整页空白**。业主当日被擦四五次,成因是组长的连续发版。
    // 🔴 本改**不修根因**(ring 仍无持久化,重启前的历史确实没了),
    //    只让「屏幕上还看得见的旧内容」不被白白擦掉 —— **旧内容远好过白页**。
    //
    // 🔴 为什么要窗口:若只写「第一条事件到达时才清」,ring 空时**后来的第一条【活事件】
    //    也会触发清空** —— 那只是把白页**推迟**,不是消除。故只在重放突发期内接受清空,
    //    超时即取消(常量复用现成的 REPLAY_HARD_LIMIT_MS)。
    let pendingReconnectClear = false;
    let pendingClearTimer = null;
    function cancelPendingReconnectClear() {
      pendingReconnectClear = false;
      clearTimeout(pendingClearTimer);
      pendingClearTimer = null;
    }
    // 返回 true 表示「本条事件到达时应当先清空」——供 handleIncomingEvent 之前调用。
    function consumeReconnectClear() {
      if (!pendingReconnectClear) return false;
      cancelPendingReconnectClear();
      return true;
    }
    function markStreamReconnect() {
      // 不再立刻 resetConversation();挂起,等第一条重放事件。
      pendingReconnectClear = true;
      clearTimeout(pendingClearTimer);
      pendingClearTimer = setTimeout(function () {
        // 窗口内一条都没来 ⇒ ring 是空的(多半 Hub 刚重启)⇒ **取消清空,保住现有内容**
        cancelPendingReconnectClear();
        // 🔴 (c) `0.2.1.35`-⑲:取消清空只做到"不弄坏内容",它同时意味着**这一轮重放没接上** ——
        //    屏幕上的正文可能已过期,也可能与随后迟到几百毫秒的重放叠成两份。
        //    改之前这里一个字都不说 ⇒ 一个**频率未知的静默失败**(组长 ts-No.12 ③ 判它本版必做)。
        //    🔵 变体 'replay' 与 'conn' 共用同一个元素,靠这个实参区分;单元闸 ⑦ 钉的就是它,
        //       免得"弹了一条【连接不上】"也算过 —— 那是错误消息指错方向。
        showStreamAlert('replay');
      }, REPLAY_HARD_LIMIT_MS);
      beginTimelineReplay();
    }

    // ── R-V2-0105 件一：按服务端逐事件序号去重（要点第一至五、八、十六节）──────────────
    // Hub 每条事件带 SSE id「<纪元>-<seq>」；纪元挂在 Hub 的会话终端状态上（Hub 重启或 helper 重连即换）。
    // 已见判定：同纪元下 seq ≤ lastContiguousSeq，或在 seenAboveSeq 里。重连带 after=<纪元>-<lastContiguousSeq>，
    // Hub 只补其后 ⇒ 不再依赖「1 秒清空窗口」。无 id（旧 Hub）⇒ 完全退回现行为。
    const GAP_COALESCE_MS = 2000, GAP_REFILL_WINDOW_MS = 5 * 60 * 1000, GAP_REFILL_MAX = 3, SEEN_ABOVE_MAX = 5000;
    let lastEventEpoch = '', lastContiguousSeq = 0, seqStreamSeen = false;
    let seenAboveSeq = new Set();
    let gapRefillTimes = [], gapRefillTimer = null, gapRefillStopped = false;
    function parseEventId(id) {
      const m = /^([0-9a-f]{1,32})-([0-9]{1,20})$/.exec(id || '');
      return m ? { epoch: m[1], seq: Number(m[2]) } : null;
    }
    function eventsStreamUrl() {
      const base = apiEp('events');
      if (!lastEventEpoch) return base;
      return base + (base.includes('?') ? '&' : '?') + 'after=' + encodeURIComponent(`${lastEventEpoch}-${lastContiguousSeq}`);
    }
    // 返回 true 表示该事件应渲染；false 表示已见（跳过）。必要时排定补缺。
    function admitEventId(id) {
      const p = parseEventId(id);
      if (!p) return true;                       // 无 id：旧 Hub，照旧
      seqStreamSeen = true;
      if (p.epoch !== lastEventEpoch) {          // 首次或换纪元：保留现有内容，以本条为基线
        lastEventEpoch = p.epoch;
        lastContiguousSeq = p.seq - 1;
        seenAboveSeq = new Set();
      }
      if (p.seq <= lastContiguousSeq || seenAboveSeq.has(p.seq)) return false;
      if (p.seq === lastContiguousSeq + 1) {
        lastContiguousSeq = p.seq;
        while (seenAboveSeq.has(lastContiguousSeq + 1)) { seenAboveSeq.delete(lastContiguousSeq + 1); lastContiguousSeq += 1; }
        return true;
      }
      seenAboveSeq.add(p.seq);                   // 跳号：先显示，after 仍停在缺口前，补缺不重复
      if (seenAboveSeq.size > SEEN_ABOVE_MAX) {  // 缺口长期补不上：放弃补缺，向前对齐并提示
        lastContiguousSeq = Math.max(...seenAboveSeq);
        seenAboveSeq = new Set();
        showStreamAlert('gap');
        return true;
      }
      scheduleGapRefill();
      return true;
    }
    // 补缺：合并等待 2 s；与断线重连共用 scheduleReconnect 的退避；同纪元每 5 分钟至多 3 次，超出只提示。
    function scheduleGapRefill() {
      if (gapRefillTimer || gapRefillStopped) return;
      gapRefillTimer = setTimeout(() => {
        gapRefillTimer = null;
        if (!seenAboveSeq.size) return;          // 等待期间已自然补齐
        if (reconnectTimer) return;              // 已有重连在途，不叠加（它本就带 after）
        const now = Date.now();
        gapRefillTimes = gapRefillTimes.filter(t => now - t < GAP_REFILL_WINDOW_MS);
        if (gapRefillTimes.length >= GAP_REFILL_MAX) {
          gapRefillStopped = true;
          showStreamAlert('gap');
          return;
        }
        gapRefillTimes.push(now);
        scheduleReconnect();
      }, GAP_COALESCE_MS);
    }
    function handleReplayGap(msg) {
      let reason = '';
      try { reason = JSON.parse(msg.data).reason || ''; } catch (_) {}
      // epoch_changed：Hub 重启或会话终端重建 ⇒ 保留现有内容，随后到达的新纪元事件按基线收；不提示。
      if (reason === 'overflow') showStreamAlert('gap');
    }

    const managedParams = new URLSearchParams(location.search);
    const managedMux = managedParams.get('console_mux') === '1';
    const managedInstance = managedParams.get('iframe_instance') || '';
    let managedApplyActive = false, managedStopped = false, managedApplyPending = null, managedInFlight = null;
    let managedEpoch = '', managedApplied = 0n, managedAgent = '', managedGeneration = '';
    function managedDecimal(value) {
      if (typeof value !== 'string' || !/^(0|[1-9][0-9]{0,19})$/.test(value)) throw Error('invalid managed seq');
      const n = BigInt(value); if (n > 18446744073709551615n) throw Error('managed seq overflow'); return n;
    }
    function managedReply(p, ok, retryable) {
      parent.postMessage({protocol:'dw-console-mux/v1',type:'applied',iframe_instance:managedInstance,
        agent_id:p.agent_id,generation:p.generation,delivery_id:p.epoch+'-'+p.seq,ok,retryable},location.origin);
    }
    if (managedMux) {
      if (parent === window || !/^[0-9a-f]{32}$/.test(managedInstance)) {
        managedStopped = true; showStreamAlert('gap');
      } else {
        window.addEventListener('message', async ev => {
          const d=ev.data;
          if(ev.source!==parent||ev.origin!==location.origin||!d||d.protocol!=='dw-console-mux/v1'||d.iframe_instance!==managedInstance)return;
          if(d.type==='bind'&&d.agent_id===managedAgent&&d.generation===managedGeneration&&/^[0-9a-f]{32}$/.test(d.next_generation)){managedGeneration=d.next_generation;return;}
          if(d.type==='stopped'){managedStopped=true;finishTimelineReplay(true);showStreamAlert('gap');const alert=document.getElementById('streamAlertText');if(alert)alert.textContent=d.reason;return;}
          if(d.type!=='event'||managedStopped)return;
          const p=d.event;
          if(!p||p.agent_id!==d.agent_id||p.generation!==d.generation||p.iframe_instance!==managedInstance)return;
          try {
            const n=managedDecimal(p.seq);
            if(managedAgent&&(managedAgent!==p.agent_id||managedGeneration!==p.generation||managedEpoch!==p.epoch))throw Error('managed identity changed');
            if(!managedAgent){managedAgent=p.agent_id;managedGeneration=p.generation;managedEpoch=p.epoch;managedApplied=n-1n;}
            if(managedInFlight){if(managedInFlight.key!==p.epoch+'-'+p.seq)throw Error('concurrent managed event');await managedInFlight.promise;managedReply(p,true,false);return;}
            if(n<=managedApplied){managedReply(p,true,false);return;}
            if(n!==managedApplied+1n)throw Error('managed event gap');
            const pending={records:new Set(),resolve:null,reject:null};
            const mergeDone=new Promise((resolve,reject)=>{pending.resolve=resolve;pending.reject=reject;});mergeDone.catch(()=>{});
            let complete,fail;const applied=new Promise((resolve,reject)=>{complete=resolve;fail=reject;});applied.catch(()=>{});
            managedInFlight={key:p.epoch+'-'+p.seq,promise:applied,fail};managedApplyPending=pending;
            managedApplyActive=true;
            handleIncomingEvent(p.payload);
            flushPendingRenders();
            managedApplyActive=false;
            if(!pending.records.size)pending.resolve();
            await mergeDone;
            managedApplied=n;
            managedApplyPending=null;managedInFlight=null;complete();
            hideStreamAlert();markStreamConnected();
            managedReply(p,true,false);
          } catch (err) {
            managedApplyActive=false;managedStopped=true;
            if(managedApplyPending){for(const rec of managedApplyPending.records)clearTimeout(rec.timer);managedApplyPending=null;}
            if(managedInFlight){managedInFlight.fail(err);managedInFlight=null;}
            finishTimelineReplay(true);showStreamAlert('gap');
            // A handler may have partially mutated DOM. Never retry that mutation or claim applied.
            managedReply(p,false,false);
          }
        });
        parent.postMessage({protocol:'dw-console-mux/v1',type:'ready',iframe_instance:managedInstance},location.origin);
      }
    }

    function connectEventStream() {
      if (managedMux) return;
      closeEventStream();
      const generation = eventSourceGeneration;
      let opened = false;
      let receivedFirstEvent = false;
      beginTimelineReplay();
      setStatus('idle');
      eventSource = new EventSource(eventsStreamUrl());
      eventSource.addEventListener('replay_gap', msg => {
        if (generation !== eventSourceGeneration) return;
        handleReplayGap(msg);
      });
      eventSource.onopen = () => {
        if (generation !== eventSourceGeneration) return;
        // 第二次及以后的 open = 断线重连:hub 会重放 ring,先 arm 延迟清空避免与已有内容叠加。
        // 🔴 arm 的时机必须在 **open**,不能提前到 scheduleReconnect:延迟清空窗口
        //    (REPLAY_HARD_LIMIT_MS)是从 arm 那一刻起算的,而 backoff 最长 30s ⇒
        //    提前 arm 会让窗口在重放到达之前就过期,等于没修。
        // R-V2-0105 件一：已收到过带序号的事件 ⇒ 本次连接带 after、Hub 只补缺口，不需要清空窗口。
        if (streamEverOpened && !seqStreamSeen) markStreamReconnect();
        streamEverOpened = true;
        opened = true;
        clearStreamConnectTimer();
        hideStreamAlert();
        markStreamConnected();
        if (!stats.readonly) setStatus('idle');
      };
      eventSource.onmessage = (msg) => {
        if (generation !== eventSourceGeneration) return;
        receivedFirstEvent = true;
        clearStreamConnectTimer();
        hideStreamAlert();
        // T-086:重放的第一条到达了 ⇒ 此刻才清空(与旧行为等价);ring 空则永远走不到这里。
        // 🔴 (c):清空 = 内容马上由 ring 重建 ⇒ "可能与重放重复"的风险过去了,重放超时告警可以撤。
        if (consumeReconnectClear()) { resetConversation(); clearReplayTimeoutAlert(); }
        if (!admitEventId(msg.lastEventId)) return;   // R-V2-0105 件一：已见事件不再渲染
        try {
          handleIncomingEvent(JSON.parse(msg.data));
        } catch (err) {
          handleIncomingEvent({ kind: 'error', text: `Bad event payload: ${err.message}`, data: { code: 'bad_sse_payload' } });
        }
      };
      eventSource.onerror = () => {
        if (generation !== eventSourceGeneration) return;
        opened = false;
        setStatus('disconnected');
        // RED 不依赖 EventSource 自带的重连:它不给次数、不给节奏,也**不给任何可见状态**。
        //    这里自己排队重连,并把次数显示到 🕐 那一栏上。
        // 🔴 断线时必须**结束重放窗口**,否则我这次加的自动重连会造一个回归:
        //    connectEventStream() 每次都调 beginTimelineReplay(),在**连不上的流**上
        //    每 1s/2s/5s… 重开一次窗口 ⇒ replayInProgress 长期为 true
        //    ⇒ renderError 里那句 `if (!replayInProgress) showErrorToast(text)` 永远不执行
        //    ⇒ **本地错误(只读上传、票据失败…)在断线期间一条 toast 都不弹、错误看板计数也不涨。**
        //    实测对照(基线 vs 未修前的本批):基线「错误看板1 / toasts 2」,本批「错误看板0 / toasts 1」。
        //    重放窗口的用途是"连上后抑制 ring 重放的噪声";**连不上时本就不该处于该状态**。
        finishTimelineReplay(true);
        scheduleReconnect();
        // EventSource 自带重连；仅在宽限期后仍未重新 open/收到事件时提示。
        clearStreamConnectTimer();
        streamConnectTimer = setTimeout(() => {
          if (generation === eventSourceGeneration && !opened &&
              eventSource?.readyState !== EventSource.OPEN) showStreamAlert();
        }, STREAM_CONNECT_GRACE_MS);
      };
      streamConnectTimer = setTimeout(() => {
        if (generation === eventSourceGeneration && !opened && !receivedFirstEvent &&
            eventSource?.readyState !== EventSource.OPEN) showStreamAlert();
      }, STREAM_CONNECT_GRACE_MS);
    }

    async function refreshStatus() {
      try {
        const res = await fetch(apiEp('status'), { cache: 'no-store' });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        applyStatusData(await res.json());
        if (stats.authMode === 'view_page_v2') await ensurePageIdentity();
      } catch {
        setStatus('disconnected');
      }
    }

    function pageStorageKey() {
      return `dw-view-page:${stats.sessionName}`;
    }
    function savePageIdentity(identity) {
      pageIdentity = identity;
      sessionStorage.setItem(pageStorageKey(), JSON.stringify(identity));
      stats.unlockCode = identity.code;
      // T-141:控制台能力票与页面锁是【两套授权】;持票时不得被页面锁覆盖。
      stats.readonly = consoleCapabilityUsable() ? false : !identity.can_write;
      stats.access = stats.readonly ? '只读' : '可写';
      updateMetrics();
    }
    async function acquireConsoleCapability() {
      if (!pageIdentity?.page_id || !stats.sessionName) return false;
      // T-141:仍有余额则直接复用,不重铸 —— 重铸会作废手上这张。
      if (consoleCapabilityUsable()
          && Date.now() < consoleCapabilityExpiresAt - CONSOLE_CAPABILITY_RENEW_MS) {
        if (stats.readonly) { stats.readonly = false; stats.access = '可写'; updateMetrics(); }
        return true;
      }
      const res = await fetch(`/api/console/agents/${encodeURIComponent(stats.sessionName)}/capability`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ page_id: pageIdentity.page_id }),
      });
      if (res.status === 404) return false;
      if (!res.ok) throw new Error(`console capability failed: HTTP ${res.status}`);
      const issued = await res.json();
      if (!issued.capability || issued.page_id !== pageIdentity.page_id) throw new Error('invalid console capability');
      consoleCapability = issued.capability;
      consoleCapabilityPageId = issued.page_id;
      // 后端回 expires_in(秒);缺省按 300s,并留 5s 余量抵消网络往返。
      consoleCapabilityExpiresAt = Date.now() + ((Number(issued.expires_in) || 300) - 5) * 1000;
      stats.readonly = false;
      stats.access = '可写';
      updateMetrics();
      return true;
    }
    function consoleWriteHeaders() {
      if (!consoleCapability) return {};
      return {
        'X-DW-Console-Page': pageIdentity.page_id,
        'X-DW-Console-Capability': consoleCapability,
      };
    }
    async function createPageIdentity() {
      const res = await fetch(apiEp('page'), { method: 'POST' });
      if (!res.ok) throw new Error(`POST /page failed: HTTP ${res.status}`);
      const created = await res.json();
      savePageIdentity({ page_id: created.page_id, page_token: created.page_token,
        code: created.code, state: created.state, can_write: created.state === 'unlocked' });
      announcePageIdentity();
    }
    function resetConsoleCapability() {
      consoleCapability = null;
      consoleCapabilityPageId = null;
      consoleCapabilityExpiresAt = 0;
    }
    function resetPageIdentityChannel() {
      clearTimeout(pageIdentityUniqueTimer);
      pageIdentityUnique = false;
      if (pageIdentityChannel) pageIdentityChannel.close();
      pageIdentityChannel = null;
    }
    async function ensurePageIdentity(forceNew = false) {
      if (pageIdentityEnsurePromise) {
        await pageIdentityEnsurePromise;
        if (!forceNew) return;
      }
      const pending = ensurePageIdentityOnce(forceNew);
      pageIdentityEnsurePromise = pending;
      try {
        await pending;
        await acquireConsoleCapability();
      } finally {
        if (pageIdentityEnsurePromise === pending) pageIdentityEnsurePromise = null;
      }
    }
    async function ensurePageIdentityOnce(forceNew = false) {
      if (!pageIdentity && !forceNew) {
        try { pageIdentity = JSON.parse(sessionStorage.getItem(pageStorageKey()) || 'null'); } catch { pageIdentity = null; }
      }
      if (!pageIdentity || forceNew) {
        resetPageIdentityChannel();
        await createPageIdentity();
        setupPageIdentityChannel();
        return;
      }
      const res = await fetch(`${apiEp('page')}/resume`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ page_id: pageIdentity.page_id, page_token: pageIdentity.page_token }),
      });
      if (!res.ok) {
        sessionStorage.removeItem(pageStorageKey());
        pageIdentity = null;
        resetPageIdentityChannel();
        await createPageIdentity();
      } else {
        const resumed = await res.json();
        if (!['locked', 'unlocked'].includes(resumed.state)) {
          sessionStorage.removeItem(pageStorageKey());
          pageIdentity = null;
          resetPageIdentityChannel();
          await createPageIdentity();
        } else {
          savePageIdentity({ ...pageIdentity, ...resumed });
        }
      }
      setupPageIdentityChannel();
    }
    function announcePageIdentity() {
      if (pageIdentityChannel && pageIdentity?.page_id) {
        pageIdentityChannel.postMessage({ type: 'claim', page_id: pageIdentity.page_id, nonce: pageInstanceNonce });
      }
    }
    function settlePageIdentityUniqueness() {
      pageIdentityUnique = false;
      clearTimeout(pageIdentityUniqueTimer);
      pageIdentityUniqueTimer = setTimeout(() => { pageIdentityUnique = true; }, 300);
    }
    async function awaitPageIdentityUniqueness() {
      const deadline = Date.now() + 1500;
      while (!pageIdentityUnique && Date.now() < deadline) {
        await new Promise(resolve => setTimeout(resolve, 20));
      }
      if (!pageIdentityUnique) throw new Error('页面身份确认超时，请重试');
    }
    function setupPageIdentityChannel() {
      if (pageIdentityChannel || !pageIdentity?.page_id) return;
      if (!('BroadcastChannel' in window)) {
        // Cannot prove a cloned sessionStorage identity is single-tab: fail safe.
        if (!pageIdentityFallbackApplied) {
          pageIdentityFallbackApplied = true;
          ensurePageIdentity(true).catch(() => setStatus('disconnected'));
        } else {
          pageIdentityUnique = true;
        }
        return;
      }
      pageIdentityChannel = new BroadcastChannel(`dw-view-page:${stats.sessionName}`);
      pageIdentityChannel.onmessage = event => {
        const claim = event.data || {};
        if (claim.type !== 'claim' || claim.page_id !== pageIdentity?.page_id || claim.nonce === pageInstanceNonce) return;
        settlePageIdentityUniqueness();
        // Deterministic tie-break: the lexicographically smaller instance nonce yields.
        if (pageInstanceNonce < String(claim.nonce)) {
          pageIdentityChannel.close();
          pageIdentityChannel = null;
          pageIdentityUnique = false;
          ensurePageIdentity(true).catch(() => setStatus('disconnected'));
        } else {
          announcePageIdentity();
        }
      };
      settlePageIdentityUniqueness();
      setTimeout(announcePageIdentity, 50);
      setTimeout(announcePageIdentity, 250);
    }

    async function submitInput(text) {
      // R-V2-0102-VIEW-MENTION-ROUTE:只带候选浮层选中、且正文里仍保留「@insert」的目标;没有就不带这个键(请求体与之前同形)。
      const mentions = mentionTargetsFor(text);
      const withMentions = (o) => (mentions.length ? { ...o, mentions } : o);
      if (stats.authMode === 'view_page_v2') {
        await awaitPageIdentityUniqueness();
        if (stats.readonly) throw new Error('当前页面尚未解锁');
      }
      const res = await fetch(apiEp('input'), {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', ...consoleWriteHeaders() },
        body: JSON.stringify(withMentions(stats.authMode === 'view_page_v2' ? {
          text, page_id: pageIdentity?.page_id, page_token: pageIdentity?.page_token,
          request_id: newRequestId(),
        } : { text })),
      });
      if (!res.ok) throw new Error(`POST /input failed: HTTP ${res.status}`);
      const body = await res.json().catch(() => ({}));
      if (!body.ok) throw new Error('input returned ok=false');
      return body;
    }

    async function interruptTurn() {
      // body 契约(devof5 冻结):V2={delivery_id,turn_id,page_id,page_token,request_id}——打运行中 turn、无 message_id;
      // page 凭证与 /input、/control cancel 同一对;request_id=中断意图幂等键(c2TurnCtx.active 上 stash,重试复用)。
      // legacy 保持无 body(老 viewer 路,逐字节不变)。响应语义 §4:VS 恒 200 看 body.ok;ok:true=帧已下发≠turn 已停(停走正常流事件);
      // 非 200(400/403/502)=未受理,沿用 throw→error 卡诚实呈现。
      let intBody = null;
      if (stats.authMode === 'view_page_v2') {
        if (!pageIdentity?.page_id || !pageIdentity?.page_token) throw new Error('中断未发出:无 V2 page 凭证');
        const act = c2TurnCtx.active;
        if (!act) throw new Error('中断未发出:无运行中 turn');
        if (!act.rootPinned || !act.deliveryId) throw new Error('中断未发出:运行中 turn 的注入入口(root)未确认');  // 本地拦:一个 request_id↔一份不可变 body,root 确认后才 POST
        if (!act.requestId) act.requestId = newRequestId();
        intBody = { delivery_id: act.deliveryId, turn_id: act.turnId, page_id: pageIdentity.page_id, page_token: pageIdentity.page_token, request_id: act.requestId };
      }
      const res = await fetch(apiEp('interrupt'), intBody
        ? { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(intBody) }
        : { method: 'POST' });
      if (!res.ok) throw new Error(`POST /interrupt failed: HTTP ${res.status}`);
      const body = await res.json().catch(() => ({}));
      if (!body.ok) throw new Error('interrupt returned ok=false');
    }

    // ── 日夜主题:全局化 ＋ 持久化(0.2.1.7)────────────────────────────────────────
    // 业主原话:「◐ 应该要**提出来,放在整个 Agent 列表**,而不是某一个 tab」
    // ⇒ 开关的**归属**移到了 console 页(internal/m8/console_auth.go 的 nav #themeBtn);
    //   renderer 侧只负责三件事:①加载时读回偏好 ②把自己这个 ◐ 的改动**提升为全局**
    //   ③接收 console / 其他 tab 的广播并应用。
    // 🔴 本页那个 ◐ **保留**(不删业主看惯的控件),但它不再是"只管这一个 tab"。
    //
    // 传输用 BroadcastChannel —— 与本文件既有的 page-identity 同一手法(见 setupPageIdentityChannel,
    // 那里也是先 `'BroadcastChannel' in window` 再建)。选它而不是遍历 iframe 的 postMessage,
    // 因为它一次覆盖两类"看不见就漏掉"的对象:**display:none 的隐藏 pane**(切 tab 不重载)与**其他 tab**。
    // 🔴 持久化用 localStorage,**不用 sessionStorage**:后者不跨 tab ⇒ 不满足"含持久化"。
    //   (本文件既有两处 sessionStorage 用途 —— 任务板折叠 :1742 与页面身份 :3894 —— 都是**故意**按 tab 隔离的,
    //    主题不是;别把它们当先例照抄。)
    // 🔴 写入方必须**自己立刻 apply**:BroadcastChannel 与 storage 事件都**不会**在写入方自己那份文档上触发。
    const THEME_KEY = 'dw-theme';
    let themeChannel = null;

    function themeStore() {
      try { return window.localStorage; } catch { return null; }   // 隐私模式下取用即抛
    }
    function readStoredTheme() {
      const store = themeStore();
      if (!store) return null;
      try {
        const value = store.getItem(THEME_KEY);
        return (value === 'dark' || value === 'light') ? value : null;
      } catch { return null; }
    }
    function writeStoredTheme(theme) {
      const store = themeStore();
      if (!store) return;
      try { if (store.getItem(THEME_KEY) !== theme) store.setItem(THEME_KEY, theme); } catch { /* 存不下不影响本次会话 */ }
    }
    function applyTheme(theme) {
      if (theme !== 'dark' && theme !== 'light') return;
      if (document.body.dataset.theme === theme) return;   // 幂等:挡住来回广播
      document.body.dataset.theme = theme;
    }
    // spread=false 用于"收到广播"那条路:只应用,不再广播、不成回环
    function setTheme(theme, { spread = true } = {}) {
      applyTheme(theme);                 // 🔴 自己先变
      writeStoredTheme(theme);
      if (spread) { try { themeChannel?.postMessage({ type: 'theme', theme }); } catch { /* 通道没了也不影响本地 */ } }
    }
    function setupThemeSync() {
      // 🔴 三段**各自** try/catch,不共用一个:频道建不起来(老浏览器/被策略禁掉)
      //    **不得连带**丢掉 storage 退路 ⇒ 否则"一条路坏了 ⇒ 两条路都没了",
      //    而报错只会指向先坏的那条。两条路互为冗余是**故意的**(隐私模式下 localStorage
      //    取用即抛,那时只有频道能用;反之老浏览器没频道,那时只有 storage 事件能用),
      //    而冗余必须**各自被钉住** —— 见闸的 T7 / T8。
      try {
        const stored = readStoredTheme();
        if (stored) applyTheme(stored);    // 🔴 加载时读:新开的 pane 要跟得上既有偏好
      } catch { /* 读不到就保持 markup 里的 data-theme="light" */ }
      try {
        if ('BroadcastChannel' in window && !themeChannel) {
          themeChannel = new BroadcastChannel(THEME_KEY);
          themeChannel.onmessage = (event) => {
            const theme = event?.data?.theme;
            if (theme !== 'dark' && theme !== 'light') return;
            setTheme(theme, { spread: false });
          };
        }
      } catch { themeChannel = null; }
      try {
        // 别的文档绕过频道直接改了存储也要跟随
        window.addEventListener('storage', (event) => {
          if (event.key !== THEME_KEY) return;
          if (event.newValue === 'dark' || event.newValue === 'light') setTheme(event.newValue, { spread: false });
        });
      } catch { /* 挂不上事件时,本页那个 ◐ 仍然可用 */ }
    }
    setupThemeSync();

    themeBtn.addEventListener('click', () => {
      const next = document.body.dataset.theme === 'dark' ? 'light' : 'dark';
      setTheme(next);
    });
    // 0.2.1.2:「重连」按钮已移除 ⇒ 手动退路挪到 🕐 那一栏上,**不随按钮一起消失**。
    clockStatus?.addEventListener('click', () => {
      clearReconnectTimer();
      connectEventStream();
      refreshStatus();
    });
    streamRetryBtn.addEventListener('click', () => {
      const mode = streamAlertMode;
      hideStreamAlert();
      // 🔴 (c):重放超时那条的恢复动作是**刷新**,不是重连 —— 重连只会再 arm 一次窗口,
      //    治不了屏幕上已经叠起来的内容;刷新让整页从 hub 重新取一份完整状态。
      if (mode === 'replay' || mode === 'gap') { window.location.reload(); return; }
      connectEventStream();
    });
    async function doSend() {
      if (stats.readonly) {
        copyUnlockInstruction();
        return;
      }
      // 保留开头和内部换行，只清掉消息结尾的多余空白。
      const text = humanInput.value.replace(/\s+$/u, '');
      if (!text) return;
      try {
        const result = await submitInput(text);
        mentionPicked.length = 0;
        renderMentionReceipts(result && result.mentions);
        humanInput.value = '';
        resizeHumanInput();
        renderDraftAttachments();   // 发出去之后草稿条随正文一起清空
      } catch (err) {
        handleIncomingEvent({ kind: 'error', text: err.message, data: { code: 'input_failed' } });
      }
    }
    document.getElementById('sendBtn').addEventListener('click', doSend);
    function resizeHumanInput() {
      humanInput.style.height = 'auto';
      humanInput.style.height = `${Math.min(humanInput.scrollHeight, 140)}px`;
    }
    function insertInputNewline() {
      const start = humanInput.selectionStart;
      const end = humanInput.selectionEnd;
      humanInput.setRangeText('\n', start, end, 'end');
      humanInput.dispatchEvent(new Event('input', { bubbles: true }));
    }
    function appendInputReference(fileRef, name, size) {
      const start = humanInput.selectionStart;
      const end = humanInput.selectionEnd;
      const prefix = start > 0 && !/\s$/u.test(humanInput.value.slice(0, start)) ? ' ' : '';
      const suffix = end < humanInput.value.length && !/^\s/u.test(humanInput.value.slice(end)) ? ' ' : '';
      const detail = ` (${String(name || 'file')}, ${Number(size)} bytes)`;
      humanInput.setRangeText(prefix + fileRef + detail + suffix, start, end, 'end');
      humanInput.dispatchEvent(new Event('input', { bubbles: true }));
    }
    // ── 0.2.0.6 A 线：上传入口（业主第 1 条）────────────────────────────
    // 契约：tasks/v0.1-B 锚 d26bfd7002f70b7a9c9b5dcec6a1682ccbef974f
    //       runbooks/SPEC-0.2.0.6-file-direct-link.md §2 · §3.1 · 附录 A4
    // 0.2.0.5 的教训：这里原本**只有 paste 一个入口且只收 image/**，界面上没有任何
    // 可见按钮，于是「界面上根本没有上传入口」是业主自己用的时候发现的。
    // ⇒ 三个入口（粘贴 / 选择 / 拖放）必须同时在，且都不限类型。
    // ── 上传进度行（业主 2026-09-18 验收第 1 条）────────────────────────
    // 🔴 判据是业主那句话的反面：任一时刻用户都能分辨「在传」与「卡住了」。
    //    所以每一行在任何时刻都必须处于三种可读状态之一：
    //    ① 有百分比与已传/总字节（在传，且能看出数在涨）
    //    ② 不定进度条来回走（在等票据或等响应——没有字节可报，但看得出没死）
    //    ③ 终态：已附加 / 失败＋原因
    function newUploadRow(file) {
      const row = document.createElement('div');
      row.className = 'upload-row indeterminate';
      const name = document.createElement('span');
      name.className = 'u-name';
      name.textContent = file.name || '未命名文件';
      const meta = document.createElement('span');
      meta.className = 'u-meta';
      meta.textContent = '申请上传凭证…';
      const bar = document.createElement('div');
      bar.className = 'u-bar';
      const fill = document.createElement('div');
      fill.className = 'u-fill';
      bar.appendChild(fill);
      row.append(name, meta, bar);
      uploadQueue.appendChild(row);
      uploadQueue.hidden = false;
      return {
        // 有字节可报时：给百分比与 已传/总，并停掉不定动画
        progress(loaded, total) {
          row.classList.remove('indeterminate');
          const pct = total > 0 ? Math.min(100, Math.round((loaded / total) * 100)) : 0;
          fill.style.width = `${pct}%`;
          meta.textContent = `${pct}% · ${formatFileBytes(loaded)} / ${formatFileBytes(total)}`;
        },
        // 没有字节可报的阶段（等票据、等服务端响应）：明说在等什么，并保持条在动
        waiting(text) {
          row.classList.add('indeterminate');
          fill.style.width = '';
          meta.textContent = text;
        },
        // 组长 2026-09-18 裁定：完成态的行在**对应草稿块出现后即移除**。
        // 理由：草稿块（缩略图＋原名＋大小）已完整表达「已附加」，两处冗余；
        // 而 R1 要解决的是「进行中不知道在不在动」，完成之后再占屏幕会把草稿区挤走，
        // 草稿区才是业主第 2 条要的东西。传 20 个文件就会堆 20 行 —— 这条是本次新引入的，必须清。
        // 🔴 失败行不走这里（见 failed），人必须看得见哪个失败了。
        done(sizeBytes, url) {
          row.classList.remove('indeterminate');
          row.classList.add('done');
          fill.style.width = '100%';
          meta.textContent = `已附加 · ${formatFileBytes(sizeBytes)}`;
          const chipShown = url && draftAttachments.querySelector(`[data-file-url="${CSS.escape(url)}"]`);
          const drop = () => { row.remove(); if (!uploadQueue.children.length) uploadQueue.hidden = true; };
          // 草稿块已在 ⇒ 立即移除；万一没在（理论上不该发生）⇒ 留一个短兜底，不把行永久挂住。
          if (chipShown) drop(); else setTimeout(drop, 2500);
        },
        failed(reason, retry) {
          row.classList.remove('indeterminate');
          row.classList.add('failed');
          fill.style.width = '100%';
          meta.textContent = `失败 · ${reason}`;
          // 失败行不自动消失：业主要能看到为什么失败。可重试的失败给「重试」：文件仍在手里，点一下重走整条上传，本行让位给新行。
          if (retry) {
            const again = document.createElement('button');
            again.type = 'button';
            again.className = 'u-retry';
            again.textContent = '重试';
            again.onclick = () => { row.remove(); if (!uploadQueue.children.length) uploadQueue.hidden = true; retry(); };
            row.appendChild(again);
          }
        },
      };
    }

    // ── 批次级状态（R6，组长 2026-09-18 裁定）──────────────────────────
    // 业主原话：「多文件传输时,没有提示,不知道是不是结束了」（一次 6 张图，约 36 MB）。
    //
    // 🔴 为什么单文件行不够：裁定②让完成行随草稿块出现即移除（防堆积，该目的仍然有效），
    //    但 6 个文件依次出现、依次消失之后，进度区变成**空白** ——
    //    于是「还没开始」与「全部结束」在屏幕上长得一模一样，用户只能去数草稿块。
    // ⇒ 本行只回答一个问题：整批还剩多少、结束了没有。它与单文件行**并存**，不互相替代。
    //    单文件行回答「这个在不在动」，批次行回答「整批还剩多少」。
    const BATCH_DONE_LINGER_MS = 4000;
    function newBatchRow(files) {
      const total = files.length;
      const totalBytes = files.reduce((sum, f) => sum + (f.size || 0), 0);
      const row = document.createElement('div');
      row.className = 'batch-row';
      row.dataset.batchState = 'running';
      const name = document.createElement('span');
      name.className = 'b-name';
      name.textContent = '本批文件';
      const meta = document.createElement('span');
      meta.className = 'b-meta';
      const bar = document.createElement('div');
      bar.className = 'b-bar';
      const fill = document.createElement('div');
      fill.className = 'b-fill';
      bar.appendChild(fill);
      row.append(name, meta, bar);
      // 🔴 插在队列最前：单文件行会一个个消失，批次行不能跟着它们上下跳。
      uploadQueue.prepend(row);
      uploadQueue.hidden = false;
      let settled = 0, okCount = 0, failCount = 0, settledBytes = 0, liveBytes = 0;
      const paint = () => {
        const sent = Math.min(totalBytes, settledBytes + liveBytes);
        const pct = totalBytes > 0 ? Math.min(100, Math.round((sent / totalBytes) * 100)) : 0;
        fill.style.width = `${pct}%`;
        meta.textContent = `${settled}/${total} 个文件 · ${formatFileBytes(sent)} / ${formatFileBytes(totalBytes)}`;
      };
      const drop = () => { row.remove(); if (!uploadQueue.children.length) uploadQueue.hidden = true; };
      paint();
      return {
        // 把单文件那个 row 包一层：字节进度既喂它自己那一行，也累进批次行。
        track(fileRow) {
          return {
            progress(loaded, totalOfFile) { liveBytes = loaded; paint(); fileRow.progress(loaded, totalOfFile); },
            waiting(text) { fileRow.waiting(text); },
            done(sizeBytes, url) { fileRow.done(sizeBytes, url); },
          };
        },
        // 成败都要结算：失败的文件也不再「在传」，它的字节不能永远挂在 liveBytes 上。
        settle(file, ok) {
          settled += 1;
          if (ok) okCount += 1; else failCount += 1;
          settledBytes += file.size || 0;
          liveBytes = 0;
          paint();
        },
        finish() {
          fill.style.width = '100%';
          if (failCount === 0) {
            row.dataset.batchState = 'all-ok';
            meta.textContent = `${okCount} 个文件已全部附加`;
            // R6-2：完成态停留数秒后淡出 —— 常驻就又回到裁定②要清的那种堆积。
            setTimeout(drop, BATCH_DONE_LINGER_MS);
          } else {
            // 🔴 R6-3：有失败时**不淡出**。失败必须留在屏幕上，直到用户自己清掉。
            //    这里的 if 分支本身就是该条判据的落点：去掉它 ⇒ 失败批次也会自己消失。
            row.dataset.batchState = 'has-failure';
            meta.textContent = `${okCount} 个已附加 · ${failCount} 个失败`;
          }
        },
      };
    }

    // 🔴 用 XHR 而不是 fetch：**fetch 不上报上传进度**（没有 upload.onprogress），
    //    而业主第 1 条要的正是「已传/总字节」。这是为满足该条必须做的技术选择，
    //    不是偏好；其余语义（票据、请求头、失败取 {"error"}）与原 fetch 版逐条一致。
    function uploadWithProgress(url, ticket, file, row) {
      return new Promise((resolve, reject) => {
        const xhr = new XMLHttpRequest();
        xhr.open('POST', url, true);
        xhr.setRequestHeader('Authorization', `Bearer ${ticket}`);
        xhr.setRequestHeader('X-DingWei-Session', stats.sessionName);
        // 🔴 P0（业主 2026-09-18 撞上）：HTTP header 值受限于 ISO-8859-1(latin-1)。
        //    中文/emoji 超出该范围 ⇒ **浏览器在 setRequestHeader 阶段直接抛异常**，
        //    上传请求根本发不出去。fetch 与 XHR 都有这个限制，换 XHR 没有改变它。
        // ⇒ 按组长定死的协议编码：UTF-8''<percent-encoded>，与服务端 setDownloadHeaders
        //    已在用的 `filename*=UTF-8''…` 同一套，不另发明。
        //    encodeURIComponent 的输出必然全是 ASCII ⇒ 永不再触发该异常。
        xhr.setRequestHeader('X-File-Name', `UTF-8''${encodeURIComponent(file.name || 'upload.bin')}`);
        xhr.setRequestHeader('Content-Type', file.type || 'application/octet-stream');
        xhr.upload.addEventListener('progress', (e) => {
          if (e.lengthComputable) row.progress(e.loaded, e.total);
        });
        // 字节发完但服务端还没回：此时既不该停在 100% 不动，也没有新字节可报。
        xhr.upload.addEventListener('load', () => row.waiting('已发完，等服务端确认…'));
        xhr.addEventListener('load', () => resolve({ status: xhr.status, body: xhr.responseText }));
        xhr.addEventListener('error', () => reject(new Error('网络中断')));
        xhr.addEventListener('abort', () => reject(new Error('已取消')));
        xhr.send(file);
      });
    }

    // R-V2-0105-P1-LIST-UPLOAD：申请上传凭证限时 20 s（业主截图「申请上传凭证一直转」）；用例可经 globalThis 改短。
    function uploadTicketTimeoutMs() {
      const v = Number(globalThis.DW_UPLOAD_TICKET_TIMEOUT_MS);
      return v > 0 ? v : 20000;
    }
    // 本地校验失败（空文件、超上限）重试也不会好 ⇒ 不给重试；其余失败（凭证超时、HTTP、网络）可重试。
    function uploadInputError(text) {
      const err = new Error(text);
      err.retryable = false;
      return err;
    }
    async function uploadOneFile(file, row) {
      if (!file) throw uploadInputError('没有可上传的文件');
      const label = file.name || '未命名文件';
      // A4：上限一律 50 MiB = 50<<20 = 52428800 字节（不是 50×1000²）。
      if (file.size <= 0) throw uploadInputError(`${label}：空文件不上传`);
      if (file.size > FILE_MAX_UPLOAD_BYTES) {
        throw uploadInputError(`${label}：${formatFileBytes(file.size)} 超过上限 50 MiB（${FILE_MAX_UPLOAD_BYTES} 字节）`);
      }
      row?.waiting('申请上传凭证…');
      // 计时同时罩住 fetch 与读正文：响应头已回、正文不结束同样算超时；解析完成才清计时器。
      const ticketTimeoutMs = uploadTicketTimeoutMs();
      const ticketAbort = new AbortController();
      const ticketTimer = setTimeout(() => ticketAbort.abort(), ticketTimeoutMs);
      let ticket;
      try {
        const ticketRes = await fetch(`/api/console/agents/${encodeURIComponent(stats.sessionName)}/file-upload-ticket`, {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ max_bytes: file.size }),
          signal: ticketAbort.signal,
        });
        if (!ticketRes.ok) throw new Error(`${label}：申请上传票据失败 HTTP ${ticketRes.status}`);
        ticket = await ticketRes.json();
      } catch (err) {
        if (ticketAbort.signal.aborted) throw new Error(`${label}：申请上传凭证超时（${ticketTimeoutMs / 1000} 秒）`);
        throw err;
      } finally {
        clearTimeout(ticketTimer);
      }
      if (!ticket.upload_url || !ticket.ticket || ticket.session !== stats.sessionName) throw new Error(`${label}：上传票据响应无效`);
      // 不限类型：浏览器给不出类型时按二进制传，由服务端定夺，A 侧不猜（见 uploadWithProgress）。
      row?.progress(0, file.size);
      const uploadRes = await uploadWithProgress(ticket.upload_url, ticket.ticket, file, row || { progress() {}, waiting() {} });
      if (uploadRes.status < 200 || uploadRes.status >= 300) {
        // §2：失败返回非 2xx ＋ {"error": "<可读原因>"}。取不到可读原因就如实给状态码，不编。
        let reason = `HTTP ${uploadRes.status}`;
        try {
          const failed = JSON.parse(uploadRes.body);
          if (failed && failed.error) reason = String(failed.error);
        } catch { /* 非 JSON 失败体：保留状态码 */ }
        throw new Error(`${label}：上传失败 ${reason}`);
      }
      let uploaded;
      try {
        uploaded = JSON.parse(uploadRes.body);
      } catch {
        throw new Error(`${label}：上传响应不是合法 JSON`);
      }
      // §2：A 只依赖 url / name / size / media_type 四个字段。
      const url = String(uploaded.url || '');
      if (!/^https:\/\//u.test(url)) throw new Error(`${label}：上传响应缺少契约 §2 要求的绝对 https url`);
      if (!Number.isSafeInteger(uploaded.size) || uploaded.size < 0) throw new Error(`${label}：上传响应缺少有效 size`);
      // 本页自己传的文件，四个字段就地记下 ⇒ 正文区渲染时不必再发 HEAD。
      uploadedFileHints.set(url, {
        name: String(uploaded.name || file.name || ''),
        size: uploaded.size,
        mediaType: String(uploaded.media_type || '').split(';')[0].trim().toLowerCase(),
      });
      appendInputReference(url, uploaded.name || file.name, uploaded.size);
      renderDraftAttachments();   // 业主第 2 条：回填后立刻把缩略图摆出来
      // 🔴 顺序要紧：先渲染草稿块，done() 才看得到它、才能立即清掉完成行。
      row?.done(uploaded.size, url);

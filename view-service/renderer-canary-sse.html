<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DingWei Event View</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f7f9;
      --panel: #ffffff;
      --panel-2: #f0f3f7;
      --text: #20242a;
      --muted: #69717d;
      --line: #d8dee8;
      --accent: #0b6bcb;
      --accent-2: #0f766e;
      --danger: #b42318;
      --danger-bg: #fff1f0;
      --code-bg: #101828;
      --code-text: #e6edf3;
      --waiting-white-space: nowrap;
      --shadow: 0 12px 30px rgba(16, 24, 40, 0.08);
    }

    [data-theme="dark"] {
      color-scheme: dark;
      --bg: #111316;
      --panel: #1b1f24;
      --panel-2: #242a31;
      --text: #eef2f6;
      --muted: #a8b0bb;
      --line: #38414c;
      --accent: #6cb6ff;
      --accent-2: #7dd3c7;
      --danger: #ffb4a9;
      --danger-bg: #3a1f1f;
      --code-bg: #070b10;
      --code-text: #e6edf3;
      --shadow: 0 12px 30px rgba(0, 0, 0, 0.35);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      height: 100vh;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font: 14px/1.55 ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing: 0;
    }
    button, input { font: inherit; }
    .app {
      height: 100vh;
      min-height: 0;
      min-width: 0;
      max-width: 100vw;
      display: grid;
      grid-template-rows: auto 1fr auto;
      overflow: hidden;
    }
    .topbar {
      position: sticky;
      top: 0;
      z-index: 5;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 18px;
      background: color-mix(in srgb, var(--panel) 92%, transparent);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(10px);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }
    .mark {
      display: grid;
      place-items: center;
      width: 32px;
      height: 32px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--panel-2);
      color: var(--accent);
      font-weight: 700;
    }
    .title {
      font-size: 18px;
      font-weight: 750;
      white-space: var(--waiting-white-space);
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.2;
    }
    .subtitle {
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .lock-panel {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 10px;
      min-width: 0;
      flex-wrap: wrap;
    }
    .lock-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: 32px;
      padding: 0 10px;
      border-radius: 999px;
      border: 1px solid var(--line);
      font-weight: 750;
      white-space: nowrap;
    }
    .lock-badge.readonly {
      color: var(--danger);
      border-color: color-mix(in srgb, var(--danger) 50%, var(--line));
      background: color-mix(in srgb, var(--danger-bg) 80%, var(--panel));
    }
    .lock-badge.writable {
      color: var(--accent-2);
      border-color: color-mix(in srgb, var(--accent-2) 50%, var(--line));
      background: color-mix(in srgb, var(--accent-2) 12%, var(--panel));
    }
    .lock-help {
      color: var(--muted);
      font-size: 13px;
      white-space: nowrap;
    }
    .source-badge {
      display: inline-block;
      padding: 1px 6px;
      margin-right: 6px;
      border-radius: 4px;
      font-size: 11px;
      line-height: 16px;
      background: var(--accent, #2f6fdd);
      color: #fff;
      vertical-align: middle;
    }
    .source-badge--trusted { background: #1a7f4b; }
    /* display-provenance v1 来源图标(灰度 flag 门控) */
    .prov-ic { display: inline-flex; align-items: center; justify-content: center; width: 18px; height: 18px; border-radius: 50%; background: color-mix(in srgb, var(--accent) 18%, var(--panel)); color: var(--accent); font-size: 11px; font-weight: 600; vertical-align: middle; flex: none; }
    .prov-ic .prov-svg { width: 13px; height: 13px; display: block; }
    .prov-ic--human { background: var(--accent); color: #fff; }
    .prov-label { font-size: 12px; color: var(--muted, #888); margin: 0 4px 0 3px; vertical-align: middle; }
    .prov-spin { color: var(--muted, #888); font-size: 12px; margin-right: 4px; }
    /* 等候区在途条(张宗楚灰度反馈#2):明确「投递中」+单行截断,不与「已收到消息」混淆 */
    .waiting-item--pending { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--muted, #888); }
    .waiting-item--pending .waiting-text { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1 1 auto; min-width: 0; }
    .waiting-item--pending .prov-spin { flex: none; }
    .waiting-item--pending .waiting-stage { flex: none; }
    .card-stage-footer {
      margin-top: 4px;
      font-size: 12px;
      color: var(--muted, #888);
      display: flex;
      gap: 6px;
      align-items: center;
      flex-wrap: wrap;
    }
    .card-footnote {
      font-size: 11px;
      color: var(--muted, #888);
      border: 1px dashed var(--muted, #888);
      border-radius: 4px;
      padding: 0 4px;
    }
    .cancellable-tag {
      font-size: 11px;
      color: #b8860b;
      border: 1px solid #b8860b;
      border-radius: 4px;
      padding: 0 4px;
      margin-left: 6px;
    }
    .waiting-stage { margin-left: 6px; font-size: 11px; color: var(--muted, #888); }

    /* C2 待提交区删除/中断确认 */
    .waiting-cancel-btn {
      font-size: 11px; line-height: 1; padding: 1px 6px; margin-left: 6px;
      border: 1px solid var(--danger, #c00); color: var(--danger, #c00);
      background: transparent; border-radius: 4px; cursor: pointer;
    }
    .waiting-cancel-btn:disabled { opacity: .5; cursor: default; }
    .c2-note { margin-left: 6px; font-size: 11px; color: var(--muted, #888); }

    /* C3 责任方任务看板 */
    .taskboard-handle {
      position: fixed; right: 0; top: 40%; z-index: 40;
      writing-mode: vertical-rl; padding: 10px 6px;
      border: 1px solid var(--line, #444); border-right: none;
      border-radius: 8px 0 0 8px;
      background: var(--bg-elev, #1e1e24); color: var(--fg, #ddd);
      cursor: pointer; font-size: 13px;
    }
    .taskboard-panel {
      position: fixed; right: 0; top: 0; bottom: 0; width: 320px; z-index: 39;
      background: var(--bg-elev, #1e1e24); border-left: 1px solid var(--line, #444);
      display: flex; flex-direction: column; overflow: hidden;
    }
    .taskboard-panel[hidden] { display: none; }
    .taskboard-head { padding: 10px 12px; border-bottom: 1px solid var(--line, #444); }
    .taskboard-title { font-weight: 600; font-size: 14px; }
    .taskboard-updated { font-size: 11px; color: var(--muted, #888); margin-top: 4px; }
    .taskboard-updated.stale { color: #b8860b; }
    .taskboard-error { color: var(--danger, #d66); font-size: 13px; }
    .taskboard-list { flex: 1; overflow-y: auto; padding: 8px; display: flex; flex-direction: column; gap: 8px; }
    .task-card { border: 1px solid var(--line, #444); border-radius: 8px; padding: 8px; background: var(--bg, #16161c); }
    .task-card-head { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .task-dot { width: 8px; height: 8px; border-radius: 50%; flex: 0 0 auto; }
    .task-dot.status-todo { background: #888; }
    .task-dot.status-in_progress { background: #2f6fdd; }
    .task-dot.status-blocked { background: #d66; }
    .task-dot.status-in_review { background: #b8860b; }
    .task-dot.status-done { background: #1a7f4b; }
    .task-id { font-weight: 600; font-size: 13px; }
    .task-title { font-size: 12px; color: var(--fg, #ddd); flex: 1; }
    .task-owner { font-size: 11px; color: var(--muted, #888); }
    .task-card-body { margin-top: 6px; font-size: 12px; display: flex; flex-direction: column; gap: 4px; }
    .task-status-line { color: var(--muted, #888); font-size: 11px; }
    .task-bar { height: 4px; border-radius: 2px; background: var(--line, #444); overflow: hidden; }
    .task-bar-fill { height: 100%; background: var(--accent, #2f6fdd); }
    .task-blockers { color: #d66; font-size: 11px; }
    .task-deps { font-size: 11px; color: var(--accent, #2f6fdd); cursor: pointer; }
    .task-note { font-size: 11px; color: var(--fg, #ccc); white-space: pre-wrap; }
    .task-evidence { display: flex; align-items: center; gap: 6px; font-size: 11px; }
    .task-evidence-text { color: var(--muted, #888); word-break: break-all; flex: 1; }
    .task-evidence-copy { font-size: 10px; padding: 1px 6px; border: 1px solid var(--line, #444); border-radius: 4px; background: transparent; color: var(--fg, #ddd); cursor: pointer; }
    .task-card.status-blocked { border-color: #d66; }
    @media (max-width: 768px) {
      .taskboard-panel { width: 100%; top: auto; height: 60%; border-left: none; border-top: 1px solid var(--line, #444); }
      .taskboard-handle { top: auto; bottom: 40%; writing-mode: horizontal-tb; border-radius: 8px 8px 0 0; border: 1px solid var(--line, #444); border-bottom: none; }
    }

    .unlock-btn {
      height: 32px;
      border-radius: 6px;
      border: 1px solid var(--accent);
      background: var(--accent);
      color: #fff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 10px;
      cursor: pointer;
      white-space: nowrap;
    }
    .unlock-btn[hidden] { display: none; }
    .controls {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      flex-wrap: wrap;
    }
    .icon-btn, .text-btn, .file-label {
      height: 34px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--panel);
      color: var(--text);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 0 10px;
      cursor: pointer;
      box-shadow: none;
    }
    .icon-btn { width: 36px; padding: 0; }
    .icon-btn:hover, .text-btn:hover, .file-label:hover { border-color: var(--accent); }
    .file-label input { display: none; }
    .main {
      min-height: 0;
      min-width: 0;
      max-width: 100%;
      display: flex;
      flex-direction: column;
      width: 100%;
      margin: 0 auto;
      padding: 16px;
      overflow: hidden;
    }
    .stream-alert {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
      padding: 10px 12px;
      border: 1px solid color-mix(in srgb, var(--danger) 45%, var(--line));
      border-radius: 8px;
      background: var(--danger-bg);
      color: var(--danger);
    }
    .stream-alert[hidden] { display: none; }
    .stream-alert .text-btn { flex: 0 0 auto; }
    .timeline {
      flex: 1;
      min-width: 0;
      min-height: 0;
      max-width: 100%;
      display: flex;
      flex-direction: column;
      gap: 10px;
      overflow-y: auto;
      overscroll-behavior: contain;
      padding-right: 4px;
      scroll-behavior: smooth;
    }
    .waiting-area {
      flex: 0 0 auto;
      margin-top: 10px;
      max-height: min(35vh, 280px);
      border: 1px dashed var(--line);
      border-radius: 10px;
      background: color-mix(in srgb, var(--muted) 12%, var(--panel));
      overflow-y: auto;
      overscroll-behavior: contain;
    }
    .waiting-area[hidden] { display: none; }
    .waiting-item {
      padding: 10px 12px;
      border-top: 1px solid var(--line);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .waiting-item:first-child { border-top: none; }
    .waiting-item::before {
      content: '';
      display: inline-block;
      width: 11px;
      height: 11px;
      margin-right: 8px;
      vertical-align: -1px;
      border: 2px solid color-mix(in srgb, var(--muted) 35%, transparent);
      border-top-color: var(--muted);
      border-radius: 50%;
      animation: dw-waiting-spin .7s linear infinite;
    }
    @keyframes dw-waiting-spin { to { transform: rotate(360deg); } }
    .task-progress {
      flex: 0 0 auto;
      height: 3px;
      width: 100%;
      overflow: hidden;
      background: color-mix(in srgb, var(--accent) 15%, transparent);
      border-radius: 2px;
    }
    .task-progress[hidden] { display: none; }
    .task-progress::before {
      content: '';
      display: block;
      height: 100%;
      width: 40%;
      background: var(--accent);
      border-radius: 2px;
      animation: dw-task-indeterminate 1.1s ease-in-out infinite;
    }
    @keyframes dw-task-indeterminate {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(250%); }
    }
    @media (prefers-reduced-motion: reduce) {
      .waiting-item::before { animation: none; }
      .task-progress::before { animation-duration: 2.2s; }
    }
    .message-card, .activity-card {
      flex: 0 0 auto;      /* 关键:不被 flex 压缩,事件保持原高 → 溢出由 timeline 滚动,而不是压扁内容 */
      display: block;
      width: 100%;
      max-width: 100%;
      min-width: 0;
      border: 1px solid var(--line);
      background: var(--panel);
      border-radius: 8px;
      box-shadow: var(--shadow);
      overflow: visible;
    }
    /* T-054:辅助面板收进右侧边条,只留错误。形态对齐既有 .taskboard-handle/.taskboard-panel。 */
    .workspace-dock[hidden] { display: none; }
    .workspace-dock {
      position: fixed; right: 0; top: 58%; z-index: 40;
      display: flex; flex-direction: row-reverse; align-items: flex-start;
    }
    .workspace-dock-toggle {
      writing-mode: vertical-rl; padding: 10px 6px;
      border: 1px solid var(--danger, #d66); border-right: none;
      border-radius: 8px 0 0 8px;
      background: var(--bg-elev, #1e1e24); color: var(--danger, #d66);
      cursor: pointer; font-size: 13px; white-space: nowrap;
    }
    .workspace-dock-body {
      width: 320px; max-height: 60vh; overflow-y: auto;
      background: var(--bg-elev, #1e1e24); border: 1px solid var(--danger, #d66);
      border-radius: 8px 0 0 8px;
    }
    .workspace-dock-legacy {
      flex: 0 0 auto;
      margin-top: 10px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--panel);
      box-shadow: var(--shadow);
      overflow: hidden;
    }
    .workspace-dock-toggle, .dock-section-title {
      width: 100%;
      border: 0;
      background: transparent;
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 9px 12px;
      cursor: pointer;
      font: inherit;
      font-weight: 750;
      text-align: left;
    }
    .workspace-dock-toggle::before { content: '▸'; transition: transform .15s ease; }
    .workspace-dock-toggle[aria-expanded="true"]::before { transform: rotate(90deg); }
    .workspace-dock-label { flex: 1; }
    .dock-unread {
      min-width: 20px;
      padding: 1px 6px;
      border-radius: 999px;
      background: var(--danger);
      color: #fff;
      font-size: 11px;
      text-align: center;
    }
    .dock-unread[hidden] { display: none; }
    .workspace-dock-body { max-height: min(32vh, 260px); overflow-y: auto; border-top: 1px solid var(--line); }
    .workspace-dock-body[hidden] { display: none; }
    .dock-section + .dock-section { border-top: 1px solid var(--line); }
    .dock-section-title { cursor: default; color: var(--muted); font-size: 12px; }
    .dock-section-list { display: grid; gap: 8px; padding: 0 10px 10px; }
    .activity-card { box-shadow: none; background: var(--panel-2); }
    .toast-region {
      position: fixed;
      z-index: 100;
      top: 14px;
      right: 14px;
      display: grid;
      gap: 8px;
      width: min(420px, calc(100vw - 28px));
      pointer-events: none;
    }
    .toast {
      padding: 10px 12px;
      border: 1px solid color-mix(in srgb, var(--danger) 55%, var(--line));
      border-radius: 8px;
      background: var(--danger-bg);
      color: var(--danger);
      box-shadow: var(--shadow);
      overflow-wrap: anywhere;
    }
    .turn-group {
      flex: 0 0 auto;
      width: 100%;
      min-width: 0;
      max-width: 100%;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--panel);
      box-shadow: var(--shadow);
      overflow: hidden;
    }
    .turn-group.external { border-color: color-mix(in srgb, var(--accent) 55%, var(--line)); }
    .turn-section { min-width: 0; padding: 12px 14px; overflow-wrap: anywhere; word-break: break-word; }
    .turn-section + .turn-section { border-top: 1px solid var(--line); }
    .turn-user { background: color-mix(in srgb, var(--accent) 8%, var(--panel)); white-space: pre-wrap; font-size: 15px; }
    .turn-user .event-content { white-space: pre-wrap; }
    .turn-assistant { font-size: 15px; }
    .turn-tools { border-top: 1px solid var(--line); background: var(--panel-2); }
    .turn-tools > summary {
      cursor: pointer;
      list-style: none;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 9px 14px;
      color: var(--muted);
      font-weight: 700;
    }
    .turn-tools > summary::-webkit-details-marker { display: none; }
    .turn-tools > summary::before { content: '▸'; font-size: 12px; transition: transform .15s ease; }
    .turn-tools[open] > summary::before { transform: rotate(90deg); }
    .turn-tools-list { display: grid; gap: 8px; padding: 0 14px 12px; }
    .turn-tool-item { min-width: 0; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); overflow: hidden; }
    .turn-tool-head { display: flex; align-items: baseline; gap: 12px; padding: 9px 11px; min-width: 0; }
    .turn-tool-item pre { margin: 0; border-radius: 0; }
    /* G:超长正文折叠条 */
    .longtext-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 8px;
      padding: 8px 10px; border: 1px dashed var(--line); border-radius: 8px; background: var(--panel-2); }
    .longtext-note { color: var(--muted); font-size: 12px; flex: 1 1 auto; min-width: 180px; }
    .longtext-bar button { font: inherit; font-size: 12px; padding: 3px 10px; cursor: pointer;
      border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: inherit; }
    .longtext-bar button:hover { background: var(--panel-2); }
    .longtext-fade { position: relative; }
    .longtext-fade::after { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 40px;
      pointer-events: none; background: linear-gradient(to bottom, transparent, var(--panel)); }
    .turn-completed { padding: 6px 14px; border-top: 1px solid var(--line); color: var(--muted); font-size: 11px; text-align: right; }
    .turn-error { color: var(--danger); background: var(--danger-bg); font-weight: 600; }
    .event-meta {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-right: 8px;
      color: var(--muted);
      font-size: 12px;
      position: relative;
      vertical-align: baseline;
      white-space: nowrap;
    }
    .event-type {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--text);
      font-weight: 750;
      line-height: 1.2;
      font-size: 18px;
      flex: 0 0 auto;
    }
    .event-sent {
      color: var(--accent-2);
      font-size: 13px;
      white-space: nowrap;
      flex: 0 0 auto;
    }
    .event-time {
      color: var(--muted, #888);
      font-size: 12px;
      white-space: nowrap;
      flex: 0 0 auto;
    }
    .event-diag {
      flex: 0 0 auto;
      color: var(--muted);
      font-size: 11px;
      position: relative;
    }
    .event-diag summary {
      cursor: pointer;
      list-style: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 14px;
      line-height: 1.2;
      color: var(--muted);
    }
    .event-diag summary::-webkit-details-marker { display: none; }
    .diag-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 14px;
      height: 14px;
      border: 1px solid currentColor;
      border-radius: 50%;
      font-size: 9px;
      font-weight: 800;
      font-family: Arial, Helvetica, sans-serif;
      line-height: 1;
    }
    .event-diag-list {
      display: grid;
      gap: 3px;
      position: absolute;
      z-index: 20;
      top: 20px;
      left: 50%;
      width: min(360px, calc(100vw - 56px));
      transform: translateX(-22px);
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: var(--shadow);
      min-width: 0;
    }
    .event-diag-list code {
      display: block;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--muted);
      background: transparent;
      border: 0;
      padding: 0;
    }
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 2px 7px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--panel-2);
      color: var(--muted);
      max-width: 100%;
    }
    .status-ok { color: var(--accent-2); }
    .event-body {
      padding: 12px 14px;
      min-width: 0;
      max-width: 100%;
      overflow-wrap: anywhere;
      word-break: break-word;
    }
    .event-content {
      min-width: 0;
      max-width: 100%;
      overflow-wrap: anywhere;
      word-break: break-word;
    }
    .assistant .event-body {
      font-size: 15px;
    }
    .external {
      border-color: color-mix(in srgb, var(--accent) 55%, var(--line));
    }
    .external .event-meta { color: var(--accent); }
    .error {
      border-color: color-mix(in srgb, var(--danger) 50%, var(--line));
      background: var(--danger-bg);
    }
    .error .event-meta { color: var(--danger); }
    .error .event-body { color: var(--danger); font-weight: 600; }
    .turn-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      color: var(--muted);
    }
    .tool details {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel-2);
      overflow: hidden;
    }
    .tool summary {
      cursor: pointer;
      list-style: none;
      padding: 10px 12px;
      display: flex;
      align-items: baseline;
      justify-content: flex-start;   /* 左对齐:工具名与预览之间固定间距,不随预览长短变 */
      gap: 12px;
    }
    .tool summary::-webkit-details-marker { display: none; }
    .tool summary .event-meta { transform: translateY(8px); }
    .tool-name { font-weight: 700; flex: 0 0 auto; }
    .tool-preview {
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      min-width: 0;
      flex: 1;
      text-align: left;              /* 紧跟工具名,超长省略号截断 */
    }
    .tool pre { margin: 0; border-radius: 0; }
    /* turn 归组容器:一个回合的文本+多条工具调用竖排在一张卡里 */
    .turn-body { padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
    .turn-msg { font-size: 15px; min-width: 0; max-width: 100%; overflow-wrap: anywhere; word-break: break-word; }
    .turn-tool { min-width: 0; max-width: 100%; }
    /* 你的输入回显:与 AI 输出区分(accent 边+底色) */
    .message-card.user { border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); background: color-mix(in srgb, var(--accent) 8%, var(--panel)); }
    .message-card.user .event-body { font-size: 15px; white-space: pre-wrap; overflow-wrap: anywhere; }
    .message-card.user .event-meta { color: var(--accent); }
    .composer {
      position: sticky;
      bottom: 0;
      z-index: 6;
      width: 100%;
      min-width: 0;
      max-width: 100%;
      margin: 0 auto;
      padding: 12px 16px 18px;
      background: color-mix(in srgb, var(--bg) 92%, transparent);
      backdrop-filter: blur(10px);
    }
    .statusbar {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: nowrap;        /* 单行,不换行(否则会越堆越高) */
      overflow: hidden;
      max-width: 100%;
      min-width: 0;
      margin-bottom: 8px;
      padding: 5px 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: var(--shadow);
      color: var(--muted);
      font-size: 12px;
      line-height: 1.2;
    }
    /* 状态栏内控件压扁,贴合单行 */
    .statusbar .lock-badge { height: 24px; padding: 0 8px; font-weight: 700; }
    .statusbar .unlock-btn { height: 24px; padding: 0 8px; font-size: 12px; }
    .statusbar .icon-btn { height: 24px; width: 28px; }
    .statusbar .text-btn { height: 24px; padding: 0 8px; }
    .statusbar > * { flex: 0 0 auto; }
    /* 响应式优先级:窄屏只留 主题切换/主机时间/锁状态/解锁;够宽再依次追加 成本、身份与服务资源 */
    .sb-cost, .sb-res { display: none; }
    @media (min-width: 560px) { .sb-cost { display: inline-flex; } }
    @media (min-width: 880px) { .sb-res  { display: inline-flex; } }
    .sb-res.status-sep, .sb-cost.status-sep { display: none; }
    @media (min-width: 560px) { .status-sep.sb-cost { display: block; } }
    @media (min-width: 880px) { .status-sep.sb-res  { display: block; } }
    .status-item {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
      max-width: 100%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .status-item strong {
      color: var(--text);
      font-weight: 650;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: var(--muted);
      box-shadow: 0 0 0 2px color-mix(in srgb, currentColor 15%, transparent);
    }
    .status-dot.running { background: var(--accent-2); color: var(--accent-2); }
    .status-dot.idle { background: #d99a00; color: #d99a00; }
    .status-dot.disconnected { background: var(--danger); color: var(--danger); }
    .status-dot.readonly { background: var(--accent); color: var(--accent); }
    .status-sep {
      width: 1px;
      align-self: stretch;
      background: var(--line);
      min-height: 18px;
    }
    .composer-inner {
      display: grid;
      grid-template-columns: 1fr auto auto;
      align-items: end;
      gap: 8px;
      border: 1px solid var(--line);
      background: var(--panel);
      border-radius: 8px;
      padding: 8px;
      box-shadow: var(--shadow);
    }
    textarea {
      width: 100%;
      min-height: 42px;
      max-height: 140px;
      resize: none;
      overflow-y: auto;
      color: var(--text);
      background: transparent;
      border: 0;
      outline: none;
      padding: 8px;
    }
    textarea:disabled {
      cursor: not-allowed;
      color: var(--muted);
    }
    .send { background: var(--accent); color: white; border-color: var(--accent); }
    .interrupt { color: var(--danger); }

    .md { min-width: 0; max-width: 100%; overflow-wrap: anywhere; word-break: break-word; }
    .md > *:first-child { margin-top: 0; }
    .md > *:last-child { margin-bottom: 0; }
    .md h1, .md h2, .md h3 {
      margin: 18px 0 8px;
      line-height: 1.25;
    }
    .md h1 { font-size: 22px; }
    .md h2 { font-size: 18px; }
    .md h3 { font-size: 16px; }
    .md p { margin: 0 0 11px; }
    .md a { color: var(--accent); text-decoration-thickness: 1px; }
    .md blockquote {
      margin: 10px 0;
      padding: 8px 12px;
      border-left: 3px solid var(--accent);
      background: var(--panel-2);
      color: var(--muted);
    }
    .md hr { border: 0; border-top: 1px solid var(--line); margin: 16px 0; }
    .md ul, .md ol { padding-left: 24px; margin: 8px 0 12px; }
    .md > ul:first-child, .md > ol:first-child { margin-top: 0; }
    .md li { margin: 4px 0; }
    .md input[type="checkbox"] { transform: translateY(1px); }
    .md code:not(pre code) {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      background: var(--panel-2);
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 1px 4px;
      white-space: normal;
      overflow-wrap: anywhere;
      word-break: break-word;
    }
    .table-wrap, .code-wrap {
      width: 100%;
      max-width: 100%;
      min-width: 0;
      overflow-x: auto;
      margin: 12px 0;
      border-radius: 8px;
    }
    table {
      width: max-content;
      min-width: 100%;
      border-collapse: collapse;
      background: var(--panel);
      border: 1px solid var(--line);
    }
    th, td {
      padding: 8px 10px;
      border: 1px solid var(--line);
      text-align: left;
      vertical-align: top;
      white-space: nowrap;
    }
    th { background: var(--panel-2); font-weight: 700; }
    tbody tr:nth-child(even) { background: color-mix(in srgb, var(--panel-2) 55%, transparent); }
    .code-wrap {
      position: relative;
      background: var(--code-bg);
      border: 1px solid color-mix(in srgb, var(--line) 40%, transparent);
    }
    .code-toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      padding: 7px 8px;
      color: #aab4c0;
      border-bottom: 1px solid rgba(255,255,255,0.12);
      font-size: 12px;
    }
    .copy-code {
      height: 26px;
      padding: 0 8px;
      border-radius: 5px;
      border: 1px solid rgba(255,255,255,0.18);
      background: rgba(255,255,255,0.06);
      color: #e6edf3;
      cursor: pointer;
    }
    pre {
      margin: 0;
      padding: 12px;
      overflow-x: auto;
      max-width: 100%;
      color: var(--code-text);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 13px;
      line-height: 1.55;
      white-space: pre;
      tab-size: 4;
    }
    .tok-kw { color: #ff7b72; }
    .tok-str { color: #a5d6ff; }
    .tok-num { color: #79c0ff; }
    .tok-com { color: #8b949e; }
    .tok-fn { color: #d2a8ff; }

    @media (max-width: 860px) {
      .main { padding: 10px; }
      .message-card, .activity-card { display: block; }
      .topbar { align-items: flex-start; flex-direction: column; }
      .lock-panel { justify-content: flex-start; }
      .lock-help { white-space: normal; }
      .controls { justify-content: flex-start; }
      .composer { padding: 10px; }
      .composer-inner { grid-template-columns: 1fr auto; }
      .interrupt { grid-column: 2; }
    }
  </style>
</head>
<body data-theme="light">
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <div class="title" id="headerSessionName">demo</div>
      </div>
    </header>

    <main class="main">
      <section class="stream-alert" id="streamAlert" role="alert" hidden>
        <span>⚠️ 事件流连接不上——可能打开了太多 web-view 页窗口（Chrome 每个域名最多 6 个连接），请关闭多余窗口后点【重试】</span>
        <button class="text-btn" id="streamRetryBtn" type="button">重试</button>
      </section>
      <div class="task-progress" id="taskProgress" hidden aria-hidden="true"></div>
      <section class="timeline" id="timeline" aria-live="polite"></section>
      <section class="waiting-area" id="waitingArea" aria-label="等待接纳的消息" aria-live="polite" hidden>
        <div id="waitingList"></div>
      </section>
    </main>
    <!-- T-054:错误看板,右侧贴边;无错误时整体不显示 -->
    <section class="workspace-dock" id="workspaceDock" aria-label="错误看板" hidden>
      <button class="workspace-dock-toggle" id="workspaceDockToggle" type="button" aria-expanded="false" aria-controls="workspaceDockBody">
        <span class="workspace-dock-label">错误看板</span><span class="dock-unread" id="workspaceDockUnread" hidden>0</span>
      </button>
      <div class="workspace-dock-body" id="workspaceDockBody" hidden>
        <section class="dock-section" data-dock-section="activity" aria-labelledby="activitySectionTitle">
          <div class="dock-section-title" id="activitySectionTitle"><span>错误</span></div>
          <div class="dock-section-list" id="activityList" role="log" aria-live="polite"></div>
        </section>
      </div>
    </section>
    <div class="toast-region" id="toastRegion" aria-live="assertive" aria-atomic="true"></div>

    <footer class="composer">
      <div class="statusbar" aria-label="Session status">
        <!-- 优先级1(始终显示):主题切换 · 主机时间 · 锁状态 · 解锁按钮 -->
        <button class="icon-btn" id="themeBtn" type="button" title="切换黑夜/白天">◐</button>
        <span class="status-item">🕐 <strong id="localTime">--:--:--</strong></span>
        <span class="lock-badge readonly" id="lockBadge">🔒 只读</span>
        <button class="unlock-btn" id="copyUnlockBtn" type="button">复制解锁指令</button>
        <!-- 优先级2(够宽追加):成本 -->
        <span class="status-sep sb-cost"></span>
        <span class="status-item sb-cost">本次 <strong id="turnCost">$0.0000</strong></span>
        <span class="status-item sb-cost">累计 <strong id="totalCost">$0.0000</strong></span>
        <!-- 优先级3(更宽追加):头部身份 + 详情 + 服务资源 -->
        <span class="status-sep sb-res"></span>
        <span class="status-item sb-res" id="lockHelp">🔒 只读模式 · 输入被锁</span>
        <span class="status-item sb-res">归属 <strong id="headerOwner">--</strong></span>
        <span class="status-item sb-res"><span class="status-dot idle" id="sessionDot"></span><strong id="sessionState">空闲</strong></span>
        <span class="status-item sb-res">内存 <strong id="memStat">--</strong></span>
        <span class="status-item sb-res">磁盘 <strong id="diskStat">--</strong></span>
        <span class="status-item sb-res">负载 <strong id="loadStat">--</strong></span>
        <span class="status-item sb-res">模型 <strong id="modelStat">--</strong></span>
        <span class="status-item sb-res">会话 <strong id="sessionName">--</strong></span>
        <button class="text-btn sb-res" id="reconnectBtn" type="button" title="重连事件流">重连</button>
      </div>
      <div class="composer-inner">
        <textarea id="humanInput" rows="1" placeholder="输入消息；Enter 发送，Ctrl/Cmd/Shift+Enter 换行"></textarea>
        <button class="icon-btn interrupt" id="interruptBtn" type="button" title="Interrupt current turn">■</button>
        <button class="text-btn send" id="sendBtn" type="button">发送</button>
      </div>
    </footer>
  </div>

  <script>
    const timeline = document.getElementById('timeline');
    const waitingArea = document.getElementById('waitingArea');
    const waitingList = document.getElementById('waitingList');
    const workspaceDock = document.getElementById('workspaceDock');
    const workspaceDockToggle = document.getElementById('workspaceDockToggle');
    const workspaceDockBody = document.getElementById('workspaceDockBody');
    const workspaceDockUnread = document.getElementById('workspaceDockUnread');
    const toastRegion = document.getElementById('toastRegion');
    const themeBtn = document.getElementById('themeBtn');
    const reconnectBtn = document.getElementById('reconnectBtn');
    const streamAlert = document.getElementById('streamAlert');
    const streamRetryBtn = document.getElementById('streamRetryBtn');
    const humanInput = document.getElementById('humanInput');
    const headerSessionName = document.getElementById('headerSessionName');
    const headerOwner = document.getElementById('headerOwner');
    const lockBadge = document.getElementById('lockBadge');
    const lockHelp = document.getElementById('lockHelp');
    const copyUnlockBtn = document.getElementById('copyUnlockBtn');
    const sessionDot = document.getElementById('sessionDot');
    const sessionState = document.getElementById('sessionState');
    const taskProgress = document.getElementById('taskProgress');
    const memStat = document.getElementById('memStat');
    const diskStat = document.getElementById('diskStat');
    const loadStat = document.getElementById('loadStat');
    const localTime = document.getElementById('localTime');
    const modelStat = document.getElementById('modelStat');
    const sessionName = document.getElementById('sessionName');
    const turnCost = document.getElementById('turnCost');
    const totalCost = document.getElementById('totalCost');

    // VS 代理端点自定位 scoped base(M1):保留 /view 前全部 pathname 前缀(/dingwei/view/<sess>/ → /dingwei/view/<sess>),
    // 未命中(根直出/nginx)→''=根相对。VS _serve_file 字面量改写降为冗余(本处不再含 ''/ep'' 引号字面量,不会双前缀)。
    // 懒解析(生产边角实证:bare POST /control=404):每次取当前 pathname,防 init 时 URL 未就绪/未来客户端跳转;
    // 根直出恒 ''(F5 不受影响)。注:本页不 mutate URL,空 base 另一主因=缓存旧件根绝对端点(部署侧缓存课题)。
    const apiBase = () => (location.pathname.match(/^(.*?\/view\/[^/]+)/) || [null, ''])[1];
    const apiEp = p => apiBase() + '/' + p;
    // API=init 快照,仅供诊断/测试读取;请求路径一律走 apiEp() 懒解析,勿再新增 API.x 调用点。
    const API = {
      events: apiEp('events'),
      input: apiEp('input'),
      interrupt: apiEp('interrupt'),
      control: apiEp('control'),
      status: apiEp('status'),
      page: apiEp('page'),
      tasks: '/tasks',  // 全局投影端点(C3:VS_TASKS_FILE 快照,非 session 子路径;生产 VS 尚无 handler)——不 scoped,勿拼 base
    };
    let eventSource = null;
    let eventSourceGeneration = 0;
    let streamConnectTimer = null;
    const STREAM_CONNECT_GRACE_MS = 7500;
    let statusTimer = null;
    let rendered = 0;
    const messageBuffers = new Map();
    const messageNodes = new Map();
    const turnGroups = new Map();
    // ── View 长文本卡死 hotfix(A 节流 / B·C 上限 / D 缓存回收)──
    // 症状:7964 字契约文本使页面假死。根因=每个 SSE chunk 都触发一次全量 rebuildTurn +
    // renderMarkdown(整段历史文本),单回合 N 个 chunk ⇒ 近平方级重建。
    // B/C:时间线承载的「完整消息卡/回合卡」上限(不是 SSE chunk 数)。
    // 200 是**业主硬约束**(「始终最新 200 条」),不是性能取舍项。
    // 我曾据"200 与 500 只差 +486ms"把它改成 500,那是把硬约束当成了可优化的建议 —— 已按令改回。
    // 性能上 200/500 都不是闸门(真闸门是 H 的渲染死循环与 A 的每 chunk 全量重渲),
    // 故这里取 200 不带来任何性能代价;要改必须先改约束,不能由执笔按"技术最优"自决。
    // ── 2026-09-11 业主细化约束:按设备分档 ──
    // 业主原话(单位已与业主对齐:一轮=2 卡,输入/输出各一张):
    //     「PC:100 轮次 200 卡; 手机端:10 轮次 20 卡」
    // 🔴 **PC 档维持 200 不变** —— 即业主原有硬约束「始终最新 200 条」原样保留,
    //    本次只新增窄屏档。上一位执笔曾据性能把 200 改成 500 被退回并留言
    //    「要改必须先改约束,不能由执笔按技术最优自决」;该约束本次**未被改动**。
    // ⚠️ 计数单位是**时间线子节点数**。输入/输出各自成卡时 200 节点≈100 轮;
    //    若某些消息走回合分组渲染(turn-group 一个节点=一整轮),同样 200 节点会装下
    //    多达 200 轮 —— 即上限在分组模式下比预期**松**。本次不处理,记录在案。
    const NARROW_VIEWPORT_PX = 768;   // 与既有回归用的两档视口(1280/390)对齐
    function timelineMaxCards() {
      const w = (typeof window !== 'undefined' && window.innerWidth) || 1280;
      return w < NARROW_VIEWPORT_PX ? 20 : 200;   // 业主定:手机 10 轮次(20 卡)/ PC 100 轮次(200 卡)
    }
    // ── G:超长正文文件化 ───────────────────────────────────────
    // 业主定的方向:长文本本该落文件、直接读文件,不该在 View 页内联全量展示。
    // 超过阈值的回合正文**不再整段进 markdown**,只内联渲染开头一段摘要,
    // 其余通过[打开全文](Blob 新标签页)/[下载 .md]/[复制全文]取用 —— 正文一个字不丢。
    // 关键不变量:**内联渲染看到的字符数上界 = 摘要长度,与正文总长无关** ⇒ 渲染成本与长度解耦。
    // 这是治本的一层:A(节流)压的是频次、E(去重)断的是增长源、G 断的是"长度→成本"这条因果。
    const LONGTEXT_THRESHOLD = (typeof window !== 'undefined' && window.DW_LONGTEXT_THRESHOLD) || 4000;
    const LONGTEXT_EXCERPT = (typeof window !== 'undefined' && window.DW_LONGTEXT_EXCERPT) || 1200;
    const RENDER_THROTTLE_MS = 80;       // A:重渲合并窗口(要求区间 50~100ms)
    const assistantEntries = new Map();  // messageKey -> 渲染记录(非 turn 分组的流式助手卡)
    const pendingRenders = new Set();    // 待重渲的 turn group / assistant 记录
    let renderFlushTimer = null;
    let renderFlushFrame = null;
    const waitingDeliveries = new Map();
    // ── C2 control 地基(待提交区删除 + 中断确认)──
    // 传输层:默认真接 VS POST /control(仅 kind=cancel;VS 恒 200 {"ok":bool},ok=false=未受理/已注入/终态);
    // body 契约(派单②,与 devof5 书面冻结):legacy={kind,message_id,delivery_id} 三字段;
    // V2(生产)=补 page_id+page_token(VS authorize_page 授权,取自 pageIdentity,与 /input 同一对)+request_id(hub 幂等去重)。
    // window.C2_CONTROL_TRANSPORT 可注入覆盖(测试)。

    // ⚠️ 非用户来源的 scroll 只允许把跟随标志**置真**(到底了),不允许置假 ——
    //    否则浏览器挪一下就把跟随权拿走,正是旧实现的病根。
    const USER_SCROLL_GESTURE_MS = 400;
    const FOLLOW_RELEASE_GAP_PX = 160;   // 约两三行高:少于此距离的偏移不视为「用户要看历史」
    const SCROLL_KEYS = new Set(['PageUp', 'PageDown', 'Home', 'End', 'ArrowUp', 'ArrowDown', ' ', 'Spacebar']);
    let lastUserScrollGestureAt = 0;
    const markUserScrollGesture = () => { lastUserScrollGestureAt = Date.now(); };
    // ⚠️ 监听挂在 document 上而非 timeline 上:滚动条拖拽、触控板惯性、指针落在子元素
    // 或 timeline 外沿时,事件不一定经过 timeline。**宁可把手势判宽一点** ——
    // 判宽的代价是「用户滚了但我们没跟随」(用户自己再滚回底即可);
    // 判窄的代价是「浏览器滚了却被当成用户」,那正是本次要修的病根。
    for (const type of ['wheel', 'touchstart', 'touchmove', 'mousedown', 'pointerdown']) {
      document.addEventListener(type, markUserScrollGesture, { passive: true, capture: true });
    }
    document.addEventListener('keydown', (e) => { if (SCROLL_KEYS.has(e.key)) markUserScrollGesture(); }, { capture: true });

    timeline.addEventListener('scroll', () => {
      const nearBottom = isTimelineNearBottom();
      const byUser = (Date.now() - lastUserScrollGestureAt) <= USER_SCROLL_GESTURE_MS;
      if (replayInProgress && !nearBottom && byUser) {
        // 用户在初始窗口内**主动**上翻时立即交还滚动控制权；后续 live 事件
        // 只能在用户仍贴底时跟随。
        finishTimelineReplay(false);
        if (followScrollFrame !== null) {
          cancelAnimationFrame(followScrollFrame);
          followScrollFrame = null;
        }
      }
      // 🔴 迟滞(T-076):贴底判据用于「要不要跟随」很合适,但用于「要不要**放弃**跟随」太敏感。
      // 实测窄屏 20 卡:淘汰使位置被推离底部仅 **60px**,恰落在用户手势窗口内,
      // 于是被判成「用户想看历史」而永久交还跟随权 —— 连续流式那格 5/5 失败。
      // ⇒ 放弃跟随另立一条更宽的阈值:**离底不足 FOLLOW_RELEASE_GAP_PX 一律不放弃**。
      // 判宽的代价是「用户只滚了一点点,仍会被带回底」(再滚多一点即可);
      // 判窄的代价是「淘汰抖一下就永久失去跟随」,即本次要修的病。
      const gap = timeline.scrollHeight - timeline.clientHeight - timeline.scrollTop;
      if (nearBottom) timelineAtBottom = true;
      else if (byUser && gap > FOLLOW_RELEASE_GAP_PX) timelineAtBottom = false;
    }, { passive: true });

    const timelineResizeObserver = new ResizeObserver(() => {
      // Markdown、折叠区、字体等在 append 后继续增高时补一次到底；用户已
      // 上翻则 timelineAtBottom=false，不取得滚动控制权。
      if (replayInProgress || timelineAtBottom) scheduleTimelineToBottom();
    });
    function observeTimelineNode(node) {
      timelineResizeObserver.observe(node);
    }
    const timelineMutationObserver = new MutationObserver(records => {
      for (const record of records) {
        record.addedNodes.forEach(node => {
          if (node.nodeType === Node.ELEMENT_NODE) observeTimelineNode(node);
        });
        record.removedNodes.forEach(node => {
          if (node.nodeType === Node.ELEMENT_NODE) timelineResizeObserver.unobserve(node);
        });
      }
    });
    timelineMutationObserver.observe(timeline, { childList: true });

    function resetConversation() {
      rendered = 0;
      messageBuffers.clear();
      messageNodes.clear();
      turnGroups.clear();
      waitingDeliveries.clear();
      // D:重置会话时一并清渲染队列与输入卡索引,否则这些 Map 指向已被 textContent='' 摘掉的游离节点
      assistantEntries.clear();
      pendingRenders.clear();
      cancelRenderFlush();
      c1InputCards.clear();
      c1PendingUpdates.clear();
      // T-041 的第二处同类漏点(诊断 T-043 时顺带发现):c1DeliveryCards 是 deliveryId -> messageKey
      // 的反向索引,键不是 messageId,上面两句清不到它 => 重置后仍留着指向已清空卡片的悬挂键。
      // 实测重置前 dlv=5/cards=5,重置后 dlv=5/cards=0。与 releaseTimelineNode 处同源,一并清。
      c1DeliveryCards.clear();
      stats.turns = 0;
      stats.cost = 0;
      stats.turnCost = 0;
      stats.lastTurnCostTotal = 0;
      timeline.textContent = '';
      waitingList.textContent = '';
      waitingArea.hidden = true;
      for (const section of dockSections.values()) section.list.textContent = '';
      toastRegion.textContent = '';
      dockUnreadCount = 0;
      workspaceDock.hidden = true;  // T-054:清空后回到「无错误则不显示」
      updateDockUnread();
      setDockExpanded(false);
      beginTimelineReplay();
      scrollTimelineToBottom();
      updateMetrics();
    }

    // ── C3 责任方任务看板(右侧折叠浮窗,只读)──
    const taskBoard = {
      handle: null, panel: null, listEl: null, headEl: null,
      data: null, lastGood: null, lastGoodAt: 0,
      collapsed: sessionStorage.getItem('dw-taskboard-collapsed') !== '0',
      STALE_MS: 600000,
    };

    function taskBoardEnsureDom() {
      if (taskBoard.handle) return;
      const handle = document.createElement('button');
      handle.type = 'button';
      handle.className = 'taskboard-handle';
      handle.setAttribute('aria-label', '任务看板');
      const panel = document.createElement('aside');
      panel.className = 'taskboard-panel';
      panel.hidden = true;
      panel.innerHTML = '<div class="taskboard-head"></div><div class="taskboard-list"></div>';
      document.body.append(handle, panel);
      taskBoard.handle = handle;
      taskBoard.panel = panel;
      taskBoard.headEl = panel.querySelector('.taskboard-head');
      taskBoard.listEl = panel.querySelector('.taskboard-list');
      handle.addEventListener('click', event => {
        event.stopPropagation();
        taskBoardSetCollapsed(!taskBoard.collapsed);
      });
      // 点击主区域即收起,浮层不拦截外部事件
      document.addEventListener('click', event => {
        if (!taskBoard.collapsed && !panel.contains(event.target) && event.target !== handle) {
          taskBoardSetCollapsed(true);
        }
      });
      taskBoardSetCollapsed(taskBoard.collapsed);
    }

    function taskBoardSetCollapsed(collapsed) {
      taskBoard.collapsed = collapsed;
      sessionStorage.setItem('dw-taskboard-collapsed', collapsed ? '1' : '0');
      taskBoard.panel.hidden = collapsed;
      taskBoardRenderHandle();
    }

    function taskBoardActiveCount() {
      const tasks = (taskBoard.lastGood || taskBoard.data)?.tasks || [];
      return tasks.filter(t => t.status === 'in_progress' || t.status === 'blocked').length;
    }

    function taskBoardRenderHandle() {
      taskBoard.handle.textContent = `📋 任务看板 (${taskBoardActiveCount()})`;
    }

    const TASK_STATUS_META = {
      todo: { label: '待办', cls: 'todo' },
      in_progress: { label: '进行', cls: 'in_progress' },
      blocked: { label: '阻塞', cls: 'blocked' },
      in_review: { label: '评审', cls: 'in_review' },
      done: { label: '完成', cls: 'done' },
    };

    function taskBoardSortTasks(tasks) {
      const groupOrder = { a: 0, b: 1, c: 2, cross: 3 };
      const statusOrder = { blocked: 0, in_progress: 1, in_review: 2, todo: 3, done: 4 };
      return [...tasks].sort((x, y) =>
        (groupOrder[x.group] ?? 9) - (groupOrder[y.group] ?? 9) ||
        (statusOrder[x.status] ?? 9) - (statusOrder[y.status] ?? 9) ||
        String(y.updated_at || '').localeCompare(String(x.updated_at || '')));
    }

    function taskBoardIsStale() {
      // 新鲜度按数据 envelope.updated_at(非拉取时间)
      const upd = (taskBoard.lastGood || taskBoard.data)?.updated_at;
      if (!upd) return false;
      const t = Date.parse(upd);
      return !Number.isNaN(t) && (Date.now() - t > taskBoard.STALE_MS);
    }

    async function taskBoardRefresh() {
      taskBoardEnsureDom();
      try {
        const res = await fetch(API.tasks, { cache: 'no-store' });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        if (!data || !Array.isArray(data.tasks)) throw new Error('bad payload');
        taskBoard.data = data;
        taskBoard.lastGood = data;
        taskBoard.lastGoodAt = Date.now();
      } catch (err) {
        // 失败保留上次数据(陈旧标记);首次失败显示错误态
        taskBoard.data = taskBoard.lastGood ? { ...taskBoard.lastGood, __error: String(err.message || err) } : { __error: String(err.message || err), tasks: [] };
      }
      taskBoardRender();
    }

    function taskBoardRender() {
      taskBoardRenderHandle();
      const data = taskBoard.data;
      const head = taskBoard.headEl;
      const list = taskBoard.listEl;
      head.textContent = '';
      list.textContent = '';
      if (!data || data.__error !== undefined && !data.tasks?.length) {
        const err = document.createElement('div');
        err.className = 'taskboard-error';
        err.textContent = '看板数据暂不可用';
        head.appendChild(err);
        return;
      }
      const tasks = data.tasks || [];
      const allDone = tasks.length > 0 && tasks.every(t => t.status === 'done');
      const stale = !allDone && taskBoardIsStale();
      const doneCount = tasks.filter(t => t.status === 'done').length;
      const title = document.createElement('div');
      title.className = 'taskboard-title';
      title.textContent = `${data.project || '任务看板'} · ${doneCount}/${tasks.length} 完成`;
      head.appendChild(title);
      if (data.updated_at) {
        const upd = document.createElement('div');
        upd.className = 'taskboard-updated' + (stale ? ' stale' : '');
        upd.textContent = `数据更新于 ${data.updated_at}${stale ? '(可能已陈旧)' : ''}`;
        head.appendChild(upd);
      }
      if (data.__error) {
        const warn = document.createElement('div');
        warn.className = 'taskboard-updated stale';
        warn.textContent = '刷新失败,显示上次数据';
        head.appendChild(warn);
      }
      for (const task of taskBoardSortTasks(tasks)) {
        list.appendChild(taskBoardRenderCard(task, tasks));
      }
    }

    function taskBoardRenderCard(task, allTasks) {
      const meta = TASK_STATUS_META[task.status] || TASK_STATUS_META.todo;
      const card = document.createElement('div');
      card.className = `task-card status-${meta.cls}`;
      card.dataset.taskId = task.task_id || '';
      const head = document.createElement('div');
      head.className = 'task-card-head';
      const dot = document.createElement('span');
      dot.className = `task-dot status-${meta.cls}`;
      const idEl = document.createElement('span');
      idEl.className = 'task-id';
      idEl.textContent = task.task_id || '?';
      const titleEl = document.createElement('span');
      titleEl.className = 'task-title';
      titleEl.textContent = task.title || '';
      const ownerEl = document.createElement('span');
      ownerEl.className = 'task-owner';
      ownerEl.textContent = task.owner_display || task.owner || '';
      head.append(dot, idEl, titleEl, ownerEl);
      card.appendChild(head);
      const body = document.createElement('div');
      body.className = 'task-card-body';
      const statusLine = document.createElement('div');
      statusLine.className = 'task-status-line';
      statusLine.textContent = meta.label + (typeof task.progress_pct === 'number' ? ` · ${task.progress_pct}%` : '');
      body.appendChild(statusLine);
      if (typeof task.progress_pct === 'number') {
        const bar = document.createElement('div');
        bar.className = 'task-bar';
        const fill = document.createElement('div');
        fill.className = 'task-bar-fill';
        fill.style.width = `${Math.max(0, Math.min(100, task.progress_pct))}%`;
        bar.appendChild(fill);
        body.appendChild(bar);
      }
      if (task.status === 'blocked') {
        const blk = document.createElement('div');
        blk.className = 'task-blockers';
        blk.textContent = '已阻塞';   // 不渲染 raw blockers(防拓扑串),原因走 public_summary(策展)
        body.appendChild(blk);
      }
      const deps = Array.isArray(task.depends_on) ? task.depends_on.filter(Boolean) : [];
      if (deps.length) {
        const depEl = document.createElement('div');
        depEl.className = 'task-deps';
        depEl.textContent = `依赖:${deps.join(', ')}`;
        depEl.title = deps.map(d => {
          const target = allTasks.find(t => t.task_id === d);
          return target ? `${d}: ${target.title}` : d;
        }).join('\n');
        depEl.addEventListener('click', event => {
          event.stopPropagation();
          const first = deps[0];
          const target = taskBoard.listEl.querySelector(`[data-task-id="${CSS.escape(first)}"]`);
          if (target) target.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        });
        body.appendChild(depEl);
      }
      if (task.public_summary) {
        const noteEl = document.createElement('div');
        noteEl.className = 'task-note';
        noteEl.textContent = task.public_summary;   // 仅 manager 维护的对外摘要
        body.appendChild(noteEl);
      }
      card.appendChild(body);
      return card;
    }

    function taskBoardStart() {
      taskBoardEnsureDom();
      taskBoardRefresh();
      setInterval(taskBoardRefresh, 5000);
    }

    // ── C1 三来源显示:事件规范化(B0 canonical 一等协议,legacy 仅迁移输入)──
    // canonical: input_posted / delivery_update;legacy: user_input(lifecycle)。
    // 优先级:canonical 受保护值永远优先,legacy 迁移值仅缺省回填,legacy source 永不带 trusted。
    // B0 §6:pty_write 与 cli_injected 是 helper_received 后的分支,pty_write(注入未确认)弱于 cli_injected;
    // 顺序必须 pty_write < cli_injected,否则后到的 pty_write 会把"已注入执行"降级成"注入未确认"
    const C1_STAGE_ORDER = ['generated', 'hub_received', 'helper_received', 'pty_write', 'cli_injected'];
    const C1_STAGE_TEXT = {
      generated: '已入队', queued: '已入队',
      hub_received: 'hub 已收', helper_received: 'helper 已收',
      cli_injected: '已注入执行', turn_admitted: '已注入执行', admitted: '已注入执行',
      pty_write: '已写入终端', busy: '暂不可投递', expired: '投递过期',
      failed: '失败', cancelled: '已取消', dead: '已终止', dropped: '已丢弃',
    };
    const C1_STAGE_FOOTER = {
      generated: '已入队', queued: '已入队',
      hub_received: 'hub 已收', helper_received: 'helper 已收',
      cli_injected: '已注入执行', turn_admitted: '已注入执行', admitted: '已注入执行',
      pty_write: '已写入终端(注入未确认)', busy: '暂不可投递(重试中)', expired: '投递过期',
      failed: '失败', cancelled: '已取消', dead: '已终止', dropped: '已丢弃',
    };
    const C1_REASON_TEXT = {
      target_offline: '目标不在线', queue_full: '队列已满，请稍后重试', timeout: '投递超时',
      session_unavailable: '会话不在线', page_unauthorized: '写权限失效',
      service_unavailable: '服务临时不可用', cancelled: '已取消',
      injection_unconfirmed: '已写入终端(注入未确认)',
      // A0 §7-amend-1(冻结 @ 6a33540/4fbd4d61):非法 UTF-8=ingress fail-closed 拒收,诚实态文案;code=invalid_utf8 已经理核 §7 冻结文本逐字确认
      invalid_utf8: '乱码无法识别',
    };
    const c1InputCards = new Map();      // messageIdKey -> { card, footer, stageIdx, footnotes:Set }
    const c1PendingUpdates = new Map();  // messageIdKey -> [norm 更新](卡片未建时缓冲)
    // ── 🔴 T-074:同一笔投递有两个名字 ────────────────────────────────
    // Hub 发 `dlv_X`(internal/m8/hub.go:3242);helper 收到后统一加前缀成 `dw-dlv_X`
    // (tools/sessionhelper/sessionhelper/unified_queue.py:_delivery_id)。
    // 渲染器此前对前缀零归一 ⇒ 合卡索引对不上 ⇒ **同一条输入渲染两遍**
    // (业主 2026-09-10 截图:一张类型标 `event` 的卡 + 一张 👤 卡,正文相同)。
    //
    // ⚠️ **不能简单「统一去掉前缀」** —— helper 的队列正是以 **dw- 形式为键**
    // (`self._by_delivery`),取消/中断必须用该形式寻址,去掉前缀会让寻址静默失效。
    // ⇒ 两个用途各用各的形式,且**与 helper 同一套规则**:
    //     合卡索引 → 去前缀(两种写法收敛到同一个键)
    //     出站寻址 → 补前缀(缺则加,与 helper _delivery_id 的规则逐字一致)
    const deliveryMergeKey = (id) => String(id || '').replace(/^dw-/, '');
    const deliveryAddrId = (id) => {
      const v = String(id || '').trim();
      return (!v || v.startsWith('dw-')) ? v : 'dw-' + v;
    };

    const c1DeliveryCards = new Map();   // deliveryMergeKey -> messageIdKey(display v1 copy 归并寻址:observed_delivery_id→primary 卡)
    const c1MergeBuf = new Map();        // deliveryId -> [{ev,timer}](primary 卡未建时的归并缓冲,带 hold 窗回落)
    const C2_MERGE_HOLD_MS = (typeof window !== 'undefined' && window.C2_MERGE_HOLD_MS) || 3000;  // 归并等待窗(copy),测试可覆盖
    const C2_ECHO_HOLD_MS = (typeof window !== 'undefined' && window.C2_ECHO_HOLD_MS) || 800;     // 回显乱序短窗(user_input echo),测试可覆盖
    function bufferMergeCopy(dlvId, ev, opts = {}) {
      const buf = c1MergeBuf.get(dlvId) || [];
      const rec = { ev, admit: !!opts.admit, footKey: opts.footKey || 'echo_merge',
        timer: setTimeout(() => flushMergeCopy(dlvId, rec), opts.holdMs || C2_MERGE_HOLD_MS) };
      buf.push(rec);
      c1MergeBuf.set(dlvId, buf);
    }
    function flushMergeCopy(dlvId, rec) {
      const buf = c1MergeBuf.get(dlvId) || [];
      const i = buf.indexOf(rec);
      if (i < 0) return;  // 窗内已归并
      buf.splice(i, 1);
      if (!buf.length) c1MergeBuf.delete(dlvId);
      // hold 窗内 primary 未现(错链/链向别视图)→照常独立渲染,绝不被 buffer 吞(生产实证:错链 copy 被隐藏)
      if (rec.admit) admitWaitingDelivery(rec.ev);
      renderEvent(rec.ev);
    }
    function c1Footnote(entry, key, text) {
      if (entry.footnotes.has(key)) return;
      entry.footnotes.add(key);
      const note = document.createElement('span');
      note.className = 'card-footnote';
      note.textContent = text;
      entry.footer.appendChild(note);
    }

    function normalizeEvent(ev) {
      const data = ev.data || {};
      const meta = ev.meta || {};
      const src = (ev.source && typeof ev.source === 'object') ? ev.source : {};
      // U5:按已协商版本严格二选一。v2=canonical;显式 v1/无版本=legacy 迁移输入。
      const rawVer = ev.schema_version ?? meta.schema_version ?? '';
      const isV2 = rawVer === 'delivery.v2' || rawVer === 2 || rawVer === '2';
      const norm = {
        messageId: ev.message_id || data.message_id || '',
        // view_observation 副本自身只有 copy_id;归并/取消寻址用被观察 primary 的 observed_delivery_id
        deliveryId: ev.observed_delivery_id || data.observed_delivery_id || ev.delivery_id || data.delivery_id || '',
        copyId: ev.copy_id || data.copy_id || '',
        turnId: ev.turn_id || data.turn_id || '',
        originDlv: ev.origin_delivery_id || data.origin_delivery_id || '',  // 归并锚(dev55 两签:helper 可信保留 hub meta.delivery_id 原样;仅相关性非鉴权)
        sourceKind: '', sourceLabel: '', sourceTrusted: false,
        stage: '', reason: '', copyKind: '', deliveryMode: '', cancellable: null,
        text: '', stageIdx: -1, conflict: '',
      };
      // canonical 受保护字段
      norm.sourceKind = src.kind || '';
      // F3:可信徽标只认规范化 trust_decision(B0 决策层),不采信 raw provenance/attested_by(ingress 侧输入,可伪造);
      // trust_decision 缺失或 != trusted 一律 fail-closed 不挂徽标
      norm.sourceTrusted = src.trust_decision === 'trusted';
      norm.sourceLabel = src.display_name || '';
      const delivery = (ev.delivery && typeof ev.delivery === 'object') ? ev.delivery : {};
      // V2 终裁:canonical=delivery.role{primary,copy,control};delivery_mode 已废、无 legacy 兼容(read-only role)
      norm.deliveryMode = delivery.role || '';
      norm.copyKind = ev.copy_kind || delivery.copy_kind || '';
      const cb = ev.cancellable ?? ev.cancelable;  // 拼写容错(hub 双l/单l 并存,契约 hygiene;行为仍只认 input_posted 原值)
      norm.cancellable = (cb === undefined) ? null : Boolean(cb);
      // provenance 块(display-provenance v1 冻结契约):canonical 可选块,hub 按可信 ingress 坐实(非转发字符串)
      const prov = (ev.provenance && typeof ev.provenance === 'object') ? ev.provenance : null;
      norm.prov = { kind: 'unknown', displayName: '', trusted: false };
      if (prov) {
        norm.prov.kind = (typeof prov.kind === 'string' && prov.kind) ? prov.kind : 'unknown';
        norm.prov.displayName = prov.display_name || '';
        const chain = Array.isArray(prov.attestation_chain) ? prov.attestation_chain : [];
        const attested = prov.attested_by === 'hub' || chain.includes('hub');
        if (prov.trust_decision === 'trusted' && attested) {
          norm.prov.trusted = true;
        } else if (prov.trust_decision === 'trusted') {
          // 块 claim trusted 但 attested_by≠hub 且 chain 不含 hub=伪造坐实 → conflict+fail-closed 不显示
          if (!norm.conflict) norm.conflict = 'provenance_attestation_forged';
        }
      }
      if (isV2) {
        // U5①:v2 必填缺失或与 legacy 同义值冲突 → schema_conflict,fail-closed(不以 legacy 回填掩盖断链)
        if (!norm.messageId) norm.conflict = 'v2_missing_message_id';
        const legacyKind = typeof data.source === 'string' ? data.source : '';
        if (!norm.conflict && norm.sourceKind && legacyKind &&
            legacyKind !== norm.sourceKind && !(legacyKind === 'user' && norm.sourceKind === 'view')) {
          norm.conflict = 'v2_legacy_source_conflict';
        }
        // raw provenance 只许审计枚举,出现 'trusted' 字面 = schema_conflict(B0:trusted 只能由 canonical trust_decision 表达)
        if (!norm.conflict && src.provenance === 'trusted') {
          norm.conflict = 'raw_provenance_trusted';
        }
        if (norm.conflict) norm.sourceTrusted = false;  // 可信徽标必须关闭
      } else {
        // U5②③:显式 v1 或无版本 → 仅迁移映射;legacy source 永不带 trusted
        if (!norm.sourceKind && typeof data.source === 'string' && data.source) {
          norm.sourceKind = data.source === 'user' ? 'human' : data.source;
          norm.sourceLabel = norm.sourceLabel || String(data.display_name || '');
          norm.sourceTrusted = false;
        }
      }
      // 事件类别归一
      if (ev.kind === 'input_posted') {
        norm.stage = ev.stage || 'generated';
        norm.text = ev.payload ?? ev.text ?? '';
      } else if (ev.kind === 'delivery_update') {
        // canonical B0 线格式:delivery_stage=管道阶段(generated/hub_received/helper_received/...),
        // delivery_status=终态状态(cancelled/failed);legacy ev.stage 仅迁移输入。
        // dev55 实证:hub 真 cancel SSE={observed_delivery_id,delivery_stage:helper_received,delivery_status:cancelled}
        norm.stage = ev.delivery_stage || ev.stage || '';
        norm.status = ev.delivery_status || '';
        if (norm.status === 'cancelled') norm.stage = 'cancelled';        // 终态取消归一(待提交区移出/时间线终态)
        else if (norm.status === 'failed') norm.stage = 'failed';
        else if (norm.status === 'dead' || norm.status === 'dropped') norm.stage = norm.status;  // 终态归一(dev56 分层:hub 补发 dead SSE 后走此径;兼容未来 dropped)
        norm.reason = ev.reason || data.reason || '';
      } else if (ev.kind === 'user_input') {
        // legacy 迁移:lifecycle 映射到 B0 §6 阶段枚举(admitted→cli_injected,其余→generated)
        const lifecycle = String(data.lifecycle || '').toLowerCase();
        norm.stage = lifecycle === 'admitted' ? 'cli_injected' : 'generated';
        norm.text = ev.text ?? '';
        if (norm.cancellable === null) norm.cancellable = norm.stage === 'generated';
      }
      norm.stageIdx = C1_STAGE_ORDER.indexOf(norm.stage === 'turn_admitted' ? 'cli_injected' : norm.stage);
      // 🔴 T-074 真正的成因在这一行(2026-09-11 实测):无 message_id 时键**退回投递号**,
      // 而投递号正是那个有两种写法的字段(Hub 发 `dlv_X`,helper 加前缀成 `dw-dlv_X`)。
      // ⇒ 同一条输入的两个事件拿到**两个不同的键** ⇒ 合卡索引永远对不上 ⇒ 画两张卡。
      // ⚠️ 组长此前的修复之所以"测试通过、线上无效",是因为测试用例**给了 message_id**,
      //    两边键自然相同;而线上事件不带 message_id,永远走这条回退分支。
      //    ——**用例比现实宽松,于是测出了绿灯。**
      // ⇒ 回退分支必须归一(去前缀),与 c1DeliveryCards 的键口径一致。
      // 🔴 T-074 真正的成因(2026-09-11 逐层查到源头):同一条输入由**两个进程**各发一个事件,
      // 且**字段构成不对称**:
      //     Hub(Go)   input_posted  internal/m8/terminal.go:496  **带 message_id**
      //     helper(Py) user_input   unified_queue.py:167         **不带 message_id**
      // ⇒ 前者键取 message_id,后者只能退回投递号 ⇒ **两个键永不相等** ⇒ 画两张卡。
      // (投递号本身还有 `dlv_X` / `dw-dlv_X` 两种写法,那是**第二层**不一致。)
      //
      // ⇒ 键改为**先查投递号索引**:同一笔投递,谁先建卡谁定键,后到的一律沿用。
      //   如此两种到达顺序都收敛到同一张卡,且不依赖任一方带 message_id。
      // ⚠️ 组长此前三版修复都"用例通过、线上无效",根因同一个:
      //   用例给两边都配了 message_id(或都不配),**比现实对称** —— 现实是一边有一边没有。
      const dlvKey = deliveryMergeKey(norm.deliveryId);
      norm.key = (dlvKey && c1DeliveryCards.get(dlvKey)) || norm.messageId || dlvKey;
      return { ...ev, _norm: norm };
    }

    function sourceBadgeHtml(norm) {
      if (!norm.sourceTrusted) return '';
      const label = {
        feishu: '飞书', view: '人工', human: '人工', system: '系统',
        agent: `Agent·${norm.sourceLabel || '未知'}`,
      }[norm.sourceKind] || '';
      return label ? `<span class="source-badge source-badge--trusted">${escapeHtml(label)}</span>` : '';
    }

    // display-provenance v1:灰度 flag(VS serve 注入 window.PROVENANCE_ICONS_V1;默认关)+来源图标
    // (仅 provenance.trusted 显示,fail-closed;inline SVG 无外部依赖,currentColor 适配主题;不认识的 kind 仅文字)
    const provFlagOn = () => !!(typeof window !== 'undefined' && window.PROVENANCE_ICONS_V1);
    const PROV_SVG = {
      feishu: '<svg class="prov-svg" viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 9.5c3.2-1 5.6-3.2 6.6-6.5.9 2.2.7 4.3-.4 6.2 1.7-.8 3-1 4.3-.9-1.2 3.2-4.3 5.4-7.7 5.4h-2.8V9.5z" fill="currentColor"/></svg>',
      agent: '<svg class="prov-svg" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="2.6" r="1.1" fill="currentColor"/><path d="M8 3.7v1.8" stroke="currentColor" stroke-width="1.2"/><rect x="3" y="5.5" width="10" height="7" rx="2" fill="currentColor"/><circle cx="5.9" cy="8.7" r="1" fill="#fff"/><circle cx="10.1" cy="8.7" r="1" fill="#fff"/><path d="M6.2 11h3.6" stroke="#fff" stroke-width=".9" stroke-linecap="round"/></svg>',
      system: '<svg class="prov-svg" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="2.4" fill="currentColor"/><path d="M8 1.8v2M8 12.2v2M1.8 8h2M12.2 8h2M3.6 3.6l1.4 1.4M11 11l1.4 1.4M12.4 3.6L11 5M5 11l-1.4 1.4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>',
      human: '<svg class="prov-svg" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="5" r="2.6" fill="currentColor"/><path d="M3 14c0-3 2.4-5 5-5s5 2 5 5v.5H3V14z" fill="currentColor"/></svg>',
    };
    function provenanceIconHtml(norm) {
      if (!provFlagOn() || !norm.prov || !norm.prov.trusted) return '';
      const fallback = { feishu: '飞书', agent: 'Agent', human: '人工', system: '系统' }[norm.prov.kind] || '';
      const label = norm.prov.displayName || fallback;
      // 精简(张宗楚灰度反馈):来源文字不占版面,可读性进 title/aria-label
      if (norm.prov.kind === 'human') {
        // 泛名(人工/human/空)=person SVG;真名=首字符头像(张宗楚→张)——泛名首字符「人」无信息量
        const generic = !label || ['人工', '人', 'human', 'Human', 'HUMAN'].includes(label);
        if (generic) return `<span class="prov-ic" title="人工" aria-label="来源:人工">${PROV_SVG.human}</span>`;
        const ch = label.trim().charAt(0);
        return `<span class="prov-ic prov-ic--human" title="${escapeHtml(label)}" aria-label="来源:人工 ${escapeHtml(label)}">${escapeHtml(ch)}</span>`;
      }
      const svg = PROV_SVG[norm.prov.kind];
      if (!svg) return '';  // 未知/扩展 kind:不显示(开放扩展不 fail)
      const kindText = { feishu: '飞书', agent: 'Agent', system: '系统' }[norm.prov.kind] || norm.prov.kind;
      return `<span class="prov-ic" title="${escapeHtml(label || kindText)}" aria-label="来源:${escapeHtml(label || kindText)}">${svg}</span>`;
    }

    function stageFooterText(norm) {
      if (norm.stage === 'failed') {
        const reason = C1_REASON_TEXT[norm.reason] || '投递失败';
        return `失败:${reason}`;
      }
      const t = C1_STAGE_FOOTER[norm.stage] || '';
      // 投递语义措辞(张宗楚#3):「已注入执行」→「已送达」——投递状态只表「送进 CLI 没有」,
      // 不暗示 CLI 在执行/在等结果(执行与回复=单独输出消息那路信号);flag 关=原措辞
      return provFlagOn() ? t.replace('已注入执行', '已送达').replace('注入未确认', '送达未确认') : t;
    }

    function c1CardFor(norm, create) {
      if (!norm.key) return null;
      let entry = c1InputCards.get(norm.key);
      if (!entry && create) {
        entry = { card: null, footer: null, stageIdx: -1, footnotes: new Set() };
        c1InputCards.set(norm.key, entry);
      }
      return entry;
    }

    function c1ApplyCardUpdate(norm) {
      const entry = c1CardFor(norm, false);
      if (!entry || !entry.footer) {
        // 卡片未建:缓冲(到达乱序时,建卡后再应用最高阶段)
        if (norm.key) {
          const list = c1PendingUpdates.get(norm.key) || [];
          list.push(norm);
          c1PendingUpdates.set(norm.key, list);
        }
        return;
      }
      c1ApplyToEntry(entry, norm);
    }

    function c1ApplyToEntry(entry, norm) {
      // 阶段单调:只前进,不回退(B0 ACK 单调约束);failed/cancelled/expired=终态直通
      if (norm.stage === 'failed' || norm.stage === 'cancelled' || norm.stage === 'expired' || norm.stage === 'dead' || norm.stage === 'dropped' || norm.stageIdx > entry.stageIdx) {
        entry.stageIdx = Math.max(entry.stageIdx, norm.stageIdx);
        const text = stageFooterText(norm);
        if (text && entry.stageEl) entry.stageEl.textContent = text;
        if (provFlagOn() && entry.sentEl) {
          const sl = eventStatusLabel({ kind: 'input_posted', _norm: norm });  // kind 用卡自身的(输入卡),不取 update 事件的
          entry.sentEl.textContent = sl;
          entry.sentEl.style.display = sl ? '' : 'none';  // 精简:常态(已注入)隐标,异常才醒目
        }
      }
      if (norm.copyKind === 'feishu_sync' && !entry.footnotes.has('feishu_sync')) {
        entry.footnotes.add('feishu_sync');
        const note = document.createElement('span');
        note.className = 'card-footnote';
        note.textContent = '已同步飞书';
        entry.footer.appendChild(note);
      }
    }

    // ── B/C/D:时间线承载上限 ────────────────────────────────────
    // B 旧实现只在 handleIncomingEvent 的**最后一个**分支裁剪,delivery_update / 待提交区转入 /
    //   echo 归并等分支全部提前 return,绕过上限;这里改为在唯一入口的出口处统一裁剪,任何分支都绕不过。
    //   初始回放、实时新消息、重连补放同样只经此一个入口(SSE onmessage),故一处即全覆盖。
    // C 计数对象=timeline 的直接子元素,即一张完整消息卡或一个回合卡;长回复不论多少 chunk 都只占 1。
    // D 逐出节点时同步清掉指向它的全部索引缓存(旧实现只清 turnGroups,其余 Map 只增不减)。
    function releaseTimelineNode(node) {
      const ds = (node && node.dataset) || {};
      if (ds.turnKey) {
        const group = turnGroups.get(ds.turnKey);
        if (group) { group.detached = true; pendingRenders.delete(group); }
        turnGroups.delete(ds.turnKey);
      }
      if (ds.messageKey) {
        const entry = assistantEntries.get(ds.messageKey);
        if (entry) { entry.detached = true; pendingRenders.delete(entry); }
        assistantEntries.delete(ds.messageKey);
        messageNodes.delete(ds.messageKey);
        messageBuffers.delete(ds.messageKey);
      }
      if (ds.messageId) {
        c1InputCards.delete(ds.messageId);
        c1PendingUpdates.delete(ds.messageId);
        // 三方合并暴露(T-041):c1DeliveryCards 是 deliveryId -> messageKey 的**反向**索引,
        // 键不是 messageId,故上面两句删不到它 —— 只增不减,与 D 条(逐出即清空全部指向该节点的索引)相悖。
        // ⚠️ 合并前此处原注称「主线有那段回收循环,随 forward-port 补回」;实测四份副本无一存在该循环,
        //    该说法不成立。不要据注释断言另一版本的内容(与今日部署制品三来源拼装同类)。
        // 按值回收:表已收敛到 CAP 量级,每次逐出一次线性扫描的代价可忽略;
        // 不给它单设上限——那正是产生本 bug 的结构(索引自成一套生命周期),复制它只会再漏一次。
        for (const [dlvId, mappedKey] of c1DeliveryCards) {
          if (mappedKey === ds.messageId) c1DeliveryCards.delete(dlvId);
        }
      }
    }

    function enforceTimelineCap() {
      const cap = timelineMaxCards();
      // ⚠️ 此处**曾经**加过一段「淘汰后显式补滚」。负向对照显示去掉它测试照样全过
      // (3/3),即它并未起作用 —— 真正治住窄屏小上限的是下方跟随判据里的**迟滞**。
      // 已删除:基于错误假设加的补丁若留着,就成了又一层「谁也不敢动的时序补丁」,
      // 而正是这类层层补丁让本缺陷长期找不到根因。**没有证据支持的代码不留。**
      while (timeline.children.length > cap) {
        const oldest = timeline.firstElementChild;
        if (!oldest) break;
        releaseTimelineNode(oldest);
        timeline.removeChild(oldest);
      }
    }

    function handleIncomingEvent(ev) {
      try {
        return dispatchIncomingEvent(ev);
      } finally {
        enforceTimelineCap();
      }
    }

    function dispatchIncomingEvent(ev) {
      ev = normalizeEvent(ev);
      c2TrackTurn(ev);  // 中断目标:运行中 turn 跟踪(turn_completed 清除)
      if (ev._norm.conflict) {
        // U5:schema_conflict 可观测(徽标已关),事件本体按不可信继续渲染
        console.warn('[c1] schema_conflict:', ev._norm.conflict);
        renderError({ kind: 'error', text: `消息格式异常(${ev._norm.conflict}),已按不可信处理`,
          data: { code: 'schema_conflict' } });
      }
      const shouldFollow = replayInProgress || timelineAtBottom;
      scheduleTimelineReplayEnd();
      // delivery_update / copy 事件:原位更新输入卡,不产生新条目
      // display v1 归并去重:route_observation 带 observed_delivery_id(链 primary)时走归并分支;无链=独立占位卡(现状回落)
      const copyMergable = provFlagOn() && ev._norm.copyKind === 'route_observation' && !!(ev.observed_delivery_id || (ev.data && ev.data.observed_delivery_id));
      if (ev.kind === 'delivery_update' || ev._norm.copyKind === 'feishu_sync' || copyMergable) {
        const norm = ev._norm;
        const wEntry = norm.deliveryId ? waitingDeliveries.get(norm.deliveryId) : null;
        if (wEntry && ['cli_injected', 'pty_write', 'failed', 'cancelled', 'expired', 'dead', 'dropped'].includes(norm.stage)) {
          // 注入/终态(含 expired 投递过期/dead 终止/dropped 丢弃):待提交区移出,以原输入事件建时间线卡(阶段由后续 update 推进)
          wEntry.node.remove();
          waitingDeliveries.delete(norm.deliveryId);
          waitingArea.hidden = waitingDeliveries.size === 0;
          renderEvent(wEntry.event);
          rendered += 1;
        } else if (wEntry && norm.stage) {
          // 未注入:原位推进待提交区条目的阶段显示
          wEntry.event._norm.stage = norm.stage;
          renderWaitingDelivery(wEntry.event);
        }
        if (copyMergable) {
          // 归并去重(display v1):observed_delivery_id→primary 卡 footnote「已回显」;
          // 卡未建/在等待区→带 hold 窗缓冲(超时独立占位,错链不隐藏)
          const pKey = norm.deliveryId ? c1DeliveryCards.get(deliveryMergeKey(norm.deliveryId)) : null;
          const pEntry = pKey ? c1InputCards.get(pKey) : null;
          if (pEntry && pEntry.footer) c1Footnote(pEntry, 'echo_merge', '已回显');
          else if (norm.deliveryId) bufferMergeCopy(norm.deliveryId, ev);
        }
        c1ApplyCardUpdate(norm);
        rendered += 1;
        updateMetrics();
        if (shouldFollow) scheduleTimelineToBottom();
        return;
      }
      // G-LIFECYCLE(张宗楚实测「测试-你好×2」):同一 delivery 的 user_input queued/accepted 阶段事件=在途占位,
      // 与 input_posted primary 的待提交区重复(双份正文+再生一个删除按钮)——flag 开一律不渲;
      // admitted(带 turn)才是单一回显渲染点(生命周期幂等,renderer 自治,不依赖 helper 改)
      if (provFlagOn() && ev.kind === 'user_input') {
        const lc = String((ev.data && ev.data.lifecycle) || '').toLowerCase();
        if (lc === 'queued' || lc === 'accepted') {
          rendered += 1;
          updateMetrics();
          return;
        }
      }
      if (isWaitingDelivery(ev)) {
        renderWaitingDelivery(ev);
        rendered += 1;
        updateMetrics();
        return;
      }
      // G-MERGE-SAME(同会话去重,dev55 设计,纯 renderer 不猜链):结构化 user_input 回显 delivery_id
      // 精确命中本视图 primary input_posted.delivery_id → 不建第二张用户卡,primary 加「已回显」footnote;
      // 乱序短窗缓冲(C2_ECHO_HOLD_MS);未命中/空 id/copy/legacy 无 id=照常独立。provenance 只取 primary canonical。
      if (provFlagOn() && ev.kind === 'user_input' && (ev._norm || {}).deliveryId) {
        const echoN = ev._norm;
        const echoKey = echoN.originDlv || echoN.deliveryId;  // 归并锚=origin_delivery_id(两签可信字段);回退=自身 id 精确命中;绝不 trim dw- 猜链
        const pKey = c1DeliveryCards.get(deliveryMergeKey(echoKey));
        const pEntry = pKey ? c1InputCards.get(pKey) : null;
        if (pEntry && pEntry.footer) {
          c1Footnote(pEntry, 'echo_merge', '已回显');
          rendered += 1;
          updateMetrics();
          if (shouldFollow) scheduleTimelineToBottom();
          return;
        }
        bufferMergeCopy(echoKey, ev, { admit: true, holdMs: C2_ECHO_HOLD_MS, footKey: 'echo_merge' });
        rendered += 1;
        updateMetrics();
        return;
      }
      admitWaitingDelivery(ev);
      renderEvent(ev);
      rendered += 1;
      updateMetrics();
      if (shouldFollow) scheduleTimelineToBottom();
    }

    function deliveryLifecycle(ev) {
      return String(ev.data?.lifecycle || ev.data?.state || ev.data?.change || '').toLowerCase();
    }

    function isWaitingDelivery(ev) {
      const norm = ev._norm || {};
      if (!norm.deliveryId || norm.turnId) return false;
      // copy 不追 ACK,不进待提交区;control 不进输入卡/待提交区;已有卡的原位更新
      if (String(norm.deliveryMode).includes('copy')) return false;
      if (norm.deliveryMode === 'control') return false;
      if (norm.key && c1InputCards.has(norm.key)) return false;
      // canonical 注入前阶段入待提交区
      if (['generated', 'queued', 'hub_received', 'helper_received'].includes(norm.stage)) return true;
      const lifecycle = deliveryLifecycle(ev);
      return lifecycle === 'queued' || lifecycle === 'waiting' || lifecycle === 'delivery_queued' ||
        (ev.kind === 'user_input' && (!lifecycle || lifecycle === 'accepted'));
    }

    function renderWaitingDelivery(ev) {
      const waitKey = ev._norm?.deliveryId || ev.delivery_id;  // 归一键:observed_delivery_id 优先(B0)
      let entry = waitingDeliveries.get(waitKey);
      if (!entry) {
        const node = document.createElement('article');
        node.className = 'waiting-item';
        node.dataset.deliveryId = waitKey;
        waitingList.appendChild(node);
        entry = { node, event: ev };
        waitingDeliveries.set(waitKey, entry);
      } else if (ev.text) {
        entry.event = ev;
      }
      entry.touched = Date.now();  // 看门狗心跳:创建/阶段推进都刷新
      entry.staleNoted = false;    // 推进重渲染清超时标记(innerHTML 已重排)
      entry.failNotedAt = null;    // 推进重渲染清失败便签标记
      const norm = ev._norm || {};
      // 寻址保真 tripwire(dev56 取证:hub 必发 message_id,缺=renderer 管道丢)——可取消条目缺 message_id 必须可观测
      if (norm.cancellable && !norm.messageId) console.warn('[c2] 可取消条目缺 message_id(寻址保真破):', { deliveryId: waitKey, kind: ev.kind, stage: norm.stage, hasMsgId: 'message_id' in ev });
      const provIc = provenanceIconHtml(norm);  // display v1:provenance 图标在场时压 legacy 文字徽标(不双标)
      const badge = provIc ? '' : sourceBadgeHtml(norm);
      const cancelTag = norm.cancellable ? '<span class="cancellable-tag">可取消</span>' : '';
      const stageText = stageFooterText(norm);
      if (provFlagOn()) {
        // 精简在途条(张宗楚灰度反馈#2):明确「⏳ 投递中」+单行截断,全文进 title——不与「已收到消息」混淆;
        // 删除寻址保留(截断足够辨认),终态仍事件驱动转出
        entry.node.classList.add('waiting-item--pending');
        entry.node.innerHTML = `${provIc}${badge}<span class="prov-spin" title="未达终态(注入/失败/取消/过期/终止)">⏳ 投递中</span>${stageText ? `<span class="waiting-stage">${escapeHtml(stageText)}</span>` : ''}<span class="waiting-text"></span>${cancelTag}`;
      } else {
        entry.node.innerHTML = `${provIc}${badge}<span class="waiting-text"></span>${cancelTag}${stageText ? `<span class="waiting-stage">${escapeHtml(stageText)}</span>` : ''}`;
      }
      const rawWaitText = entry.event.text || ev.data?.text || `delivery ${waitKey}`;  // flag 关=原样(与生产逐字)
      const waitText = provFlagOn() ? (ev._norm?.text || rawWaitText) : rawWaitText;   // flag 开:在途条用 payload 解析文本(norm.text 优先)
      entry.node.querySelector('.waiting-text').textContent = waitText;
      entry.node.querySelector('.waiting-text').title = (provFlagOn() && !waitText.startsWith('delivery ')) ? waitText : '';  // 截断时全文 hover(仅 flag 开)
      // C2:可取消条目带删除按钮;点击=发起 cancel 请求(条目的消失只由事件流 cancelled 驱动,不本地静默删)
      if (norm.cancellable && !entry.node.querySelector('.waiting-cancel-btn')) {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'waiting-cancel-btn';
        btn.textContent = '删除';
        btn.title = '请求取消该待提交输入';
        btn.addEventListener('click', () => c2RequestCancel(waitKey, entry));
        entry.node.appendChild(btn);
      }
      waitingArea.hidden = false;
      requestAnimationFrame(() => {
        waitingArea.scrollTop = waitingArea.scrollHeight;
      });
    }

    function admitWaitingDelivery(ev) {
      const waitKey = ev._norm?.deliveryId || ev.delivery_id;
      if (!waitKey || !ev.turn_id) return;
      const entry = waitingDeliveries.get(waitKey);
      if (!entry) return;
      entry.node.remove();
      waitingDeliveries.delete(waitKey);
      waitingArea.hidden = waitingDeliveries.size === 0;
      if (ev.kind !== 'user_input') {
        renderTurnEvent(ev.turn_id, { ...entry.event, turn_id: ev.turn_id });
      }
    }

    function keyFor(ev) {
      return ev.delivery_id || ev.turn_id || `cursor-${ev.cursor || rendered}`;
    }

    function turnKeyFor(ev) {
      return ev.turn_id || ev.delivery_id || '';
    }

    function compareCursor(a, b) {
      return String(a.cursor ?? '').localeCompare(String(b.cursor ?? ''), undefined, { numeric: true, sensitivity: 'base' });
    }

    function eventTypeLabel(ev) {
      // 精简:flag 开,input_posted 与 user_input 一律隐类型标(有源图标表意,无则素净;治「人/👤 双标」)
      if (provFlagOn() && (ev.kind === 'input_posted' || ev.kind === 'user_input')) return '';
      if (ev.kind === 'assistant_text') return '🤖';
      if (ev.kind === 'user_input') return '👤';
      if (ev.kind === 'tool_call') return '🔧';
      if (ev.kind === 'error') return '⚠️';
      if (ev.kind === 'state_change') return '⚙️';
      return 'event';
    }

    function eventStatusLabel(ev) {
      if (!provFlagOn()) return '✓';
      // 状态标只挂投递生命周期(input_posted);assistant/tool/error/state 等输出无投递语义→不挂(治 assistant 卡常驻 ⏳)
      if (ev.kind !== 'input_posted') return '';
      // 精简:已注入=常态不打 ✓;仅异常/非终态醒目(⏳ 未达终态 / ✗ 失败 / 🚫 已取消 / ⏰ 已过期 / ■ 已终止·已丢弃)
      const st = ev._norm?.stage || '';
      if (st === 'cancelled') return '🚫';
      if (st === 'failed') return '✗';

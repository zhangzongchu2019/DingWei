    }

    function turnKeyFor(ev) {
      return ev.turn_id || ev._norm?.turnId || ev.delivery_id || '';
    }

    function compareCursor(a, b) {
      if (Number.isFinite(a?.ts) && Number.isFinite(b?.ts) && a.ts !== b.ts) return a.ts - b.ts;
      return String(a.cursor ?? '').localeCompare(String(b.cursor ?? ''), undefined, { numeric: true, sensitivity: 'base' });
    }

    function stableAssistantItemKey(ev) {
      const itemId = ev?.data?.item_id ?? ev?.data?.params?.itemId ?? ev?.data?.item?.id;
      const threadId = ev?.data?.thread_id ?? ev?.session_id ?? ev?.data?.params?.threadId ?? '';
      const turnId = ev?.turn_id ?? ev?.data?.params?.turnId ?? '';
      if (![threadId, turnId, itemId].every(v => typeof v === 'string' && v)) return '';
      return `${threadId}\u0000${turnId}\u0000${itemId}`;
    }

    function eventTypeLabel(ev) {
      // 精简:flag 开,input_posted 与 user_input 一律隐类型标(有源图标表意,无则素净;治「人/👤 双标」)
      if (provFlagOn() && (ev.kind === 'input_posted' || ev.kind === 'user_input')) return '';
      if (ev.kind === 'assistant_text') return '🤖';
      if (ev.kind === 'user_input') return '👤';
      if (ev.kind === 'tool_call') return '🔧';
      if (ev.kind === 'error') return '⚠️';
      if (ev.kind === 'state_change') return '⚙️';
      return 'event';
    }

    function eventStatusLabel(ev) {
      if (!provFlagOn()) return '✓';
      // 状态标只挂投递生命周期(input_posted);assistant/tool/error/state 等输出无投递语义→不挂(治 assistant 卡常驻 ⏳)
      if (ev.kind !== 'input_posted') return '';
      // 精简:已注入=常态不打 ✓;仅异常/非终态醒目(⏳ 未达终态 / ✗ 失败 / 🚫 已取消 / ⏰ 已过期 / ■ 已终止·已丢弃)
      const st = ev._norm?.stage || '';
      if (st === 'cancelled') return '🚫';
      if (st === 'failed') return '✗';
      if (st === 'expired') return '⏰';
      if (st === 'dead' || st === 'dropped') return '■';
      if (['cli_injected', 'turn_processed', 'pty_write', 'turn_admitted', 'admitted'].includes(st)) return '';
      return '⏳';
    }

    function eventDiagnostics(ev) {
      return [
        ev.delivery_id ? ['delivery', ev.delivery_id] : null,
        ev.turn_id ? ['turn', ev.turn_id] : null,
        ev.cursor ? ['cursor', ev.cursor] : null,
      ].filter(Boolean);
    }

    // Generic dock shell: future sections (for example files) register one
    // list and reuse the same collapse/unread mechanics.
    const dockSections = new Map();
    let dockUnreadCount = 0;

    function registerDockSection(id) {
      const root = document.querySelector(`[data-dock-section="${id}"]`);
      const list = root?.querySelector('.dock-section-list');
      if (!root || !list) throw new Error(`missing dock section: ${id}`);
      dockSections.set(id, { root, list });
    }

    function updateDockUnread() {
      workspaceDockUnread.textContent = String(dockUnreadCount);
      workspaceDockUnread.hidden = dockUnreadCount === 0;
    }

    function setDockExpanded(expanded) {
      workspaceDockToggle.setAttribute('aria-expanded', String(expanded));
      workspaceDockBody.hidden = !expanded;
      if (expanded) {
        dockUnreadCount = 0;
        updateDockUnread();
      }
    }

    workspaceDockToggle.addEventListener('click', () => {
      setDockExpanded(workspaceDockToggle.getAttribute('aria-expanded') !== 'true');
    });

    function appendDockCard(sectionID, card) {
      const section = dockSections.get(sectionID);
      if (!section) throw new Error(`unregistered dock section: ${sectionID}`);
      section.list.appendChild(card);
      while (section.list.children.length > 500) section.list.removeChild(section.list.firstChild);
      workspaceDock.hidden = false;  // T-054:出现错误后入口才出现
      if (workspaceDockBody.hidden && !replayInProgress) {
        dockUnreadCount++;
        updateDockUnread();
      }
    }

    function showErrorToast(text) {
      const toast = document.createElement('div');
      toast.className = 'toast';
      toast.setAttribute('role', 'alert');
      toast.textContent = text || 'Unknown error';
      toastRegion.appendChild(toast);
      while (toastRegion.children.length > 3) toastRegion.removeChild(toastRegion.firstChild);
      setTimeout(() => toast.remove(), 6000);
    }

    registerDockSection('activity');
    setDockExpanded(false);

    // ══ 0.2.0.6 A 线：正文区按类型自动渲染（业主第 2 条）══════════════════
    // 契约 §3.2 · 附录 A5 · 🔴 附录 B2（组长 2026-09-18 裁定，取 (b)）。口径三条：
    //   1. 分派依据三级，按权威性排序（附录 B2 改裁为 (b′)）：
    //      ① **本页本次上传** ⇒ 用上传响应里的 media_type（§2 的四字段之一，最准）
    //      ② **收到的消息** ⇒ 发 HEAD 读**服务端声明的 Content-Type**。
    //         那是权威值；URL 扩展名只是对权威值的再解释。A5 保证这个头是对的。
    //         HEAD 返回 404 ⇒ 文件不存在或链接无效；单凭 404 不能断定过期，不画坏掉的 <img>。
    //      ③ 🔴 **降级**：HEAD 不被放行 / 网络出错 ⇒ 退回 URL 扩展名分派。
    //         组长明示 nginx `limit_except GET` 放行 HEAD **只从文档知道、未实测**
    //         （已派 prodops 在 H 收尾实测），实测通过前这条降级分支必须在。
    //      取 (b′) 而不是「只渲本页本次上传」，是因为业主要的是 **Agent 之间互传** ——
    //      接收方根本没见过那个上传响应。
    //   2. 🔴 渲染不了的一律给下载链接。不是报错，不是留一串裸 URL 文本。
    //   3. 只认本站 /f/ 直链（附录 A1 的 URL 前缀），不对任意外站 URL 做任何请求。
    const FILE_MAX_UPLOAD_BYTES = 52428800;      // 附录 A4：50 MiB = 50<<20，不是 50×1000²
    // §3.2 要求文本内联「要有长度上限，超出截断并给下载链接」但没给数值。
    // 组长裁定到达前按 256 KiB，交付件里标明这是我自选的数。
    const FILE_TEXT_INLINE_MAX = 262144;
    const FILE_URL_RE = /https?:\/\/[^\s<>"'`）】]+/gu;
    const uploadedFileHints = new Map();   // url -> {name,size,mediaType}（本页本次上传，免一次 HEAD）

    function formatFileBytes(n) {
      const bytes = Number(n) || 0;
      if (bytes < 1024) return `${bytes} B`;
      if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(1)} KiB`;
      return `${(bytes / 1024 / 1024).toFixed(1)} MiB`;
    }

    // 🔴 DW-MD-CORE:own-url BEGIN —— 【生成副本】源在 view-service/md-render-core.js 的同名段;改源后跑 md-render-core-sync.py(漂移由 test_md_render_core.py 挡)
    function canonicalPublicOrigin() {
      try {
        const raw = typeof VS_CANONICAL_ORIGIN !== 'undefined' && VS_CANONICAL_ORIGIN
          ? VS_CANONICAL_ORIGIN
          : (typeof globalThis !== 'undefined' ? globalThis.DW_CANONICAL_PUBLIC_ORIGIN : '');
        const u = new URL(raw);
        return u.protocol === 'https:' ? u.origin : '';
      } catch { return ''; }
    }

    function isOwnFileUrl(raw) {
      try {
        const u = new URL(raw, location.href);
        return u.pathname.startsWith('/f/') &&
          (u.origin === location.origin || (canonicalPublicOrigin() && u.origin === canonicalPublicOrigin()));
      } catch { return false; }
    }

    function localFileUrl(raw) {
      try {
        const u = new URL(raw, location.href);
        if (!u.pathname.startsWith('/f/') || u.origin !== canonicalPublicOrigin()) return raw;
        u.protocol = location.protocol;
        u.host = location.host;
        return u.href;
      } catch { return raw; }
    }

    function canonicalFileUrl(raw) {
      try {
        const u = new URL(raw, location.href);
        if (u.origin !== location.origin || !u.pathname.startsWith('/f/')) return raw;
        const origin = canonicalPublicOrigin();
        if (!origin) return raw;
        return origin + u.pathname + u.search + u.hash;
      } catch { return raw; }
    }
    // DW-MD-CORE:own-url END

    // 正文里的 URL 常带尾随标点（句号、右括号、中文标点），不剥掉会把它吃进路径。
    function trimUrlTail(raw) {
      return String(raw).replace(/[.,;:!?，。；：！？、)\]}」』>]+$/u, '');
    }

    const fileMetaCache = new Map();   // url -> Promise<meta|'gone'|null>；同一 URL 全页只探一次

    // HEAD 探测：ok ⇒ 服务端声明；404 ⇒ 文件不存在或链接无效；其余(405/403/网络错) ⇒ null ⇒ 走扩展名降级。
    function probeFileMeta(url) {
      if (fileMetaCache.has(url)) return fileMetaCache.get(url);
      const task = fetch(localFileUrl(url), { method: 'HEAD' })
        .then((res) => {
          if (res.ok) {
            const rawDisposition = String(res.headers.get('Content-Disposition') || '');
            return {
              mediaType: String(res.headers.get('Content-Type') || '').split(';')[0].trim().toLowerCase(),
              disposition: rawDisposition.toLowerCase(),
              // R4：接收侧的原名只能从这里来。服务端暂不带 filename（B 线 B5 在补），
              // 解不出即 '' —— **不编名字**，由调用方回退到浏览器默认行为。
              fileName: parseDispositionFilename(rawDisposition),
              size: Number(res.headers.get('Content-Length')) || 0,
            };
          }
          return res.status === 404 ? 'gone' : null;
        })
        .catch(() => null);
      fileMetaCache.set(url, task);
      return task;
    }

    // 🔴 DW-MD-CORE:ext-kind BEGIN —— 【生成副本】源在 view-service/md-render-core.js 的同名段;改源后跑 md-render-core-sync.py(漂移由 test_md_render_core.py 挡)
    // 附录 A5 那张白名单的**反向映射**，只在 HEAD 不可用时作降级依据。
    // 🔴 表外的扩展名（含 .bin）一律下载链接，不尝试内联。
    // 🔴 本表只在【降级路径】上用（HEAD 拿不到 Content-Type 时按 URL 扩展名分派）。
    //    B-11（组长 2026-09-19 授权）补两类，成因都是「B 侧本批加宽了能力，本表没跟上」：
    //    ① 音频：B 侧本批新增 audio 落盘与真实 audio MIME（mp3/m4a/flac/aac/opus/oga/wav），
    //       本表若不补，降级路径上音频一律落 download ——「否则不播」那个目的就没达成。
    //    ② 文本：B 侧 filenameTextExts 有 15 个扩展名统一出 text/plain，
    //       而本表此前只有 txt ⇒ md/csv/py/yml/json 在 HEAD 路径内联、在降级路径落 download，
    //       **同一个文件两条路径两种结果**。这里与 B 侧那张表对齐。
    //    🔴 对齐对象写死在这里，便于下次核：internal/fileservice/manager.go 的 filenameTextExts。
    //    ⚠️ 补进本表的扩展名必须与 FILE_EXT_NEVER_INLINE 不相交（④h(a) 盯着这条）。
    const FILE_EXT_KIND = {
      // 🔴 图片行必须 == `deploy/nginx-dingwei.conf` 里 `types{image/*}` 那一组(**单一事实源在 nginx**),
      //    另加一个已登记别名 `jpeg`(image/jpeg 的另一种写法;nginx 的 /f/ 只放行 jpg)。
      //    🔴 **本仓只有这一份图片扩展名清单**:markdown 就地出图(ts-No.79)也走它(经 kindFromExt),
      //    不许在别处再列一份 —— 漂移由 renderer-markdown-image-regression.js 的 G0 逐项对账
      //    (少一个、多一个、连"独有 token 在源码里出现两次"都红)。
      //    ⚠️ 补进本表的扩展名必须与 FILE_EXT_NEVER_INLINE 不相交(④h(a) 与 G0(c) 都盯着这条)。
      png: 'image', jpg: 'image', jpeg: 'image', gif: 'image', webp: 'image',
      avif: 'image', heic: 'image', bmp: 'image', tiff: 'image',
      mp4: 'video', webm: 'video',
      mp3: 'audio', m4a: 'audio', flac: 'audio', aac: 'audio', opus: 'audio', oga: 'audio', wav: 'audio',
      pdf: 'pdf',
      txt: 'text', md: 'text', csv: 'text', json: 'text', log: 'text', py: 'text', js: 'text',
      go: 'text', java: 'text', yaml: 'text', yml: 'text', toml: 'text', ini: 'text', sh: 'text', sql: 'text',
    };
    // DW-MD-CORE:ext-kind END
    // 展示用的类型文案：扩展名分派下没有响应头可读，不编造 media_type。
    const FILE_EXT_LABEL = {
      png: 'image/png', jpg: 'image/jpeg', jpeg: 'image/jpeg', gif: 'image/gif', webp: 'image/webp',
      mp4: 'video/mp4', webm: 'video/webm', pdf: 'application/pdf', txt: 'text/plain',
    };

    // 🔴 DW-MD-CORE:ext-of BEGIN —— 【生成副本】源在 view-service/md-render-core.js 的同名段;改源后跑 md-render-core-sync.py(漂移由 test_md_render_core.py 挡)
    function fileExtOf(url) {
      try {
        const last = new URL(url, location.href).pathname.split('/').pop() || '';
        const dot = last.lastIndexOf('.');
        return dot > 0 ? last.slice(dot + 1).toLowerCase() : '';
      } catch { return ''; }
    }
    // DW-MD-CORE:ext-of END

    function kindFromMediaType(mt) {
      if (!mt) return '';
      // 🔴 附录 E：SVG 可内嵌脚本 ⇒ 不内联，走下载链接。
      //    经 <img> 加载的 SVG 浏览器本就禁脚本，B 线也已把它排除在白名单外 ——
      //    但那是【别人线上的两个前提】，任一被改动这里就破了，所以本侧自己也挡一道。
      if (mt === 'image/svg+xml') return 'download';
      if (mt.startsWith('image/')) return 'image';
      if (mt.startsWith('video/')) return 'video';
      // B-11：音频与视频同一条路 —— 能播就播，播不了由 error 分支降级到下载链接。
      // 🔴 音频是被动数据（不像 svg 能带脚本），所以这里按服务端声明的真实 audio MIME 内联，
      //    而不是像文本那样统一压成一种类型；压成 text/plain 会让它根本不播。
      if (mt.startsWith('audio/')) return 'audio';
      if (mt === 'application/pdf') return 'pdf';
      // §3.2 的表写的是 text/*，附录 A5 的服务端白名单只放 text/plain。
      // 服务端真声明了 text/* 就按 text/* 内联 —— 附录 B2 定的权威值是响应头。
      // 🔴 内联一律走 <pre> 的 textContent（见 fillTextAttachment），
      //    所以 text/html 显示的是**源码文本**、不会被当 HTML 执行；比 iframe 安全。
      if (mt.startsWith('text/')) return 'text';
      return 'download';
    }
    // 🔴 DW-MD-CORE:never-inline BEGIN —— 【生成副本】源在 view-service/md-render-core.js 的同名段;改源后跑 md-render-core-sync.py(漂移由 test_md_render_core.py 挡)
    // 🔴 附录 E：这几个扩展名**永不内联**，且**不看 FILE_EXT_KIND 是否列了它们**。
    //    为什么要独立一层：今天 svg/html 不在表里，安全是靠「没写」得来的；
    //    将来有人「补全白名单」把它们加进去，降级路径就会内联 —— 而那条路径当时没有任何断言盯着。
    //    （同一形状：守卫加完就假定它会一直有效。组长 2026-09-18 在 ⑭ 闸上遇到的也是这个。）
    const FILE_EXT_NEVER_INLINE = new Set(['svg', 'svgz', 'html', 'htm', 'xhtml', 'xml']);
    function kindFromExt(url) {
      const ext = fileExtOf(url);
      if (FILE_EXT_NEVER_INLINE.has(ext)) return 'download';
      return FILE_EXT_KIND[ext] || 'download';
    }
    // DW-MD-CORE:never-inline END

    // 从 Content-Disposition 取原始文件名：支持 RFC 5987 的 filename*（可带 UTF-8 百分号编码）
    // 与普通 filename="…"。🔴 取不到就返回 ''，**绝不猜、绝不用 URL 末段冒充原名**。
    function parseDispositionFilename(raw) {
      if (!raw) return '';
      const ext = /filename\*\s*=\s*([^;]+)/i.exec(raw);
      if (ext) {
        const v = ext[1].trim().replace(/^UTF-8''/i, '');
        try { return decodeURIComponent(v); } catch { return v; }
      }
      const plain = /filename\s*=\s*("([^"]*)"|[^;]+)/i.exec(raw);
      if (plain) return (plain[2] !== undefined ? plain[2] : plain[1]).trim();
      return '';
    }

    function fileNameFromUrl(url) {
      try { return decodeURIComponent(new URL(url, location.href).pathname.split('/').pop() || '') || '文件'; }
      catch { return '文件'; }
    }

    function fileDownloadLink(url, label, fileName) {
      const a = document.createElement('a');
      a.className = 'attachment-dl';
      a.href = localFileUrl(url);
      a.rel = 'noopener noreferrer';
      a.target = '_blank';
      // R4（业主 2026-09-18：下载下来是 f5790871….bin，Word 打不开）：
      // 🔴 `download=""` 让浏览器回退用 URL 末段命名 —— 而同一张卡片上明明显示着正确的原名。
      //    **显示对了、存下来错了**：两边取的不是同一个值。
      // ⇒ 有已知原名就填；取不到留空回退现行为，不自己编。
      const name = String(fileName || '').trim();
      // 只挡目录分隔符：空格与括号是合法文件名字符（业主那个就是 `… v2 (1).docx`）。
      a.setAttribute('download', name && !/[\\/]/.test(name) ? name : '');
      a.textContent = `⬇ ${label || '下载'}`;
      return a;
    }

    function fileAttachmentShell(url, meta, hint) {
      const box = document.createElement('div');
      box.className = 'attachment';
      box.dataset.fileUrl = url;
      const head = document.createElement('div');
      head.className = 'attachment-head';
      // R5-1（业主 09-18：「一个文件链接下一个文件展示」）：文件名本身就是那条链接。
      const name = document.createElement('a');
      name.className = 'attachment-name';
      name.href = localFileUrl(url);
      name.rel = 'noopener noreferrer';
      name.target = '_blank';
      name.textContent = hint?.name || fileNameFromUrl(url);
      const facts = document.createElement('span');
      const size = hint?.size || meta?.size || 0;
      facts.textContent = [meta?.mediaType || '类型未知', size ? formatFileBytes(size) : ''].filter(Boolean).join(' · ');
      head.append(name, facts);
      box.appendChild(head);
      return box;
    }

    async function fillTextAttachment(box, url, meta, knownName) {
      const pre = document.createElement('pre');
      box.appendChild(pre);
      try {
        // Range 取头部：不为了显示一段预览把整个文件拉下来。
        const res = await fetch(localFileUrl(url), { headers: { Range: `bytes=0-${FILE_TEXT_INLINE_MAX - 1}` } });
        if (!res.ok && res.status !== 206) throw new Error(`HTTP ${res.status}`);
        const text = await res.text();
        pre.textContent = text;
        const total = Number(meta?.size) || 0;
        // 🔴 不能拿「回了 206」当截断依据：Range 覆盖了整个小文件时服务端同样回 206，
        //    那样 1.7 KiB 的文本也会被标成「已截断」。以 Content-Range 的 end/total 为准。
        const cr = /bytes\s+(\d+)-(\d+)\/(\d+)/u.exec(res.headers.get('Content-Range') || '');
        const truncated = cr
          ? Number(cr[2]) + 1 < Number(cr[3])
          : (total ? total > FILE_TEXT_INLINE_MAX : text.length >= FILE_TEXT_INLINE_MAX);
        if (truncated) {
          const note = document.createElement('div');
          note.className = 'attachment-note';
          note.textContent = `已截断：只内联前 ${FILE_TEXT_INLINE_MAX} 字节${total ? `，全文 ${formatFileBytes(total)}` : ''}`;
          box.append(note, fileDownloadLink(url, '下载完整文件', knownName));
        }
      } catch (err) {
        pre.remove();
        const note = document.createElement('div');
        note.className = 'attachment-note';
        note.textContent = `文本取回失败（${err.message}）⇒ 改给下载链接`;
        box.append(note, fileDownloadLink(url, '下载', knownName));
      }
    }

    async function buildFileAttachment(url, stillCurrent = () => true) {
      const hint = uploadedFileHints.get(url) || null;
      const ext = fileExtOf(url);
      let kind = '';
      let meta = { mediaType: '', size: 0 };
      let source = '';
      if (hint?.mediaType) {
        // ① 本页本次上传：手上就有 §2 的 media_type，不必再问服务端。
        meta = { mediaType: hint.mediaType, size: hint.size };
        kind = kindFromMediaType(hint.mediaType);
        source = 'upload';
      } else {
        const probed = await probeFileMeta(url);
        if (!stillCurrent()) return null; // superseded attachment: do not continue rendering/fetching
        if (probed === 'gone') {
          // ② HEAD 404：不存在或链接无效；不能仅凭此响应断定保留期已到。
          source = 'gone';
        } else if (probed) {
          meta = { mediaType: probed.mediaType, size: probed.size };
          // 服务端明说要当附件下（A5：白名单外 ⇒ octet-stream ＋ attachment），照办。
          kind = probed.disposition.includes('attachment') ? 'download' : kindFromMediaType(probed.mediaType);
          source = 'head';
        } else {
          // ③ 降级：HEAD 不被放行或网络出错 ⇒ 退回扩展名。
          //    nginx 放行 HEAD 尚未实测（prodops 在 H 收尾验），这条分支在实测通过前必须在。
          meta = { mediaType: FILE_EXT_LABEL[ext] || (ext ? `.${ext}` : ''), size: 0 };
          kind = kindFromExt(url);
          source = 'ext';
        }
      }
      // R4：本页上传用 uploadedFileHints 的 name；接收侧用 HEAD 解出的 Content-Disposition filename。
      //     两者都没有 ⇒ '' ⇒ fileDownloadLink 回退浏览器默认命名，不编。
      const knownName = String(hint?.name || meta?.fileName || '').trim();
      const box = fileAttachmentShell(url, meta, hint);
      box.dataset.dispatch = source;   // 供验收断言「这一张是靠哪一级定的类型」
      // 🔴 B-11 新增：把**判成了哪一类**也记下来。
      //    起因是 ④b 那条已经吃过一次亏：本机解不了 H.264 时 <video> 会自我移除，
      //    于是「判成 video 但播不了」与「根本没判成 video」在 DOM 上长得一样，
      //    用例只好写成「两种都算过」。音频同理（替身里的样本是假字节，必然解码失败）。
      //    ⇒ 把分派结果显式记成 data-kind，判定与解码能力就分开了：
      //      data-kind 验的是**分派对不对**，元素在不在验的是**这台机器能不能播**。
      box.dataset.kind = kind;
      if (source === 'gone') {
        const note = document.createElement('div');
        note.className = 'attachment-note';
        note.textContent = '文件不存在或链接无效（服务端 404）。若是 7 天前的链接，可能已过保留期。';
        box.append(note, fileDownloadLink(url, '仍要试着打开', knownName));
        return box;
      }
      if (source === 'ext') {
        const note = document.createElement('div');
        note.className = 'attachment-note';
        note.textContent = '已降级：HEAD 不可用，改按 URL 扩展名分派';
        box.appendChild(note);
      }
      switch (kind) {
        case 'image': {
          const img = document.createElement('img');
          img.src = localFileUrl(url);
          img.loading = 'lazy';
          img.alt = hint?.name || fileNameFromUrl(url);
          // 图片本身加载不出来时也不留空白：退到下载链接。
          img.addEventListener('error', () => { img.replaceWith(fileDownloadLink(url, '下载图片', knownName)); }, { once: true });
          box.appendChild(img);
          break;
        }
        case 'video': {
          const video = document.createElement('video');
          video.src = localFileUrl(url);
          video.controls = true;
          video.preload = 'metadata';
          // 🔴 下面那条下载链接是**无条件**附的（能播时也该能下载）。
          //    所以 error 分支只需把放不了的 <video> **移除**，不能再 replaceWith 出第二条 ——
          //    否则解不了码时会并排出现两个「⬇ 下载视频」（组长 2026-09-18 从我的证据截图里看出来的）。
          video.addEventListener('error', () => { video.remove(); }, { once: true });
          box.appendChild(video);
          box.appendChild(fileDownloadLink(url, '下载视频', knownName));   // 恒附一条：能播时可下载，解不了码时它就是唯一出路
          break;
        }
        case 'audio': {
          const audio = document.createElement('audio');
          audio.src = localFileUrl(url);
          audio.controls = true;
          audio.preload = 'metadata';
          // 与 video 同一形态（见上）：下载链接**无条件**附一条 ——
          // 能播时也该能存一份；解不了码时 error 分支只移除播放器，不再补第二条链接。
          audio.addEventListener('error', () => { audio.remove(); }, { once: true });
          box.appendChild(audio);
          box.appendChild(fileDownloadLink(url, '下载音频', knownName));
          break;
        }
        case 'pdf': {
          const frame = document.createElement('iframe');
          frame.src = localFileUrl(url);
          frame.title = hint?.name || fileNameFromUrl(url);
          box.appendChild(frame);
          box.appendChild(fileDownloadLink(url, '下载 PDF', knownName));   // 浏览器无内置 PDF 阅读器时仍有出路
          break;
        }
        case 'text':
          await fillTextAttachment(box, url, meta, knownName);
          break;
        default:
          // 🔴 兜底分支：其它一切 ⇒ 下载链接。业主逐字：「不能显示的，直接给出下载链接」。
          box.appendChild(fileDownloadLink(url, hint?.name || fileNameFromUrl(url), knownName));
      }
      return box;
    }

    // 挂载点放在卡片上、而不是正文里：assistant 流式重渲会整块重写正文的 innerHTML，
    // 挂在正文里的 <video> 会被每个 chunk 打断重建（播放中断）。挂卡片上则跨重渲存活。
    function fileAttachmentsHost(cardEl) {
      let host = cardEl._fileHost;
      if (!host) {
        host = document.createElement('div');
        host.className = 'attachments';
        cardEl._fileHost = host;
      }
      if (host.parentNode !== cardEl) cardEl.appendChild(host);
      return host;
    }

    // R5-2/R5-3：把正文里「已经成功渲染成附件块」的那条 URL 文本视觉隐藏。
    //
    // 🔴 三条约束，缺一不可：
    //   ① **只隐藏，不删除** —— 接收侧靠扫正文里的 /f/ 直链分派（附录 B2）；
    //      删掉等于把那条机制拆了，也会让不变式失去锚。
    //   ② **只隐藏成功渲染的** —— 过期（HEAD 404）、渲染失败的，正文原样留着，
    //      否则用户连那条 URL 都看不到、连复制都做不到。
    //   ③ 每次重渲后都要重新施加：assistant 的正文每个流式 chunk 都会重写 innerHTML，
    //      上一次包的 <span> 会被整段冲掉。
    function hideRenderedLinks(cardEl) {
      if (!cardEl || !cardEl._fileHost) return;
      const okUrls = [...cardEl._fileHost.querySelectorAll('.attachment[data-rendered="ok"]')]
        .map((b) => b.dataset.fileUrl).filter(Boolean);
      if (!okUrls.length) return;
      for (const body of cardEl.querySelectorAll('.event-content')) {
        // 🔴 跳过已经被包过的:本函数在每个附件就绪时都会重跑一遍,
        //    不跳过就会把同一条 URL 反复嵌套包裹(实测:三条链接被包成 9 层)。
        const walker = document.createTreeWalker(body, NodeFilter.SHOW_TEXT, {
          acceptNode: (n) => (n.parentElement && n.parentElement.closest('.dw-link-rendered')
            ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT),
        });
        const hits = [];
        let node = walker.nextNode();
        while (node) {
          if (okUrls.some((u) => node.nodeValue.includes(u))) hits.push(node);
          node = walker.nextNode();
        }
        for (const textNode of hits) {
          let rest = textNode;
          for (const u of okUrls) {
            const idx = rest.nodeValue.indexOf(u);
            if (idx < 0) continue;
            const mid = rest.splitText(idx);
            rest = mid.splitText(u.length);
            const span = document.createElement('span');
            span.className = 'dw-link-rendered';
            span.dataset.fileUrl = u;
            span.textContent = u;
            mid.replaceWith(span);
          }
        }
      }
    }

    function attachFileRenders(cardEl, rawText, options) {
      if (!cardEl || !rawText) return;
      const text = String(rawText);
      // A URL at the live text boundary has no completion evidence yet. Keep
      // its body text intact and wait for a delimiter or explicit card finish.
      const streaming = options?.streaming ?? cardEl._fileStreaming ?? false;
      cardEl._fileStreaming = streaming;
      cardEl._fileText = text;
      const matches = [...text.matchAll(FILE_URL_RE)];
      const urls = [...new Set(matches.map(m => trimUrlTail(m[0])))].filter(isOwnFileUrl);
      if (!urls.length) return;
      const seen = cardEl._fileSeen || (cardEl._fileSeen = new Set());
      const records = cardEl._fileRecords || (cardEl._fileRecords = new Map());
      const known = [...new Set([...seen, ...urls])];
      const longerExists = url => known.some(other => other.length > url.length && other.startsWith(url));
      // Invalidate both resolved cards and pending slots. HEAD promises are
      // shared across cards, so cancel this subscriber, not another card's HEAD.
      for (const [url, rec] of records) {
        if (!longerExists(url)) continue;
        rec.cancelled = true; rec.node.remove(); records.delete(url); seen.delete(url);
        // A removed success card no longer justifies hiding its body URL.
        // Restore text, including adjacent suffix bytes, before any new card
        // is ready; a later successful full URL may apply R5-2 again.
        for (const span of cardEl.querySelectorAll('.dw-link-rendered')) {
          if (span.dataset.fileUrl !== url) continue;
          const parent = span.parentNode;
          span.replaceWith(span.textContent);
          parent?.normalize();
        }
      }
      const tail = matches.at(-1);
      // A trailing dot may be the first byte of an extension (.md), not a
      // sentence delimiter. Only whitespace or unambiguous closing syntax can
      // close a live tail; ambiguous punctuation waits for the card finish.
      const closedTail = tail && /[)\]}」』>，。；：！？、]$/u.test(tail[0]);
      const openTail = streaming && tail && tail.index + tail[0].length === text.length &&
        !closedTail ? trimUrlTail(tail[0]) : '';
      const inlineShown = mdInlineImageUrls(cardEl);
      const host = fileAttachmentsHost(cardEl);
      for (const url of urls) {
        if (url === openTail || longerExists(url) || seen.has(url) || inlineShown.has(url)) continue;
        seen.add(url);
        const slot = document.createElement('div');
        slot.dataset.fileUrl = url;
        const rec = { node: slot, cancelled: false };
        records.set(url, rec); host.appendChild(slot);
        const current = () => !rec.cancelled && records.get(url) === rec && rec.node.parentNode === host;
        buildFileAttachment(url, current)
          .then((box) => {
            if (!current() || !box) return;
            if (mdInlineImageUrls(cardEl).has(url)) {
              slot.remove();
              if (records.get(url) === rec) { records.delete(url); seen.delete(url); }
              return;
            }
            // 404/failure bodies remain visible and copyable (R5-3).
            if (box.dataset.dispatch && box.dataset.dispatch !== 'gone') box.dataset.rendered = 'ok';
            slot.replaceWith(box); rec.node = box;
            hideRenderedLinks(cardEl);
          })
          .catch(() => {
            if (!current()) return; // rejected obsolete probe cannot resurrect its prefix
            const fallback = fileAttachmentShell(url, null, uploadedFileHints.get(url));
            fallback.appendChild(fileDownloadLink(url, '下载', uploadedFileHints.get(url)?.name || ''));
            slot.replaceWith(fallback); rec.node = fallback;
          });
      }
    }

    function finishAssistantFileRenders() {
      for (const entry of assistantEntries.values()) {
        const card = messageNodes.get(entry.key)?.closest('.message-card');
        if (entry.detached || !card?._fileStreaming) continue;
        entry.fileComplete = true;
        scheduleRender(entry, true);
      }
    }

    // 🔴 ts-No.79:markdown 就地出图 与 附件卡 之间的让位规则。
    //
    // 为什么判据是"**当前 DOM 里那张 <img> 的状态**",而不是"这条 URL 写在 markdown 语法里":
    //   · 超长正文只渲染开头摘要(LONGTEXT_EXCERPT)⇒ 摘要外的图**不会**就地出现 ⇒ 卡必须照旧建,
    //     否则那张图**直接没了**(比现状差)。
    //   · 图取不到(7 天保留期到了 / 解不了码)⇒ 就地那张撤掉 ⇒ 卡照旧给
    //     「文件已不可取(服务端 404)——可能已过 7 天保留期被清理」与「⬇ 下载图片」的出路 ⇒ 也不比现状差。
    //   🔵 两条都不是推论:renderer-markdown-image-regression.js 的 G5/G6 各钉一条。
    function mdInlineImageUrls(cardEl) {
      const urls = new Set();
      if (!cardEl || !cardEl.querySelectorAll) return urls;
      for (const img of cardEl.querySelectorAll('.event-content img[data-md-img]')) {
        const src = canonicalFileUrl(img.getAttribute('src') || '');
        if (!src) continue;
        // 🔴 加载失败(complete 且 naturalWidth==0)⇒ **不算**已就地显示 ⇒ 附件卡接手
        if (img.complete && img.naturalWidth === 0) continue;
        urls.add(src);
      }
      return urls;
    }

    function dropRenderedFileCard(cardEl, url) {
      if (!cardEl || !url || !cardEl._fileHost) return;
      for (const el of [...cardEl._fileHost.children]) {
        if (el.dataset && el.dataset.fileUrl === url) el.remove();
      }
    }

    // 每次重渲后都要重新接线(innerHTML 会把上一次的处理连同元素一起冲掉)—— 与 hideRenderedLinks 同理。
    function wireMarkdownImages(content, cardEl) {
      if (!content || !cardEl) return;
      for (const img of content.querySelectorAll('img[data-md-img]')) {
        if (img.dataset.mdWired === '1') continue;
        img.dataset.mdWired = '1';
        const url = img.getAttribute('src') || '';
        const failed = () => {
          // 就地那张取不到 ⇒ 撤掉破图标,并让附件卡接手(它带"已过期/下载"的出路,不留空白)。
          img.remove();
          attachFileRenders(cardEl, cardEl._fileText || '');
        };
        if (img.complete) {
          if (img.naturalWidth === 0) failed();
          else dropRenderedFileCard(cardEl, url);
          continue;
        }
        img.addEventListener('load', () => dropRenderedFileCard(cardEl, url), { once: true });
        img.addEventListener('error', failed, { once: true });
      }
    }

    function timelineTimestamp(node) {
      // Match the visible timeline contract: the first rendered event-time is
      // the timestamp represented by this top-level node. Provisional nodes use
      // their explicit timestamp until their event-time child is rendered.
      const rendered = Number(node?.querySelector?.('.event-time[data-ts]')?.dataset?.ts);
      if (Number.isFinite(rendered) && rendered > 0) return rendered;
      const explicit = Number(node?.dataset?.timelineTs);
      return Number.isFinite(explicit) && explicit > 0 ? explicit : NaN;
    }

    function timelineSequence(node) {
      const value = Number(node?.dataset?.timelineSeq);
      return Number.isSafeInteger(value) && value > 0 ? value : NaN;
    }

    // Epoch identifiers are opaque and random, so their lexical value cannot
    // express chronology. Assign each newly observed epoch a stable rank; a
    // later Hub epoch therefore sorts after every node from an earlier epoch.
    const timelineEpochRanks = new Map();
    let nextTimelineEpochRank = 1;
    const timelineSequencedNodes = [];
    function timelineEpochRank(epoch) {
      if (!epoch) return 0;
      if (!timelineEpochRanks.has(epoch)) timelineEpochRanks.set(epoch, nextTimelineEpochRank++);
      return timelineEpochRanks.get(epoch);
    }
    function setTimelineEventEpoch(ev, epoch) {
      if (!epoch) return;
      ev._timelineEpoch = String(epoch);
      ev._timelineEpochOrder = timelineEpochRank(ev._timelineEpoch);
    }
    function timelineEventRank(ev) {
      return Number.isSafeInteger(ev?._timelineEpochOrder)
        ? ev._timelineEpochOrder : timelineEpochRank(ev?._timelineEpoch);
    }
    function compareTimelineKey(aRank, aSeq, bRank, bSeq) {
      return aRank === bRank ? aSeq - bSeq : aRank - bRank;
    }
    function compareTimelineNodes(a, b) {
      const aTs = timelineTimestamp(a), bTs = timelineTimestamp(b);
      const aSeq = timelineSequence(a), bSeq = timelineSequence(b);
      const aRank = Number(a?.dataset?.timelineEpochOrder) || 0;
      const bRank = Number(b?.dataset?.timelineEpochOrder) || 0;
      // Within one Hub epoch, sequence is authoritative even if clocks disagree.
      // Across epochs/streams, compare the event timestamps exposed by .event-time.
      if (Number.isFinite(aSeq) && Number.isFinite(bSeq) && aRank === bRank) {
        return aSeq - bSeq;
      }
      if (Number.isFinite(aTs) && Number.isFinite(bTs) && aTs !== bTs) return aTs - bTs;
      if (Number.isFinite(aSeq) && Number.isFinite(bSeq)) {
        return compareTimelineKey(aRank, aSeq, bRank, bSeq);
      }
      if (Number.isFinite(aSeq) !== Number.isFinite(bSeq)) return Number.isFinite(aSeq) ? -1 : 1;
      return 0;
    }
    function setNodeTimelineKey(node, rank, seq) {
      node.dataset.timelineEpochOrder = String(rank);
      node.dataset.timelineSeq = String(seq);
    }
    function timelineEventsMinKey(events) {
      let best = null;
      for (const event of events) {
        const seq = Number(event?._hubSeq);
        if (!Number.isSafeInteger(seq) || seq <= 0) continue;
        const rank = timelineEventRank(event);
        if (!best || compareTimelineKey(rank, seq, best.rank, best.seq) < 0) best = { rank, seq };
      }
      return best;
    }
    function forgetTimelineSequenceNode(node) {
      const index = timelineSequencedNodes.indexOf(node);
      if (index >= 0) timelineSequencedNodes.splice(index, 1);
    }

    // Keep all top-level timeline nodes on one axis across live delivery, history replay,
    // and older-page insertion. A same-epoch Hub sequence wins; cross-stream nodes use
    // their rendered event time. Nodes without either key retain their relative position.
    function placeTimelineNode(node, fallbackBefore = null) {
      const seq = timelineSequence(node);
      const ts = timelineTimestamp(node);
      const rank = Number(node?.dataset?.timelineEpochOrder) || 0;
      const oldRank = Number(node._timelineEpochOrderAtPlacement);
      const oldSeq = Number(node._timelineSeqAtPlacement);
      const oldTs = Number(node._timelineTsAtPlacement);
      if (node.parentNode === timeline && oldRank === rank && Object.is(oldSeq, seq) && Object.is(oldTs, ts)) return;
      if (node.parentNode === timeline) {
        forgetTimelineSequenceNode(node);
        timeline.removeChild(node);
      }
      if (Number.isFinite(seq)) {
        let low = 0, high = timelineSequencedNodes.length;
        while (low < high) {
          const mid = (low + high) >>> 1;
          if (compareTimelineNodes(timelineSequencedNodes[mid], node) <= 0) low = mid + 1;
          else high = mid;
        }
        timelineSequencedNodes.splice(low, 0, node);
      }
      node._timelineEpochOrderAtPlacement = rank;
      node._timelineSeqAtPlacement = seq;
      node._timelineTsAtPlacement = ts;
      for (const current of timeline.children) {
        const currentTs = timelineTimestamp(current);
        const nodeHasKey = Number.isFinite(ts) || Number.isFinite(seq);
        const currentHasKey = Number.isFinite(currentTs) || Number.isFinite(timelineSequence(current));
        if (!nodeHasKey || !currentHasKey) continue;
        if (compareTimelineNodes(node, current) < 0) {
          timeline.insertBefore(node, current);
          return;
        }
      }
      if (fallbackBefore?.parentNode === timeline) timeline.insertBefore(node, fallbackBefore);
      else timeline.appendChild(node);
    }

    function baseCard(ev, cls = '', cardClass = 'message-card') {
      const card = document.createElement('article');
      card.className = `${cardClass} ${cls}`.trim();
      const body = document.createElement('div');
      body.className = 'event-body';
      const meta = document.createElement('span');
      meta.className = 'event-meta';
      const diag = eventDiagnostics(ev);
      meta.innerHTML = `
        ${provenanceIconHtml(ev._norm || {})}${eventTypeLabel(ev) ? `<div class="event-type">${escapeHtml(eventTypeLabel(ev))}</div>` : ''}
        ${eventStatusLabel(ev) ? `<div class="event-sent">${escapeHtml(eventStatusLabel(ev))}</div>` : ''}
        ${eventTimeHtml(ev)}
        ${diag.length ? `<details class="event-diag"><summary title="诊断" aria-label="诊断"><span class="diag-icon" aria-hidden="true">i</span></summary><div class="event-diag-list">${diag.map(([k, v]) => `<code>${escapeHtml(k)} ${escapeHtml(v)}</code>`).join('')}</div></details>` : ''}
      `;
      const content = document.createElement('span');
      content.className = 'event-content';
      body.append(meta, content);
      card.appendChild(body);
      return { card, body, content, meta };
    }

    // 业主08-05定:tool_call/state_change 独立事件卡不上时间线(与会话卡重复,状态已有待提交区/状态栏)。
    // 只挡"独立卡"出口:turn-group 数据入组、完成判定、状态栏/成本副作用均不受影响;
    // state_change 本就不产卡(renderState 仅副作用),入集合为对齐口径。input_posted 留在正文;
    // 无 turn 的 error/control/unknown 进入正文外的辅助面板。
    const HIDDEN_TIMELINE_CARD_KINDS = new Set(['tool_call', 'state_change']);

    function renderEvent(ev) {
      if (ev.kind === 'state_change' && ev.data?.change === 'session_init') return renderState(ev);
      if (ev.kind === 'input_posted') {
        const inputDelivery = ev._norm?.originDlv || ev._norm?.deliveryId || ev.delivery_id || '';
        if (inputDelivery && deliveryTurnInputs.has(deliveryMergeKey(inputDelivery))) return;
        return renderUser(ev);   // C1:canonical 输入事件,不经 turn 分组
      }
      // 🔴 T-074:legacy `user_input` 与 canonical `input_posted` 描述的是**同一条输入**,
      // 却分别落到两条渲染路径(前者经 turn 分组、后者走独立输入卡),于是同一条输入画两次。
      // ⇒ 若该笔投递**已经有卡**(合卡索引命中,前缀两种写法已归一),就让它就地更新,
      //   不另起分组节点。
      // ⚠️ **带守卫,不无条件抑制**:若 input_posted 未到(索引未命中),user_input 仍照常渲染 ——
      //   否则在只有 legacy 事件的场景下,消息会整个消失。今晚已经因无守卫的抑制栽过一次。
      const inputDelivery = ev._norm?.originDlv || ev._norm?.deliveryId || ev.delivery_id || '';
      if (ev.kind === 'user_input' && inputDelivery
          && c1DeliveryCards.has(deliveryMergeKey(inputDelivery))) {
        const key = c1DeliveryCards.get(deliveryMergeKey(inputDelivery));
        const entry = c1InputCards.get(key);
        const turnKey = turnKeyFor(ev);
        if (!turnKey) return renderUser(ev);
        retainCanonicalTrustedProvenance(entry, ev);
        deliveryTurnInputs.set(deliveryMergeKey(inputDelivery), turnKey);
        // The canonical input_posted card is provisional until a turn is known.
        // Move it into this turn exactly once when the admitted echo arrives.
        entry?.card?.remove();
        if (cliViewOn() && entry && entry.card && entry.card._cliNode) { entry.card._cliNode.remove(); entry.card._cliNode = null; }   // S-R62-CLI-VIEW-B：合卡移除同步 CLI
        c1InputCards.delete(key);
        for (const [deliveryKey, mappedKey] of c1DeliveryCards) {
          if (mappedKey === key) c1DeliveryCards.delete(deliveryKey);
        }
      }
      const turnKey = turnKeyFor(ev);
      if (turnKey && ['user_input', 'assistant_text', 'tool_call', 'state_change', 'error'].includes(ev.kind)) {
        if (ev.kind === 'user_input') {
          const delivery = ev._norm?.originDlv || ev._norm?.deliveryId || ev.delivery_id || '';
          if (delivery) deliveryTurnInputs.set(deliveryMergeKey(delivery), turnKey);
        }
        return renderTurnEvent(turnKey, ev);
      }
      if (HIDDEN_TIMELINE_CARD_KINDS.has(ev.kind)) {
        if (ev.kind === 'state_change') renderState(ev);   // 状态栏/成本副作用保留,本就无卡
        return;
      }
      if (ev.kind === 'user_input') return renderUser(ev);
      if (ev.kind === 'assistant_text') return renderAssistant(ev);
      if (ev.kind === 'error') return renderError(ev);
      renderUnknown(ev);
    }

    function retainCanonicalTrustedProvenance(entry, admittedEvent) {
      // This call site is reached only after exact delivery-id lookup. Reuse
      // normalized Hub-attested provenance from the canonical primary; never
      // derive trust from the helper echo.
      const canonical = entry?.canonicalPrimary ? entry.canonicalProvenance : null;
      if (canonical?.trusted === true && admittedEvent?._norm && !admittedEvent._norm.conflict) {
        admittedEvent._norm.prov = { ...canonical };
      }
    }

    function eventTimeHtml(ev) {
      // ts=UTC epoch 毫秒(helper 打戳);按查看者本地时区渲染,悬停给完整本地时间+UTC。
      // 旧事件(ring 回放的无 ts 存量)不显示,不兜底猜时间。
      let ts = ev?.ts;
      if (!Number.isFinite(ts) && ev?.kind === 'input_posted') {
        const updatedAt = Date.parse(ev.updated_at || '');
        ts = Number.isFinite(updatedAt) ? updatedAt : ev._arrivalTs;
      }
      if (!Number.isFinite(ts)) return '';
      const d = new Date(ts);
      if (Number.isNaN(d.getTime())) return '';   // 超Date值域的ts同走不显示不猜,防toISOString抛RangeError丢整卡(dev55 R1 F1)
      const full = `${d.toLocaleString()} (${d.toISOString()} UTC)`;
      return `<span class="event-time" data-ts="${ts}" title="${escapeHtml(full)}">${escapeHtml(d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false }))}</span>`;
    }

    function eventMetaHtml(ev) {
      const diag = eventDiagnostics(ev);
      const tl = eventTypeLabel(ev);
      const sl = eventStatusLabel(ev);
      return `<span class="event-meta">${provenanceIconHtml(ev._norm || {})}${tl ? `<span class="event-type">${escapeHtml(tl)}</span>` : ''}${sl ? `<span class="event-sent">${escapeHtml(sl)}</span>` : ''}${eventTimeHtml(ev)}${diag.length ? `<details class="event-diag"><summary title="诊断" aria-label="诊断"><span class="diag-icon" aria-hidden="true">i</span></summary><span class="event-diag-list">${diag.map(([k, v]) => `<code>${escapeHtml(k)} ${escapeHtml(v)}</code>`).join('')}</span></details>` : ''}</span>`;
    }

    // ── E(已按 P0 令重做):重放幂等**不再靠 cursor 去重** ────────
    // 🔴 2026-08-29 P0:我原先假设 cursor 是"每事件唯一",据此对 assistant_text 做 seen 去重。
    // 该假设是错的 —— Codex 的流式 delta **整个 item 共用同一个 cursor**
    // (如 375 片全是 `turn:<turnId>:item:0003`,只有 data.params.delta 不同),
    // 于是第一片进 seen 之后其余 374 片被当成重放丢弃,页面只剩首片 + 一个假的「✓ 回合完成」。
    // 这正是我给自己定过的红线的反面:**去重的代价只能是"多渲一次",绝不能是"少一段内容"**,
    // 而我把它踩了 —— 因为我只验证了"重复事件不再累加",没有验证"不同内容会不会被误判成重复"。
    //
    // 新口径(业主令):**在服务端给出 per-delta 唯一序号(event_seq / SSE id)之前,
    // 任何按 cursor 的去重都不得作用于流式内容。** 这里索性把 cursor 去重整体拆掉,
    // 只保留一种幂等机制(见 markStreamReconnect):重连时先清空再由 ring 重放重建。
    // 一种机制比两种更难出错,且它的失败模式是"重建一次"而不是"丢正文"。
    // 现网每次 SSE 重连(网络抖动 / VS 重启 / 休眠唤醒 / 后台标签页被断流)之后,
    // hub 都会重放 ring 里的同一批事件;而追加路径此前**没有任何去重**——
    // 同一回合的正文每重放一次就再追加一遍(实测 60→120→180→240 字线性增长),
    // group.events 同步无界增长,使每次 rebuildTurn 的 filter/map/join 与 markdown 都越来越贵,
    // 最终表现为「同一个答案吐出两份 → 页面越来越卡 → 卡死」,极端情况下正文长度会撞上
    // V8 的字符串上限抛 RangeError(Invalid string length),此后该回合再也渲染不出来。
    // 节流只降渲染**频次**,治不了内容**无界增长**,故必须在追加入口做幂等。
    //
    // R-V2-0105 件一：回合组上限。到软上限时把【按 cursor 排序后较旧一半】里连续的 assistant_text 合并为一条
    // （文本按序拼接、cursor 取首条）——rebuildTurn 的正文就是排序后 assistant_text 文本的拼接，合并不改正文；
    // 只合并较旧一半，免得后到事件的 cursor 落进已合并区间。合并后仍超硬上限才停止追加并提示（第八、十六节）。
    const TURN_EVENTS_SOFT_CAP = (typeof window !== 'undefined' && window.TURN_EVENTS_SOFT_CAP) || 20000;
    const TURN_EVENTS_HARD_CAP = (typeof window !== 'undefined' && window.TURN_EVENTS_HARD_CAP) || 100000;
    function compactTurnGroup(group) {
      if (!group.sorted) group.events.sort(compareCursor);
      group.sorted = true;
      const half = Math.floor(group.events.length / 2);
      const merged = [];
      for (let i = 0; i < half; i++) {
        const ev = group.events[i];
        const prev = merged[merged.length - 1];
        // 同 delivery 才合并（复核要求：不同投递的文本各留归属，delivery_id 另有用途如 ext- 判定）
        // turn_id 为空的不参与合并（这类事件本就各自成卡；组长 R-V2-0105-MERGE-EMPTY-TURN）
        const prevItemKey = stableAssistantItemKey(prev);
        const itemKey = stableAssistantItemKey(ev);
        const sameItemBoundary = (prevItemKey || itemKey) ? Boolean(prevItemKey && itemKey && prevItemKey === itemKey) : true;
        if (prev && prev.kind === 'assistant_text' && ev.kind === 'assistant_text'
            && prev.turn_id && ev.turn_id
            && (prev.delivery_id || '') === (ev.delivery_id || '')
            && sameItemBoundary) {
          merged[merged.length - 1] = { ...prev, text: (prev.text || '') + (ev.text || '') };
        } else {
          merged.push(ev);
        }
      }
      group.events = merged.concat(group.events.slice(half));
      if (group.events.length > TURN_EVENTS_HARD_CAP && !group.overCap) {
        group.overCap = true;
        const note = document.createElement('div');
        note.className = 'turn-overcap-note';
        note.textContent = '本回合事件过多,后续未显示(刷新页面重建)';
        group.node._overCapNote = note;   // rebuildTurn 用 innerHTML 重写，故与附件区同法接回
        group.node.appendChild(note);
      }
    }

    function renderTurnEvent(turnKey, ev) {
      let group = turnGroups.get(turnKey);
      const hubSeq = Number(ev._hubSeq);
      const eventRank = Number.isSafeInteger(hubSeq) && hubSeq > 0 ? timelineEventRank(ev) : 0;
      let segments = turnGroupSegments.get(turnKey);
      if (segments && eventRank > 0) {
        group = segments.find(segment => segment.timelineEpochOrder === eventRank
          && hubSeq >= segment.rangeStart && hubSeq < segment.rangeEnd) || null;
        if (!group) group = segments.find(segment => segment.timelineEpochOrder === eventRank) || null;
        // A turn can span the history and live epochs. If this epoch has no
        // segment for the turn, keep the event with the time-nearest existing
        // segment instead of creating a second visual turn for the same ID.
        if (!group && segments.length) {
          const eventTs = Number(ev.ts);
          if (Number.isFinite(eventTs)) {
            group = segments.reduce((nearest, segment) => {
              const segmentTs = timelineTimestamp(segment.node);
              if (!Number.isFinite(segmentTs)) return nearest;
              return !nearest || Math.abs(segmentTs - eventTs) < Math.abs(timelineTimestamp(nearest.node) - eventTs)
                ? segment : nearest;
            }, null);
          }
        }
      }
      if (!group) {
        const node = document.createElement('article');
        node.className = 'turn-group';
        node.dataset.turnKey = turnKey;
        node.setAttribute('aria-label', `Turn ${turnKey}`);
        node.dataset.timelineTs = String(Number(ev.ts) || 0);
        group = { node, events: [], completedItemIds: new Set(), kind: 'turn', dirty: false, sorted: true, lastRender: 0, detached: false,
          timelineEpochOrder: eventRank || Number.POSITIVE_INFINITY, timelineSeq: Number.POSITIVE_INFINITY,
          rangeStart: 0, rangeEnd: Number.POSITIVE_INFINITY };
        if (!segments) segments = [];
        const insertAt = eventRank > 0 ? segments.findIndex(segment => segment.timelineEpochOrder > eventRank) : -1;
        if (insertAt >= 0) segments.splice(insertAt, 0, group);
        else segments.push(group);
        turnGroups.set(turnKey, segments.at(-1));
        turnGroupSegments.set(turnKey, segments);
      }
      if (group.overCap) return;   // R-V2-0105 件一：已到硬上限并已提示
      const itemKey = ev.kind === 'assistant_text' ? stableAssistantItemKey(ev) : '';
      const isBackfill = ev.kind === 'assistant_text' && ev.data?.backfill === true;
      if (isBackfill) {
        // Backfill is a complete item replacement, never an append. Require the
        // stable item identity so malformed/legacy envelopes cannot duplicate text.
        if (!itemKey) return;
        group.completedItemIds ||= new Set();
        const before = group.events.length;
        group.events = group.events.filter(old => !(old.kind === 'assistant_text' && stableAssistantItemKey(old) === itemKey));
        group.completedItemIds.add(itemKey);
        if (group.events.length !== before) group.sorted = false;
      } else if (itemKey && group.completedItemIds?.has(itemKey)) {
        // The reconnect snapshot can be followed by buffered/live deltas for the
        // same item. Once replaced by its complete body, those chunks are stale.
        return;
      }
      const prevEv = group.events[group.events.length - 1];
      group.events.push(ev);   // 不做 cursor 去重:同一 item 的多片 delta 共用 cursor,去重会吞正文
      const eventTimes = group.events.map(event => Number(event?.ts)).filter(ts => Number.isFinite(ts) && ts > 0);
      const priorTimelineTs = timelineTimestamp(group.node);
      const nextTimelineTs = eventTimes.length ? Math.min(...eventTimes) : NaN;
      if (Number.isFinite(nextTimelineTs)) group.node.dataset.timelineTs = String(nextTimelineTs);
      const timelineTsChanged = Number.isFinite(nextTimelineTs) && nextTimelineTs !== priorTimelineTs;
      const seq = Number(ev._hubSeq);
      if (Number.isSafeInteger(seq) && seq > 0) {
        const rank = timelineEventRank(ev);
        // An event from another epoch may be paired into this visual group,
        // but its sequence key belongs to that epoch and must not reposition
        // the group's original timeline anchor.
        if (rank === group.timelineEpochOrder
            && compareTimelineKey(rank, seq, group.timelineEpochOrder, group.timelineSeq) < 0) {
          group.timelineEpochOrder = rank;
          group.timelineSeq = seq;
          setNodeTimelineKey(group.node, rank, seq);
          placeTimelineNode(group.node);
        }
      } else if (!group.node.parentNode) placeTimelineNode(group.node);
      if (timelineTsChanged) placeTimelineNode(group.node);
      // R-V2-0105 件一压力格：按 cursor 顺序到达（常态）不置乱序，重渲与合并就不必每次全量重排；
      // 全量重排在 2 万条时每次约百毫秒，每片都触发一次重渲时页面整个卡住（含同页 Agent 列表轮询）。
      // 平局（同 cursor 多片）保持到达序，与稳定排序结果相同。
      if (prevEv && compareCursor(prevEv, ev) > 0) group.sorted = false;
      if (group.events.length > TURN_EVENTS_SOFT_CAP) compactTurnGroup(group);
      // turn_completed 强制终渲:终态文案与 renderState 的状态栏/成本副作用不可被节流推迟
      const completed = ev.kind === 'state_change' && ev.data && ev.data.change === 'turn_completed';
      scheduleRender(group, completed);
    }

    function splitTurnGroupAtHubSequence(turnKey, boundarySeq, boundaryRank = 0) {
      const latest = turnGroups.get(turnKey);
      if (!latest || !Number.isSafeInteger(boundarySeq) || boundarySeq <= 0) return;
      const segments = turnGroupSegments.get(turnKey) || [latest];
      const segmentIndex = segments.findIndex(segment => (!boundaryRank || segment.timelineEpochOrder === boundaryRank)
        && boundarySeq >= segment.rangeStart && boundarySeq < segment.rangeEnd);
      if (segmentIndex < 0) return;
      const before = segments[segmentIndex];
      const earlier = [], later = [];
      for (const event of before.events) {
        const seq = Number(event._hubSeq);
        const rank = timelineEventRank(event);
        (Number.isSafeInteger(seq) && seq > 0
          && compareTimelineKey(rank, seq, boundaryRank || rank, boundarySeq) >= 0 ? later : earlier).push(event);
      }
      if (!earlier.length && !later.length) return;
      const priorEnd = before.rangeEnd;
      const after = { node: document.createElement('article'), events: later,
        completedItemIds: new Set(before.completedItemIds || []), kind: 'turn', dirty: false,
        sorted: false, lastRender: 0, detached: false, timelineEpochOrder: boundaryRank || before.timelineEpochOrder,
        timelineSeq: Number.POSITIVE_INFINITY, rangeStart: boundarySeq, rangeEnd: priorEnd };
      after.node.className = 'turn-group';
      after.node.dataset.turnKey = turnKey;
      after.node.setAttribute('aria-label', `Turn ${turnKey}`);
      if (earlier.length) {
        before.events = earlier;
        before.sorted = false;
        before.timelineEpochOrder = boundaryRank || before.timelineEpochOrder;
        before.rangeEnd = boundarySeq;
        const earlierKey = timelineEventsMinKey(earlier);
        if (earlierKey) setNodeTimelineKey(before.node, earlierKey.rank, earlierKey.seq);
      } else {
        forgetTimelineSequenceNode(before.node);
        before.node.remove();
        before.events = [];
        before.rangeEnd = boundarySeq;
        before.node = document.createElement('article');
        before.node.className = 'turn-group';
        before.node.dataset.turnKey = turnKey;
        before.node.setAttribute('aria-label', `Turn ${turnKey}`);
        before.timelineEpochOrder = boundaryRank || before.timelineEpochOrder;
        before.timelineSeq = Number.POSITIVE_INFINITY;
      }
      const laterKey = timelineEventsMinKey(later);
      if (laterKey) setNodeTimelineKey(after.node, laterKey.rank, laterKey.seq);
      segments.splice(segmentIndex, 1, before, after);
      turnGroupSegments.set(turnKey, segments);
      turnGroups.set(turnKey, segments.at(-1));
      if (earlier.length) placeTimelineNode(before.node);
      if (later.length) placeTimelineNode(after.node);
      if (earlier.length) scheduleRender(before, true);
      if (later.length) scheduleRender(after, true);
    }

    // ── A:渲染节流 ─────────────────────────────────────────────
    // 同一 turn / 同一助手消息的重渲合并进 RENDER_THROTTLE_MS 窗口。
    // 前沿即时渲染:窗口空闲时第一条事件同步出画,保住「消息一到就看得见」的手感,
    //   也让「一条事件 → 立刻可断言 DOM」的既有同步语义对孤立事件保持不变。
    // 窗口内后续 chunk 只置脏,由尾帧一次性重渲;turn_completed 与回放收尾强制终渲。
    function cancelRenderFlush() {
      if (renderFlushTimer !== null) { clearTimeout(renderFlushTimer); renderFlushTimer = null; }
      if (renderFlushFrame !== null) { cancelAnimationFrame(renderFlushFrame); renderFlushFrame = null; }
    }

    function renderPendingEntry(entry) {
      entry.dirty = false;
      entry.lastRender = Date.now();
      if (entry.kind === 'assistant') renderAssistantBody(entry);
      else rebuildTurn(entry);
    }

    function flushPendingRenders() {
      cancelRenderFlush();
      if (!pendingRenders.size) return;
      // 跟随态必须在本次批量重渲**之前**取样:重渲会让回合卡增高,
      // 浏览器的滚动锚定(overflow-anchor)随即挪动 scrollTop 并派发一次 scroll 事件,
      // 而既有 scroll 处理器把「不在底部的 scroll」判为用户上翻 → 永久交还跟随权,页面停在半空。
      // 取样后在同一批里补到底,scroll 事件落地时已在底部,判据自然不成立(不改既有启发式)。
      const wasFollowing = replayInProgress || timelineAtBottom;
      const due = Array.from(pendingRenders);
      pendingRenders.clear();
      for (const entry of due) {
        if (entry.detached) continue;   // 已被上限逐出:不重渲,也不让它复活
        // F:单个条目渲染抛错不得连累同批其余条目 —— 它们已被移出 pendingRenders,
        // 一旦异常冒泡就再也没有人来渲染它们,表现为「页面从此不再更新 / 刷新也刷不出来」。
        // 这里逐条兜住并把错误显式记到控制台(fail-loud,不静默),其余条目照常渲染。
        try {
          renderPendingEntry(entry);
        } catch (err) {
          if (managedApplyActive) throw err;
          markIntegrityApplyFailed();
          console.error('[render] 条目重渲失败,已跳过该条,不影响同批其余条目:', err);
        }
      }
      if (wasFollowing) scrollTimelineToBottom();
      maybeClearRecoveredGap();
    }

    function scheduleRenderFlush() {
      if (renderFlushTimer !== null || renderFlushFrame !== null) return;
      renderFlushTimer = setTimeout(() => {
        renderFlushTimer = null;
        // 再对齐一次 rAF,避免与浏览器排版抢帧;定时器已先兜住节流窗口,
        // 故页面不可见(rAF 不触发)时也不会把内容永久压在队列里 —— 下次可见的首帧或强制终渲会补上。
        if (typeof requestAnimationFrame !== 'function') return flushPendingRenders();
        renderFlushFrame = requestAnimationFrame(() => { renderFlushFrame = null; flushPendingRenders(); });
      }, RENDER_THROTTLE_MS);
    }

    function scheduleRender(entry, force = false) {
      if (entry.detached) { pendingRenders.delete(entry); return; }
      entry.dirty = true;
      if (force || (Date.now() - (entry.lastRender || 0)) >= RENDER_THROTTLE_MS) {
        pendingRenders.delete(entry);
        renderPendingEntry(entry);
        return;
      }
      pendingRenders.add(entry);
      scheduleRenderFlush();
    }

    // 只数长度,不拼串(整段 join 会在每次重渲时分配一份完整正文,长文本下这本身就是开销)
    function eventsTextLength(evs) {
      let n = 0;
      for (const ev of evs) n += (ev.text || '').length;
      return n;
    }
    // 取前 max 字的摘要;在行边界截断,避免把一行 markdown 从中间劈开
    function eventsTextPrefix(evs, max) {
      let out = '';
      for (const ev of evs) {
        out += ev.text || '';
        if (out.length >= max) break;
      }
      if (out.length <= max) return out;
      const cut = out.slice(0, max);
      const nl = cut.lastIndexOf('\n');
      return nl > max * 0.5 ? cut.slice(0, nl) : cut;
    }
    function eventsTextFull(evs) {
      return evs.map(ev => ev.text || '').join('');
    }

    // ── S-R62-CLI-VIEW-B：终端风格第二投影（Codex CLI 版式，加性层） ──────────────
    // 只读与现管线同一份 group.events / 输入卡 entry 数据，产出独立 #timeline-cli DOM。
    // 所有钩子带 cliViewOn() 闸：关态不建 CLI DOM、不改现 DOM 一个字节。
    // 开关手法逐字仿主题先例（THEME_KEY 段）：localStorage＋BroadcastChannel＋写入方自 apply。
    const CLI_VIEW_KEY = 'dw-cli-view';
    let cliViewChannel = null;
    let cliStatusModel = '';
    let cliStatusUsage = null;
    const cliTimeline = document.getElementById('timeline-cli');
    const cliViewBtn = document.getElementById('cliViewBtn');

    function cliViewOverride() {
      const value = window.CLI_VIEW_SESSION_OVERRIDE;
      return typeof value === 'boolean' ? value : null;
    }
    function cliViewOn() {
      const override = cliViewOverride();
      if (override !== null) return override;   // 优先级：会话覆盖 ＞ 用户偏好 ＞ 默认关
      return document.body.classList.contains('cli-view-on');
    }
    function cliViewLocked() { return cliViewOverride() !== null; }

    function cliMarkdownLite(text) {
      // 独立轻量格式化：先转义再认三种内联标记（代码块/行内码/粗体）；bypass md-render-core。
      let html = escapeHtml(String(text || ''));
      html = html.replace(/```([\s\S]*?)```/g, (_, code) => `<pre class="cli-code">${code.replace(/^\n/, '')}</pre>`);
      html = html.replace(/`([^`\n]+)`/g, '<code class="cli-inline-code">$1</code>');
      html = html.replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>');
      return html;
    }

    function placeCliNode(cliNode, sourceNode) {
      for (const key of ['timelineTs', 'timelineSeq', 'timelineEpochOrder']) {
        if (sourceNode.dataset[key] !== undefined) cliNode.dataset[key] = sourceNode.dataset[key];
      }
      if (cliNode.parentNode === cliTimeline) cliTimeline.removeChild(cliNode);
      for (const current of cliTimeline.children) {
        if (current.classList.contains('cli-statusbar')) continue;
        if (compareTimelineNodes(cliNode, current) < 0) { cliTimeline.insertBefore(cliNode, current); return; }
      }
      const status = cliTimeline.querySelector('.cli-statusbar');
      if (status) cliTimeline.insertBefore(cliNode, status);
      else cliTimeline.appendChild(cliNode);
    }

    function cliToolLine(ev, turnCompleted) {
      const data = ev.data || {};
      const item = data.item || {};
      const name = item.name || data.name || 'Tool';   // dynamicToolCall 的真名在 item.name；data.name 可能是类别
      const input = data.input || item.input || {};
      const kind = String(item.type || data.type || name).toLowerCase();
      const rawCommand = item.command || input.command || input.cmd || '';
      const command = Array.isArray(rawCommand) ? rawCommand.join(' ') : String(rawCommand || '');   // rollout 实证 command 可为数组
      const changes = (item.changes && typeof item.changes === 'object') ? Object.keys(item.changes) : [];   // 0.170 实证：fileChange 真形是 changes 映射
      const path = input.path || item.path || changes[0] || '';
      const exitCode = item.exitCode ?? item.exit_code ?? data.exit_code ?? data.exitCode;
      const output = String(item.aggregatedOutput ?? item.aggregated_output ?? item.output ?? data.output ?? item.result ?? data.result ?? '');   // 0.170 live 实证：aggregatedOutput（rollout 序列化 aggregated_output 兼容）
      const itemDone = item.status === 'completed' || item.status === 'failed' || data.status === 'completed';
      const running = !turnCompleted && !itemDone;
      let head;
      if (kind.includes('filechange')) head = `• Edited ${escapeHtml(changes.length > 1 ? `${changes.length} files` : (path || name))}`;
      else if (running) head = `• Running ${escapeHtml(command || name)}…`;
      else head = `• Ran ${escapeHtml(command || name)}`;
      let html = `<div class="cli-line cli-tool">${head}`;
      if (!running) {
        // 工具完成后保留行（与现视图「完成即移除工具」的有意差异，设计 §二）。
        const firstLine = (output.split('\n').find(line => line.trim()) || '').slice(0, 120);
        const exitText = exitCode === undefined || exitCode === null ? '' : `exit ${exitCode}`;
        const preview = Object.entries(input).map(([k, v]) => `${k}: ${String(v).slice(0, 56)}`).join(' · ');
        let summary = [exitText, firstLine].filter(Boolean).join(' · ');
        let detail = output || JSON.stringify(input, null, 2);
        if (!summary && changes.length) {
          summary = changes.map(file => `${(item.changes[file] || {}).type || 'change'} ${file}`).join(' · ').slice(0, 120);
          detail = changes.map(file => {
            const change = item.changes[file] || {};
            const body = String(change.content || change.unified_diff || '');
            return `--- ${file} (${change.type || 'change'})\n${body.slice(0, 4000)}${body.length > 4000 ? '\n…(截断)' : ''}`;
          }).join('\n');
        }
        if (!summary) summary = preview;
        html += `<details class="cli-tool-out"><summary>└ ${escapeHtml(summary)}</summary><pre>${escapeHtml(detail)}</pre></details>`;
      }
      html += '</div>';
      return html;
    }

    function cliWorkedLine(group, completed) {
      const times = group.events.map(ev => Number(ev.ts)).filter(ts => Number.isFinite(ts) && ts > 0);
      const endTs = Number(completed.ts) || (times.length ? Math.max(...times) : 0);
      const startTs = times.length ? Math.min(...times) : endTs;
      const seconds = Math.max(0, Math.round((endTs - startTs) / 1000));
      const clock = endTs ? new Date(endTs).toTimeString().slice(0, 5) : '--:--';
      if (completed.data?.model) cliStatusModel = String(completed.data.model);
      if (completed.data?.usage || completed.data?.token_usage) cliStatusUsage = completed.data.usage || completed.data.token_usage;
      return `<div class="cli-line cli-worked">  Worked for ${seconds}s • ${escapeHtml(clock)}</div>`;
    }

    function updateCliStatusLine() {
      let bar = cliTimeline.querySelector('.cli-statusbar');
      if (!bar) { bar = document.createElement('div'); bar.className = 'cli-statusbar'; cliTimeline.appendChild(bar); }
      const model = cliStatusModel || stats.model || 'model';
      const session = stats.sessionName || 'session';
      let usageText = '';
      if (cliStatusUsage) {
        const total = cliStatusUsage.total_tokens ?? ((cliStatusUsage.input_tokens || 0) + (cliStatusUsage.output_tokens || 0));
        if (total) usageText = ` · tokens ${total}`;
      }
      bar.textContent = `${model} default · ${session}${usageText}\n← for agents · ? for shortcuts`;
    }

    function rebuildTurnCLI(group) {
      if (group.detached) return;
      if (!group.sorted) { group.events.sort(compareCursor); group.sorted = true; }
      const users = group.events.filter(ev => ev.kind === 'user_input');
      const tools = group.events.filter(ev => ev.kind === 'tool_call');
      const assistants = group.events.filter(ev => ev.kind === 'assistant_text');
      const errors = group.events.filter(ev => ev.kind === 'error');
      const completed = group.events.filter(ev => ev.kind === 'state_change' && ev.data?.change === 'turn_completed').at(-1);
      let html = '';
      if (users.length) {
        const prefix = cliSourcePrefix(users[0]._norm || null);   // S-R62-CLI-VIEW-B：合卡入回合后前缀同源保留
        html += `<div class="cli-line cli-user">› ${escapeHtml(prefix)}${escapeHtml(users.map(ev => ev.text || '').join(''))}</div>`;
      }
      for (const ev of tools) html += cliToolLine(ev, Boolean(completed));
      if (assistants.length) {
        const total = eventsTextLength(assistants);
        if (total > LONGTEXT_THRESHOLD) {
          const excerpt = eventsTextPrefix(assistants, LONGTEXT_EXCERPT);
          html += `<div class="cli-line cli-assistant">• ${cliMarkdownLite(excerpt)}</div>`;
          html += `<div class="cli-line cli-pager">── 全文 ${total.toLocaleString()} 字 · <button type="button" data-cli-open="1">[打开全文]</button> ──</div>`;
        } else {
          html += `<div class="cli-line cli-assistant">• ${cliMarkdownLite(eventsTextFull(assistants))}</div>`;
        }
      }
      for (const ev of errors) html += `<div class="cli-line cli-error">✗ ${escapeHtml(ev.text || 'Unknown error')}</div>`;
      if (completed) html += cliWorkedLine(group, completed);
      let node = group.node._cliNode;
      if (!node) { node = document.createElement('article'); node.className = 'cli-turn'; group.node._cliNode = node; }
      node.dataset.turnKey = group.node.dataset.turnKey || '';
      node.innerHTML = html;
      placeCliNode(node, group.node);
      node.querySelectorAll('[data-cli-open]').forEach(btn => {
        btn.addEventListener('click', () => {
          // 全文点击时现拼（仿 wireLongtextBar 懒拼装，流式期不为未点全文付成本）。
          const fullText = eventsTextFull(group.events.filter(ev => ev.kind === 'assistant_text'));
          const url = URL.createObjectURL(new Blob([fullText], { type: 'text/markdown;charset=utf-8' }));
          if (!window.open(url, '_blank', 'noopener')) {
            const a = document.createElement('a');
            a.href = url; a.download = 'dingwei-cli-turn.md';
            document.body.appendChild(a); a.click(); a.remove();
          }
          setTimeout(() => URL.revokeObjectURL(url), 60000);
        });
      });
      if (completed) updateCliStatusLine();
    }

    // S-R62-CLI-VIEW-B：来源前缀与 provenanceIconHtml／sourceBadgeHtml 同源（同一 norm 可信判定，fail-closed）：
    // 不可信不挂来源；CLI 层不自判 trust。独立卡与回合内用户行共用，合卡迁移不丢前缀。
    function cliSourcePrefix(norm) {
      if (!norm) return '';
      if (provFlagOn() && norm.prov && norm.prov.trusted) {
        const label = norm.prov.displayName || { feishu: '飞书', agent: 'Agent', human: '人工', system: '系统' }[norm.prov.kind] || '';
        return label ? `[${label}] ` : '';
      }
      if (norm.sourceTrusted) {
        const label = { feishu: '飞书', view: '人工', human: '人工', system: '系统', agent: `Agent·${norm.sourceLabel || '未知'}` }[norm.sourceKind] || '';
        return label ? `[${label}] ` : '';
      }
      return '';
    }

    function renderUserCLI(entry) {
      const card = entry.card;
      if (!card || entry.detached) return;
      const text = entry.content ? entry.content.textContent : '';
      const stage = entry.stageEl ? entry.stageEl.textContent : '';
      const prefix = cliSourcePrefix(entry._cliNorm || null);
      let node = card._cliNode;
      if (!node) { node = document.createElement('div'); node.className = 'cli-line cli-user cli-input-card'; card._cliNode = node; }
      node.innerHTML = `› ${escapeHtml(prefix)}${escapeHtml(text)}${stage ? ` <span class="cli-stage">[${escapeHtml(stage)}]</span>` : ''}`;
      placeCliNode(node, card);
    }

    function rebuildAllCLI() {
      cliTimeline.replaceChildren();
      for (const segments of turnGroupSegments.values()) for (const group of segments) rebuildTurnCLI(group);
      for (const entry of c1InputCards.values()) if (entry.card) renderUserCLI(entry);
      updateCliStatusLine();
    }

    function applyCliView(on) {
      on = Boolean(on);
      if (document.body.classList.contains('cli-view-on') === on) return;   // 幂等：挡住来回广播
      document.body.classList.toggle('cli-view-on', on);
      cliTimeline.hidden = !on;
      if (on) rebuildAllCLI();
      else cliTimeline.replaceChildren();
      if (cliViewBtn) cliViewBtn.setAttribute('aria-pressed', on ? 'true' : 'false');
    }
    function cliViewStore() {
      try { return window.localStorage; } catch { return null; }
    }
    function writeStoredCliView(on) {
      const store = cliViewStore();
      if (!store) return;
      try { store.setItem(CLI_VIEW_KEY, on ? 'on' : 'off'); } catch { /* 存不下不影响本次会话 */ }
    }
    function setCliView(on, { spread = true } = {}) {
      applyCliView(on);                 // 写入方自己立刻 apply（频道与 storage 事件不回触写入方）
      writeStoredCliView(on);
      if (spread) { try { cliViewChannel?.postMessage({ type: 'cli-view', on: Boolean(on) }); } catch { /* 通道没了也不影响本地 */ } }
    }
    function setupCliViewSync() {
      // 三段各自 try/catch（仿主题先例）：频道与 storage 互为冗余，一条坏不连带另一条。
      try {
        const override = cliViewOverride();
        let stored = null;
        const store = cliViewStore();
        if (store) stored = store.getItem(CLI_VIEW_KEY);
        const effective = override !== null ? override : stored === 'on';
        if (cliViewBtn && cliViewLocked()) {
          cliViewBtn.disabled = true;
          cliViewBtn.title = '终端视图（会话级已锁定）';
        }
        applyCliView(effective);
      } catch { /* 读不到保持默认关 */ }
      try {
        if ('BroadcastChannel' in window && !cliViewChannel) {
          cliViewChannel = new BroadcastChannel(CLI_VIEW_KEY);
          cliViewChannel.onmessage = (event) => {
            if (typeof event?.data?.on !== 'boolean') return;
            setCliView(event.data.on, { spread: false });
          };
        }
      } catch { cliViewChannel = null; }
      try {
        window.addEventListener('storage', (event) => {
          if (event.key !== CLI_VIEW_KEY) return;
          if (event.newValue === 'on' || event.newValue === 'off') setCliView(event.newValue === 'on', { spread: false });
        });
      } catch { /* 挂不上事件时本页按钮仍可用 */ }
    }
    setupCliViewSync();
    cliViewBtn?.addEventListener('click', () => {
      if (cliViewLocked()) return;
      setCliView(!cliViewOn());
    });
    // ── S-R62-CLI-VIEW-B 投影层结束 ──────────────────────────────────────────

    function rebuildTurn(group) {
      // 排序也从「每 chunk 一次」挪到重渲时一次:旧实现 O(N) 次 sort ⇒ O(N² log N)
      if (!group.sorted) { group.events.sort(compareCursor); group.sorted = true; }
      const users = group.events.filter(ev => ev.kind === 'user_input');
      const tools = group.events.filter(ev => ev.kind === 'tool_call');
      const assistants = group.events.filter(ev => ev.kind === 'assistant_text');
      const errors = group.events.filter(ev => ev.kind === 'error');
      const completed = group.events.filter(ev => ev.kind === 'state_change' && ev.data?.change === 'turn_completed').at(-1);
      group.node.classList.toggle('external', assistants.some(ev => ev.delivery_id?.startsWith('ext-')));
      let html = '';
      if (users.length) {
        const text = users.map(ev => ev.text || '').join('');
        html += `<section class="event-body turn-section turn-user">${eventMetaHtml(users[0])}<span class="event-content">${escapeHtml(text)}</span></section>`;
      }
      // Tools are useful as live progress while a turn is running. Once the
      // turn completes, remove them from the reading view and keep only the
      // user request and final answer.
      if (tools.length && !completed) {
        html += `<details class="turn-tools"><summary><span>🔧 ${tools.length} 次工具调用</span></summary><div class="turn-tools-list">${tools.map(renderTurnTool).join('')}</div></details>`;
      }
      if (assistants.length) {
        const total = eventsTextLength(assistants);
        if (total > LONGTEXT_THRESHOLD) {
          // G:超长 ⇒ 只渲染摘要 + 文件化入口。内联 markdown 的输入被摘要长度封顶。
          const excerpt = eventsTextPrefix(assistants, LONGTEXT_EXCERPT);
          const note = completed
            ? `全文 ${total.toLocaleString()} 字,已折叠(仅显示开头 ${excerpt.length.toLocaleString()} 字)`
            : `接收中…已收 ${total.toLocaleString()} 字,已折叠(仅显示开头 ${excerpt.length.toLocaleString()} 字)`;
          html += `<section class="event-body turn-section turn-assistant longtext">${eventMetaHtml(assistants[0])}` +
            `<span class="event-content longtext-fade">${renderMarkdown(excerpt)}</span>` +
            `<div class="longtext-bar" role="group" aria-label="长正文操作">` +
            `<span class="longtext-note">📄 ${escapeHtml(note)}</span>` +
            `<button type="button" data-longtext="open">打开全文</button>` +
            `<button type="button" data-longtext="download">下载 .md</button>` +
            `<button type="button" data-longtext="copy">复制全文</button>` +
            `</div></section>`;
        } else {
          const text = eventsTextFull(assistants);
          html += `<section class="event-body turn-section turn-assistant">${eventMetaHtml(assistants[0])}<span class="event-content">${renderMarkdown(text)}</span></section>`;
        }
      }
      for (const ev of errors) {
        html += `<section class="event-body turn-section turn-error">${eventMetaHtml(ev)}<span class="event-content">${escapeHtml(ev.text || 'Unknown error')}</span></section>`;
      }
      if (completed) {
        const cost = completed.data?.turn_cost_usd ?? completed.data?.cost_usd;
        const total = completed.data?.total_cost_usd ?? completed.data?.cost_total;
        // 业主 2026-09-11:「这里只要给个完成标志即可,不用单写一行文字」。
        // ⚠️ 标志本身保留:整行删掉会让「回合结束」与「还在跑」无法区分。
        html += `<footer class="turn-completed" title="回合完成" aria-label="回合完成">✓</footer>`;
      }
      group.node.innerHTML = html;
      placeTimelineNode(group.node);
      // 0.2.0.6 A：innerHTML 会连附件一起抹掉 ⇒ 重渲后把附件区接回去，已渲染过的不重建。
      if (group.node._fileHost) group.node.appendChild(group.node._fileHost);
      if (group.node._overCapNote) group.node.appendChild(group.node._overCapNote);
      attachFileRenders(group.node, `${users.map(ev => ev.text || '').join('')}\n${eventsTextFull(assistants)}`, { streaming: !completed && !replayInProgress });
      group.node.querySelectorAll('.turn-assistant .event-content').forEach(content => {
        mergeMetaIntoMarkdown(content);
        wireCopyButtons(content);
        wireMarkdownImages(content, group.node);   // 🔴 ts-No.79:就地图片与附件卡的让位(回合重建路径)
      });
      group.node.querySelectorAll('.turn-tool-item').forEach(wireCopyButtons);
      wireLongtextBar(group);
      if (completed) renderState(completed);
      if (cliViewOn()) rebuildTurnCLI(group);   // S-R62-CLI-VIEW-B：关态零副作用
    }

    // G:入口条接线。全文在点击那一刻才从 group.events 现拼 —— 既保证拿到的是最新内容,
    // 也保证流式期间完全不为"可能没人点"的全文付出任何成本。
    function wireLongtextBar(group) {
      const bar = group.node.querySelector('.longtext-bar');
      if (!bar) return;
      const fullText = () => eventsTextFull(group.events.filter(ev => ev.kind === 'assistant_text'));
      const fileName = `dingwei-${String(group.node.dataset.turnKey || 'turn').replace(/[^\w.-]/g, '_')}.md`;
      const withBlobUrl = (fn) => {
        const url = URL.createObjectURL(new Blob([fullText()], { type: 'text/markdown;charset=utf-8' }));
        try { fn(url); } finally { setTimeout(() => URL.revokeObjectURL(url), 60000); }
      };
      bar.querySelectorAll('button[data-longtext]').forEach(btn => {
        btn.addEventListener('click', async () => {
          const kind = btn.dataset.longtext;
          const label = btn.textContent;
          const flash = (t) => { btn.textContent = t; setTimeout(() => { btn.textContent = label; }, 1200); };
          if (kind === 'copy') {
            try { await navigator.clipboard.writeText(fullText()); flash('已复制'); }
            catch { flash('复制失败'); }   // 诚实回显失败,不假称成功
            return;
          }
          if (kind === 'download') {
            withBlobUrl(url => {
              const a = document.createElement('a');
              a.href = url; a.download = fileName;
              document.body.appendChild(a); a.click(); a.remove();
            });
            return;
          }
          withBlobUrl(url => {
            // 新标签页打开;被拦截时不静默,退回下载
            if (!window.open(url, '_blank', 'noopener')) flash('被拦截');
          });
        });
      });
    }

    function renderTurnTool(ev) {
      const name = ev.data?.name || 'Tool';
      const input = ev.data?.input || {};
      const preview = Object.entries(input).map(([k, v]) => `${k}: ${String(v).slice(0, 56)}`).join(' · ');
      return `<div class="turn-tool-item"><div class="turn-tool-head">${eventMetaHtml(ev)}<span class="tool-name">${escapeHtml(name)}</span><span class="tool-preview">${escapeHtml(preview)}</span></div>${renderCode(JSON.stringify(input, null, 2), 'json')}</div>`;
    }

    // control 消息按系统事件渲染:v0.6 只表达「已发起/已发出」,绝不假称「已终止/真停」(真停挂 v0.7#20)
    function renderControlNote(ev) {
      // T-054(业主 2026-09-10):control 卡片与输入框上方的待提交区完全重复
      // (待提交区已显示已入队→hub 已收→helper 已收→已注入→已写入终端,含失败原因),
      // 故不再产生任何卡片 —— 正文区与边条都不产生。
      return;
      /* eslint-disable no-unreachable */
      const { card, content } = baseCard(ev, 'system', 'activity-card');
      const kind = String(ev.control?.kind || ev.control_kind || '').toLowerCase();
      const text = {
        cancel: '已请求终止',
        interrupt: '中断已发出',
      }[kind] || '控制消息已下发';
      const detail = ev.text || ev._norm?.text || '';
      content.textContent = detail ? `${text}:${detail}` : text;
      appendDockCard('activity', card);
      /* eslint-enable no-unreachable */
    }

    function renderUser(ev) {
      const norm = ev._norm || { key: '', sourceTrusted: false, stageIdx: -1 };
      // control 消息(cancel/interrupt 等)不进输入卡/待提交区,按系统事件文案渲染
      if (norm.deliveryMode === 'control') {
        c2MaybeConfirmInterrupt(ev);  // C2:流上 control 事件=中断回执,升级 pending 请求为已确认
        return renderControlNote(ev);
      }
      // 🔴 业主 2026-09-11(两次):『不希望看到 event 卡片,就算是出错信息也不希望看到』
      // 『这个卡片要显示的状态信息,在待提交信息区和对话轮次交互卡片中都可以展示,
      //   无需多出一个 event 卡片』。
      // ⇒ 失败**不另起任何卡**(正文区与右侧看板都不起),而是**更新已有的那张对话卡**。
      // 成因见 T-074:失败事件与输入卡的 message_id 键对不上,`c1CardFor` 找不到 ⇒ 新建 ⇒ 多一张。
      // ⇒ 按 message_id 找不到时,改用**投递号**(已归一)反查已有卡再更新。
      const entry0 = norm.key ? c1CardFor(norm, true) : null;
      const entry = entry0;
      if (!entry?.card && norm.stage === 'failed') {
        const viaDlv = norm.deliveryId ? c1InputCards.get(c1DeliveryCards.get(deliveryMergeKey(norm.deliveryId))) : null;
        if (viaDlv?.footer) {
          // fail-loud:不在界面另起卡,但仍留痕,便于事后诊断(业主不看,排查时要用)
          console.warn('[delivery-failed]', norm.deliveryId || '', stageFooterText(norm));
          const st = viaDlv.footer.querySelector('.stage-text');
          if (st) st.textContent = stageFooterText(norm) || '失败:投递失败';
          if (cliViewOn() && viaDlv.card) renderUserCLI(viaDlv);   // S-R62-CLI-VIEW-B：失败只更新用户行阶段缀
          return;
        }
        // ⚠️ 连已有卡都找不到:仍不新建卡(业主明确不要),只留痕。
        console.warn('[delivery-failed-orphan]', norm.deliveryId || '', stageFooterText(norm));
        return;
      }
      if (entry && entry.card) {
        // 同 message_id 已有输入卡:原位更新,绝不产生第二张
        if (norm.text && !entry.content.textContent) entry.content.textContent = norm.text;
        c1ApplyToEntry(entry, norm);
        attachFileRenders(entry.card, ev.text || norm.text || '');   // 0.2.0.6 A：正文里的 /f/ 直链渲染
        return;
      }
      const { card, content } = baseCard(ev, 'user');
      if (ev.kind === 'input_posted') {
        const updatedAt = Date.parse(ev.updated_at || '');
        const timelineTs = Number.isFinite(updatedAt) ? updatedAt : Number(ev._arrivalTs);
        if (Number.isFinite(timelineTs)) card.dataset.timelineTs = String(timelineTs);
      }
      if (Number.isSafeInteger(Number(ev._hubSeq)) && Number(ev._hubSeq) > 0) card.dataset.timelineSeq = String(Number(ev._hubSeq));
      if (Number.isSafeInteger(Number(ev._hubSeq)) && Number(ev._hubSeq) > 0) card.dataset.timelineEpochOrder = String(timelineEventRank(ev));
      content.textContent = ev.text || norm.text || '';
      attachFileRenders(card, ev.text || norm.text || '');   // 0.2.0.6 A：正文里的 /f/ 直链渲染
      if (norm.key) card.dataset.messageId = norm.key;
      // 徽标 + 阶段脚注:trusted 才挂来源徽标(fail-closed);copy 不显示等待 ACK 态
      const isCopy = String(norm.deliveryMode).includes('copy');
      const footer = document.createElement('div');
      footer.className = 'card-stage-footer';
      const provIc = provenanceIconHtml(norm);  // display v1:provenance 图标在场时压 legacy 文字徽标(不双标)
      const badge = provIc ? '' : sourceBadgeHtml(norm);
      const footText = isCopy ? '已同步/镜像(不追 ACK)' : stageFooterText(norm);
      footer.innerHTML = `${badge}${outboundTargetsHtml(norm)}<span class="stage-text">${escapeHtml(footText)}</span>`;
      card.appendChild(footer);
      placeTimelineNode(card); // R51-TIMELINE-USER
      if (entry) {
        entry.card = card;
        entry.canonicalPrimary = ev.kind === 'input_posted';
        entry.canonicalDeliveryId = entry.canonicalPrimary && norm.deliveryMode === 'primary' ? String(ev.delivery_id || '') : '';
        entry.canonicalProvenance = entry.canonicalPrimary && norm.deliveryMode === 'primary' && norm.prov?.trusted === true
          ? { ...norm.prov } : null;
        entry.content = content;

        entry.footer = footer;
        entry.stageEl = footer.querySelector('.stage-text');
        entry.sentEl = card.querySelector('.event-sent');
        entry.stageIdx = norm.stageIdx;
        entry._cliNorm = norm;   // S-R62-CLI-VIEW-B：来源前缀同源数据（仅加性字段）
        if (norm.deliveryId) c1DeliveryCards.set(deliveryMergeKey(norm.deliveryId), norm.key);
        // 应用建卡前缓冲的乱序更新
        const pending = c1PendingUpdates.get(norm.key) || [];
        c1PendingUpdates.delete(norm.key);
        for (const p of pending) c1ApplyToEntry(entry, p);
        // copy/echo 归并缓冲(display v1):先到的 route_observation/user_input 回显归并到本卡(清 timer 防回落)
        const mergeNotes = norm.deliveryId ? c1MergeBuf.get(norm.deliveryId) || [] : [];
        c1MergeBuf.delete(norm.deliveryId);
        for (const rec of mergeNotes) { clearTimeout(rec.timer); c1Footnote(entry, rec.footKey || 'echo_merge', '已回显'); }
        if (!isCopy) c1ApplyToEntry(entry, norm);
        paintModelAdmissionFailure(norm.deliveryId);
      }
      if (cliViewOn()) {   // S-R62-CLI-VIEW-B：建卡/更新后同步 CLI 用户行
        const cliEntry = norm.key ? c1InputCards.get(norm.key) : null;
        if (cliEntry && cliEntry.card) renderUserCLI(cliEntry);
      }
    }

    // R-V2-0103-MENTION-REPLY-MIRROR:独立卡片(左色条＋「来自 X 的回复」头),与本页 Agent 的回复在样式上区分;
    // 正文走与 assistant 同一个 renderMarkdown(先转义再排版,不执行 HTML);失败／未处理只画一行状态文字。
    // 按 message_id 去重:Hub 给的号稳定(mreply-<delivery_id>-<turn 短哈希>),重连回放同一条只画一张。
    const mentionReplySeen = new Set();
    function renderMentionReply(ev) {
      const id = String(ev.message_id || '');
      if (id && mentionReplySeen.has(id)) return false;
      if (id) mentionReplySeen.add(id);
      const data = ev.data || {};
      const label = String(data.from_label || data.from_full_name || '');
      const failed = data.status === 'failed';
      const { card, body, content } = baseCard(ev, `mention-reply${failed ? ' mention-reply-failed' : ''}`);
      if (id) card.dataset.messageId = id;
      card.dataset.status = failed ? 'failed' : 'ok';
      const head = document.createElement('div');
      head.className = 'mention-reply-head';
      head.textContent = `来自 ${label} 的回复`;
      body.insertBefore(head, content);
      const text = String(ev.text || '');
      if (failed) content.textContent = text;
      else content.innerHTML = renderMarkdown(text);
      placeTimelineNode(card);
      return true;
    }

    function renderAssistant(ev) {
      const k = keyFor(ev);
      let body = messageNodes.get(k);
      if (!body) {
        const { card, content } = baseCard(ev, `assistant ${ev.delivery_id?.startsWith('ext-') ? 'external' : ''}`);
        card.dataset.messageKey = k;   // D:逐出时按此反查,清 messageNodes/messageBuffers/assistantEntries
        placeTimelineNode(card);
        body = content;
        messageNodes.set(k, body);
        messageBuffers.set(k, '');
      }
      let entry = assistantEntries.get(k);
      if (!entry) {
        entry = { kind: 'assistant', key: k, dirty: false, lastRender: 0, detached: false };
        assistantEntries.set(k, entry);
      }
      entry.fileComplete = false;
      messageBuffers.set(k, (messageBuffers.get(k) || '') + (ev.text || ''));   // 同上:不去重,不吞正文
      scheduleRender(entry);   // A:同一条助手消息的多个 chunk 合并为一次 markdown 重渲
    }

    function renderAssistantBody(entry) {
      const body = messageNodes.get(entry.key);
      if (!body) return;
      body.innerHTML = renderMarkdown(messageBuffers.get(entry.key) || '');
      mergeMetaIntoMarkdown(body);
      wireCopyButtons(body);
      // 0.2.0.6 A：挂在卡片上而不是正文里 —— 正文每个 chunk 都重写 innerHTML。
      attachFileRenders(body.closest('.message-card'), messageBuffers.get(entry.key) || '', { streaming: !entry.fileComplete && !replayInProgress });
      // 🔴 ts-No.79:流式路径也要接线,否则每个 chunk 重渲后"让位"就失效 ⇒ 一图两处。
      wireMarkdownImages(body, body.closest('.message-card'));
    }

    function mergeMetaIntoMarkdown(content) {
      const eventBody = content.closest('.event-body');
      const meta = eventBody?.querySelector(':scope > .event-meta');
      const md = content.querySelector(':scope > .md');
      const firstBlock = md?.firstElementChild;
      if (!meta || !firstBlock || firstBlock.contains(meta)) return;
      let target = firstBlock;
      if (firstBlock.matches('ol, ul')) {
        target = firstBlock.querySelector('li') || firstBlock;
      } else if (firstBlock.classList.contains('code-wrap')) {
        target = firstBlock.querySelector('.code-toolbar') || firstBlock;
      } else if (firstBlock.classList.contains('table-wrap')) {
        target = firstBlock.querySelector('th, td') || firstBlock;
      }
      target.insertBefore(meta, target.firstChild);
    }

    function mergeMetaIntoFirstBlock(content, target) {
      const eventBody = content.closest('.event-body');
      const meta = eventBody?.querySelector(':scope > .event-meta');
      if (!meta || !target || target.nodeType !== Node.ELEMENT_NODE || target.contains(meta)) return;
      target.insertBefore(meta, target.firstChild);
    }

    function renderState(ev) {
      if (ev.data?.change === 'session_init') {
        applyStatusData(ev.data);
        return;
      }
      if (ev.data?.change === 'turn_completed') {
        finishAssistantFileRenders();
        stats.turns = Math.max(stats.turns, Number(ev.data.num_turns || stats.turns || 0));
        applyCostData(ev.data);
        setStatus('idle');
        return;
      }
      // Unknown lifecycle state changes are intentionally omitted from the
      // conversation timeline; rendering their raw payload creates noisy cards.
      return;
    }

    function applyCostData(data) {
      if (costAccountingMode !== 'active') return;
      const total = Number(data.total_cost_usd ?? data.cost_total ?? data.totalCostUsd ?? data.cost_usd ?? NaN);
      if (Number.isFinite(total)) {
        stats.turnCost = Math.max(0, total - stats.lastTurnCostTotal);
        stats.cost = total;
        stats.lastTurnCostTotal = total;
        return;
      }
      const turn = Number(data.turn_cost_usd ?? 0);
      stats.turnCost = Number.isFinite(turn) ? turn : 0;
      stats.cost += stats.turnCost;
      stats.lastTurnCostTotal = stats.cost;
    }

    // Live data source contract:
    // helper/sidecar will emit state_change every ~5s with data like
    // {mem:{used,total,unit}, disk:{used,total,unit}, load, session_state,
    //  readonly, unlock_code, owner}.
    // The view updates this bottom status bar and does not append those
    // heartbeat state events to the conversation timeline.
    function applyStatusData(data) {
      if (data.session_id || data.session) {
        const sessionName=data.session_id||data.session;
        if(stats.sessionName!==sessionName){stats.sessionName=sessionName;restoreLocallyUntrackedForSession(sessionName);refreshUnknownDeliveryViews();}
      }
      if (data.owner) stats.owner = data.owner;
      if (data.auth_mode) stats.authMode = data.auth_mode;
      if (data.model || data.driver) stats.model = data.model || data.driver;
      if (data.unlock_code || data.unlockCode) stats.unlockCode = data.unlock_code || data.unlockCode;
      const pageAuthorized = stats.authMode === 'view_page_v2';
      if (!pageAuthorized && data.readonly !== undefined) {
        stats.readonly = Boolean(data.readonly);
        stats.access = stats.readonly ? '只读' : '可写';
      } else if (!pageAuthorized && data.readonly === undefined) {
        stats.readonly = false;
        stats.access = '可写';
      }
      if (!pageAuthorized && data.access) stats.access = data.access;
      const incomingState = data.session_state || data.state;
      if (incomingState) {
        stats.sessionState = incomingState === 'busy' ? 'running' : incomingState;
        if (!pageAuthorized && incomingState === 'readonly') {
          stats.readonly = true;
          stats.access = '只读';
        }
      }
      // mem/disk/time belong only to the bounded VS resource snapshot, not SSE heartbeats.
      if (data.load !== undefined) stats.load = data.load;
      if (data.turns !== undefined) {
        const turns = Number(data.turns);
        if (Number.isFinite(turns)) stats.turns = turns;
      }
      if (costAccountingMode === 'active' && (data.cost_total !== undefined || data.total_cost_usd !== undefined)) {
        const total = Number(data.cost_total ?? data.total_cost_usd);
        if (Number.isFinite(total)) {
          stats.cost = total;
        }
      }
      if (costAccountingMode === 'active' && data.cost_last !== undefined) {
        const last = Number(data.cost_last);
        if (Number.isFinite(last)) stats.turnCost = last;
      }
      updateMetrics();
    }

    function renderError(ev) {
      const text = ev.text || 'Unknown error';
      const { card, content } = baseCard(ev, 'error', 'activity-card');
      content.innerHTML = `${escapeHtml(text)}<div class="subtitle">${escapeHtml(ev.data?.code || '')}</div>`;
      appendDockCard('activity', card);
      if (!replayInProgress) showErrorToast(text);
    }

    function renderUnknown(ev) {
      // T-054:同上,unknown 事件不再产生卡片。
      return;
      /* eslint-disable no-unreachable */
      const { card, content } = baseCard(ev, 'system', 'activity-card');
      content.appendChild(document.createTextNode(JSON.stringify(ev, null, 2)));
      mergeMetaIntoFirstBlock(content, content.firstChild);
      appendDockCard('activity', card);
      /* eslint-enable no-unreachable */
    }

    // 🔴 DW-MD-CORE:render BEGIN —— 【生成副本】源在 view-service/md-render-core.js 的同名段;改源后跑 md-render-core-sync.py(漂移由 test_md_render_core.py 挡)
    function renderMarkdown(src) {
      const blocks = splitFencedBlocks(src);
      let html = '';
      for (const block of blocks) {
        if (block.type === 'code') {
          html += renderCode(block.code, block.lang);
        } else {
          html += renderMarkdownText(block.text);
        }
      }
      return `<div class="md">${html}</div>`;
    }

    function splitFencedBlocks(src) {
      const lines = src.split('\n');
      const blocks = [];
      let text = [];
      let inCode = false;
      let lang = '';
      let code = [];
      for (const line of lines) {
        const fence = line.match(/^```([A-Za-z0-9_-]*)\s*$/);
        if (fence && !inCode) {
          if (text.length) blocks.push({ type: 'text', text: text.join('\n') });
          text = [];
          inCode = true;
          lang = fence[1] || '';
          code = [];
        } else if (fence && inCode) {
          blocks.push({ type: 'code', lang, code: code.join('\n') });
          inCode = false;
          lang = '';
          code = [];
        } else if (inCode) {
          code.push(line);
        } else {
          text.push(line);
        }
      }
      if (inCode) {
        text.push('```' + lang);
        text.push(...code);
      }
      if (text.length) blocks.push({ type: 'text', text: text.join('\n') });
      return blocks;
    }

    function renderMarkdownText(src) {
      const lines = src.split('\n');
      let html = '';
      for (let i = 0; i < lines.length;) {
        if (!lines[i].trim()) { i++; continue; }
        if (isTableStart(lines, i)) {
          const table = [];
          while (i < lines.length && lines[i].includes('|') && lines[i].trim()) table.push(lines[i++]);
          html += renderTable(table);
          continue;
        }
        const heading = lines[i].match(/^(#{1,3})\s+(.+)$/);
        if (heading) {
          const level = heading[1].length;
          html += `<h${level}>${renderInline(heading[2])}</h${level}>`;
          i++;
          continue;
        }
        if (/^>\s?/.test(lines[i])) {
          const quote = [];
          while (i < lines.length && /^>\s?/.test(lines[i])) quote.push(lines[i++].replace(/^>\s?/, ''));
          html += `<blockquote>${renderInline(quote.join('\n'))}</blockquote>`;
          continue;
        }
        if (/^---+$/.test(lines[i].trim())) {
          html += '<hr>';
          i++;
          continue;
        }
        if (/^(\s*)([-*+]|\d+\.)\s+/.test(lines[i])) {
          const list = [];
          const ordered = /^\s*\d+\.\s+/.test(lines[i]);
          while (i < lines.length && /^(\s*)([-*+]|\d+\.)\s+/.test(lines[i])) list.push(lines[i++]);
          html += renderList(list, ordered);
          continue;
        }
        const paraStart = i;
        const para = [];
        while (i < lines.length && lines[i].trim() && !isTableStart(lines, i) && !/^(\s*)([-*+]|\d+\.)\s+/.test(lines[i]) && !/^(#{1,3})\s+/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !/^---+$/.test(lines[i].trim())) {
          para.push(lines[i++]);
        }
        // 🔴 无进展保护 —— 长文本「卡死」的直接原因就在这里。
        // 本函数的外层 `for (let i = 0; i < lines.length;)` 没有自增,完全依赖各分支推进 i。
        // 「### 」这种**只有标记、没有标题**的行会两头落空:标题分支的 /^(#{1,3})\s+(.+)$/
        // 要求标题非空所以不匹配;段落分支的守卫里又有 !/^(#{1,3})\s+/ 把它挡在外面 ——
        // 于是一行都不吃、i 原地不动,外层 for 无限循环,html 每轮追加一个空 <p></p>,
        // 约 7600 万轮后撑爆 V8 字符串上限抛 RangeError,页面表现为「卡住几分钟后再也渲染不出来」。
        // 流式下只要某个 chunk 边界正好落在「### 」之后就会踩到(实测 7964 字契约文本的
        // 3680 字前缀恰好如此);非流式下,正文里任何一个空标题行同样会踩到。
        // 兜底:若这一轮没有任何前进,就把该行按普通段落吃掉,保证外层循环必定推进、且不丢内容。
        if (i === paraStart) para.push(lines[i++]);
        html += `<p>${renderInline(para.join('\n'))}</p>`;
      }
      return html;
    }

    function isTableStart(lines, i) {
      return i + 1 < lines.length && /^\s*\|?.+\|.+\|?\s*$/.test(lines[i]) && /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/.test(lines[i + 1]);
    }

    function splitTableRow(row) {
      const cells = [];
      let cell = '';
      let escaped = false;
      const trimmed = row.trim().replace(/^\|/, '').replace(/\|$/, '');
      for (const ch of trimmed) {
        if (escaped) { cell += ch; escaped = false; continue; }
        if (ch === '\\') { escaped = true; continue; }
        if (ch === '|') { cells.push(cell.trim()); cell = ''; continue; }
        cell += ch;
      }
      cells.push(cell.trim());
      return cells;
    }

    function renderTable(rows) {
      const head = splitTableRow(rows[0]);
      const body = rows.slice(2).map(splitTableRow);
      return `<div class="table-wrap"><table><thead><tr>${head.map(c => `<th>${renderInline(c)}</th>`).join('')}</tr></thead><tbody>${body.map(r => `<tr>${r.map(c => `<td>${renderInline(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
    }

    function renderList(lines, ordered) {
      const tag = ordered ? 'ol' : 'ul';
      const items = lines.map(line => {
        let text = line.replace(/^(\s*)([-*+]|\d+\.)\s+/, '');
        const task = text.match(/^\[( |x|X)\]\s+(.+)$/);
        if (task) {
          const checked = task[1].toLowerCase() === 'x' ? ' checked' : '';
          text = `<input type="checkbox" disabled${checked}> ${renderInline(task[2])}`;
        } else {
          text = renderInline(text);
        }
        return `<li>${text}</li>`;
      }).join('');
      return `<${tag}>${items}</${tag}>`;
    }

    // 🔴 ts-No.79(业主:「只要是图片的就显示预览的图」「感叹号可以不用了」):
    //    "这条 URL 该不该就地出图"的**唯一**判据。两个前提都复用**已有**的东西,不新造清单、不新造边界:
    //      · isOwnFileUrl —— 附件那条路已在用的信任边界:只认本站 /f/ 直链,
    //        🔴「不对任意外站 URL 做任何请求」(见 FILE_URL_RE 上面那段注释)⇒ 外站图片**仍是链接**。
    //        🔵 这是一条产品可见的边界:要放开得由业主裁,不在本格顺手改(G4 把现状钉住了)。
    //      · kindFromExt —— 先查 FILE_EXT_NEVER_INLINE(svg/svgz/html/htm/xhtml/xml **写死**永不内联;
    //        派工单④:不靠"名单里没写"),再查 FILE_EXT_KIND(== nginx 的 types{image/*},G0 对账)。
    function isInlineImageUrl(url) {
      return isOwnFileUrl(url) && kindFromExt(url) === 'image';
    }

    // 🔴 派工单④:一律 <img>,**绝不内联 SVG 源码** —— 本函数只可能产出 <img>,
    //    没有任何一条路会把文件字节读进来拼成元素(svg 更是上面那层写死的 deny-set 就挡住了)。
    //    alt/src 用的都是 escapeHtml **之后**的串(引号已是 &quot;)⇒ 属性突破不成立;
    //    那道承重墙由 ts-No.76 的 P12 与本件 G3/M-G3 一起钉着。
    function mdImageHtml(alt, url) {
      return `<img class="md-img" data-md-img src="${localFileUrl(url)}" alt="${alt}" loading="lazy" referrerpolicy="no-referrer">`;
    }

    function renderInline(src) {
      let out = escapeHtml(src);
      const codes = [];
      out = out.replace(/`([^`]+)`/g, (_, code) => {
        const token = `@@CODE${codes.length}@@`;
        codes.push(`<code>${code}</code>`);
        return token;
      });
      // 🔴 ts-No.79:`!?` 把感叹号一起吃掉 ⇒「! ＋ 链接」那个怪形态消失(业主:感叹号可以不用了)。
      //    指向图片的就**就地出图**,其余**仍是链接**(派工单③:非图片链接行为不变,只是少了那个 "!")。
      //    🔵 用函数式替换而不是 '$1/$2' 串:捕获值里的 `$` 不再有机会被当替换模式解释。
      out = out.replace(/(!?)\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, (_, bang, text, url) => (
        isInlineImageUrl(url)
          ? mdImageHtml(text, url)
          : `<a href="${localFileUrl(url)}" rel="noreferrer" target="_blank">${text}</a>`));
      out = out.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
      out = out.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
      out = out.replace(/\n/g, '<br>');
      codes.forEach((html, i) => { out = out.replace(`@@CODE${i}@@`, html); });
      return out;
    }

    function renderCode(code, lang) {
      const safeLang = escapeHtml(lang || 'text');
      const highlighted = highlightCode(code, lang);
      const encoded = encodeURIComponent(code);
      return `<div class="code-wrap"><div class="code-toolbar"><span>${safeLang}</span><button class="copy-code" type="button" data-code="${encoded}">Copy</button></div><pre><code>${highlighted}</code></pre></div>`;
    }

    // 🔴 2026-09-25 修:每一条正则原先都作用在【上一条已经产出的 HTML】上,
    //    于是后一条会把前一条生成的标签当成源码再包一层。实测触发点是关键字名单里的
    //    `class` 命中了 `<span class="tok-str">` 的**属性名**:
    //      print("copy-me")  ⇒  print(<span <span class="tok-kw">class</span>="tok-str">…</span>)
    //      屏上显示成         print(class="tok-str">"copy-me")
    //    ⇒ **凡含字符串字面量的 python 代码块都坏**,spec 页与 timeline 共用本核,两处都坏。
    // 🔵 做法不是把 `class` 从名单里删掉(那只挡住今天这一个词,明天加 `for`/`type` 又会犯);
    //    而是让后续规则【看不见已经包好的部分】:每包完一类就把生成的 span 收进保险箱,
    //    原地留一个不可能被任何规则命中的占位,全部替换结束后再还原。
    function highlightCode(code, lang) {
      // 占位用的两个控制字符若真出现在源码里,先剔掉,免得还原阶段被伪造的占位污染。
      let html = escapeHtml(code).replace(/[\u0001\u0002]/g, '');
      const vault = [];
      // 🔴 占位里【不能出现数字】:数字规则 \b(\d+)\b 会把占位的序号当成代码里的数字包起来,
      //    stash 再把它收走 ⇒ 占位嵌套、还原失败,屏上直接漏出控制字符。(本次实测踩到过。)
      //    故序号按 26 进制编成 A..P,所有规则(关键字/字面量全是小写)都命中不了它。
      const encodeIndex = (n) => n.toString(26).replace(/[0-9a-p]/g, (ch) => String.fromCharCode(65 + parseInt(ch, 26)));
      const decodeIndex = (s) => s.split('').reduce((acc, ch) => acc * 26 + (ch.charCodeAt(0) - 65), 0);
      const stash = (value) => value.replace(/<span class="tok-[a-z]+">[\s\S]*?<\/span>/g, (hit) => {
        vault.push(hit);
        return '\u0001' + encodeIndex(vault.length - 1) + '\u0002';
      });
      const wrap = (pattern, replacement) => { html = stash(html.replace(pattern, replacement)); };
      if ((lang || '').toLowerCase() === 'python') {
        wrap(/(#.*)$/gm, '<span class="tok-com">$1</span>');
        wrap(/(&#39;[^&]*?&#39;|&quot;[^&]*?&quot;)/g, '<span class="tok-str">$1</span>');
        wrap(/\b(def|return|if|else|elif|for|in|and|or|not|class|import|from|while|try|except|with|as|lambda)\b/g, '<span class="tok-kw">$1</span>');
        wrap(/\b(\d+(?:\.\d+)?)\b/g, '<span class="tok-num">$1</span>');
      } else if ((lang || '').toLowerCase() === 'json') {
        wrap(/(&quot;[^&]*?&quot;)(\s*:)/g, '<span class="tok-kw">$1</span>$2');
        wrap(/(:\s*)(&quot;[^&]*?&quot;)/g, '$1<span class="tok-str">$2</span>');
        wrap(/\b(true|false|null)\b/g, '<span class="tok-kw">$1</span>');
        wrap(/\b(\d+(?:\.\d+)?)\b/g, '<span class="tok-num">$1</span>');
      }
      return html.replace(/\u0001([A-P]+)\u0002/g, (_, index) => vault[decodeIndex(index)]);
    }
    // DW-MD-CORE:render END

    function wireCopyButtons(root) {
      root.querySelectorAll('.copy-code').forEach(btn => {
        btn.addEventListener('click', async () => {
          const text = decodeURIComponent(btn.dataset.code || '');
          try {
            await navigator.clipboard.writeText(text);
            btn.textContent = 'Copied';
            setTimeout(() => btn.textContent = 'Copy', 900);
          } catch {
            btn.textContent = 'Copy failed';
            setTimeout(() => btn.textContent = 'Copy', 900);
          }
        });
      });
    }

    let historyGeneration = '';
    let historyBefore = null;
    let historyHasOlder = false;
    let historyLoading = false;
    let historyBootstrapPending = false;
    let historyApplying = false;
    let historyWindowExpanded = false;
    let historyHighWater = 0;
    let initialHistoryStreamOpen = null;
    const historyLivePending = [];
    const historyEventIDs = new Set();
    const historyInputReplayKeys = new Set();
    // The first sequenced SSE replay can race the initial history fetch. Cache
    // semantic user-input identities so the history copy wins without creating
    // a second, differently-ranked turn group.
    function historyInputReplayKey(ev) {
      if (ev?.kind !== 'user_input') return '';
      return JSON.stringify([ev.cursor || '', ev.delivery_id || '', ev.origin_delivery_id || '', ev.turn_id || '',
        ev.data?.lifecycle || ev.data?.state || '', ev.text || '']);
    }
    // json.RawMessage is emitted as an object by the history API. Older fixtures
    // and callers may still provide serialized JSON, so accept both envelopes.
    function parseHistoryEvent(value) {
      let ev = value;
      if (typeof value === 'string') {
        try { ev = JSON.parse(value); } catch (_) { return null; }
      }
      return ev && typeof ev === 'object' && !Array.isArray(ev) ? { ...ev } : null;
    }
    function markHistoryEvent(ev) {
      const id = ev?._history?.event_id;
      if (!id) return false;
      if (historyEventIDs.has(id)) return true;
      historyEventIDs.add(id);
      if (historyEventIDs.size > 20000) historyEventIDs.delete(historyEventIDs.values().next().value);
      return false;
    }
    async function loadSessionHistory(before = null) {
      if (historyLoading) return;
      historyLoading = true;
      historyOlder.disabled = true;
      try {
        const url = new URL(apiEp('history'), location.href);
        if (historyGeneration) url.searchParams.set('generation', historyGeneration);
        if (before) url.searchParams.set('before', String(before));
        const controller = new AbortController();
        const timeout = setTimeout(() => controller.abort(), 2100);
        let response;
        try { response = await fetch(url, { credentials: 'same-origin', cache: 'no-store', signal: controller.signal }); }
        finally { clearTimeout(timeout); }
        if (!response.ok) return; // 503 disabled, 401/404/500: keep r49 UI; finally releases buffered live SSE events.
        const page = await response.json();
        const priorGeneration = historyGeneration;
        historyGeneration = page.generation || historyGeneration;
        if (priorGeneration && historyGeneration && priorGeneration !== historyGeneration) historyHighWater = 0;
        historyHighWater = Math.max(historyHighWater, Number(page.high_water) || 0);
        historyHasOlder = !!page.has_older;
        historyOlder.hidden = false;
        historyOlder.textContent = historyHasOlder ? '向上翻页' : '没有更早的记录';
        historyOlder.disabled = !historyHasOlder;
        const viewportTop = timeline.getBoundingClientRect().top;
        const anchor = [...timeline.children].find(node => node.getBoundingClientRect().bottom > viewportTop) || timeline.firstElementChild;
        const anchorTop = anchor?.getBoundingClientRect().top;
        const prior = new Set(timeline.children);
        historyApplying = true;
        let invalidHistoryEventRows = 0;
        for (const row of (page.events || [])) {
          const ev = parseHistoryEvent(row?.event);
          if (!ev) { invalidHistoryEventRows++; continue; }
          if (ev.kind === 'user_input' && !Number.isFinite(ev.ts)) {
            const receivedAt = Date.parse(row?.received_at || '');
            if (Number.isFinite(receivedAt)) ev.ts = receivedAt;
          }
          if (ev.kind === 'input_posted' && !Number.isFinite(ev._arrivalTs)) {
            const receivedAt = Date.parse(row?.received_at || '');
            if (Number.isFinite(receivedAt)) ev._arrivalTs = receivedAt;
          }
          delete ev._history_gap;
          ev._history = { generation: row.cursor.generation, seq: row.cursor.seq, event_id: row.event_id };
          ev._hubSeq = Number(row.cursor.seq);
          setTimelineEventEpoch(ev, `history:${row.cursor.generation}`);
          handleIncomingEvent(ev);
        }
        if (invalidHistoryEventRows) {
          console.warn(`history page skipped ${invalidHistoryEventRows} invalid event row(s)`);
        }
        // History rows must have concrete timeline nodes before we compute the
        // insertion set. Live user_input replay normally has an echo merge hold;
        // historyApplying bypasses that timer above. Flush turn-group updates
        // synchronously too, so paging does not depend on rAF/timer ordering.
        flushPendingRenders();
        historyApplying = false;
        const added = [...timeline.children].filter(node => !prior.has(node));
        // Each rendered history node already uses placeTimelineNode; reposition the
        // newly-created set in timestamp order to preserve the same rule for old pages.
        for (const node of added) placeTimelineNode(node);
        if (anchor && Number.isFinite(anchorTop)) timeline.scrollTop += anchor.getBoundingClientRect().top - anchorTop;
        if (page.gap_before || (priorGeneration && historyGeneration && priorGeneration !== historyGeneration) || page.gaps?.length) {
          const notice = document.createElement('div');

      consoleCapability = issued.capability;
      consoleCapabilityPageId = issued.page_id;
      // 后端短租约从请求开始计，最大300s并留5s余量，不因慢响应延长。
      if (!Number.isFinite(issued.expires_in) || issued.expires_in <= 5 || issued.expires_in > 300) throw new Error('invalid capability lease');
      consoleCapabilityExpiresAt = capabilityCheckStartedAt + (issued.expires_in - 5) * 1000;
      if (!consoleCapabilityUsable()) { resetConsoleCapability(); throw new Error('capability already expired'); }
      stats.readonly = false;
      stats.access = '可写';
      updateMetrics();
      return true;
    }
    function consoleWriteHeaders() {
      if (!consoleCapabilityUsable()) return {};
      return {
        'X-DW-Console-Page': pageIdentity.page_id,
        'X-DW-Console-Capability': consoleCapability,
      };
    }
    async function createPageIdentity() {
      const generation = viewAuthGeneration;
      const { body: created } = await viewRequestJSON(apiEp('page'), { method: 'POST' });
      if (viewRefreshClosed || generation !== viewAuthGeneration) throw new Error('stale page identity');
      savePageIdentity({ page_id: created.page_id, page_token: created.page_token,
        code: created.code, state: created.state, can_write: created.state === 'unlocked' });
      announcePageIdentity();
    }
    function resetConsoleCapability() {
      consoleCapability = null;
      consoleCapabilityPageId = null;
      consoleCapabilityExpiresAt = 0;
    }
    function resetPageIdentityChannel() {
      clearTimeout(pageIdentityUniqueTimer);
      pageIdentityUnique = false;
      if (pageIdentityChannel) pageIdentityChannel.close();
      pageIdentityChannel = null;
    }
    async function ensurePageIdentity(forceNew = false) {
      if (pageIdentityEnsurePromise) {
        await pageIdentityEnsurePromise;
        if (!forceNew) return;
      }
      const pending = (async () => {
        await ensurePageIdentityOnce(forceNew);
        if (!viewRefreshEmbedded || viewIsVisible()) await acquireConsoleCapability();
      })();
      pageIdentityEnsurePromise = pending;
      try {
        await pending;
      } finally {
        if (pageIdentityEnsurePromise === pending) pageIdentityEnsurePromise = null;
      }
    }
    async function ensurePageIdentityOnce(forceNew = false) {
      if (!pageIdentity && !forceNew) {
        try { pageIdentity = JSON.parse(sessionStorage.getItem(pageStorageKey()) || 'null'); } catch { pageIdentity = null; }
      }
      if (!pageIdentity || forceNew) {
        resetPageIdentityChannel();
        await createPageIdentity();
        setupPageIdentityChannel();
        return;
      }
      const generation = viewAuthGeneration;
      let resumed, resumeRejected = false;
      try {
        const result = await viewRequestJSON(`${apiEp('page')}/resume`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ page_id: pageIdentity.page_id, page_token: pageIdentity.page_token }),
      });
        resumed = result.body;
      } catch (error) {
        if (error.code !== 403 && error.code !== 404) throw error;
        resumeRejected = true;
      }
      if (viewRefreshClosed || generation !== viewAuthGeneration) throw new Error('stale resume');
      if (resumeRejected) {
        sessionStorage.removeItem(pageStorageKey());
        pageIdentity = null;
        resetPageIdentityChannel();
        await createPageIdentity();
      } else {
        if (!['locked', 'unlocked'].includes(resumed.state)) {
          sessionStorage.removeItem(pageStorageKey());
          pageIdentity = null;
          resetPageIdentityChannel();
          await createPageIdentity();
        } else {
          savePageIdentity({ ...pageIdentity, ...resumed });
        }
      }
      setupPageIdentityChannel();
    }
    function announcePageIdentity() {
      if (pageIdentityChannel && pageIdentity?.page_id) {
        pageIdentityChannel.postMessage({ type: 'claim', page_id: pageIdentity.page_id, nonce: pageInstanceNonce });
      }
    }
    function settlePageIdentityUniqueness() {
      pageIdentityUnique = false;
      clearTimeout(pageIdentityUniqueTimer);
      pageIdentityUniqueTimer = setTimeout(() => { pageIdentityUnique = true; }, 300);
    }
    async function awaitPageIdentityUniqueness() {
      const deadline = Date.now() + 1500;
      while (!pageIdentityUnique && Date.now() < deadline) {
        await new Promise(resolve => setTimeout(resolve, 20));
      }
      if (!pageIdentityUnique) throw new Error('页面身份确认超时，请重试');
    }
    function setupPageIdentityChannel() {
      if (pageIdentityChannel || !pageIdentity?.page_id) return;
      if (!('BroadcastChannel' in window)) {
        // Cannot prove a cloned sessionStorage identity is single-tab: fail safe.
        if (!pageIdentityFallbackApplied) {
          pageIdentityFallbackApplied = true;
          ensurePageIdentity(true).catch(() => setStatus('disconnected'));
        } else {
          pageIdentityUnique = true;
        }
        return;
      }
      pageIdentityChannel = new BroadcastChannel(`dw-view-page:${VS_SCOPE_KEY || stats.sessionName}`);
      pageIdentityChannel.onmessage = event => {
        const claim = event.data || {};
        if (claim.type !== 'claim' || claim.page_id !== pageIdentity?.page_id || claim.nonce === pageInstanceNonce) return;
        settlePageIdentityUniqueness();
        // Deterministic tie-break: the lexicographically smaller instance nonce yields.
        if (pageInstanceNonce < String(claim.nonce)) {
          pageIdentityChannel.close();
          pageIdentityChannel = null;
          pageIdentityUnique = false;
          ensurePageIdentity(true).catch(() => setStatus('disconnected'));
        } else {
          announcePageIdentity();
        }
      };
      settlePageIdentityUniqueness();
      setTimeout(announcePageIdentity, 50);
      setTimeout(announcePageIdentity, 250);
    }

    async function submitInput(text) {
      // R-V2-0102-VIEW-MENTION-ROUTE:只带候选浮层选中、且正文里仍保留「@insert」的目标;没有就不带这个键(请求体与之前同形)。
      const mentions = mentionTargetsFor(text);
      const withMentions = (o) => (mentions.length ? { ...o, mentions } : o);
      if (stats.authMode === 'view_page_v2') {
        await prepareViewWrite();
      }
      const res = await fetch(apiEp('input'), {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', ...consoleWriteHeaders() },
        body: JSON.stringify(withMentions(stats.authMode === 'view_page_v2' ? {
          text, page_id: pageIdentity?.page_id, page_token: pageIdentity?.page_token,
          request_id: newRequestId(),
        } : { text })),
      });
      if (!res.ok) throw new Error(`POST /input failed: HTTP ${res.status}`);
      const body = await res.json().catch(() => ({}));
      if (!body.ok) throw new Error('input returned ok=false');
      return body;
    }

    async function interruptTurn() {
      // body 契约(devof5 冻结):V2={delivery_id,turn_id,page_id,page_token,request_id}——打运行中 turn、无 message_id;
      // page 凭证与 /input、/control cancel 同一对;request_id=中断意图幂等键(c2TurnCtx.active 上 stash,重试复用)。
      // legacy 保持无 body(老 viewer 路,逐字节不变)。响应语义 §4:VS 恒 200 看 body.ok;ok:true=帧已下发≠turn 已停(停走正常流事件);
      // 非 200(400/403/502)=未受理,沿用 throw→error 卡诚实呈现。

    // ── 日夜主题:全局化 ＋ 持久化(0.2.1.7)────────────────────────────────────────
    // 业主原话:「◐ 应该要**提出来,放在整个 Agent 列表**,而不是某一个 tab」
    // ⇒ 开关的**归属**移到了 console 页(internal/m8/console_auth.go 的 nav #themeBtn);
    //   renderer 侧只负责三件事:①加载时读回偏好 ②把自己这个 ◐ 的改动**提升为全局**
    //   ③接收 console / 其他 tab 的广播并应用。
    // 🔴 本页那个 ◐ **保留**(不删业主看惯的控件),但它不再是"只管这一个 tab"。
    //
    // 传输用 BroadcastChannel —— 与本文件既有的 page-identity 同一手法(见 setupPageIdentityChannel,
    // 那里也是先 `'BroadcastChannel' in window` 再建)。选它而不是遍历 iframe 的 postMessage,
    // 因为它一次覆盖两类"看不见就漏掉"的对象:**display:none 的隐藏 pane**(切 tab 不重载)与**其他 tab**。
    // 🔴 持久化用 localStorage,**不用 sessionStorage**:后者不跨 tab ⇒ 不满足"含持久化"。
    //   (本文件既有两处 sessionStorage 用途 —— 任务板折叠 :1742 与页面身份 :3894 —— 都是**故意**按 tab 隔离的,
    //    主题不是;别把它们当先例照抄。)
    // 🔴 写入方必须**自己立刻 apply**:BroadcastChannel 与 storage 事件都**不会**在写入方自己那份文档上触发。
    const THEME_KEY = 'dw-theme';
    let themeChannel = null;

    function themeStore() {
      try { return window.localStorage; } catch { return null; }   // 隐私模式下取用即抛
    }
    function readStoredTheme() {
      const store = themeStore();
      if (!store) return null;
      try {
        const value = store.getItem(THEME_KEY);
        return (value === 'dark' || value === 'light') ? value : null;
      } catch { return null; }
    }
    function writeStoredTheme(theme) {
      const store = themeStore();
      if (!store) return;
      try { if (store.getItem(THEME_KEY) !== theme) store.setItem(THEME_KEY, theme); } catch { /* 存不下不影响本次会话 */ }
    }
    function applyTheme(theme) {
      if (theme !== 'dark' && theme !== 'light') return;
      if (document.body.dataset.theme === theme) return;   // 幂等:挡住来回广播
      document.body.dataset.theme = theme;
    }
    // spread=false 用于"收到广播"那条路:只应用,不再广播、不成回环
    function setTheme(theme, { spread = true } = {}) {
      applyTheme(theme);                 // 🔴 自己先变
      writeStoredTheme(theme);
      if (spread) { try { themeChannel?.postMessage({ type: 'theme', theme }); } catch { /* 通道没了也不影响本地 */ } }
    }
    function setupThemeSync() {
      // 🔴 三段**各自** try/catch,不共用一个:频道建不起来(老浏览器/被策略禁掉)
      //    **不得连带**丢掉 storage 退路 ⇒ 否则"一条路坏了 ⇒ 两条路都没了",
      //    而报错只会指向先坏的那条。两条路互为冗余是**故意的**(隐私模式下 localStorage
      //    取用即抛,那时只有频道能用;反之老浏览器没频道,那时只有 storage 事件能用),
      //    而冗余必须**各自被钉住** —— 见闸的 T7 / T8。
      try {
        const stored = readStoredTheme();
        if (stored) applyTheme(stored);    // 🔴 加载时读:新开的 pane 要跟得上既有偏好
      } catch { /* 读不到就保持 markup 里的 data-theme="light" */ }
      try {
        if ('BroadcastChannel' in window && !themeChannel) {
          themeChannel = new BroadcastChannel(THEME_KEY);
          themeChannel.onmessage = (event) => {
            const theme = event?.data?.theme;
            if (theme !== 'dark' && theme !== 'light') return;
            setTheme(theme, { spread: false });
          };
        }
      } catch { themeChannel = null; }
      try {
        // 别的文档绕过频道直接改了存储也要跟随
        window.addEventListener('storage', (event) => {
          if (event.key !== THEME_KEY) return;
          if (event.newValue === 'dark' || event.newValue === 'light') setTheme(event.newValue, { spread: false });
        });
      } catch { /* 挂不上事件时,本页那个 ◐ 仍然可用 */ }
    }
    setupThemeSync();

    themeBtn.addEventListener('click', () => {
      const next = document.body.dataset.theme === 'dark' ? 'light' : 'dark';
      setTheme(next);
    });
    // 0.2.1.2:「重连」按钮已移除 ⇒ 手动退路挪到 🕐 那一栏上,**不随按钮一起消失**。
    clockStatus?.addEventListener('click', () => {
      clearReconnectTimer();
      connectEventStream();
      refreshStatus();
    });
    streamRetryBtn.addEventListener('click', requestStreamRecovery);
    async function doSend() {
      if (stats.readonly && isConsoleView()) { await refreshViewAuthorization(); }
      if (stats.readonly) {
        if (!isConsoleView()) copyUnlockInstruction();

      }
      // 规范粘贴换行，去掉边界空行，保留正文中间换行和缩进。
      const text = humanInput.value.replace(/\r\n?/g, '\n').replace(/^\n+/u, '').replace(/\s+$/u, '')
        .replace(FILE_URL_RE, (url) => canonicalFileUrl(url));
      if (!text.trim()) return;
      try {
        const result = await submitInput(text);
        mentionPicked.length = 0;
        renderMentionReceipts(result && result.mentions);
        humanInput.value = '';
        resizeHumanInput();
        renderDraftAttachments();   // 发出去之后草稿条随正文一起清空
      } catch (err) {
        handleIncomingEvent({ kind: 'error', text: err.message, data: { code: 'input_failed' } });
      }
    }
    document.getElementById('sendBtn').addEventListener('click', doSend);
    function resizeHumanInput() {
      humanInput.style.height = 'auto';
      humanInput.style.height = `${Math.min(humanInput.scrollHeight, 140)}px`;
    }
    function insertInputNewline() {
      const start = humanInput.selectionStart;
      const end = humanInput.selectionEnd;
      humanInput.setRangeText('\n', start, end, 'end');
      humanInput.dispatchEvent(new Event('input', { bubbles: true }));
    }
    function appendInputReference(fileRef, name, size) {
      const start = humanInput.selectionStart;
      const end = humanInput.selectionEnd;
      const prefix = start > 0 && !/\s$/u.test(humanInput.value.slice(0, start)) ? ' ' : '';
      const suffix = end < humanInput.value.length && !/^\s/u.test(humanInput.value.slice(end)) ? ' ' : '';
      const detail = ` (${String(name || 'file')}, ${Number(size)} bytes)`;
      humanInput.setRangeText(prefix + fileRef + detail + suffix, start, end, 'end');
      humanInput.dispatchEvent(new Event('input', { bubbles: true }));
    }

    function normalizeInputFileUrls(text) {
      if (!VS_CANONICAL_ORIGIN || VS_CANONICAL_ORIGIN === location.origin) return text;
      return String(text).replace(FILE_URL_RE, (raw) => {
        const trimmed = trimUrlTail(raw);
        if (!isOwnFileUrl(trimmed)) return raw;
        try {
          const u = new URL(trimmed);
          if (u.origin !== location.origin || !u.pathname.startsWith('/f/')) return raw;
          return VS_CANONICAL_ORIGIN + trimmed.slice(u.origin.length) + raw.slice(trimmed.length);
        } catch { return raw; }
      });
    }
    // ── 0.2.0.6 A 线：上传入口（业主第 1 条）────────────────────────────
    // 契约：tasks/v0.1-B 锚 d26bfd7002f70b7a9c9b5dcec6a1682ccbef974f
    //       runbooks/SPEC-0.2.0.6-file-direct-link.md §2 · §3.1 · 附录 A4
    // 0.2.0.5 的教训：这里原本**只有 paste 一个入口且只收 image/**，界面上没有任何
    // 可见按钮，于是「界面上根本没有上传入口」是业主自己用的时候发现的。
    // ⇒ 三个入口（粘贴 / 选择 / 拖放）必须同时在，且都不限类型。
    // ── 上传进度行（业主 2026-09-18 验收第 1 条）────────────────────────
    // 🔴 判据是业主那句话的反面：任一时刻用户都能分辨「在传」与「卡住了」。
    //    所以每一行在任何时刻都必须处于三种可读状态之一：
    //    ① 有百分比与已传/总字节（在传，且能看出数在涨）
    //    ② 不定进度条来回走（在等票据或等响应——没有字节可报，但看得出没死）
    //    ③ 终态：已附加 / 失败＋原因
    function newUploadRow(file) {
      const row = document.createElement('div');
      row.className = 'upload-row indeterminate';
      const name = document.createElement('span');
      name.className = 'u-name';
      name.textContent = file.name || '未命名文件';
      const meta = document.createElement('span');
      meta.className = 'u-meta';
      meta.textContent = '申请上传凭证…';
      const bar = document.createElement('div');
      bar.className = 'u-bar';
      const fill = document.createElement('div');
      fill.className = 'u-fill';
      bar.appendChild(fill);
      row.append(name, meta, bar);
      uploadQueue.appendChild(row);
      uploadQueue.hidden = false;
      return {
        // 有字节可报时：给百分比与 已传/总，并停掉不定动画
        progress(loaded, total) {
          row.classList.remove('indeterminate');
          const pct = total > 0 ? Math.min(100, Math.round((loaded / total) * 100)) : 0;
          fill.style.width = `${pct}%`;
          meta.textContent = `${pct}% · ${formatFileBytes(loaded)} / ${formatFileBytes(total)}`;
        },
        // 没有字节可报的阶段（等票据、等服务端响应）：明说在等什么，并保持条在动
        waiting(text) {
          row.classList.add('indeterminate');
          fill.style.width = '';
          meta.textContent = text;
        },
        // 组长 2026-09-18 裁定：完成态的行在**对应草稿块出现后即移除**。
        // 理由：草稿块（缩略图＋原名＋大小）已完整表达「已附加」，两处冗余；
        // 而 R1 要解决的是「进行中不知道在不在动」，完成之后再占屏幕会把草稿区挤走，
        // 草稿区才是业主第 2 条要的东西。传 20 个文件就会堆 20 行 —— 这条是本次新引入的，必须清。
        // 🔴 失败行不走这里（见 failed），人必须看得见哪个失败了。
        done(sizeBytes, url) {
          row.classList.remove('indeterminate');
          row.classList.add('done');
          fill.style.width = '100%';
          meta.textContent = `已附加 · ${formatFileBytes(sizeBytes)}`;
          const chipShown = url && draftAttachments.querySelector(`[data-file-url="${CSS.escape(url)}"]`);
          const drop = () => { row.remove(); if (!uploadQueue.children.length) uploadQueue.hidden = true; };
          // 草稿块已在 ⇒ 立即移除；万一没在（理论上不该发生）⇒ 留一个短兜底，不把行永久挂住。
          if (chipShown) drop(); else setTimeout(drop, 2500);
        },
        failed(reason, retry) {
          row.classList.remove('indeterminate');
          row.classList.add('failed');
          fill.style.width = '100%';
          meta.textContent = `失败 · ${reason}`;
          // 失败行不自动消失：业主要能看到为什么失败。可重试的失败给「重试」：文件仍在手里，点一下重走整条上传，本行让位给新行。
          if (retry) {
            const again = document.createElement('button');
            again.type = 'button';
            again.className = 'u-retry';
            again.textContent = '重试';
            again.onclick = () => { row.remove(); if (!uploadQueue.children.length) uploadQueue.hidden = true; retry(); };
            row.appendChild(again);
          }
        },
      };
    }

    // ── 批次级状态（R6，组长 2026-09-18 裁定）──────────────────────────
    // 业主原话：「多文件传输时,没有提示,不知道是不是结束了」（一次 6 张图，约 36 MB）。
    //
    // 🔴 为什么单文件行不够：裁定②让完成行随草稿块出现即移除（防堆积，该目的仍然有效），
    //    但 6 个文件依次出现、依次消失之后，进度区变成**空白** ——
    //    于是「还没开始」与「全部结束」在屏幕上长得一模一样，用户只能去数草稿块。
    // ⇒ 本行只回答一个问题：整批还剩多少、结束了没有。它与单文件行**并存**，不互相替代。
    //    单文件行回答「这个在不在动」，批次行回答「整批还剩多少」。
    const BATCH_DONE_LINGER_MS = 4000;
    function newBatchRow(files) {
      const total = files.length;
      const totalBytes = files.reduce((sum, f) => sum + (f.size || 0), 0);
      const row = document.createElement('div');
      row.className = 'batch-row';
      row.dataset.batchState = 'running';
      const name = document.createElement('span');
      name.className = 'b-name';
      name.textContent = '本批文件';
      const meta = document.createElement('span');
      meta.className = 'b-meta';
      const bar = document.createElement('div');
      bar.className = 'b-bar';
      const fill = document.createElement('div');
      fill.className = 'b-fill';
      bar.appendChild(fill);
      row.append(name, meta, bar);
      // 🔴 插在队列最前：单文件行会一个个消失，批次行不能跟着它们上下跳。
      uploadQueue.prepend(row);
      uploadQueue.hidden = false;
      let settled = 0, okCount = 0, failCount = 0, settledBytes = 0, liveBytes = 0;
      const paint = () => {
        const sent = Math.min(totalBytes, settledBytes + liveBytes);
        const pct = totalBytes > 0 ? Math.min(100, Math.round((sent / totalBytes) * 100)) : 0;
        fill.style.width = `${pct}%`;
        meta.textContent = `${settled}/${total} 个文件 · ${formatFileBytes(sent)} / ${formatFileBytes(totalBytes)}`;
      };
      const drop = () => { row.remove(); if (!uploadQueue.children.length) uploadQueue.hidden = true; };
      paint();
      return {
        // 把单文件那个 row 包一层：字节进度既喂它自己那一行，也累进批次行。
        track(fileRow) {
          return {
            progress(loaded, totalOfFile) { liveBytes = loaded; paint(); fileRow.progress(loaded, totalOfFile); },
            waiting(text) { fileRow.waiting(text); },
            done(sizeBytes, url) { fileRow.done(sizeBytes, url); },
          };
        },
        // 成败都要结算：失败的文件也不再「在传」，它的字节不能永远挂在 liveBytes 上。
        settle(file, ok) {
          settled += 1;
          if (ok) okCount += 1; else failCount += 1;
          settledBytes += file.size || 0;
          liveBytes = 0;
          paint();
        },
        finish() {
          fill.style.width = '100%';
          if (failCount === 0) {
            row.dataset.batchState = 'all-ok';
            meta.textContent = `${okCount} 个文件已全部附加`;
            // R6-2：完成态停留数秒后淡出 —— 常驻就又回到裁定②要清的那种堆积。
            setTimeout(drop, BATCH_DONE_LINGER_MS);
          } else {
            // 🔴 R6-3：有失败时**不淡出**。失败必须留在屏幕上，直到用户自己清掉。
            //    这里的 if 分支本身就是该条判据的落点：去掉它 ⇒ 失败批次也会自己消失。
            row.dataset.batchState = 'has-failure';
            meta.textContent = `${okCount} 个已附加 · ${failCount} 个失败`;
          }
        },
      };
    }

    // 🔴 用 XHR 而不是 fetch：**fetch 不上报上传进度**（没有 upload.onprogress），
    //    而业主第 1 条要的正是「已传/总字节」。这是为满足该条必须做的技术选择，
    //    不是偏好；其余语义（票据、请求头、失败取 {"error"}）与原 fetch 版逐条一致。
    function uploadWithProgress(url, ticket, file, row) {
      return new Promise((resolve, reject) => {
        const xhr = new XMLHttpRequest();
        xhr.open('POST', url, true);
        xhr.setRequestHeader('Authorization', `Bearer ${ticket}`);
        xhr.setRequestHeader('X-DingWei-Session', stats.sessionName);
        // 🔴 P0（业主 2026-09-18 撞上）：HTTP header 值受限于 ISO-8859-1(latin-1)。
        //    中文/emoji 超出该范围 ⇒ **浏览器在 setRequestHeader 阶段直接抛异常**，
        //    上传请求根本发不出去。fetch 与 XHR 都有这个限制，换 XHR 没有改变它。
        // ⇒ 按组长定死的协议编码：UTF-8''<percent-encoded>，与服务端 setDownloadHeaders
        //    已在用的 `filename*=UTF-8''…` 同一套，不另发明。
        //    encodeURIComponent 的输出必然全是 ASCII ⇒ 永不再触发该异常。
        xhr.setRequestHeader('X-File-Name', `UTF-8''${encodeURIComponent(file.name || 'upload.bin')}`);
        xhr.setRequestHeader('Content-Type', file.type || 'application/octet-stream');
        xhr.upload.addEventListener('progress', (e) => {
          if (e.lengthComputable) row.progress(e.loaded, e.total);
        });
        // 字节发完但服务端还没回：此时既不该停在 100% 不动，也没有新字节可报。
        xhr.upload.addEventListener('load', () => row.waiting('已发完，等服务端确认…'));
        xhr.addEventListener('load', () => resolve({ status: xhr.status, body: xhr.responseText }));
        xhr.addEventListener('error', () => reject(new Error('网络中断')));
        xhr.addEventListener('abort', () => reject(new Error('已取消')));
        xhr.send(file);
      });
    }

    // R-V2-0105-P1-LIST-UPLOAD：申请上传凭证限时 20 s（业主截图「申请上传凭证一直转」）；用例可经 globalThis 改短。
    function uploadTicketTimeoutMs() {
      const v = Number(globalThis.DW_UPLOAD_TICKET_TIMEOUT_MS);
      return v > 0 ? v : 20000;
    }
    // 本地校验失败（空文件、超上限）重试也不会好 ⇒ 不给重试；其余失败（凭证超时、HTTP、网络）可重试。
    function uploadInputError(text) {
      const err = new Error(text);
      err.retryable = false;
      return err;
    }
    async function uploadOneFile(file, row) {
      if (!file) throw uploadInputError('没有可上传的文件');
      const label = file.name || '未命名文件';
      // A4：上限一律 50 MiB = 50<<20 = 52428800 字节（不是 50×1000²）。
      if (file.size <= 0) throw uploadInputError(`${label}：空文件不上传`);
      if (file.size > FILE_MAX_UPLOAD_BYTES) {
        throw uploadInputError(`${label}：${formatFileBytes(file.size)} 超过上限 50 MiB（${FILE_MAX_UPLOAD_BYTES} 字节）`);
      }
      row?.waiting('申请上传凭证…');
      // 计时同时罩住 fetch 与读正文：响应头已回、正文不结束同样算超时；解析完成才清计时器。
      const ticketTimeoutMs = uploadTicketTimeoutMs();
      const ticketAbort = new AbortController();
      const ticketTimer = setTimeout(() => ticketAbort.abort(), ticketTimeoutMs);
      let ticket;
      try {
        const ticketRes = await fetch(`/api/console/agents/${encodeURIComponent(stats.sessionName)}/file-upload-ticket`, {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ max_bytes: file.size }),
          signal: ticketAbort.signal,
        });
        if (!ticketRes.ok) throw new Error(`${label}：申请上传票据失败 HTTP ${ticketRes.status}`);
        ticket = await ticketRes.json();
      } catch (err) {
        if (ticketAbort.signal.aborted) throw new Error(`${label}：申请上传凭证超时（${ticketTimeoutMs / 1000} 秒）`);
        throw err;
      } finally {
        clearTimeout(ticketTimer);
      }
      if (!ticket.upload_url || !ticket.ticket || ticket.session !== stats.sessionName) throw new Error(`${label}：上传票据响应无效`);
      // 不限类型：浏览器给不出类型时按二进制传，由服务端定夺，A 侧不猜（见 uploadWithProgress）。
      row?.progress(0, file.size);
      const uploadRes = await uploadWithProgress(ticket.upload_url, ticket.ticket, file, row || { progress() {}, waiting() {} });
      if (uploadRes.status < 200 || uploadRes.status >= 300) {
        // §2：失败返回非 2xx ＋ {"error": "<可读原因>"}。取不到可读原因就如实给状态码，不编。
        let reason = `HTTP ${uploadRes.status}`;
        try {
          const failed = JSON.parse(uploadRes.body);
          if (failed && failed.error) reason = String(failed.error);
        } catch { /* 非 JSON 失败体：保留状态码 */ }
        throw new Error(`${label}：上传失败 ${reason}`);
      }
      let uploaded;
      try {
        uploaded = JSON.parse(uploadRes.body);
      } catch {
        throw new Error(`${label}：上传响应不是合法 JSON`);
      }
      // §2：A 只依赖 url / name / size / media_type 四个字段。
      const url = String(uploaded.url || '');
      if (!/^https:\/\//u.test(url)) throw new Error(`${label}：上传响应缺少契约 §2 要求的绝对 https url`);
      if (!Number.isSafeInteger(uploaded.size) || uploaded.size < 0) throw new Error(`${label}：上传响应缺少有效 size`);
      // 本页自己传的文件，四个字段就地记下 ⇒ 正文区渲染时不必再发 HEAD。
      uploadedFileHints.set(url, {
        name: String(uploaded.name || file.name || ''),
        size: uploaded.size,
        mediaType: String(uploaded.media_type || '').split(';')[0].trim().toLowerCase(),
      });
      appendInputReference(url, uploaded.name || file.name, uploaded.size);
      renderDraftAttachments();   // 业主第 2 条：回填后立刻把缩略图摆出来
      // 🔴 顺序要紧：先渲染草稿块，done() 才看得到它、才能立即清掉完成行。
      row?.done(uploaded.size, url);
      return url;
    }

    async function uploadFiles(files) {
      const list = Array.from(files || []).filter(Boolean);
      if (!list.length) return;
      if (stats.readonly) {
        handleIncomingEvent({ kind: 'error', text: isConsoleView() ? '上传授权暂不可用，请检查登录或访问权限' : '只读模式：先解锁再上传文件', data: { code: 'file_upload_readonly' } });
        return;
      }
      // 顺序上传：票据一次一张、且按 max_bytes 绑定本次大小，并发会互相挤掉。
      // 单个失败不打断其余文件 —— 拖进来 5 个坏了 1 个，另外 4 个仍应传上去。
      // 🔴 R6-4：单文件不开批次行 ——「1/1 个文件」是噪音，它回答不了任何问题。
      const batch = list.length > 1 ? newBatchRow(list) : null;
      for (const file of list) {
        // 🔴 每个文件一行,不是只显示一个总数(组长 R1 明示:多文件时逐个可见)。
        const row = newUploadRow(file);
        try {
          await uploadOneFile(file, batch ? batch.track(row) : row);
          batch?.settle(file, true);
        } catch (err) {
          row.failed(err.message, err.retryable === false ? null : () => uploadFiles([file]));
          batch?.settle(file, false);
          // 🔴 R3：上传成功前从不修改输入框 —— 失败时用户已经输入的文字原样保留。
          //    注意这条约束只管「不动输入框」，**不含「不给反馈」**；
          //    反馈现在走上面这一行 ＋ 下面的错误事件。两件事此前被绑在一起，是业主第 1 条的成因。
          handleIncomingEvent({ kind: 'error', text: err.message, data: { code: 'file_upload_failed' } });
        }
      }
      // 🔴 R6-2/R6-3：整批走完才结算批次行 —— 业主问的「是不是结束了」就答在这一句。
      batch?.finish();
    }

    // ── 草稿附件缩略图（业主 2026-09-18 验收第 2 条）────────────────────
    // 业主原话：「输入框中的链接（文件名，字节数），不知道怎么来的。如果能显示为缩略图就更好了」
    //
    // 🔴 正文仍然是那条 https 直链，**一个字都不动**：
    //    接收侧（附录 B2）靠扫正文里的 /f/ 直链分派渲染 ——
    //    为了好看把链接从正文里拿掉，会让接收方什么都渲染不出来。
    //    ⇒ 这里是**附加的视觉层**：从输入框现有文本里扫出直链，在它下方摆缩略图。
    //    用户删掉那段文字，这里也随之消失；两者永远一致，因为它只是正文的投影。
    function draftIconFor(mediaType) {
      if (!mediaType) return '📄';
      if (mediaType.startsWith('video/')) return '🎬';
      if (mediaType === 'application/pdf') return '📕';
      if (mediaType.startsWith('text/')) return '📝';
      if (mediaType.startsWith('audio/')) return '🎵';
      return '📦';
    }

    // 🔴 约束:任何改动 humanInput.value 的代码,必须派发 input 事件或直接调用本函数。
    //    实测(2026-09-18):直接赋值而不派事件 ⇒ 附件块留在上一份草稿上,
    //    于是「视觉层」与「正文」不再一致 —— 而正文才是发出去的东西。
    //    浏览器用例⑩里有一条不变式断言盯着这件事:附件块数 == 正文里的 /f/ 直链数。
    function renderDraftAttachments() {
      const urls = [...new Set((humanInput.value.match(FILE_URL_RE) || []).map(trimUrlTail))].filter(isOwnFileUrl);
      draftAttachments.textContent = '';
      if (!urls.length) {
        draftAttachments.hidden = true;
        return;
      }
      draftAttachments.hidden = false;
      for (const url of urls) {
        // 本页刚传的文件，四个字段就在 uploadedFileHints 里，**不必再发 HEAD**（组长明示）。
        const hint = uploadedFileHints.get(url) || {};
        const chip = document.createElement('div');
        chip.className = 'draft-chip';
        chip.dataset.fileUrl = url;
        const mediaType = hint.mediaType || '';
        if (mediaType.startsWith('image/') && mediaType !== 'image/svg+xml') {
          const img = document.createElement('img');
          img.src = localFileUrl(url);
          img.alt = hint.name || fileNameFromUrl(url);
          img.loading = 'lazy';
          // 缩略图取不到就退回图标，不留一个破图。
          img.addEventListener('error', () => {
            const fallback = document.createElement('span');
            fallback.className = 'd-icon';
            fallback.textContent = '🖼';
            img.replaceWith(fallback);
          }, { once: true });
          chip.appendChild(img);
        } else {
          const icon = document.createElement('span');
          icon.className = 'd-icon';
          icon.textContent = draftIconFor(mediaType);
          chip.appendChild(icon);
        }
        const text = document.createElement('div');
        text.className = 'd-text';
        const nameEl = document.createElement('div');
        nameEl.className = 'd-name';
        nameEl.textContent = hint.name || fileNameFromUrl(url);
        nameEl.title = url;
        const sizeEl = document.createElement('div');
        sizeEl.className = 'd-size';
        sizeEl.textContent = [mediaType || '类型未知', hint.size ? formatFileBytes(hint.size) : ''].filter(Boolean).join(' · ');
        text.append(nameEl, sizeEl);
        chip.appendChild(text);
        draftAttachments.appendChild(chip);
      }
    }

    humanInput.addEventListener('input', resizeHumanInput);
    humanInput.addEventListener('input', renderDraftAttachments);
    // 入口①：粘贴 —— 🔴 由「只接 image/*」扩到任意类型，且一次粘多个也收。
    // 🔴 P0(2026-09-19 现网回归:业主粘贴图片「完全没反应、输入框是空的」)。
    //    监听器原先绑在 humanInput 这个**叶子节点**上。paste 事件从 document.activeElement
    //    往上冒泡 —— **焦点不在输入框时,冒泡路径根本不经过它 ⇒ 监听器不触发**,
    //    于是既没有上传请求、也没有任何控制台报错(因为压根没执行)。
    //
    //    为什么 0.2.0.6 没人撞上、0.2.0.7 才坏:
    //    0.2.0.6 正文里的直链是**裸文本,点不了** ⇒ 焦点一直留在输入框;
    //    0.2.0.7 把文件名做成 <a>(R4/R5)、又加了下载链接 ⇒ 实测正文附件区有三个可聚焦的 <a>
    //    (#draftAttachments 与 #uploadQueue 里**没有**)⇒ 用户点过任一个,焦点就离开了输入框。
    //    ⇒ **不是某一行写错了,是新增的可点元素把一个既有限制从罕见变成了常态。**
    //
    //    改挂 document:焦点在哪都能粘。只挂 composer 不行 —— 正文在 composer 之外,等于没修。
    //    🔴 代价:作用域变成全页 ⇒ 「剪贴板里没有文件就 return、不干预浏览器原行为」这条更要紧。
    //       用例⑳ 在页面三处(输入框/body/正文链接)粘纯文本把它钉住了,不靠这段注释保证。
    document.addEventListener('paste', (event) => {
      const files = Array.from(event.clipboardData?.items || [])
        .filter((item) => item.kind === 'file')
        .map((item) => item.getAsFile())
        .filter(Boolean);
      if (!files.length) return;   // 纯文本粘贴保持浏览器原行为
      event.preventDefault();
      uploadFiles(files);
    });
    // ── 入口④:页内截屏(0.2.1.2 ③,业主 2026-09-19)────────────────────
    // 点 📷 → getDisplayMedia 选源 → 抓一帧 → **页内框选裁剪** → 走既有上传管道。
    //
    // 🔴 三条硬限制(已向业主讲明,不是实现偷懒):
    //   · 浏览器**强制**弹「选择共享内容」框,绕不过;
    //   · 浏览器只能整屏/整窗抓,**框选必须自实现** —— 不裁剪则只能传整屏,基本无用;
    //   · 以 Chrome 系为准。
    // 🔵 粘贴路径**照旧保留,不替换** —— 截屏是新增入口,不是替代品。
    //
    // 🔴 抓帧这一步留了一个**显式的测试缝** `screenshotFrameSource`:
    //    getDisplayMedia 需要真实用户手势 ＋ 浏览器选源框,headless 给不了。
    //    没有这个缝,框选/裁剪/上传这三步在自动化里**一格都测不到** ——
    //    而那三步才是本功能里我们自己写的部分。选源那一步只能人工,用例里写明了。
    // 🔴 这是**测试缝**,组长 2026-09-19 ts-No.6 批准保留,附两条要求:
    //    ① 谁在用:view-service/renderer-0206-file-render-regression.js 的用例㉕ ——
    //       它替换的**只有抓帧一步**,其后框选/裁剪/生成 File/走 uploadFiles 全是产品代码。
    //    ② 去掉它会失去什么:失去「按选区裁得对不对」这一格。
    //       浏览器开关(--use-fake-ui-for-media-stream ＋ --use-fake-device-for-media-stream)
    //       能让真 getDisplayMedia 自动选源不弹框(用例㉖ 就这么跑),
    //       但它给的是**合成画面、内容不可控** ⇒ 验不了裁剪正确性。
    //    🔴 用例㉖ 专门钉住「不设缝时走的是真 getDisplayMedia」——
    //       防这条缝哪天悄悄变成默认路径,那会让"截屏"静默变成"传一张假图"。
    let screenshotFrameSource = null;
    window.__dwSetScreenshotFrameSource = (fn) => { screenshotFrameSource = fn; };

    async function captureScreenFrame() {
      if (screenshotFrameSource) return screenshotFrameSource();
      if (!navigator.mediaDevices?.getDisplayMedia) {
        throw new Error('本浏览器不支持页内截屏(需要 getDisplayMedia,以 Chrome 系为准)');
      }
      // 🔴 selfBrowserSurface:'include' —— Chrome 默认 'exclude',即把【当前这个 tab】排除在选源列表外
      //    (那默认是为"实时预览会自我嵌套"设的;我们抓一帧就停轨,没有预览,只剩"业主截不到眼前这页")。
      //    不认这个成员的浏览器会按 WebIDL 把它当未知成员忽略 ⇒ 无副作用(忽略机制已实测,见用例 ㉚ 守卫②)。
      const stream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: false, selfBrowserSurface: 'include' });
      try {
        const video = document.createElement('video');
        video.srcObject = stream;
        video.muted = true;
        await video.play();
        // 等一帧真正可用:metadata 到了不代表已经有画面。
        await new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)));
        const canvas = document.createElement('canvas');
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        canvas.getContext('2d').drawImage(video, 0, 0);
        return canvas;
      } finally {
        stream.getTracks().forEach((t) => t.stop());   // 不停轨 ⇒ 浏览器会一直显示"正在共享"
      }
    }

    let shotSourceCanvas = null;
    let shotRect = null;   // {x,y,w,h} 源图坐标系

    function closeShotOverlay() {
      shotOverlay.hidden = true;
      shotSel.hidden = true;
      shotSourceCanvas = null;
      shotRect = null;
    }

    async function startScreenshot() {
      if (stats.readonly) {
        handleIncomingEvent({ kind: 'error', text: isConsoleView() ? '上传授权暂不可用，请检查登录或访问权限' : '只读模式：先解锁再上传文件', data: { code: 'file_upload_readonly' } });
        return;
      }
      try {
        shotSourceCanvas = await captureScreenFrame();
      } catch (err) {
        // 🔴 抓不到必须可见:用户点了按钮,什么都不发生是最难报告的一种失败。
        //    (用户自己在选源框点「取消」也走这里,文案要能区分得开。)
        handleIncomingEvent({ kind: 'error', text: `截屏未完成：${err.message}`, data: { code: 'screenshot_failed' } });
        return;
      }
      shotCanvas.width = shotSourceCanvas.width;
      shotCanvas.height = shotSourceCanvas.height;
      shotCanvas.getContext('2d').drawImage(shotSourceCanvas, 0, 0);
      shotRect = null;
      shotSel.hidden = true;
      shotOverlay.hidden = false;
    }

    // 框选:鼠标坐标 → 源图坐标(canvas 会被 max-width 缩放,必须按缩放比换算)
    (() => {
      let dragging = false;
      let startX = 0;
      let startY = 0;
      const toSource = (ev) => {
        const r = shotCanvas.getBoundingClientRect();
        const sx = shotCanvas.width / r.width;
        const sy = shotCanvas.height / r.height;
        return { x: (ev.clientX - r.left) * sx, y: (ev.clientY - r.top) * sy, r };
      };
      shotCanvas?.addEventListener('pointerdown', (ev) => {
        dragging = true;
        const p = toSource(ev);
        startX = p.x; startY = p.y;
        shotRect = null;
        shotSel.hidden = true;
        shotCanvas.setPointerCapture?.(ev.pointerId);
      });
      shotCanvas?.addEventListener('pointermove', (ev) => {
        if (!dragging) return;
        const p = toSource(ev);
        const x = Math.min(startX, p.x);
        const y = Math.min(startY, p.y);
        const w = Math.abs(p.x - startX);
        const h = Math.abs(p.y - startY);
        shotRect = { x, y, w, h };
        const wrap = shotWrap.getBoundingClientRect();
        shotSel.hidden = false;
        shotSel.style.left = `${(x / shotCanvas.width) * p.r.width + (p.r.left - wrap.left)}px`;
        shotSel.style.top = `${(y / shotCanvas.height) * p.r.height + (p.r.top - wrap.top)}px`;
        shotSel.style.width = `${(w / shotCanvas.width) * p.r.width}px`;
        shotSel.style.height = `${(h / shotCanvas.height) * p.r.height}px`;
      });
      shotCanvas?.addEventListener('pointerup', () => { dragging = false; });
    })();

    // 供用例直接设选区(框选是鼠标行为,坐标换算另有其测法;这里让"裁剪+上传"能被单独验)
    window.__dwSetShotRect = (rect) => { shotRect = rect; };

    async function confirmScreenshot() {
      if (!shotSourceCanvas) return;
      const full = { x: 0, y: 0, w: shotSourceCanvas.width, h: shotSourceCanvas.height };
      // 不框选 = 整张(业主可能就是要整屏);框太小(<4px)按误触处理,也当整张。
      const r = (shotRect && shotRect.w >= 4 && shotRect.h >= 4) ? shotRect : full;
      const out = document.createElement('canvas');
      out.width = Math.round(r.w);
      out.height = Math.round(r.h);
      out.getContext('2d').drawImage(shotSourceCanvas,
        Math.round(r.x), Math.round(r.y), Math.round(r.w), Math.round(r.h),
        0, 0, out.width, out.height);
      const blob = await new Promise((res) => out.toBlob(res, 'image/png'));
      closeShotOverlay();
      if (!blob) {
        handleIncomingEvent({ kind: 'error', text: '截屏裁剪失败：拿不到图片数据', data: { code: 'screenshot_failed' } });
        return;
      }
      const stamp = new Date().toISOString().replace(/[:.]/g, '-');
      // 🔴 走**既有**上传管道,不另写一条:上传的进度行/草稿块/直链回填/P0 文件名编码
      //    全部沿用,不给自己留第二条需要单独维护的路。
      await uploadFiles([new File([blob], `screenshot-${stamp}.png`, { type: 'image/png' })]);
    }

    shotBtn?.addEventListener('click', startScreenshot);
    shotConfirm?.addEventListener('click', confirmScreenshot);
    shotCancel?.addEventListener('click', closeShotOverlay);

    // 入口②：文件选择（可多选）。这是 0.2.0.5 缺的那个「看得见的入口」。
    filePicker?.addEventListener('change', () => {
      const picked = Array.from(filePicker.files || []);
      uploadFiles(picked).finally(() => { filePicker.value = ''; });   // 清空以便再选同一个文件
    });
    // 入口③：拖放，支持一次拖入多个。
    (() => {
      const composer = composerInner?.closest('.composer');
      let dragDepth = 0;
      const hasFiles = (ev) => Array.from(ev.dataTransfer?.types || []).includes('Files');
      const setDragging = (on) => {
        composer?.classList.toggle('dragging', on);
        if (dropHint) dropHint.hidden = !on;
      };
      addEventListener('dragenter', (event) => {
        if (!hasFiles(event)) return;
        dragDepth += 1;
        setDragging(true);
      });
      addEventListener('dragover', (event) => {
        if (!hasFiles(event)) return;
        event.preventDefault();   // 不阻止的话浏览器会直接打开文件，页面被替换掉
        if (event.dataTransfer) event.dataTransfer.dropEffect = 'copy';
      });
      addEventListener('dragleave', (event) => {
        if (!hasFiles(event)) return;
        dragDepth = Math.max(0, dragDepth - 1);
        if (!dragDepth) setDragging(false);
      });
      addEventListener('drop', (event) => {
        if (!hasFiles(event)) return;
        event.preventDefault();
        dragDepth = 0;
        setDragging(false);
        uploadFiles(event.dataTransfer?.files);
      });
    })();
    // ── V11 输入框 @ 候选 ─────────────────────────────────────────────────────────
    // 键入＠(行首或空白之后)⇒ 在输入框上方弹出同组 Agent 候选;每行「短名（长名）」,CLI 图标＋在线点;
    // 继续输入按短名或长名前缀过滤;↑↓ 移动、回车/Tab/点击选中、Esc 关闭;选中把「＠词」换成「＠insert 」。
    // 🔴 Hub 掌握事实:候选只含本组 Agent、`insert`(组内短名唯一 ⇒ 短名,否则全名)由 Hub 给,页面不自己算。
    // 🔴 浮层打开且有可选项时,回车=选中而不是发送;没有可选项(加载中/失败/无匹配)回车照常发送;输入法选字中一律不拦截。
    // 🔴 候选加载失败不影响正常输入与发送。
    const MENTION_TTL_MS = 10000, MENTION_FETCH_TIMEOUT_MS = 5000;
    const mentionPopup = document.createElement('div');
    mentionPopup.id = 'mentionPopup'; mentionPopup.className = 'mention-popup'; mentionPopup.setAttribute('role', 'listbox');
    mentionPopup.setAttribute('aria-label', '同组 Agent 候选'); mentionPopup.hidden = true;
    composerInner.append(mentionPopup);
    humanInput.setAttribute('aria-controls', 'mentionPopup'); humanInput.setAttribute('aria-expanded', 'false');
    const mention = { open: false, items: [], active: 0, token: null, status: 'idle', loadedAt: 0, gen: 0 };
    // R-V2-0102-VIEW-MENTION-ROUTE:选中的候选记下 full_name,发送时交给 Hub 投递(Hub 只认这份结构化名单,不解析正文)。
    // 正文里那段「@insert」被删掉 ⇒ 不再带上;手打的同样文字不算(组长 NOFALLBACK 035027)。
    const mentionPicked = [];
    // 正文里是否还有「@insert」独立一段(前不接名字字符,后不接名字字符)——发送取目标与输入时剔除共用这一个判据。
    function mentionPrefixAllowed(text, at) {
      return at === 0 || !/[A-Za-z0-9.]/.test(text.charAt(at - 1));
    }
    function mentionInsertPresent(text, insert) {
      const at = '@' + insert;
      for (let i = text.indexOf(at); i >= 0; i = text.indexOf(at, i + 1)) {
        const after = text.charAt(i + at.length);
        if (mentionPrefixAllowed(text, i) && !/[A-Za-z0-9.]/.test(after)) return true;
      }
      return false;
    }
    function mentionTargetsFor(text) {
      const out = [];
      for (const p of mentionPicked) {
        if (mentionInsertPresent(text, p.insert) && !out.includes(p.full_name)) out.push(p.full_name);
      }
      return out;
    }
    // 0.2.1.103 C(R-V2-0103-SMALLFIXES):正文里已不再有某个已选的「@insert」⇒ 立刻从已选集合剔除;
    // 之后手打同样文字不算已选(组长 NOFALLBACK:手打不转发)。输入法组字中的 input 不剔除,组字结束(compositionend)再判。
    function mentionPrunePicked() {
      const text = humanInput.value;
      for (let i = mentionPicked.length - 1; i >= 0; i--) {
        if (!mentionInsertPresent(text, mentionPicked[i].insert)) mentionPicked.splice(i, 1);
      }
    }
    humanInput.addEventListener('input', (e) => { if (!e.isComposing) mentionPrunePicked(); });
    humanInput.addEventListener('compositionend', () => mentionPrunePicked());
    const mentionReceipt = document.createElement('div');
    mentionReceipt.id = 'mentionReceipt'; mentionReceipt.className = 'mention-receipt'; mentionReceipt.setAttribute('role', 'status'); mentionReceipt.hidden = true;
    composerInner.after(mentionReceipt);
    function renderMentionReceipts(list) {
      mentionReceipt.replaceChildren();
      const rows = Array.isArray(list) ? list.filter((m) => m && typeof m.message === 'string' && m.message) : [];
      for (const m of rows) {
        const row = document.createElement('div'); row.className = 'mention-receipt-row';
        row.dataset.status = String(m.status || ''); row.textContent = m.message;   // textContent:Hub 文字不当 HTML
        mentionReceipt.append(row);
      }
      mentionReceipt.hidden = rows.length === 0;
    }
    function mentionToken() {
      const pos = humanInput.selectionStart;
      if (humanInput.selectionEnd !== pos) return null;
      const m = /@([A-Za-z0-9.]*)$/.exec(humanInput.value.slice(0, pos));
      return m && mentionPrefixAllowed(humanInput.value, m.index)
        ? { start: m.index, caret: pos, query: m[1] } : null;
    }
    function mentionMatches() {
      const q = (mention.token ? mention.token.query : '').toLowerCase();
      return mention.items.filter((it) => !q || String(it.name || '').toLowerCase().startsWith(q) || String(it.full_name || '').toLowerCase().startsWith(q));
    }
    function mentionClose() {
      mention.open = false; mention.token = null; mentionPopup.hidden = true; mentionPopup.replaceChildren();
      humanInput.setAttribute('aria-expanded', 'false'); humanInput.removeAttribute('aria-activedescendant');
    }
    function mentionNote(text, retry) {
      const row = document.createElement('div'); row.className = 'mention-row mention-note'; row.textContent = text;
      if (retry) { row.style.cursor = 'pointer'; row.dataset.retry = '1'; row.addEventListener('mousedown', (e) => { e.preventDefault(); mentionLoad(true); }); }
      return row;
    }
    function mentionRender() {
      if (!mention.open) return;
      mentionPopup.replaceChildren();
      const rows = mentionMatches();
      if (mention.active >= rows.length) mention.active = Math.max(0, rows.length - 1);
      if (mention.status === 'loading' && !mention.items.length) mentionPopup.append(mentionNote('加载候选…'));
      else if (mention.status === 'error' && !mention.items.length) mentionPopup.append(mentionNote('候选加载失败，点此重试', true));
      else if (!mention.items.length) mentionPopup.append(mentionNote('本组没有其他 Agent'));
      else if (!rows.length) mentionPopup.append(mentionNote('没有匹配的 Agent'));
      rows.forEach((it, i) => {
        const row = document.createElement('div');
        row.className = 'mention-row'; row.id = `mentionOpt${i}`; row.setAttribute('role', 'option');
        row.setAttribute('aria-selected', i === mention.active ? 'true' : 'false'); row.dataset.insert = it.insert || it.full_name || it.name || '';
        const ico = document.createElement('span'); ico.className = 'mention-ico'; ico.dataset.cli = String(it.cli || '').toLowerCase();
        ico.textContent = ({ claude: 'C', codex: 'X', opencode: 'O', deepseek: 'D' })[ico.dataset.cli] || '?';
        const dot = document.createElement('span'); dot.className = 'mention-dot'; dot.dataset.online = it.online === true ? 'true' : 'false';
        dot.title = it.online === true ? '在线' : '离线'; ico.append(dot);
        const label = document.createElement('span'); label.className = 'mention-label';
        const full = document.createElement('span'); full.className = 'mention-full'; full.textContent = `（${it.full_name || ''}）`;
        label.append(document.createTextNode(it.name || ''), full);
        row.append(ico, label);
        row.addEventListener('mousedown', (e) => { e.preventDefault(); mentionSelect(i); });   // 不抢走输入框焦点
        mentionPopup.append(row);
      });
      if (rows.length) humanInput.setAttribute('aria-activedescendant', `mentionOpt${mention.active}`);
      else humanInput.removeAttribute('aria-activedescendant');
      mentionPopup.style.maxHeight = `${Math.max(64, Math.min(232, Math.floor(composerInner.getBoundingClientRect().top) - 14))}px`;   // 矮视口:不超出输入框上方可用空间
      const sel = mentionPopup.querySelector('[aria-selected="true"]'); if (sel) sel.scrollIntoView({ block: 'nearest' });
    }
    function mentionSelectable() { return mention.open && mentionMatches().length > 0; }
    function mentionSelect(index) {
      const it = mentionMatches()[index]; const tok = mention.token;
      if (!it || !tok) return;
      const insert = it.insert || it.full_name || it.name || '';
      humanInput.setRangeText(`@${insert} `, tok.start, tok.caret, 'end');
      if (it.full_name) mentionPicked.push({ insert, full_name: it.full_name });
      humanInput.dispatchEvent(new Event('input', { bubbles: true }));   // 约束:改 humanInput.value 必须派发 input
      mentionClose(); humanInput.focus();
    }
    async function mentionLoad(force) {
      const fresh = mention.status === 'ok' && Date.now() - mention.loadedAt < MENTION_TTL_MS;
      if (fresh && !force) return;
      if (mention.status === 'loading' && !force) return;   // 沿用在途那次,慢接口下连敲不重复请求
      if (mention.status === 'error' && !force) return;     // 失败后打字不自动重取(Hub 故障/限流时不放大);点「重试」或重新打开浮层才重取
      const gen = ++mention.gen; mention.status = 'loading'; mentionRender();
      const controller = new AbortController(); const timer = setTimeout(() => controller.abort(), MENTION_FETCH_TIMEOUT_MS);
      try {
        const r = await fetch(apiEp('mention-candidates'), { cache: 'no-store', signal: controller.signal });
        if (!r.ok) throw new Error(`HTTP ${r.status}`);
        const data = await r.json();
        if (!data || !Array.isArray(data.candidates)) throw new Error('bad shape');
        if (gen !== mention.gen) return;                       // 过期应答不得覆盖新应答
        mention.items = data.candidates.filter((c) => c && c.full_name); mention.status = 'ok'; mention.loadedAt = Date.now();
      } catch (_) {
        if (gen !== mention.gen) return;
        mention.status = 'error'; mention.items = [];
      } finally { clearTimeout(timer); }
      mentionRender();
    }
    function mentionSync() {
      if (humanInput.disabled) { if (mention.open) mentionClose(); return; }
      const tok = mentionToken();
      if (!tok) { if (mention.open) mentionClose(); return; }
      const opening = !mention.open;
      mention.token = tok;
      if (opening && (mention.status === 'loading' || mention.status === 'error')) mention.status = 'idle';   // 重新打开:在途那次可能带着旧数据,重取(只在打开时;打字不重取)
      if (opening) { mention.open = true; mention.active = 0; mentionPopup.hidden = false; humanInput.setAttribute('aria-expanded', 'true'); }
      else mention.active = 0;
      mentionRender(); mentionLoad(false);
    }
    humanInput.addEventListener('input', (e) => { if (!e.isComposing) mentionSync(); });
    humanInput.addEventListener('compositionend', () => mentionSync());
    humanInput.addEventListener('click', mentionSync);
    humanInput.addEventListener('keyup', (e) => { if (['ArrowLeft', 'ArrowRight', 'Home', 'End'].includes(e.key)) mentionSync(); });
    humanInput.addEventListener('blur', () => { if (mention.open) mentionClose(); });
    // 捕获阶段先于下面那个 Enter=发送 的监听;只在"有可选项"时拦截,其余一律放行。
    humanInput.addEventListener('keydown', (e) => {
      if (!mention.open || e.isComposing) return;
      if (e.key === 'Escape') { e.preventDefault(); e.stopImmediatePropagation(); mentionClose(); return; }
      if (!mentionSelectable()) return;
      const n = mentionMatches().length;
      if (e.key === 'ArrowDown') { e.preventDefault(); e.stopImmediatePropagation(); mention.active = (mention.active + 1) % n; mentionRender(); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); e.stopImmediatePropagation(); mention.active = (mention.active - 1 + n) % n; mentionRender(); }
      else if ((e.key === 'Enter' && !e.ctrlKey && !e.metaKey && !e.shiftKey) || e.key === 'Tab') { e.preventDefault(); e.stopImmediatePropagation(); mentionSelect(mention.active); }
    }, true);
    // Enter 发送；Ctrl/Cmd/Shift+Enter 在光标或选区处插入换行。
    // isComposing 守卫：中文输入法选字回车只确认候选，不误发送。
    humanInput.addEventListener('keydown', (e) => {
      if (e.key !== 'Enter' || e.isComposing) return;
      e.preventDefault();
      if (e.ctrlKey || e.metaKey || e.shiftKey) insertInputNewline();
      else doSend();
    });
    resizeHumanInput();
    document.getElementById('interruptBtn').addEventListener('click', () => {
      c2RequestInterrupt();  // C2:已请求→(流上 control 事件)已发出;无传输时内部回退 legacy /interrupt,确认语义不变
    });
    async function copyUnlockInstruction() {
      const command = `#unlock ${stats.unlockCode}`;
      try {
        await navigator.clipboard.writeText(command);
        copyUnlockBtn.textContent = '已复制 #unlock';
      } catch {
        copyUnlockBtn.textContent = command;
      }
      setTimeout(() => {
        if (stats.readonly) copyUnlockBtn.textContent = '复制解锁指令';
      }, 1100);
    }
    copyUnlockBtn.addEventListener('click', copyUnlockInstruction);

    addEventListener('pagehide', () => {
      closeViewRefresh();
      if (stats.authMode !== 'view_page_v2' || !pageIdentity) return;
      navigator.sendBeacon(`${apiEp('page')}/disconnect`, new Blob([JSON.stringify({
        page_id: pageIdentity.page_id, page_token: pageIdentity.page_token,
      })], { type: 'application/json' }));
    });
    addEventListener('pageshow', event => {
      if (!event.persisted || stats.authMode !== 'view_page_v2') return;
      viewRefreshClosed = false; viewAuthGeneration++;
      resetPageIdentityChannel();
      startViewRefresh();
      ensurePageIdentity().catch(() => setStatus('disconnected'));
    });

    startApp();
  </script>
</body>
</html>

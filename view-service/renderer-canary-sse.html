<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DingWei Event View</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f7f9;
      --panel: #ffffff;
      --panel-2: #f0f3f7;
      --text: #20242a;
      --muted: #69717d;
      --line: #d8dee8;
      --accent: #0b6bcb;
      --accent-2: #0f766e;
      --danger: #b42318;
      --danger-bg: #fff1f0;
      --code-bg: #101828;
      --code-text: #e6edf3;
      --waiting-white-space: nowrap;
      --shadow: 0 12px 30px rgba(16, 24, 40, 0.08);
    }

    [data-theme="dark"] {
      color-scheme: dark;
      --bg: #111316;
      --panel: #1b1f24;
      --panel-2: #242a31;
      --text: #eef2f6;
      --muted: #a8b0bb;
      --line: #38414c;
      --accent: #6cb6ff;
      --accent-2: #7dd3c7;
      --danger: #ffb4a9;
      --danger-bg: #3a1f1f;
      --code-bg: #070b10;
      --code-text: #e6edf3;
      --shadow: 0 12px 30px rgba(0, 0, 0, 0.35);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      height: 100vh;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font: 14px/1.55 ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing: 0;
    }
    button, input { font: inherit; }
    .app {
      height: 100vh;
      min-height: 0;
      min-width: 0;
      max-width: 100vw;
      display: grid;
      grid-template-rows: auto 1fr auto;
      overflow: hidden;
    }
    .topbar {
      position: sticky;
      top: 0;
      z-index: 5;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 18px;
      background: color-mix(in srgb, var(--panel) 92%, transparent);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(10px);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }
    .mark {
      display: grid;
      place-items: center;
      width: 32px;
      height: 32px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--panel-2);
      color: var(--accent);
      font-weight: 700;
    }
    .title {
      font-size: 18px;
      font-weight: 750;
      white-space: var(--waiting-white-space);
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.2;
    }
    .subtitle {
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .lock-panel {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 10px;
      min-width: 0;
      flex-wrap: wrap;
    }
    .lock-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: 32px;
      padding: 0 10px;
      border-radius: 999px;
      border: 1px solid var(--line);
      font-weight: 750;
      white-space: nowrap;
    }
    .lock-badge.readonly {
      color: var(--danger);
      border-color: color-mix(in srgb, var(--danger) 50%, var(--line));
      background: color-mix(in srgb, var(--danger-bg) 80%, var(--panel));
    }
    .lock-badge.writable {
      color: var(--accent-2);
      border-color: color-mix(in srgb, var(--accent-2) 50%, var(--line));
      background: color-mix(in srgb, var(--accent-2) 12%, var(--panel));
    }
    .lock-help {
      color: var(--muted);
      font-size: 13px;
      white-space: nowrap;
    }
    .source-badge {
      display: inline-block;
      padding: 1px 6px;
      margin-right: 6px;
      border-radius: 4px;
      font-size: 11px;
      line-height: 16px;
      background: var(--accent, #2f6fdd);
      color: #fff;
      vertical-align: middle;
    }
    .source-badge--trusted { background: #1a7f4b; }
    /* display-provenance v1 来源图标(灰度 flag 门控) */
    .prov-ic { display: inline-flex; align-items: center; justify-content: center; width: 18px; height: 18px; border-radius: 50%; background: color-mix(in srgb, var(--accent) 18%, var(--panel)); color: var(--accent); font-size: 11px; font-weight: 600; vertical-align: middle; flex: none; }
    .prov-ic .prov-svg { width: 13px; height: 13px; display: block; }
    .prov-ic--human { background: var(--accent); color: #fff; }
    .prov-label { font-size: 12px; color: var(--muted, #888); margin: 0 4px 0 3px; vertical-align: middle; }
    .prov-spin { color: var(--muted, #888); font-size: 12px; margin-right: 4px; }
    /* 等候区在途条(张宗楚灰度反馈#2):明确「投递中」+单行截断,不与「已收到消息」混淆 */
    .waiting-item--pending { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--muted, #888); }
    .waiting-item--pending .waiting-text { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1 1 auto; min-width: 0; }
    .waiting-item--pending .prov-spin { flex: none; }
    .waiting-item--pending .waiting-stage { flex: none; }
    .card-stage-footer {
      margin-top: 4px;
      font-size: 12px;
      color: var(--muted, #888);
      display: flex;
      gap: 6px;
      align-items: center;
      flex-wrap: wrap;
    }
    .card-footnote {
      font-size: 11px;
      color: var(--muted, #888);
      border: 1px dashed var(--muted, #888);
      border-radius: 4px;
      padding: 0 4px;
    }
    .cancellable-tag {
      font-size: 11px;
      color: #b8860b;
      border: 1px solid #b8860b;
      border-radius: 4px;
      padding: 0 4px;
      margin-left: 6px;
    }
    .waiting-item--model-delay { flex-wrap: wrap; }
    .model-queued-wait { white-space: normal; display: block; flex-basis: 100%; color: var(--warn, #b45309); font-weight: 600; }
    .waiting-stage { margin-left: 6px; font-size: 11px; color: var(--muted, #888); }

    /* C2 待提交区删除/中断确认 */
    .waiting-cancel-btn {
      font-size: 11px; line-height: 1; padding: 1px 6px; margin-left: 6px;
      border: 1px solid var(--danger, #c00); color: var(--danger, #c00);
      background: transparent; border-radius: 4px; cursor: pointer;
    }
    .waiting-cancel-btn:disabled { opacity: .5; cursor: default; }
    .c2-note { margin-left: 6px; font-size: 11px; color: var(--muted, #888); }

    /* C3 责任方任务看板 */
    .taskboard-handle {
      position: fixed; right: 0; top: 40%; z-index: 40;
      writing-mode: vertical-rl; padding: 10px 6px;
      border: 1px solid var(--line, #444); border-right: none;
      border-radius: 8px 0 0 8px;
      background: var(--bg-elev, #1e1e24); color: var(--fg, #ddd);
      cursor: pointer; font-size: 13px;
    }
    .taskboard-panel {
      position: fixed; right: 0; top: 0; bottom: 0; width: 320px; z-index: 39;
      background: var(--bg-elev, #1e1e24); border-left: 1px solid var(--line, #444);
      display: flex; flex-direction: column; overflow: hidden;
    }
    .taskboard-panel[hidden] { display: none; }
    .taskboard-head { padding: 10px 12px; border-bottom: 1px solid var(--line, #444); }
    .taskboard-title { font-weight: 600; font-size: 14px; }
    .taskboard-updated { font-size: 11px; color: var(--muted, #888); margin-top: 4px; }
    .taskboard-updated.stale { color: #b8860b; }
    .taskboard-error { color: var(--danger, #d66); font-size: 13px; }
    .taskboard-list { flex: 1; overflow-y: auto; padding: 8px; display: flex; flex-direction: column; gap: 8px; }
    .task-card { border: 1px solid var(--line, #444); border-radius: 8px; padding: 8px; background: var(--bg, #16161c); }
    .task-card-head { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .task-dot { width: 8px; height: 8px; border-radius: 50%; flex: 0 0 auto; }
    .task-dot.status-todo { background: #888; }
    .task-dot.status-in_progress { background: #2f6fdd; }
    .task-dot.status-blocked { background: #d66; }
    .task-dot.status-in_review { background: #b8860b; }
    .task-dot.status-done { background: #1a7f4b; }
    .task-id { font-weight: 600; font-size: 13px; }
    .task-title { font-size: 12px; color: var(--fg, #ddd); flex: 1; }
    .task-owner { font-size: 11px; color: var(--muted, #888); }
    .task-card-body { margin-top: 6px; font-size: 12px; display: flex; flex-direction: column; gap: 4px; }
    .task-status-line { color: var(--muted, #888); font-size: 11px; }
    .task-bar { height: 4px; border-radius: 2px; background: var(--line, #444); overflow: hidden; }
    .task-bar-fill { height: 100%; background: var(--accent, #2f6fdd); }
    .task-blockers { color: #d66; font-size: 11px; }
    .task-deps { font-size: 11px; color: var(--accent, #2f6fdd); cursor: pointer; }
    .task-note { font-size: 11px; color: var(--fg, #ccc); white-space: pre-wrap; }
    .task-evidence { display: flex; align-items: center; gap: 6px; font-size: 11px; }
    .task-evidence-text { color: var(--muted, #888); word-break: break-all; flex: 1; }
    .task-evidence-copy { font-size: 10px; padding: 1px 6px; border: 1px solid var(--line, #444); border-radius: 4px; background: transparent; color: var(--fg, #ddd); cursor: pointer; }
    .task-card.status-blocked { border-color: #d66; }
    @media (max-width: 768px) {
      .taskboard-panel { width: 100%; top: auto; height: 60%; border-left: none; border-top: 1px solid var(--line, #444); }
      .taskboard-handle { top: auto; bottom: 40%; writing-mode: horizontal-tb; border-radius: 8px 8px 0 0; border: 1px solid var(--line, #444); border-bottom: none; }
      /* S-R62-MOBILE：会话阅读页窄屏点击目标≥40px（业主：手机上难操作）。
         只抬最小高/宽，不改配色与结构；PC（>768）零变化。min-height 压过
         .statusbar .unlock-btn 的 height:24px 是 CSS 本意（最小高优先）。 */
      .text-btn, .unlock-btn, #themeBtn, #clockStatus, #interruptBtn { min-height: 40px; }
      #themeBtn, #interruptBtn, .unlock-btn { min-width: 40px; }
    }

    .unlock-btn {
      height: 32px;
      border-radius: 6px;
      border: 1px solid var(--accent);
      background: var(--accent);
      color: #fff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 10px;
      cursor: pointer;
      white-space: nowrap;
    }
    .unlock-btn[hidden] { display: none; }
    .controls {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      flex-wrap: wrap;
    }
    .icon-btn, .text-btn, .file-label {
      height: 34px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--panel);
      color: var(--text);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 0 10px;
      cursor: pointer;
      box-shadow: none;
    }
    #historyOlder[hidden] { display: none; }
    .icon-btn { width: 36px; padding: 0; }
    .icon-btn:hover, .text-btn:hover, .file-label:hover { border-color: var(--accent); }
    .file-label input { display: none; }

    /* ── 0.2.0.6 A 线：正文区文件渲染（业主第 2 条） ───────────────────
       渲染不了的一律给下载链接，绝不留裸 URL、绝不报错卡。 */
    .attachments { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
    .attachment {
      border: 1px solid var(--line); border-radius: 8px; padding: 8px;
      background: var(--panel); max-width: 100%; overflow: hidden;
    }
    .attachment-head {
      display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
      font-size: 12px; color: var(--muted); margin-bottom: 6px;
    }
    .attachment-name { color: var(--text); font-weight: 600; word-break: break-all; text-decoration: none; }
    .attachment-name:hover { text-decoration: underline; }
    /* R5-2：正文里那条已经被渲染成附件块的 URL ⇒ 视觉隐藏。
       🔴 只隐藏，不从 DOM 删除 —— 接收侧靠扫正文里的 /f/ 直链分派（附录 B2），
          删掉会让那条机制失效，也会让「附件块数 == 正文直链数」这条不变式失去锚。 */
    .dw-link-rendered { display: none; }
    .attachment img, .attachment video { max-width: 100%; max-height: 420px; border-radius: 6px; display: block; }
    .attachment iframe { width: 100%; height: 480px; border: 0; border-radius: 6px; background: #fff; }
    .attachment audio { width: 100%; display: block; }
    .attachment pre {
      margin: 0; max-height: 360px; overflow: auto; white-space: pre-wrap; word-break: break-word;
      font-size: 12px; line-height: 1.5;
    }
    .attachment-dl {
      display: inline-flex; align-items: center; gap: 6px; text-decoration: none;
      border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; color: var(--text);
    }
    .attachment-dl:hover { border-color: var(--accent); }
    .attachment-note { font-size: 12px; color: var(--muted); margin-top: 6px; }
    .drop-hint {
      margin-top: 8px; padding: 10px; border: 1px dashed var(--accent); border-radius: 8px;
      text-align: center; font-size: 13px; color: var(--muted);
    }
    .composer.dragging .composer-inner { border-color: var(--accent); }

    /* ── 上传进度（业主验收第 1 条）────────────────────────────── */
    .upload-queue { display: flex; flex-direction: column; gap: 6px; margin-bottom: 8px; }
    .upload-row {
      display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; align-items: center;
      border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; background: var(--panel);
      font-size: 12px;
    }
    .upload-row .u-name { color: var(--text); font-weight: 600; word-break: break-all; }
    .upload-row .u-meta { color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
    .upload-row .u-bar { grid-column: 1 / -1; height: 4px; border-radius: 2px; background: var(--line); overflow: hidden; }
    .upload-row .u-fill { height: 100%; width: 0; background: var(--accent); transition: width .15s linear; }
    /* 未知进度（申请票据/等响应）时用一条来回走的条，表示「在动」而不是「卡住」 */
    .upload-row.indeterminate .u-fill { width: 35%; animation: u-slide 1.1s ease-in-out infinite; }
    @keyframes u-slide { 0% { margin-left: -35%; } 100% { margin-left: 100%; } }
    .upload-row.failed { border-color: #c0392b; }
    .upload-row.failed .u-meta { color: #c0392b; }
    .upload-row .u-retry { grid-column: 1 / -1; justify-self: start; font-size: 12px; padding: 1px 8px; }
    .upload-row.done .u-fill { background: #2e9e5b; }

    /* ── 批次级状态（R6，组长 2026-09-18 裁定）──────────────────────
       🔴 批次行与单文件行是**两层**，故用独立类名、独立 DOM，不复用 .upload-row：
          复用会让盯单文件行的断言被批次行连带满足（⑨ 的「完成后不得残留进度行」
          正是这种形状），于是批次行一出现，⑨ 就再也分辨不出单文件行有没有清干净。*/
    .batch-row {
      display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; align-items: center;
      border: 1px solid var(--accent); border-radius: 6px; padding: 6px 10px; background: var(--panel);
      font-size: 12px;
    }
    .batch-row .b-name { color: var(--text); font-weight: 600; }
    .batch-row .b-meta { color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
    .batch-row .b-bar { grid-column: 1 / -1; height: 4px; border-radius: 2px; background: var(--line); overflow: hidden; }
    .batch-row .b-fill { height: 100%; width: 0; background: var(--accent); transition: width .15s linear; }
    .batch-row[data-batch-state="all-ok"] .b-fill { background: #2e9e5b; }
    .batch-row[data-batch-state="has-failure"] { border-color: #c0392b; }
    .batch-row[data-batch-state="has-failure"] .b-meta { color: #c0392b; }

    /* ── 草稿附件缩略图（业主验收第 2 条）───────────────────────── */
    .draft-attachments { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
    .draft-chip {
      display: flex; align-items: center; gap: 8px; max-width: 260px;
      border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px 6px 6px; background: var(--panel);
    }
    .draft-chip img { width: 40px; height: 40px; object-fit: cover; border-radius: 4px; display: block; flex: 0 0 auto; }
    .draft-chip .d-icon {
      width: 40px; height: 40px; border-radius: 4px; flex: 0 0 auto; display: flex;
      align-items: center; justify-content: center; font-size: 18px; background: var(--bg); border: 1px solid var(--line);
    }
    .draft-chip .d-text { min-width: 0; }
    .draft-chip .d-name { font-size: 12px; font-weight: 600; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .draft-chip .d-size { font-size: 11px; color: var(--muted); }
    .main {
      min-height: 0;
      min-width: 0;
      max-width: 100%;
      display: flex;
      flex-direction: column;
      width: 100%;
      margin: 0 auto;
      padding: 16px;
      overflow: hidden;
    }
    .stream-alert {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
      padding: 10px 12px;
      border: 1px solid color-mix(in srgb, var(--danger) 45%, var(--line));
      border-radius: 8px;
      background: var(--danger-bg);
      color: var(--danger);
    }
    .stream-alert[data-tone="notice"] {
      border-color: var(--line);
      background: var(--panel);
      color: var(--muted);
      padding: 6px 12px;
    }
    .stream-alert[data-tone="notice"] #streamAlertText {
      min-width: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .stream-alert[hidden] { display: none; }
    .stream-alert .text-btn { flex: 0 0 auto; }
    .timeline {
      flex: 1;
      min-width: 0;
      min-height: 0;
      max-width: 100%;
      display: flex;
      flex-direction: column;
      gap: 10px;
      overflow-y: auto;
      overscroll-behavior: contain;
      overflow-anchor: none;
      padding-right: 4px;
      scroll-behavior: smooth;
    }
    .waiting-area {
      flex: 0 0 auto;
      margin-top: 10px;
      max-height: min(35vh, 280px);
      border: 1px dashed var(--line);
      border-radius: 10px;
      background: color-mix(in srgb, var(--muted) 12%, var(--panel));
      overflow-y: auto;
      overscroll-behavior: contain;
    }
    .waiting-area[hidden] { display: none; }
    .waiting-item {
      padding: 10px 12px;
      border-top: 1px solid var(--line);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .waiting-item:first-child { border-top: none; }
    .waiting-item::before {
      content: '';
      display: inline-block;
      width: 11px;
      height: 11px;
      margin-right: 8px;
      vertical-align: -1px;
      border: 2px solid color-mix(in srgb, var(--muted) 35%, transparent);
      border-top-color: var(--muted);
      border-radius: 50%;
      animation: dw-waiting-spin .7s linear infinite;
    }
    @keyframes dw-waiting-spin { to { transform: rotate(360deg); } }
    .task-progress {
      flex: 0 0 auto;
      height: 3px;
      width: 100%;
      overflow: hidden;
      background: color-mix(in srgb, var(--accent) 15%, transparent);
      border-radius: 2px;
    }
    .task-progress[hidden] { display: none; }
    .task-progress::before {
      content: '';
      display: block;
      height: 100%;
      width: 40%;
      background: var(--accent);
      border-radius: 2px;
      animation: dw-task-indeterminate 1.1s ease-in-out infinite;
    }
    @keyframes dw-task-indeterminate {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(250%); }
    }
    @media (prefers-reduced-motion: reduce) {
      .waiting-item::before { animation: none; }
      .task-progress::before { animation-duration: 2.2s; }
    }
    .message-card, .activity-card {
      flex: 0 0 auto;      /* 关键:不被 flex 压缩,事件保持原高 → 溢出由 timeline 滚动,而不是压扁内容 */
      display: block;
      width: 100%;
      max-width: 100%;
      min-width: 0;
      border: 1px solid var(--line);
      background: var(--panel);
      border-radius: 8px;
      box-shadow: var(--shadow);
      overflow: visible;
    }
    /* T-054:辅助面板收进右侧边条,只留错误。形态对齐既有 .taskboard-handle/.taskboard-panel。 */
    .workspace-dock[hidden] { display: none; }
    .workspace-dock {
      position: fixed; right: 0; top: 58%; z-index: 40;
      display: flex; flex-direction: row-reverse; align-items: flex-start;
    }
    .workspace-dock-toggle {
      writing-mode: vertical-rl; padding: 10px 6px;
      border: 1px solid var(--danger, #d66); border-right: none;
      border-radius: 8px 0 0 8px;
      background: var(--bg-elev, #1e1e24); color: var(--danger, #d66);

    .workspace-dock-body {

         判据:renderer-failure-dock-embedded-regression.js 腿二(窄档量溢出)。 */
      width: min(320px, calc(100vw - 64px)); max-height: 60vh; overflow-y: auto;
      background: var(--bg-elev, #1e1e24); border: 1px solid var(--danger, #d66);

      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;

      cursor: pointer;
      font: inherit;
      font-weight: 750;
      text-align: left;

    /* 🔴 上面这条规则里【不要再加 width:100%】。它由 .workspace-dock-toggle 与
       .dock-section-title 共用,而把手是 flex row-reverse 容器里的一项:
       width:100% 会让把手吃满整个 dock(实测 365.7px),把 .workspace-dock-body
       挤到只剩两条 1px 红边(clientWidth=0)⇒ 角标照涨、卡片照进 DOM、点开却是空白。

    .workspace-dock-toggle::before { content: '▸'; transition: transform .15s ease; }

    /* 响应式优先级:窄屏只留 主题切换/主机时间/锁状态/解锁;够宽再追加 服务资源 */
    .sb-res { display: none; }
    @media (min-width: 880px) { .sb-res  { display: inline-flex; } }
    /* RED 0.2.1.2:📎/📷 移进状态栏后**必须单独豁免**上面那条响应式隐藏。
       直接沿用 .sb-res 会让它们在 <880px 时整排 display:none ⇒ 窄窗口下按钮消失,
       那就是 0.2.0.5 的坑「界面上看不见按钮 = 功能不存在」(业主 0.2.0.6 第 1 条验收意见的成因)。
       ⇒ .sb-always 不参与任何 media query,任何宽度都显示。业主确认的阴格盯的就是这一条。 */
    /* 🔴 这两个元素**同时**挂 .sb-res 与 .sb-always:

       .sb-always 才是把它们从隐藏里救回来的那一道。
       🔴 第一版我只挂 .sb-always 不挂 .sb-res —— 变异"删掉 .sb-always"**零转红**:
       元素本来就不在隐藏规则的作用域里,豁免规则是**空的**,而阴格照样全绿。
       (自己写的「东西在那儿但不起作用」,靠组长要求的那发变异才照出来。) */
    .statusbar .sb-always { display: inline-flex !important; }

  <!-- 🔴 截屏遮罩必须是 <body> 直属,**不能**留在 <footer class="composer"> 里(0.2.1.7 修)。

  <script>
    const timeline = document.getElementById('timeline');
    const historyOlder = document.getElementById('historyOlder');
    const waitingArea = document.getElementById('waitingArea');
    const waitingList = document.getElementById('waitingList');
    const workspaceDock = document.getElementById('workspaceDock');
    const workspaceDockToggle = document.getElementById('workspaceDockToggle');
    const workspaceDockBody = document.getElementById('workspaceDockBody');
    const workspaceDockUnread = document.getElementById('workspaceDockUnread');
    const toastRegion = document.getElementById('toastRegion');
    const themeBtn = document.getElementById('themeBtn');
    const clockStatus = document.getElementById('clockStatus');
    const shotBtn = document.getElementById('shotBtn');
    const shotOverlay = document.getElementById('shotOverlay');
    const shotCanvas = document.getElementById('shotCanvas');
    const shotSel = document.getElementById('shotSel');
    const shotWrap = document.getElementById('shotWrap');
    const shotConfirm = document.getElementById('shotConfirm');
    const shotCancel = document.getElementById('shotCancel');
    const streamAlert = document.getElementById('streamAlert');
    const streamAlertText = document.getElementById('streamAlertText');
    const streamRetryBtn = document.getElementById('streamRetryBtn');
    const humanInput = document.getElementById('humanInput');
    const headerSessionName = document.getElementById('headerSessionName');
    const lockBadge = document.getElementById('lockBadge');
    const copyUnlockBtn = document.getElementById('copyUnlockBtn');
    const VS_SCOPE_KEY = /* VS_SCOPE_KEY */ '';
    const costAccountingMode = /* VS_COST_ACCOUNTING_MODE */ 'active';
    const VS_CANONICAL_ORIGIN = /* VS_PUBLIC_ORIGIN */ '';
    const composerInner = document.getElementById('composerInner');
    const filePicker = document.getElementById('filePicker');
    const dropHint = document.getElementById('dropHint');
    const uploadQueue = document.getElementById('uploadQueue');
    const draftAttachments = document.getElementById('draftAttachments');
    const taskProgress = document.getElementById('taskProgress');
    const memStat = document.getElementById('memStat');
    const diskStat = document.getElementById('diskStat');
    const localTime = document.getElementById('localTime');

    // VS 代理端点自定位 scoped base(M1):保留 /view 前全部 pathname 前缀(/dingwei/view/<sess>/ → /dingwei/view/<sess>),
    // 未命中(根直出/nginx)→''=根相对。VS _serve_file 字面量改写降为冗余(本处不再含 ''/ep'' 引号字面量,不会双前缀)。
    // 懒解析(生产边角实证:bare POST /control=404):每次取当前 pathname,防 init 时 URL 未就绪/未来客户端跳转;
    // 根直出恒 ''(F5 不受影响)。注:本页不 mutate URL,空 base 另一主因=缓存旧件根绝对端点(部署侧缓存课题)。
    const apiBase = () => (location.pathname.match(/^(.*?\/view\/[^/]+)/) || [null, ''])[1];
    const apiEp = p => apiBase() + '/' + p;
    // API=init 快照,仅供诊断/测试读取;请求路径一律走 apiEp() 懒解析,勿再新增 API.x 调用点。
    const API = {
      events: apiEp('events'),
      input: apiEp('input'),
      interrupt: apiEp('interrupt'),
      control: apiEp('control'),
      status: apiEp('status'),
      page: apiEp('page'),
    };
    let eventSource = null;
    let eventSourceGeneration = 0;
    // 🔴 0.2.1.35-⑬:这个标志**必须是模块级的**。它原先是 connectEventStream() 的闭包局部,
    //    而 0.2.1.2 的自建重连每次都**新建** EventSource(scheduleReconnect → connectEventStream),
    //    于是它每次重连都归零 ⇒ 下面那句 `if (streamEverOpened) markStreamReconnect()`
    //    在**已发的自动重连路径上从不执行** ⇒ T-086 的延迟清空永不 arm ⇒ resetConversation 永不运行
    //    ⇒ 每次重连把整份 ring 又追加一遍(实测 26s / 18 次重连:正文 15360 → 136320 字,
    //      markStreamReconnect 调用数 = 0)。
    //    🔵 EventSource **原生**重连是"同一对象二次 open",所以这个 bug 在 0.2.1.2 之前不成立
    //      (对照实测:摘掉自建重连、以及真 pre-0.2.1.2 的件,正文全程纹丝不动)。
    //    判据是"**这个页面**曾经连上过",不是"**这个对象**open 过第二次"。
    let streamEverOpened = false;
    // Transport open is not evidence that replay or an event was successfully applied.
    let streamHasAcceptedEvent = false, streamTransportOpen = false;
    let streamConnectTimer = null;
    const STREAM_CONNECT_GRACE_MS = 7500;
    // RED 0.2.1.2:移除「重连」按钮**必须同时加自动重连** —— 移除前它是 SSE 断开后
    //    **唯一**的恢复入口,先拿掉再说等于"断线只能刷页面"。
    //    业主定「网络确实不好时 30 秒一次」;组长收口为**先快后慢**:
    //    瞬断不让业主等 30 秒,持续坏时落在业主说的 30 秒。
    const RECONNECT_BACKOFF_MS = [1000, 2000, 5000, 10000, 30000];
    let reconnectAttempt = 0;      // 第几次重连(0 = 当前是连着的)
    let reconnectTimer = null;
    // A reasoned upstream refusal is not a generic transport outage. Keep the
    // reason visible while the same bounded backoff retries, so an Agent whose
    // helper has no event stream does not look like a permanently reconnecting
    // browser network failure.
    let streamUnavailableReason = '';
    let statusTimer = null;
    let rendered = 0;
    const messageBuffers = new Map();
    const messageNodes = new Map();
    const turnGroups = new Map();
    const turnGroupSegments = new Map();
    const injectionFences = new Map();
    // ── View 长文本卡死 hotfix(A 节流 / B·C 上限 / D 缓存回收)──
    // 症状:7964 字契约文本使页面假死。根因=每个 SSE chunk 都触发一次全量 rebuildTurn +
    // renderMarkdown(整段历史文本),单回合 N 个 chunk ⇒ 近平方级重建。
    // B/C:时间线承载的「完整消息卡/回合卡」上限(不是 SSE chunk 数)。
    // 200 是**业主硬约束**(「始终最新 200 条」),不是性能取舍项。
    // 我曾据"200 与 500 只差 +486ms"把它改成 500,那是把硬约束当成了可优化的建议 —— 已按令改回。
    // 性能上 200/500 都不是闸门(真闸门是 H 的渲染死循环与 A 的每 chunk 全量重渲),
    // 故这里取 200 不带来任何性能代价;要改必须先改约束,不能由执笔按"技术最优"自决。
    // ── 2026-09-11 业主细化约束:按设备分档 ──
    // 业主原话(单位已与业主对齐:一轮=2 卡,输入/输出各一张):
    //     「PC:100 轮次 200 卡; 手机端:10 轮次 20 卡」
    // 🔴 **PC 档维持 200 不变** —— 即业主原有硬约束「始终最新 200 条」原样保留,
    //    本次只新增窄屏档。上一位执笔曾据性能把 200 改成 500 被退回并留言
    //    「要改必须先改约束,不能由执笔按技术最优自决」;该约束本次**未被改动**。
    // ⚠️ 计数单位是**时间线子节点数**。输入/输出各自成卡时 200 节点≈100 轮;
    //    若某些消息走回合分组渲染(turn-group 一个节点=一整轮),同样 200 节点会装下
    //    多达 200 轮 —— 即上限在分组模式下比预期**松**。本次不处理,记录在案。
    const NARROW_VIEWPORT_PX = 768;   // 与既有回归用的两档视口(1280/390)对齐
    function timelineMaxCards() {
      const w = (typeof window !== 'undefined' && window.innerWidth) || 1280;
      return w < NARROW_VIEWPORT_PX ? 20 : 200;   // 业主定:手机 10 轮次(20 卡)/ PC 100 轮次(200 卡)

    // 因为它们都挂在 timelineAtBottom 之后,而该标志已被提前清掉。
    // ⇒ 症状:刷新后有时到底、有时停中间、有时差一屏(业主实测);
    //    自动化侧表现为 renderer-regression 滚动断言约 25% 偶发失败(T-035,
    //    此前被登记为「测试 flaky」,实为本缺陷的观测手段)。
    //
    // 修法:只有**紧随真实用户手势**的 scroll 才算用户接管。
    // ⚠️ 非用户来源的 scroll 只允许把跟随标志**置真**(到底了),不允许置假 ——
    //    否则浏览器挪一下就把跟随权拿走,正是旧实现的病根。
    const USER_SCROLL_GESTURE_MS = 400;
    const FOLLOW_RELEASE_GAP_PX = 160;   // 约两三行高:少于此距离的偏移不视为「用户要看历史」
    const SCROLL_KEYS = new Set(['PageUp', 'PageDown', 'Home', 'End', 'ArrowUp', 'ArrowDown', ' ', 'Spacebar']);
    let lastUserScrollGestureAt = 0;
    const markUserScrollGesture = () => { lastUserScrollGestureAt = Date.now(); };
    // ⚠️ 监听挂在 document 上而非 timeline 上:滚动条拖拽、触控板惯性、指针落在子元素
    // 或 timeline 外沿时,事件不一定经过 timeline。**宁可把手势判宽一点** ——
    // 判宽的代价是「用户滚了但我们没跟随」(用户自己再滚回底即可);
    // 判窄的代价是「浏览器滚了却被当成用户」,那正是本次要修的病根。
    for (const type of ['wheel', 'touchstart', 'touchmove', 'mousedown', 'pointerdown']) {
      document.addEventListener(type, markUserScrollGesture, { passive: true, capture: true });

    document.addEventListener('keydown', (e) => { if (SCROLL_KEYS.has(e.key)) markUserScrollGesture(); }, { capture: true });

    timeline.addEventListener('scroll', () => {
      const nearBottom = isTimelineNearBottom();
      const byUser = (Date.now() - lastUserScrollGestureAt) <= USER_SCROLL_GESTURE_MS;
      if (replayInProgress && !nearBottom && byUser) {
        // 用户在初始窗口内**主动**上翻时立即交还滚动控制权；后续 live 事件
        // 只能在用户仍贴底时跟随。

        }
      }
      // 🔴 迟滞(T-076):贴底判据用于「要不要跟随」很合适,但用于「要不要**放弃**跟随」太敏感。
      // 实测窄屏 20 卡:淘汰使位置被推离底部仅 **60px**,恰落在用户手势窗口内,
      // 于是被判成「用户想看历史」而永久交还跟随权 —— 连续流式那格 5/5 失败。
      // ⇒ 放弃跟随另立一条更宽的阈值:**离底不足 FOLLOW_RELEASE_GAP_PX 一律不放弃**。
      // 判宽的代价是「用户只滚了一点点,仍会被带回底」(再滚多一点即可);
      // 判窄的代价是「淘汰抖一下就永久失去跟随」,即本次要修的病。
      const gap = timeline.scrollHeight - timeline.clientHeight - timeline.scrollTop;
      if (nearBottom) {
        timelineAtBottom = true;
        if (historyWindowExpanded) enforceTimelineCap();
      }

    }, { passive: true });

      // 上翻则 timelineAtBottom=false，不取得滚动控制权。

      c1DeliveryCards.clear();

      waitingList.textContent = '';

    // ── C1 三来源显示:事件规范化(B0 canonical 一等协议,legacy 仅迁移输入)──
    // canonical: input_posted / delivery_update;legacy: user_input(lifecycle)。
    // 优先级:canonical 受保护值永远优先,legacy 迁移值仅缺省回填,legacy source 永不带 trusted。
    // B0 §6:pty_write 与 cli_injected 是 helper_received 后的分支,pty_write(注入未确认)弱于 cli_injected;
    // 顺序必须 pty_write < cli_injected,否则后到的 pty_write 会把"已注入执行"降级成"注入未确认"
    const C1_STAGE_ORDER = ['generated', 'hub_received', 'helper_received', 'helper_queued', 'pty_write', 'cli_injected', 'turn_processed'];
    const C1_STAGE_TEXT = {
      generated: '已入队', queued: '已入队',
      hub_received: 'Hub 已收', helper_received: 'helper 已收', helper_queued: 'helper 已排队，未注入', turn_processed: '回合已结束',
      cli_injected: '已注入执行', turn_admitted: '已注入执行', admitted: '已注入执行',
      pty_write: '已写入终端', busy: '暂不可投递', expired: '投递过期',
      failed: '失败', cancelled: '已取消', dead: '已终止', dropped: '已丢弃',
    };
    const C1_STAGE_FOOTER = {
      generated: '已入队', queued: '已入队',
      hub_received: 'Hub 已收', helper_received: 'helper 已收', helper_queued: 'helper 已排队，未注入', turn_processed: '回合已结束',
      cli_injected: '已注入执行', turn_admitted: '已注入执行', admitted: '已注入执行',
      pty_write: '已写入终端(注入未确认)', busy: '暂不可投递(重试中)', expired: '投递过期',
      failed: '失败', cancelled: '已取消', dead: '已终止', dropped: '已丢弃',

    const C1_REASON_TEXT = {
      target_offline: '目标不在线', queue_full: '队列已满，请稍后重试', timeout: '投递超时',
      session_unavailable: '会话不在线', page_unauthorized: '写权限失效',
      service_unavailable: '服务临时不可用', cancelled: '已取消',
      injection_unconfirmed: '已写入终端(注入未确认)',
      model_admission_unknown: '已送达，Agent 忙时无法确认是否已接收',
      cancel_not_cancelable: '已交给 Agent，无法撤回',
      unconfirmed_retryable: '未确认（可重发）',
      legacy_injection_unknown: '旧版 helper 已收／状态无法确认',
      turn_terminal_unknown: '回合终态未知／投递队列已释放／暂停自动重投',
      // A0 §7-amend-1(冻结 @ 6a33540/4fbd4d61):非法 UTF-8=ingress fail-closed 拒收,诚实态文案;code=invalid_utf8 已经理核 §7 冻结文本逐字确认
      invalid_utf8: '乱码无法识别',
    };
    const c1InputCards = new Map();      // messageIdKey -> { card, footer, stageIdx, footnotes:Set }
    const c1PendingUpdates = new Map();  // messageIdKey -> [norm 更新](卡片未建时缓冲)
    // ── 🔴 T-074:同一笔投递有两个名字 ────────────────────────────────
    // Hub 发 `dlv_X`(internal/m8/hub.go:3242);helper 收到后统一加前缀成 `dw-dlv_X`
    // (tools/sessionhelper/sessionhelper/unified_queue.py:_delivery_id)。
    // 渲染器此前对前缀零归一 ⇒ 合卡索引对不上 ⇒ **同一条输入渲染两遍**
    // (业主 2026-09-10 截图:一张类型标 `event` 的卡 + 一张 👤 卡,正文相同)。
    //
    // ⚠️ **不能简单「统一去掉前缀」** —— helper 的队列正是以 **dw- 形式为键**
    // (`self._by_delivery`),取消/中断必须用该形式寻址,去掉前缀会让寻址静默失效。
    // ⇒ 两个用途各用各的形式,且**与 helper 同一套规则**:
    //     合卡索引 → 去前缀(两种写法收敛到同一个键)
    //     出站寻址 → 补前缀(缺则加,与 helper _delivery_id 的规则逐字一致)
    const deliveryMergeKey = (id) => String(id || '').replace(/^dw-/, '');
    const deliveryAddrId = (id) => {
      const v = String(id || '').trim();
      return (!v || v.startsWith('dw-')) ? v : 'dw-' + v;
    };

    const c1DeliveryCards = new Map();   // deliveryMergeKey -> messageIdKey(display v1 copy 归并寻址:observed_delivery_id→primary 卡)
    const deliveryTurnInputs = new Map(); // deliveryMergeKey -> turnKey, so history-first input suppresses its later canonical card
    const pendingModelAdmissionFailures = new Map();
    function paintModelAdmissionFailure(deliveryId) {
      const key = deliveryMergeKey(deliveryId);
      const reason = pendingModelAdmissionFailures.get(key);
      const entry = c1InputCards.get(c1DeliveryCards.get(key));
      if (!reason || !entry || !entry.footer) return;
      let note = entry.footer.querySelector('.model-admission-failure');
      if (!note) {
        note = document.createElement('span');
        note.className = 'card-footnote model-admission-failure';
        note.setAttribute('role', 'status');
        entry.footer.appendChild(note);
      }
      note.textContent = reason === 'session_unavailable'
        ? '模型未接收：会话不可用'
        : '模型接收结果未知，请核实后再处理';
      pendingModelAdmissionFailures.delete(key);
    }
    function observeModelAdmissionFailure(ev) {
      const reason = ev.data?.reason;
      if (ev.kind !== 'state_change' || ev.data?.change !== 'turn_completed'
          || ev.data?.outcome !== 'failed' || typeof ev.delivery_id !== 'string' || !ev.delivery_id
          || !['session_unavailable', 'model_admission_unknown'].includes(reason)) return;
      const key = deliveryMergeKey(ev.delivery_id);
      pendingModelAdmissionFailures.set(key, reason);
      // Bound out-of-order events whose input card never arrives.
      while (pendingModelAdmissionFailures.size > 1000) {
        pendingModelAdmissionFailures.delete(pendingModelAdmissionFailures.keys().next().value);
      }
      paintModelAdmissionFailure(key);
      return true;
    }
    const c1MergeBuf = new Map();        // deliveryId -> [{ev,timer}](primary 卡未建时的归并缓冲,带 hold 窗回落)
    const C2_MERGE_HOLD_MS = (typeof window !== 'undefined' && window.C2_MERGE_HOLD_MS) || 3000;  // 归并等待窗(copy),测试可覆盖
    const C2_ECHO_HOLD_MS = (typeof window !== 'undefined' && window.C2_ECHO_HOLD_MS) || 800;     // 回显乱序短窗(user_input echo),测试可覆盖
    function bufferMergeCopy(dlvId, ev, opts = {}) {
      const buf = c1MergeBuf.get(dlvId) || [];
      const rec = { ev, admit: !!opts.admit, footKey: opts.footKey || 'echo_merge',
        timer: setTimeout(() => {
          if(!rec.managed){integrityDispatchDepth++;try{flushMergeCopy(dlvId,rec);}catch(err){markIntegrityApplyFailed();throw err;}finally{integrityDispatchDepth--;}maybeClearRecoveredGap();return;}
          try {managedApplyActive=true;flushMergeCopy(dlvId,rec);flushPendingRenders();rec.managed.records.delete(rec);if(!rec.managed.records.size)rec.managed.resolve();}
          catch(err){rec.managed.reject(err);}finally{managedApplyActive=false;}
        }, opts.holdMs || C2_MERGE_HOLD_MS) };
      if(managedApplyActive&&managedApplyPending){rec.managed=managedApplyPending;managedApplyPending.records.add(rec);}
      buf.push(rec);
      c1MergeBuf.set(dlvId, buf);
    }
    function flushMergeCopy(dlvId, rec) {
      const buf = c1MergeBuf.get(dlvId) || [];
      const i = buf.indexOf(rec);
      if (i < 0) return;  // 窗内已归并
      buf.splice(i, 1);
      if (!buf.length) c1MergeBuf.delete(dlvId);
      // hold 窗内 primary 未现(错链/链向别视图)→照常独立渲染,绝不被 buffer 吞(生产实证:错链 copy 被隐藏)
      if (rec.admit) admitWaitingDelivery(rec.ev);
      renderEvent(rec.ev);
    }
    function c1Footnote(entry, key, text) {
      if (entry.footnotes.has(key)) return;
      entry.footnotes.add(key);
      const note = document.createElement('span');
      note.className = 'card-footnote';
      note.textContent = text;
      entry.footer.appendChild(note);
    }

    function normalizeEvent(ev) {
      const data = ev.data || {};
      const meta = ev.meta || {};
      const src = (ev.source && typeof ev.source === 'object') ? ev.source : {};
      // U5:按已协商版本严格二选一。v2=canonical;显式 v1/无版本=legacy 迁移输入。
      const rawVer = ev.schema_version ?? meta.schema_version ?? '';
      const isV2 = rawVer === 'delivery.v2' || rawVer === 2 || rawVer === '2';
      const norm = {
        messageId: ev.message_id || data.message_id || '',
        // view_observation 副本自身只有 copy_id;归并/取消寻址用被观察 primary 的 observed_delivery_id
        deliveryId: ev.observed_delivery_id || data.observed_delivery_id || ev.delivery_id || data.delivery_id || '',
        copyId: ev.copy_id || data.copy_id || '',
        turnId: ev.turn_id || data.turn_id || '',
        originDlv: ev.origin_delivery_id || data.origin_delivery_id || '',  // 归并锚(dev55 两签:helper 可信保留 hub meta.delivery_id 原样;仅相关性非鉴权)
        sourceKind: '', sourceLabel: '', sourceTrusted: false,
        stage: '', reason: '', copyKind: '', deliveryMode: '', cancellable: null,
        targets: [], text: '', stageIdx: -1, conflict: '',
        ackProtocol: Number.isInteger(ev.ack_protocol) ? ev.ack_protocol : null,
        processingMode: ev.processing_mode || '', queuedAt: ev.queued_at || '',
        occurredAt: ev.occurred_at || '', turnOutcome: ev.turn_outcome || '',
        lifecycleUpdate: ev.kind === 'delivery_update',
      };
      // canonical 受保护字段
      norm.sourceKind = src.kind || '';
      // F3:可信徽标只认规范化 trust_decision(B0 决策层),不采信 raw provenance/attested_by(ingress 侧输入,可伪造);
      // trust_decision 缺失或 != trusted 一律 fail-closed 不挂徽标
      norm.sourceTrusted = src.trust_decision === 'trusted';
      norm.sourceLabel = src.display_name || '';
      const delivery = (ev.delivery && typeof ev.delivery === 'object') ? ev.delivery : {};
      // V2 终裁:canonical=delivery.role{primary,copy,control};delivery_mode 已废、无 legacy 兼容(read-only role)
      norm.deliveryMode = delivery.role || '';
      norm.targets = Array.isArray(delivery.targets) ? delivery.targets.filter(Boolean).map(String) : [];
      norm.copyKind = ev.copy_kind || delivery.copy_kind || '';
      const cb = ev.cancellable ?? ev.cancelable;  // 拼写容错(hub 双l/单l 并存,契约 hygiene;行为仍只认 input_posted 原值)
      norm.cancellable = (cb === undefined) ? null : Boolean(cb);
      // provenance 块(display-provenance v1 冻结契约):canonical 可选块,hub 按可信 ingress 坐实(非转发字符串)
      const prov = (ev.provenance && typeof ev.provenance === 'object') ? ev.provenance : null;
      norm.prov = { kind: 'unknown', displayName: '', trusted: false };
      if (prov) {
        norm.prov.kind = (typeof prov.kind === 'string' && prov.kind) ? prov.kind : 'unknown';
        norm.prov.displayName = prov.display_name || '';
        const chain = Array.isArray(prov.attestation_chain) ? prov.attestation_chain : [];
        const attested = prov.attested_by === 'hub' || chain.includes('hub');
        if (prov.trust_decision === 'trusted' && attested) {
          norm.prov.trusted = true;
        } else if (prov.trust_decision === 'trusted') {
          // 块 claim trusted 但 attested_by≠hub 且 chain 不含 hub=伪造坐实 → conflict+fail-closed 不显示
          if (!norm.conflict) norm.conflict = 'provenance_attestation_forged';
        }
      }
      if (isV2) {
        // U5①:v2 必填缺失或与 legacy 同义值冲突 → schema_conflict,fail-closed(不以 legacy 回填掩盖断链)
        if (!norm.messageId) norm.conflict = 'v2_missing_message_id';
        const legacyKind = typeof data.source === 'string' ? data.source : '';
        if (!norm.conflict && norm.sourceKind && legacyKind &&
            legacyKind !== norm.sourceKind && !(legacyKind === 'user' && norm.sourceKind === 'view')) {
          norm.conflict = 'v2_legacy_source_conflict';
        }
        // raw provenance 只许审计枚举,出现 'trusted' 字面 = schema_conflict(B0:trusted 只能由 canonical trust_decision 表达)
        if (!norm.conflict && src.provenance === 'trusted') {
          norm.conflict = 'raw_provenance_trusted';
        }
        if (norm.conflict) norm.sourceTrusted = false;  // 可信徽标必须关闭
      } else {
        // U5②③:显式 v1 或无版本 → 仅迁移映射;legacy source 永不带 trusted
        if (!norm.sourceKind && typeof data.source === 'string' && data.source) {
          norm.sourceKind = data.source === 'user' ? 'human' : data.source;
          norm.sourceLabel = norm.sourceLabel || String(data.display_name || '');
          norm.sourceTrusted = false;
        }
      }
      // 事件类别归一
      if (ev.kind === 'input_posted') {
        norm.stage = ev.stage || 'generated';
        norm.text = ev.payload ?? ev.text ?? '';
        if (typeof ev.cancellable === 'boolean') norm.cancellable = ev.cancellable;
      } else if (ev.kind === 'delivery_update') {
        // canonical B0 线格式:delivery_stage=管道阶段(generated/hub_received/helper_received/...),
        // delivery_status=终态状态(cancelled/failed);legacy ev.stage 仅迁移输入。
        // dev55 实证:hub 真 cancel SSE={observed_delivery_id,delivery_stage:helper_received,delivery_status:cancelled}
        norm.stage = ev.delivery_stage || ev.stage || '';
        norm.status = ev.delivery_status || '';
        if (norm.status === 'cancelled') norm.stage = 'cancelled';        // 终态取消归一(待提交区移出/时间线终态)
        else if (norm.status === 'failed') norm.stage = 'failed';
        else if (norm.status === 'dead' || norm.status === 'dropped') norm.stage = norm.status;  // 终态归一(dev56 分层:hub 补发 dead SSE 后走此径;兼容未来 dropped)
        norm.reason = ev.reason || data.reason || '';
        if ((norm.stage === 'cli_injected' || norm.stage === 'turn_processed') && norm.ackProtocol === 1) {
          norm.stage = 'helper_received';
          norm.reason = 'legacy_injection_unknown';
        }
        if (norm.stage === 'turn_processed' && (norm.ackProtocol !== 2 || norm.processingMode !== 'driver')) {
          norm.stage = 'helper_received';
          norm.reason = 'legacy_injection_unknown';
        }
      } else if (ev.kind === 'user_input') {
        // legacy 迁移:lifecycle 映射到 B0 §6 阶段枚举(admitted→cli_injected,其余→generated)
        const lifecycle = String(data.lifecycle || '').toLowerCase();
        norm.stage = lifecycle === 'admitted' ? 'cli_injected' : 'generated';
        norm.text = ev.text ?? '';
        if (norm.cancellable === null) norm.cancellable = norm.stage === 'generated';
      }
      norm.stageIdx = C1_STAGE_ORDER.indexOf(norm.stage === 'turn_admitted' ? 'cli_injected' : norm.stage);
      // 🔴 T-074 真正的成因在这一行(2026-09-11 实测):无 message_id 时键**退回投递号**,
      // 而投递号正是那个有两种写法的字段(Hub 发 `dlv_X`,helper 加前缀成 `dw-dlv_X`)。
      // ⇒ 同一条输入的两个事件拿到**两个不同的键** ⇒ 合卡索引永远对不上 ⇒ 画两张卡。
      // ⚠️ 组长此前的修复之所以"测试通过、线上无效",是因为测试用例**给了 message_id**,
      //    两边键自然相同;而线上事件不带 message_id,永远走这条回退分支。
      //    ——**用例比现实宽松,于是测出了绿灯。**
      // ⇒ 回退分支必须归一(去前缀),与 c1DeliveryCards 的键口径一致。
      // 🔴 T-074 真正的成因(2026-09-11 逐层查到源头):同一条输入由**两个进程**各发一个事件,
      // 且**字段构成不对称**:
      //     Hub(Go)   input_posted  internal/m8/terminal.go:496  **带 message_id**
      //     helper(Py) user_input   unified_queue.py:167         **不带 message_id**
      // ⇒ 前者键取 message_id,后者只能退回投递号 ⇒ **两个键永不相等** ⇒ 画两张卡。
      // (投递号本身还有 `dlv_X` / `dw-dlv_X` 两种写法,那是**第二层**不一致。)
      //
      // ⇒ 键改为**先查投递号索引**:同一笔投递,谁先建卡谁定键,后到的一律沿用。
      //   如此两种到达顺序都收敛到同一张卡,且不依赖任一方带 message_id。
      // ⚠️ 组长此前三版修复都"用例通过、线上无效",根因同一个:
      //   用例给两边都配了 message_id(或都不配),**比现实对称** —— 现实是一边有一边没有。
      const dlvKey = deliveryMergeKey(norm.deliveryId);
      norm.key = (dlvKey && c1DeliveryCards.get(dlvKey)) || norm.messageId || dlvKey;
      return { ...ev, _norm: norm };
    }

    function sourceBadgeHtml(norm) {
      if (!norm.sourceTrusted) return '';
      const label = {
        feishu: '飞书', view: '人工', human: '人工', system: '系统',
        agent: `Agent·${norm.sourceLabel || '未知'}`,
      }[norm.sourceKind] || '';
      return label ? `<span class="source-badge source-badge--trusted">${escapeHtml(label)}</span>` : '';
    }

    // display-provenance v1:灰度 flag(VS serve 注入 window.PROVENANCE_ICONS_V1;默认关)+来源图标
    // (仅 provenance.trusted 显示,fail-closed;inline SVG 无外部依赖,currentColor 适配主题;不认识的 kind 仅文字)
    const provFlagOn = () => !!(typeof window !== 'undefined' && window.PROVENANCE_ICONS_V1);
    const PROV_SVG = {
      feishu: '<svg class="prov-svg" viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 9.5c3.2-1 5.6-3.2 6.6-6.5.9 2.2.7 4.3-.4 6.2 1.7-.8 3-1 4.3-.9-1.2 3.2-4.3 5.4-7.7 5.4h-2.8V9.5z" fill="currentColor"/></svg>',
      agent: '<svg class="prov-svg" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="2.6" r="1.1" fill="currentColor"/><path d="M8 3.7v1.8" stroke="currentColor" stroke-width="1.2"/><rect x="3" y="5.5" width="10" height="7" rx="2" fill="currentColor"/><circle cx="5.9" cy="8.7" r="1" fill="#fff"/><circle cx="10.1" cy="8.7" r="1" fill="#fff"/><path d="M6.2 11h3.6" stroke="#fff" stroke-width=".9" stroke-linecap="round"/></svg>',
      system: '<svg class="prov-svg" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="2.4" fill="currentColor"/><path d="M8 1.8v2M8 12.2v2M1.8 8h2M12.2 8h2M3.6 3.6l1.4 1.4M11 11l1.4 1.4M12.4 3.6L11 5M5 11l-1.4 1.4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>',
      human: '<svg class="prov-svg" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="5" r="2.6" fill="currentColor"/><path d="M3 14c0-3 2.4-5 5-5s5 2 5 5v.5H3V14z" fill="currentColor"/></svg>',
    };
    function provenanceIconHtml(norm) {
      if (!provFlagOn() || !norm.prov || !norm.prov.trusted) return '';
      const fallback = { feishu: '飞书', agent: 'Agent', human: '人工', system: '系统' }[norm.prov.kind] || '';
      const label = norm.prov.displayName || fallback;
      // 精简(张宗楚灰度反馈):来源文字不占版面,可读性进 title/aria-label
      if (norm.prov.kind === 'human') {
        // 泛名(人工/human/空)=person SVG;真名=首字符头像(张宗楚→张)——泛名首字符「人」无信息量
        const generic = !label || ['人工', '人', 'human', 'Human', 'HUMAN'].includes(label);
        if (generic) return `<span class="prov-ic" title="人工" aria-label="来源:人工">${PROV_SVG.human}</span>`;
        const ch = label.trim().charAt(0);
        return `<span class="prov-ic prov-ic--human" title="${escapeHtml(label)}" aria-label="来源:人工 ${escapeHtml(label)}">${escapeHtml(ch)}</span>`;
      }
      const svg = PROV_SVG[norm.prov.kind];
      if (!svg) return '';  // 未知/扩展 kind:不显示(开放扩展不 fail)
      const kindText = { feishu: '飞书', agent: 'Agent', system: '系统' }[norm.prov.kind] || norm.prov.kind;
      return `<span class="prov-ic" title="${escapeHtml(label || kindText)}" aria-label="来源:${escapeHtml(label || kindText)}">${svg}</span>`;
    }

    function stageFooterText(norm) {
      if (norm.reason === 'desktop_inbox_saved') return '已保存到桌面收件箱';
      if (norm.reason === 'model_admission_unknown') return C1_REASON_TEXT.model_admission_unknown;
      if (norm.reason === 'cancel_not_cancelable') return C1_REASON_TEXT.cancel_not_cancelable;
      if (norm.reason === 'unconfirmed_retryable') return C1_REASON_TEXT.unconfirmed_retryable;
      if (norm.reason === 'turn_terminal_unknown') return C1_REASON_TEXT.turn_terminal_unknown;
      if (norm.reason === 'legacy_injection_unknown') return C1_REASON_TEXT.legacy_injection_unknown;
      if (norm.stage === 'turn_processed') {
        const outcome = {completed: '完成', interrupted: '中断', failed: '失败'}[norm.turnOutcome] || '状态未知';
        return `回合已结束（${outcome}）${norm.reason === 'late_native_confirmation' ? '／迟到确认' : ''}`;
      }
      if (norm.stage === 'cli_injected' && norm.ackProtocol === 2) return '已注入执行';
      if (norm.stage === 'failed') {
        const reason = C1_REASON_TEXT[norm.reason] || '投递失败';
        return `失败:${reason}`;
      }
      const t = C1_STAGE_FOOTER[norm.stage] || '';
      // 投递语义措辞(张宗楚#3):「已注入执行」→「已送达」——投递状态只表「送进 CLI 没有」,
      // 不暗示 CLI 在执行/在等结果(执行与回复=单独输出消息那路信号);flag 关=原措辞
      return provFlagOn() ? t.replace('已注入执行', '已送达').replace('注入未确认', '送达未确认') : t;
    }

    function outboundTargetsHtml(norm) {
      if (norm.deliveryMode !== 'copy' || !norm.targets.length) return '';
      const labels = [...new Set(norm.targets.map(addr => String(addr).split('#')[0]).filter(Boolean))];
      return labels.length ? `<span class="outbound-targets">→ ${escapeHtml(labels.join('、'))}</span>` : '';
    }

    function c1CardFor(norm, create) {
      if (!norm.key) return null;
      let entry = c1InputCards.get(norm.key);
      if (!entry && create) {
        entry = { card: null, footer: null, stageIdx: -1, footnotes: new Set() };
        c1InputCards.set(norm.key, entry);
      }
      return entry;
    }

    function c1ApplyCardUpdate(norm) {
      const entry = c1CardFor(norm, false);
      if (!entry || !entry.footer) {
        // 卡片未建:缓冲(到达乱序时,建卡后再应用最高阶段)
        if (norm.key) {
          const list = c1PendingUpdates.get(norm.key) || [];
          list.push(norm);
          c1PendingUpdates.set(norm.key, list);
        }
        return;
      }
      c1ApplyToEntry(entry, norm);
    }

    function c1ApplyToEntry(entry, norm) {
      // 阶段单调:只前进,不回退(B0 ACK 单调约束);failed/cancelled/expired=终态直通
      const admissionEcho = entry.canonicalPrimary && !norm.lifecycleUpdate && ['cli_injected', 'turn_processed'].includes(norm.stage);
      if (!admissionEcho && (norm.stage === 'failed' || norm.stage === 'cancelled' || norm.stage === 'expired' || norm.stage === 'dead' || norm.stage === 'dropped' || norm.stageIdx > entry.stageIdx || (norm.lifecycleUpdate && norm.stageIdx === entry.stageIdx))) {
        entry.stageIdx = Math.max(entry.stageIdx, norm.stageIdx);
        const text = stageFooterText(norm);
        if (text && entry.stageEl) entry.stageEl.textContent = text;
        if (provFlagOn() && entry.sentEl) {
          const sl = eventStatusLabel({ kind: 'input_posted', _norm: norm });  // kind 用卡自身的(输入卡),不取 update 事件的
          entry.sentEl.textContent = sl;
          entry.sentEl.style.display = sl ? '' : 'none';  // 精简:常态(已注入)隐标,异常才醒目
        }
      }
      if (norm.copyKind === 'feishu_sync' && !entry.footnotes.has('feishu_sync')) {
        entry.footnotes.add('feishu_sync');
        const note = document.createElement('span');
        note.className = 'card-footnote';
        note.textContent = '已同步飞书';
        entry.footer.appendChild(note);
      }
      if (cliViewOn() && entry.card) renderUserCLI(entry);   // S-R62-CLI-VIEW-B：阶段更新同步 CLI 行
    }

    // ── B/C/D:时间线承载上限 ────────────────────────────────────
    // B 旧实现只在 handleIncomingEvent 的**最后一个**分支裁剪,delivery_update / 待提交区转入 /
    //   echo 归并等分支全部提前 return,绕过上限;这里改为在唯一入口的出口处统一裁剪,任何分支都绕不过。
    //   初始回放、实时新消息、重连补放同样只经此一个入口(SSE onmessage),故一处即全覆盖。
    // C 计数对象=timeline 的直接子元素,即一张完整消息卡或一个回合卡;长回复不论多少 chunk 都只占 1。
    // D 逐出节点时同步清掉指向它的全部索引缓存(旧实现只清 turnGroups,其余 Map 只增不减)。
    function releaseTimelineNode(node) {
      const ds = (node && node.dataset) || {};
      forgetTimelineSequenceNode(node);
      if (cliViewOn() && node && node._cliNode) { node._cliNode.remove(); node._cliNode = null; }   // S-R62-CLI-VIEW-B：逐出同步
      if (ds.turnKey) {
        const segments = turnGroupSegments.get(ds.turnKey) || [];
        const kept = segments.filter(group => {
          if (group.node !== node) return true;
          group.detached = true;
          pendingRenders.delete(group);
          return false;
        });
        if (kept.length) {
          turnGroupSegments.set(ds.turnKey, kept);
          turnGroups.set(ds.turnKey, kept.at(-1));
        } else {
          turnGroupSegments.delete(ds.turnKey);
          turnGroups.delete(ds.turnKey);
        }
      }
      if (ds.messageKey) {
        const entry = assistantEntries.get(ds.messageKey);
        if (entry) { entry.detached = true; pendingRenders.delete(entry); }
        assistantEntries.delete(ds.messageKey);
        messageNodes.delete(ds.messageKey);
        messageBuffers.delete(ds.messageKey);
      }
      if (ds.messageId) {
        c1InputCards.delete(ds.messageId);
        c1PendingUpdates.delete(ds.messageId);
        // 三方合并暴露(T-041):c1DeliveryCards 是 deliveryId -> messageKey 的**反向**索引,
        // 键不是 messageId,故上面两句删不到它 —— 只增不减,与 D 条(逐出即清空全部指向该节点的索引)相悖。
        // ⚠️ 合并前此处原注称「主线有那段回收循环,随 forward-port 补回」;实测四份副本无一存在该循环,
        //    该说法不成立。不要据注释断言另一版本的内容(与今日部署制品三来源拼装同类)。
        // 按值回收:表已收敛到 CAP 量级,每次逐出一次线性扫描的代价可忽略;
        // 不给它单设上限——那正是产生本 bug 的结构(索引自成一套生命周期),复制它只会再漏一次。
        for (const [dlvId, mappedKey] of c1DeliveryCards) {
          if (mappedKey === ds.messageId) c1DeliveryCards.delete(dlvId);
        }
      }
    }

    function enforceTimelineCap() {
      // A requested history page intentionally extends the visible window; the
      // ordinary live-event cap must not evict its oldest retained row mid-page.
      if (historyApplying) return;
      // Keep an over-cap paged window while the user reads away from the bottom.
      // Once they return to the live edge, resume normal oldest-first eviction.
      if (historyWindowExpanded && !timelineAtBottom) return;
      const cap = timelineMaxCards();
      // ⚠️ 此处**曾经**加过一段「淘汰后显式补滚」。负向对照显示去掉它测试照样全过
      // (3/3),即它并未起作用 —— 真正治住窄屏小上限的是下方跟随判据里的**迟滞**。
      // 已删除:基于错误假设加的补丁若留着,就成了又一层「谁也不敢动的时序补丁」,
      // 而正是这类层层补丁让本缺陷长期找不到根因。**没有证据支持的代码不留。**
      while (timeline.children.length > cap) {
        const oldest = timeline.firstElementChild;
        if (!oldest) break;
        releaseTimelineNode(oldest);
        timeline.removeChild(oldest);
      }
      historyWindowExpanded = false;
    }

    function handleIncomingEvent(ev) {
      // Hub/helper timestamps are optional on user_input. Stamp at the stream
      // boundary so live ordering and the visible time use the actual arrival.
      if (ev?.kind === 'user_input' && !Number.isFinite(ev.ts)) ev.ts = Date.now();
      if (ev?.kind === 'input_posted' && !Number.isFinite(ev._arrivalTs)) ev._arrivalTs = Date.now();
      if (historyBootstrapPending && !historyApplying && (ev?._history || ev?._history_gap || (ev?._hubSeq && ev?._hubEpoch))) {
        historyLivePending.push(ev);
        return;
      }
      try {
        const result = dispatchIncomingEvent(ev);
        if (ev?.kind === 'input_posted' && ev.delivery?.role === 'primary') {
          const deliveryId = ev._norm?.deliveryId || ev.delivery_id;
          const pending = deliveryId && roleVerifiedPendingDeliveryUpdates.get(deliveryId);
          if (pending?.length) {
            roleVerifiedPendingDeliveryUpdates.delete(deliveryId);
            for (const update of pending) {
              const replay = update._history ? { ...update, _history: { ...update._history, event_id: `${update._history.event_id}:primary-match` } } : update;
              dispatchIncomingEvent(replay);
            }
          }
        }
        return result;
      } finally {
        enforceTimelineCap();
      }
    }

    function hasExactPrimaryDeliveryTarget(ev) {
      if (ev?.kind !== 'delivery_update') return true;
      const deliveryId = ev.observed_delivery_id;
      if (ev.delivery?.role !== 'primary' || typeof deliveryId !== 'string' || !deliveryId
          || ev._norm?.deliveryId !== deliveryId) return false;
      const waiting = waitingDeliveries.get(deliveryId);
      if (waiting) return waiting.event?.kind === 'input_posted'
        && waiting.event.delivery_id === deliveryId && waiting.event.delivery?.role === 'primary';
      const cardKey = c1DeliveryCards.get(deliveryMergeKey(deliveryId));
      const cardEntry = cardKey ? c1InputCards.get(cardKey) : null;
      return !!cardEntry?.canonicalPrimary && cardEntry.canonicalDeliveryId === deliveryId;
    }
    function rememberUnmatchedPrimaryDeliveryUpdate(ev) {
      const deliveryId = ev?.observed_delivery_id;
      if (ev?.delivery?.role !== 'primary' || typeof deliveryId !== 'string' || !deliveryId
          || ev._norm?.deliveryId !== deliveryId) return;
      const waiting = waitingDeliveries.get(deliveryId);
      const cardKey = c1DeliveryCards.get(deliveryMergeKey(deliveryId));
      const cardEntry = cardKey ? c1InputCards.get(cardKey) : null;
      if (waiting || (cardEntry?.canonicalPrimary && cardEntry.canonicalDeliveryId === deliveryId)) return;
      const pending = roleVerifiedPendingDeliveryUpdates.get(deliveryId) || [];
      if (pending.length >= 32) pending.shift();
      pending.push(ev);
      roleVerifiedPendingDeliveryUpdates.set(deliveryId, pending);
      while (roleVerifiedPendingDeliveryUpdates.size > 500) {
        roleVerifiedPendingDeliveryUpdates.delete(roleVerifiedPendingDeliveryUpdates.keys().next().value);
      }
    }

    function dispatchIncomingEvent(ev) {
      const replayKey = historyInputReplayKey(ev);
      if (!historyApplying && !historyBootstrapPending && replayKey && historyInputReplayKeys.has(replayKey)) return;
      if (historyApplying && ev?.kind === 'user_input') {
        if (replayKey) historyInputReplayKeys.add(replayKey);
      }
      const historyCursor = ev?._history;
      if (!historyApplying && !historyBootstrapPending && historyCursor
          && historyCursor.generation === historyGeneration
          && Number(historyCursor.seq) <= historyHighWater) return;
      if (markHistoryEvent(ev)) return;
      if (!historyApplying && historyCursor) {
        if (!historyGeneration) historyGeneration = historyCursor.generation;
        if (historyCursor.generation === historyGeneration) {
          const seq = Number(historyCursor.seq) || 0;
          if (seq > historyHighWater) historyHighWater = seq;
          if (seq > 1 && (!historyBefore || seq < Number(historyBefore))) {
            historyBefore = seq;
            historyHasOlder = true;
            historyOlder.hidden = false;
            historyOlder.disabled = false;
            historyOlder.textContent = '向上翻页';
          }
        }
      }
      if (ev?._history_gap) {
        const notice = document.createElement('div');
        notice.className = 'event-card';
        notice.textContent = '这段历史未保存';
        timeline.appendChild(notice);
      }
      ev = normalizeEvent(ev);
      // Older Hub/history updates have no role: preserve their pre-R60 lifecycle
      // behavior, but they never authorize retry. A tagged copy or a tagged
      // primary update without an exact canonical match must not touch a wait.
      if (ev.kind === 'delivery_update' && ev.delivery?.role
          && !hasExactPrimaryDeliveryTarget(ev)) {
        rememberUnmatchedPrimaryDeliveryUpdate(ev);
        return;
      }
      const eventDeliveryId=ev._norm.deliveryId||ev._norm.originDlv;
      const repliedDeliveryId=eventDeliveryId;
      if(repliedDeliveryId && ((ev.kind==='delivery_update' && ev._norm.stage==='turn_processed') ||
          ev.kind==='mention_reply' || ev.kind==='assistant_text')) {
        processedDeliveries.add(String(repliedDeliveryId));
        waitingDeliveries.get(String(repliedDeliveryId))?.node.querySelector('.waiting-retry-btn')?.remove();
      }
      // Admission failures have no model turn: annotate the existing input,
      // rather than constructing an empty turn card or changing delivery ACKs.
      if (observeModelAdmissionFailure(ev)) return;
      c2TrackTurn(ev);  // 中断目标:运行中 turn 跟踪(turn_completed 清除)
      if (ev._norm.conflict) {
        // U5:schema_conflict 可观测(徽标已关),事件本体按不可信继续渲染
        console.warn('[c1] schema_conflict:', ev._norm.conflict);
        renderError({ kind: 'error', text: `消息格式异常(${ev._norm.conflict}),已按不可信处理`,
          data: { code: 'schema_conflict' } });
      }
      const shouldFollow = replayInProgress || timelineAtBottom;
      scheduleTimelineReplayEnd();
      // R-V2-0103-MENTION-REPLY-MIRROR:被提及 Agent 那一轮的回复,只显示回来;不进回合分流、不进本页 Agent 的上下文。
      if (ev.kind === 'mention_reply') {
        if (renderMentionReply(ev)) rendered += 1;
        if (shouldFollow) scheduleTimelineToBottom();
        return;
      }
      // delivery_update / copy 事件:原位更新输入卡,不产生新条目
      // display v1 归并去重:route_observation 带 observed_delivery_id(链 primary)时走归并分支;无链=独立占位卡(现状回落)
      const copyMergable = provFlagOn() && ev._norm.copyKind === 'route_observation' && !!(ev.observed_delivery_id || (ev.data && ev.data.observed_delivery_id));
      if (ev.kind === 'delivery_update' || ev._norm.copyKind === 'feishu_sync' || copyMergable) {
        const norm = ev._norm;
        const wEntry = norm.deliveryId ? waitingDeliveries.get(norm.deliveryId) : null;
        if (ev.kind === 'delivery_update' && norm.stage === 'cli_injected' && norm.turnId
            && Number.isSafeInteger(Number(ev._hubSeq)) && Number(ev._hubSeq) > 0) {
          injectionFences.set(norm.deliveryId, { turnId: norm.turnId, ackSeq: Number(ev._hubSeq) });
        }
        if (wEntry && (['cli_injected', 'turn_processed', 'pty_write', 'failed', 'cancelled', 'expired', 'dead', 'dropped'].includes(norm.stage) || ['legacy_injection_unknown', 'desktop_inbox_saved'].includes(norm.reason))) {
          // 注入/终态(含 expired 投递过期/dead 终止/dropped 丢弃):待提交区移出,以原输入事件建时间线卡(阶段由后续 update 推进)
          wEntry.node.remove();
          waitingDeliveries.delete(norm.deliveryId);
          waitingArea.hidden = waitingDeliveries.size === 0;
          if (norm.stage === 'cli_injected' && norm.turnId && Number.isSafeInteger(Number(wEntry.event?._hubSeq))) {
            // The primary input_posted row is Hub-sequenced at send time. Split
            // at that boundary, even if its cli_injected acknowledgement arrives
            // after later same-turn output.
            splitTurnGroupAtHubSequence(norm.turnId, Number(wEntry.event?._hubSeq), timelineEventRank(wEntry.event));
            injectionFences.delete(norm.deliveryId);
            wEntry.event.turn_id = norm.turnId;
            wEntry.event._norm.turnId = norm.turnId;
            wEntry.event._norm.stage = norm.stage;
            wEntry.event._norm.stageIdx = C1_STAGE_ORDER.indexOf(norm.stage);
          }
          renderEvent(wEntry.event);
          rendered += 1;
        } else if (wEntry) {
          // Merge only delivery progress, never the original input identity/body.
          const current = wEntry.event._norm;
          const currentStageIdx = C1_STAGE_ORDER.indexOf(current.stage === 'turn_admitted' ? 'cli_injected' : current.stage);
          let changed = false;
          if (norm.stageIdx > currentStageIdx) {
            current.stage = norm.stage;
            current.stageIdx = norm.stageIdx;
            changed = true;
          }
          const rawVer = ev.schema_version ?? ev.meta?.schema_version;
          const canonicalUpdate = ev.kind === 'delivery_update' && (rawVer === 'delivery.v2' || rawVer === 2 || rawVer === '2');
          if (canonicalUpdate) {
            // Only an explicitly tagged, exactly matched primary update may
            // grant retry. Role-less legacy updates still advance lifecycle.
            if (ev.delivery?.role === 'primary' && hasExactPrimaryDeliveryTarget(ev)) {
              if (ev.delivery_status === 'unconfirmed_retryable') wEntry.retryRoleVerified = true;
              else if (typeof ev.delivery_status === 'string' && ev.delivery_status) wEntry.retryRoleVerified = false;
            }
            if (norm.stageIdx >= currentStageIdx) {
              for (const field of ['ackProtocol','processingMode','occurredAt','turnOutcome']) {
                if (norm[field] !== null && norm[field] !== '' && current[field] !== norm[field]) {
                  current[field] = norm[field]; changed = true;
                }
              }
              if (!current.queuedAt && norm.queuedAt) { current.queuedAt = norm.queuedAt; changed = true; }
            }
            // Explicit denial is fail-closed. Once denied, an older/same-stage
            // update cannot recreate a cancel action for this delivery.
            const canCancel = ev.cancellable;
            if (canCancel === false && current.cancellable !== false) {
              current.cancellable = false;
              changed = true;
            } else if (canCancel === true && current.cancellable !== false &&
                       (!norm.stage || norm.stageIdx >= currentStageIdx) && current.cancellable !== true) {
              current.cancellable = true;
              changed = true;
            }
            if (!norm.stage || norm.stageIdx >= currentStageIdx) {
              const status = ev.delivery_status;
              if (typeof status === 'string' && ['', 'cancelled', 'failed', 'dead', 'dropped', 'unconfirmed_retryable', 'retried'].includes(status) && (current.status || '') !== status) {
                current.status = status;
                changed = true;
              }
              const reason = ev.reason;
              if (typeof reason === 'string' && (reason === '' || reason === 'desktop_inbox_saved' || Object.hasOwn(C1_REASON_TEXT, reason)) && current.reason !== reason) {
                current.reason = reason;
                changed = true;
              }
            }
          }
          if (norm.stage === 'turn_processed' || ['processed','replied'].includes(ev.delivery_status)) processedDeliveries.add(String(norm.deliveryId));
          if ((current.reason === 'model_admission_unknown' || ['unconfirmed_retryable','retried'].includes(current.status)) && !Number.isFinite(wEntry.unknownSince)) unknownSinceMs(ev,wEntry);
          if (changed) renderWaitingDelivery(wEntry.event);
        }
        if (copyMergable) {
          // 归并去重(display v1):observed_delivery_id→primary 卡 footnote「已回显」;
          // 卡未建/在等待区→带 hold 窗缓冲(超时独立占位,错链不隐藏)
          const pKey = norm.deliveryId ? c1DeliveryCards.get(deliveryMergeKey(norm.deliveryId)) : null;
          const pEntry = pKey ? c1InputCards.get(pKey) : null;
          if (pEntry && pEntry.footer) c1Footnote(pEntry, 'echo_merge', '已回显');
          else if (norm.deliveryId) bufferMergeCopy(norm.deliveryId, ev);
        }
        c1ApplyCardUpdate(norm);
        rendered += 1;
        updateMetrics();
        if (shouldFollow) scheduleTimelineToBottom();
        return;
      }
      // G-LIFECYCLE(张宗楚实测「测试-你好×2」):同一 delivery 的 user_input queued/accepted 阶段事件=在途占位,
      // 与 input_posted primary 的待提交区重复(双份正文+再生一个删除按钮)——flag 开一律不渲;
      // admitted(带 turn)才是单一回显渲染点(生命周期幂等,renderer 自治,不依赖 helper 改)
      if (ev.kind === 'user_input') {
        const echoWait = waitingDeliveries.get(ev._norm.originDlv || ev._norm.deliveryId);
        if (echoWait && echoWait.event.kind === 'input_posted') {
          // Queue/admission echoes are not the Hub's negotiated ACK evidence.
          // Keep the primary waiting card until its canonical phase update.
          rendered += 1; updateMetrics(); return;
        }
      }
      if (provFlagOn() && ev.kind === 'user_input') {
        const lc = String((ev.data && ev.data.lifecycle) || '').toLowerCase();
        if (lc === 'queued' || lc === 'accepted') {
          rendered += 1;
          updateMetrics();
          return;
        }
      }
      if (isWaitingDelivery(ev)) {
        renderWaitingDelivery(ev);
        promoteWaitingDeliveryAtKnownFence(ev);
        rendered += 1;
        updateMetrics();
        return;
      }
      // G-MERGE-SAME(同会话去重,dev55 设计,纯 renderer 不猜链):结构化 user_input 回显 delivery_id
      // 精确命中本视图 primary input_posted.delivery_id → 不建第二张用户卡,primary 加「已回显」footnote;
      // 乱序短窗缓冲(C2_ECHO_HOLD_MS);未命中/空 id/copy/legacy 无 id=照常独立。provenance 只取 primary canonical。
      if (provFlagOn() && ev.kind === 'user_input' && (ev._norm || {}).deliveryId) {
        const echoN = ev._norm;
        const echoKey = echoN.originDlv || echoN.deliveryId;  // 归并锚=origin_delivery_id(两签可信字段);回退=自身 id 精确命中;绝不 trim dw- 猜链
        const pKey = c1DeliveryCards.get(deliveryMergeKey(echoKey));
        const pEntry = pKey ? c1InputCards.get(pKey) : null;
        if (pEntry && pEntry.footer) {
          const turnKey = turnKeyFor(ev);
          if (turnKey) {
            retainCanonicalTrustedProvenance(pEntry, ev);
            // input_posted is the delivery card while the input is queued. Once
            // its admitted user_input supplies a turn, move that same input into
            // the turn group and discard the provisional standalone card.
            pEntry.card?.remove();
            if (cliViewOn() && pEntry.card && pEntry.card._cliNode) { pEntry.card._cliNode.remove(); pEntry.card._cliNode = null; }   // S-R62-CLI-VIEW-B：合卡移除同步 CLI
            c1InputCards.delete(pKey);
            for (const [deliveryKey, mappedKey] of c1DeliveryCards) {
              if (mappedKey === pKey) c1DeliveryCards.delete(deliveryKey);
            }
            ev.ts = Number.isFinite(ev.ts) ? ev.ts : Date.now();
          } else {
          c1Footnote(pEntry, 'echo_merge', '已回显');
          rendered += 1;
          updateMetrics();
          if (shouldFollow) scheduleTimelineToBottom();
          return;
          }
        }
        if (!historyApplying) {
          bufferMergeCopy(echoKey, ev, { admit: true, holdMs: C2_ECHO_HOLD_MS, footKey: 'echo_merge' });
          rendered += 1;
          updateMetrics();
          return;
        }
      }
      admitWaitingDelivery(ev);
      renderEvent(ev);
      rendered += 1;
      updateMetrics();
      if (shouldFollow) scheduleTimelineToBottom();
    }

    function deliveryLifecycle(ev) {
      return String(ev.data?.lifecycle || ev.data?.state || ev.data?.change || '').toLowerCase();
    }

    function promoteWaitingDeliveryAtKnownFence(ev) {
      const deliveryId = ev?._norm?.deliveryId || ev?.delivery_id;
      const fence = deliveryId ? injectionFences.get(deliveryId) : null;
      const entry = deliveryId ? waitingDeliveries.get(deliveryId) : null;
      if (!fence || !entry) return false;
      entry.node.remove();
      waitingDeliveries.delete(deliveryId);
      waitingArea.hidden = waitingDeliveries.size === 0;
      const boundary = Number(entry.event?._hubSeq);
      if (Number.isSafeInteger(boundary) && boundary > 0) splitTurnGroupAtHubSequence(fence.turnId, boundary, timelineEventRank(entry.event));
      const promoted = { ...entry.event, turn_id: fence.turnId,
        _norm: { ...entry.event._norm, turnId: fence.turnId, stage: 'cli_injected', stageIdx: C1_STAGE_ORDER.indexOf('cli_injected') } };
      renderEvent(promoted);
      injectionFences.delete(deliveryId);
      return true;
    }

    function isWaitingDelivery(ev) {
      const norm = ev._norm || {};
      if (!norm.deliveryId || norm.turnId) return false;
      // copy 不追 ACK,不进待提交区;control 不进输入卡/待提交区;已有卡的原位更新
      if (String(norm.deliveryMode).includes('copy')) return false;
      if (norm.deliveryMode === 'control') return false;
      if (norm.key && c1InputCards.has(norm.key)) return false;
      // canonical 注入前阶段入待提交区
      if (['generated', 'queued', 'hub_received', 'helper_received', 'helper_queued'].includes(norm.stage)) return true;
      const lifecycle = deliveryLifecycle(ev);
      return lifecycle === 'queued' || lifecycle === 'waiting' || lifecycle === 'delivery_queued' ||
        (ev.kind === 'user_input' && (!lifecycle || lifecycle === 'accepted'));
    }

    function renderWaitingDelivery(ev) {
      const busyWait = ev.kind === 'state_change' && ev.data?.change === 'delivery_waiting_agent_idle';
      let waitKey = ev._norm?.deliveryId || ev.delivery_id;  // 归一键:observed_delivery_id 优先(B0)
      if (busyWait) {
        const existingKey = [...waitingDeliveries.keys()].find(key => deliveryMergeKey(key) === deliveryMergeKey(waitKey));
        if (existingKey) waitKey = existingKey;
      } else if (ev.kind === 'input_posted') {
        const placeholderKey = [...waitingDeliveries.keys()].find(key =>
          deliveryMergeKey(key) === deliveryMergeKey(waitKey)
          && waitingDeliveries.get(key)?.event.data?.change === 'delivery_waiting_agent_idle');
        if (placeholderKey && placeholderKey !== waitKey) {
          const placeholder = waitingDeliveries.get(placeholderKey);
          waitingDeliveries.delete(placeholderKey);
          waitingDeliveries.set(waitKey, placeholder);
          placeholder.node.dataset.deliveryId = waitKey;
        }
      }
      let entry = waitingDeliveries.get(waitKey);
      if (!entry) {
        const node = document.createElement('article');
        node.className = 'waiting-item';
        node.dataset.deliveryId = waitKey;
        waitingList.appendChild(node);
        entry = { node, event: ev, unknownSince: null, retryRoleVerified: false,
          canonicalDeliveryId: ev.kind === 'input_posted' && ev.delivery?.role === 'primary' ? String(ev.delivery_id || '') : '' };
        waitingDeliveries.set(waitKey, entry);
      } else if (ev.text && !busyWait) {
        entry.event = ev;
        entry.canonicalDeliveryId = ev.kind === 'input_posted' && ev.delivery?.role === 'primary' ? String(ev.delivery_id || '') : '';
      }
      entry.touched = Date.now();  // 看门狗心跳:创建/阶段推进都刷新
      entry.staleNoted = false;    // 推进重渲染清超时标记(innerHTML 已重排)
      entry.failNotedAt = null;    // 推进重渲染清失败便签标记
      // 忙心跳只更新等待提示，保留canonical原输入、权限和后续入场关联。
      const norm = (busyWait ? entry.event._norm : ev._norm) || {};
      if (norm.reason==='model_admission_unknown' || ['unconfirmed_retryable','retried'].includes(norm.status)) unknownSinceMs(ev,entry);
      entry.node.hidden=locallyUntrackedDeliveries.has(String(waitKey)) || isUnknownDeliveryExpired(entry);
      // 寻址保真 tripwire(dev56 取证:hub 必发 message_id,缺=renderer 管道丢)——可取消条目缺 message_id 必须可观测
      if (norm.cancellable && !norm.messageId) console.warn('[c2] 可取消条目缺 message_id(寻址保真破):', { deliveryId: waitKey, kind: ev.kind, stage: norm.stage, hasMsgId: 'message_id' in ev });
      const provIc = provenanceIconHtml(norm);  // display v1:provenance 图标在场时压 legacy 文字徽标(不双标)
      const badge = provIc ? '' : sourceBadgeHtml(norm);
      const cancelTag = norm.cancellable ? '<span class="cancellable-tag">可取消</span>' : '';
      const stageText = busyWait ? '排队等待 Agent 空闲' : stageFooterText(norm);
      const visibleStageText = isRetryableUnknownNorm(norm) ? UNKNOWN_RETRYABLE_TEXT : stageText;
      if (norm.ackProtocol === 2 && norm.processingMode === 'driver' && norm.stage === 'helper_queued' && !entry.queuedClock) {
        const queuedAt = Date.parse(norm.queuedAt);
        if (Number.isFinite(queuedAt)) {
          entry.queuedClock = {mono: performance.now(), elapsed: Math.max(0, Date.now() - queuedAt)};
        }
      }
      if (provFlagOn()) {
        // 精简在途条(张宗楚灰度反馈#2):明确「⏳ 投递中」+单行截断,全文进 title——不与「已收到消息」混淆;
        // 删除寻址保留(截断足够辨认),终态仍事件驱动转出
        const retryReady = isRetryableUnknownNorm(norm);
        entry.node.classList.toggle('waiting-item--pending', !retryReady);
        entry.node.innerHTML = `${provIc}${badge}${retryReady ? `<span class="waiting-stage">${UNKNOWN_RETRYABLE_TEXT}</span>` : '<span class="prov-spin" title="未达终态(注入/失败/取消/过期/终止)">⏳ 投递中</span>'}${visibleStageText && !retryReady ? `<span class="waiting-stage">${escapeHtml(visibleStageText)}</span>` : ''}<span class="waiting-text"></span>${cancelTag}`;
      } else {
        entry.node.innerHTML = `${provIc}${badge}<span class="waiting-text"></span>${cancelTag}${visibleStageText ? `<span class="waiting-stage">${escapeHtml(visibleStageText)}</span>` : ''}`;
      }
      const rawWaitText = entry.event.text || ev.data?.text || `delivery ${waitKey}`;  // flag 关=原样(与生产逐字)
      const waitText = provFlagOn() ? (ev._norm?.text || rawWaitText) : rawWaitText;   // flag 开:在途条用 payload 解析文本(norm.text 优先)
      entry.node.querySelector('.waiting-text').textContent = waitText;
      entry.node.querySelector('.waiting-text').title = (provFlagOn() && !waitText.startsWith('delivery ')) ? waitText : '';  // 截断时全文 hover(仅 flag 开)
      // C2:可取消条目带删除按钮;点击=发起 cancel 请求(条目的消失只由事件流 cancelled 驱动,不本地静默删)
      if (norm.cancellable && !entry.node.querySelector('.waiting-cancel-btn')) {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'waiting-cancel-btn';
        btn.textContent = '删除';
        btn.title = '请求取消该待提交输入';
        btn.addEventListener('click', () => c2RequestCancel(waitKey, entry));
        entry.node.appendChild(btn);
      }
      const retryAllowed = norm.status === 'unconfirmed_retryable' && norm.deliveryMode === 'primary'
        && entry.event?.kind === 'input_posted' && entry.event?.delivery?.role === 'primary'
        && entry.canonicalDeliveryId === waitKey && entry.retryRoleVerified === true;
      if (retryAllowed && !entry.node.querySelector('.waiting-retry-btn')) {
        const btn = document.createElement('button');
        btn.type = 'button'; btn.className = 'waiting-retry-btn'; btn.textContent = '重发';
        btn.addEventListener('click', () => c2RequestRetry(waitKey, entry, btn));
        entry.node.appendChild(btn);
      }
      if (!retryAllowed) entry.node.querySelector('.waiting-retry-btn')?.remove();
      if(isUnknownDelivery(entry)&&!entry.node.querySelector('.unknown-untrack-btn')){
        const btn=document.createElement('button');btn.type='button';btn.className='unknown-untrack-btn';btn.textContent='不再跟踪';
        btn.addEventListener('click',()=>untrackUnknownDelivery(waitKey));entry.node.appendChild(btn);
      }
      if(deliveryAlreadyProcessed(waitKey)){entry.node.querySelector('.waiting-retry-btn')?.remove();}
      r40PaintQueuedWait(entry);
      refreshInboxLagLabel();
      waitingArea.hidden = waitingDeliveries.size === 0 || [...waitingDeliveries.entries()].every(([id,x])=>x.node.hidden||locallyUntrackedDeliveries.has(String(id)));
      requestAnimationFrame(() => {
        waitingArea.scrollTop = waitingArea.scrollHeight;
      });
    }

    function r40PaintQueuedWait(entry) {
      const norm = entry.event._norm || {};
      const waiting = norm.ackProtocol === 2 && norm.processingMode === 'driver' && norm.stage === 'helper_queued';
      let note = entry.node.querySelector('.model-queued-wait');
      if (!waiting || norm.reason === 'model_admission_unknown' || isRetryableUnknownNorm(norm) || !entry.queuedClock) {
        if (note) note.remove();
        entry.node.classList.remove('waiting-item--model-delay');
        return;
      }
      const seconds = Math.floor((entry.queuedClock.elapsed + Math.max(0, performance.now() - entry.queuedClock.mono)) / 1000);
      if (seconds < 30) return;
      entry.node.classList.add('waiting-item--model-delay');
      if (!note) {
        note = document.createElement('span'); note.className = 'model-queued-wait';
        entry.node.appendChild(note);
      }
      note.textContent = `已排队 ${seconds} 秒，尚未注入会话；不要按已执行处理，可联系目标会话或等待状态更新。`;
    }
    setInterval(() => { for (const entry of waitingDeliveries.values()) r40PaintQueuedWait(entry); refreshUnknownDeliveryViews(); }, 1000);

    function admitWaitingDelivery(ev) {
      const waitKey = ev._norm?.deliveryId || ev.delivery_id;
      if (!waitKey || !ev.turn_id) return;
      const entry = waitingDeliveries.get(waitKey);
      if (!entry) return;
      // Raw output can race ahead of the Hub's delivery ACK. Keep canonical
      // input identity and its card index until delivery_update promotes it.
      if (entry.event.kind === 'input_posted') return;
      entry.node.remove();
      waitingDeliveries.delete(waitKey);
      waitingArea.hidden = waitingDeliveries.size === 0;
      if (ev.kind !== 'user_input') {
        renderTurnEvent(ev.turn_id, { ...entry.event, turn_id: ev.turn_id });
      }
    }

    function keyFor(ev) {
      return ev.delivery_id || ev.turn_id || `cursor-${ev.cursor || rendered}`;
